MSCI 자금 유입 기대와 달리 LG이노텍은 급락 마감했습니다</h4>\n      <p>증권사들은 LG이노텍의 MSCI 한국지수 편입에 따라 785억~4,390억원의 패시브 자금 유입을 추정했습니다(헤럴드경제). 그러나 실제 9/1 종가는 <strong>590,000원(-8.10%)</strong>으로 급락 마감해, <strong>유입 기대가 주가를 지지하지 못했습니다</strong>(중앙이코노미뉴스). 정확한 순매수 확정치는 검증 보류로 남습니다.</p>\n    </div>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>오늘 시장</h3></div>\n  <p class=\"sec-sub\">목요일인 오늘(9/3) 국내 증시는 전일 급락을 딛고 반등 출발했습니다. 미국 증시는 가장 최근 마감인 9/2(수, 현지시간) 기준입니다. 한국 관행대로 <span class=\"up\">상승은 빨강</span>, <span class=\"down\">하락은 파랑</span>으로 표시하며 미국 지수도 같은 기준을 적용합니다.</p>\n  <div class=\"tscroll\">\n    <table>\n      <thead><tr><th>항목</th><th>수치</th><th>의미</th></tr></thead>\n      <tbody>\n        <tr><td>코스피 (9/2 마감)</td><td class=\"num down\">6,562.72 (-3.99%)</td><td>273.08포인트 급락 마감(아시아경제)</td></tr>\n        <tr><td>코스피 (9/3 개장)</td><td class=\"num up\">6,650.33 (+1.33%)</td><td>전일 급락을 딛고 87.61포인트 오른 채 출발(아시아경제·머니투데이)</td></tr>\n        <tr><td>코스닥 (9/3 개장)</td><td class=\"num up\">814.31 (+1.28%)</td><td>10.33포인트 오른 채 출발, 코스피와 동반 반등(아시아경제)</td></tr>\n        <tr><td>다우 (9/2 마감)</td><td class=\"num up\">53,061 (+0.56%)</td><td>294.63포인트 상승 마감(AP연합·ABC뉴스·WTOP)</td></tr>\n        <tr><td>나스닥 (9/2 마감)</td><td class=\"num up\">26,217 (+0.45%)</td><td>대형 기술주 강세에 118.05포인트 상승(AP연합·ABC뉴스·WTOP)</td></tr>\n        <tr><td>S&amp;P500 (9/2 마감)</td><td class=\"num up\">7,666 (+0.46%)</td><td>35.21포인트 상승, 유가·채권수익률 안정이 배경(AP연합·ABC뉴스·WTOP)</td></tr>\n        <tr><td>원/달러 환율 (9/2 마감)</td><td class=\"num\">1,368.7원</td><td>9/3은 NDF 역산 기준 1,360원대 등락 예상(이데일리 외환브리핑)</td></tr>\n        <tr><td>미국 기준금리</td><td class=\"num\">3.50~3.75%</td><td>7월까지 5연속 동결, 다음 FOMC는 9/15~16일(파이낸셜뉴스)</td></tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"prose\">\n    <p>코스피·코스닥의 9/3 최종 마감 수치는 검색 시점 기준 아직 확인되지 않아 개장 데이터로 대체했습니다. 다음 보고서에서 종가를 확인합니다.</p>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>오늘 확인된 것들</h3></div>\n  <div class=\"claims\">\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">코스피·코스닥</span></div>\n      <h4>양대 지수, 전일 급락 딛고 1%대 반등 출발</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>코스피는 9/2 273.08포인트(3.99%) 내린 6,562.72로 마감한 뒤, 9/3 87.61포인트(1.33%) 오른 6,650.33으로 개장했습니다. 코스닥도 10.33포인트(1.28%) 오른 814.31로 개장해 동반 반등했습니다(아시아경제·머니투데이).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">뉴욕증시(9/2)</span></div>\n      <h4>미국 3대 지수, 기술주 강세에 동반 상승 마감</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>다우 53,061(+0.56%), S&amp;P500 7,666(+0.46%), 나스닥 26,217(+0.45%)로 마감했습니다. 대형 기술주 상승과 상대적으로 안정적인 유가·채권수익률이 배경으로 꼽힙니다(AP연합·ABC뉴스·WTOP).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">원/달러 환율</span></div>\n      <h4>원화, 1,410원대에서 1,360원대까지 추가 강세</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>원/달러 환율은 9/2 <strong>1,368.7원</strong>에 마감했고, 9/3은 뉴욕 NDF 1개월물(1,358원) 역산 기준 <strong>1,360원대</strong> 등락이 예상됩니다(이데일리 외환브리핑).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">연준</span></div>\n      <h4>기준금리 3.50~3.75% 유지, 9월 FOMC는 15~16일</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>연준은 7월 회의까지 5연속 기준금리를 동결해 3.50~3.75%를 유지 중이며, 다음 FOMC는 9/15~16일 예정입니다. 시장은 0.25%p 인상 가능성 57%, 동결 43%로 가격을 반영하고 있습니다(파이낸셜뉴스).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">LG이노텍</span></div>\n      <h4>MSCI 편입에도 9/1 종가는 오히려 8.10% 급락</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>교보·유진·삼성증권 등은 785억~4,390억원의 패시브 자금 유입을 추정했지만(헤럴드경제), LG이노텍은 9/1 590,000원으로 전일 대비 <strong>8.10% 하락</strong> 마감했습니다(중앙이코노미뉴스).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">반도체 관세</span></div>\n      <h4>러트닉 장관, 새 반도체 관세 체계 준비 중이라고 확인</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>하워드 러트닉 미 상무장관은 G20 혁신장관회의에서 행정부가 새로운 반도체 관세 체계를 준비하고 있다고 밝혔습니다. 노트북·게임콘솔·서버 등 완제품까지 관세를 확대하는 방안과, 미국 내 투자 기업에 우대 관세를 주는 상쇄 프로그램이 함께 검토되고 있습니다(위키트리·뉴스웨이).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">검토 단계</span><span class=\"src\">반도체 관세</span></div>\n      <h4>세율·품목·국가별 적용 방식은 여전히 미확정</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>확대 검토 중인 반도체 관세의 구체적인 세율과 적용 대상 품목, 국가별 적용 방식은 <strong>아직 확정되지 않았습니다.</strong> 발표 시점도 불명확해 검증 보류로 남깁니다(위키트리·뉴스웨이).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">엇갈림</span><span class=\"src\">웨스팅하우스</span></div>\n      <h4>원전주 재료, 진전 보도와 정부 부인이 엇갈립니다</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>한국전력이 웨스팅하우스 지분 공동 인수를 놓고 미국 측과 실무협의를 진행 중이라는 보도가 나왔지만, 산업통상자원부는 \"사실무근\"이라며 공식 부인했습니다. 진전 여부는 <strong>검증 보류</strong>로 남깁니다(뉴데일리·네이트뉴스).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip neutral\">검증 보류</span><span class=\"src\">LG이노텍</span></div>\n      <h4>실제 외국인 순매수 확정치는 아직 확인 안 됨</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>리밸런싱에 따른 LG이노텍의 실제 외국인 순매수 확정치는 오늘 검색 스니펫에서 확인되지 않아 <strong>검증 보류</strong>로 남기고 다음 보고서에서 확인합니다.</span></div>\n    </div></div>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>쟁점 — 1%대 반등, 되돌림일지 추세 전환일지 갈립니다</h3></div>\n  <p class=\"sec-sub\">전일 4%에 가까운 급락 이후 개장 반등폭이 이례적으로 커서, 방향을 가르는 재료들이 팽팽합니다.</p>\n  <div class=\"versus\">\n    <div class=\"side bull\">\n      <h4>반등 근거</h4>\n      <p>뉴욕증시가 대형 기술주 중심으로 9/2 3대 지수 모두 상승 마감해 투자심리에 긍정적입니다. 원화도 1,410원대에서 1,360원대까지 강세를 이어가며 저가 매수 여력이 커졌다는 해석이 나옵니다.</p>\n      <p class=\"src\">AP연합·ABC뉴스·WTOP·이데일리 · 2026-09-02~03</p>\n    </div>\n    <div class=\"side bear\">\n      <h4>되돌림 우려 근거</h4>\n      <p>9월 FOMC에서 금리 인상 가능성이 여전히 57%로 동결 가능성보다 높게 반영되고 있고, 반도체 고강도 관세는 세율과 품목이 정해지지 않은 채 남아 있습니다. 전일 급락을 촉발한 재료들이 해소된 것은 아닙니다.</p>\n      <p class=\"src\">파이낸셜뉴스·위키트리·뉴스웨이 · 2026-08-27~09-03</p>\n    </div>\n  </div>\n  <div class=\"callout\">\n    <h4>왜 이게 결정적인가</h4>\n    <p>전일 코스피가 4%에 가깝게 급락한 다음 날 1%대 반등으로 출발하는 것은 흔치 않은 폭입니다. 이 반등이 종가까지 유지되는지가 급락이 일시적 충격이었는지, 아니면 잭슨홀발 조정 국면이 계속되는지를 가르는 첫 신호가 됩니다.</p>\n    <p><strong>확인 방법</strong> — 코스피·코스닥 9/3 최종 마감 수치, 반도체 관세 확정 여부, 웨스팅하우스 지분 협상의 공식 확인 여부를 다음 보고서에서 확인합니다.</p>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">04</span><h3>다음 추적 대상</h3></div>\n  <ol class=\"lessons\">\n    <li><strong>코스피·코스닥 9/3 최종 마감 수치.</strong> 개장 1%대 반등이 종가까지 유지되는지 확인합니다.</li>\n    <li><strong>반도체 고강도 관세(서버·노트북 포함) 세율·품목 확정 여부.</strong> 여전히 검토 단계입니다.</li>\n    <li><strong>원전주 강세 지속 여부.</strong> 웨스팅하우스 지분 인수를 둘러싼 진전 보도와 정부 부인이 엇갈리는 상태입니다.</li>\n    <li><strong>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치.</strong> 오늘은 주가 흐름만 확인됐습니다.</li>\n    <li><strong>원/달러 환율 1,360원대 강세가 다음 거래일에도 유지되는지.</strong> 하루 만에 급반전한 흐름이 이어지는지 봅니다.</li>\n  </ol>\n</section>\n"}, {"date": "2026-09-01", "dow": "화", "summary": "팔로워 1위 계정이 근거도 기한도 없이 목표 가격을 던졌습니다", "tally": {"ok": 1, "warn": 2, "bad": 1}, "kicker": ["50K+ 3곳", "검증 4건", "1위 계정 실격"], "title": "팔로워 1위 주식 계정이 “지금 기회”라고 했습니다", "standfirst": "종목 이름과 목표 가격이 함께 적힌 글을 보면 안 사면 손해 볼 것 같은 기분이 듭니다. 그 기분은 만들어진 것입니다. 오늘은 그게 어떻게 만들어지는지, 그리고 정확한 계정과 무엇이 다른지를 봅니다.", "sources": "스레드 프로필 직접 수집(2026-09-01) · 머니투데이 · 파이낸셜뉴스 · 한국경제 · 디지털타임스 · Yahoo Finance", "body": "<section>\n          <div class=\"sec-head\"><span class=\"sec-n\">먼저</span><h3>오늘 먼저 볼 두 가지</h3></div>\n          <div class=\"heads\">\n            <div class=\"head-card\" style=\"border-left-color:var(--bad)\">\n              <h4>팔로워 1위 계정이 종목과 목표 가격을 함께 던졌습니다</h4>\n              <p><span class=\"handle\">@bullstory1</span>(74,100명)이 <strong>&ldquo;SK하이닉스 지금 기회입니다&hellip; GO TO 180만&rdquo;</strong>이라고 적었습니다. 근거도 기한도 없습니다. 같은 계정 프로필에는 <strong>텔레그램 채널과 유료 사이트 링크</strong>가 걸려 있습니다. 기한이 없는 목표 가격은 <em>영원히 틀리지 않습니다.</em> 그게 문제입니다.</p>\n            </div>\n            <div class=\"head-card\" style=\"border-left-color:var(--warn)\">\n              <h4>같은 확률을 계정마다 다르게 말합니다</h4>\n              <p>잭슨홀 이후 9월 미국 금리 인상 확률이 <strong>59%</strong>(계정) &middot; <strong>60% 안팎</strong>(국내 경제지) &middot; <strong>57%</strong>(Yahoo Finance)로 제각각입니다. 실시간으로 움직이는 수치라 <strong>셋 다 틀리지 않았을 수 있습니다.</strong> 문제는 <strong>몇 시 기준인지를 아무도 안 적었다</strong>는 것입니다. 시점 없는 확률은 검증할 방법이 없습니다.</p>\n            </div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>오늘의 대조 대상</h3></div>\n          <p class=\"sec-sub\">팔로워 5만 이상만 대조합니다. 수치는 2026-09-01 프로필 직접 측정값입니다.</p>\n          <div class=\"tscroll\">\n            <table>\n              <thead><tr><th>계정</th><th>팔로워</th><th>영역</th><th>프로필 링크</th></tr></thead>\n              <tbody>\n                <tr><td><span class=\"handle\">@bullstory1</span></td><td class=\"num\">74,100</td><td>트레이딩&middot;차트</td><td class=\"down\"><strong>텔레그램 + 유료 사이트</strong></td></tr>\n                <tr><td><span class=\"handle\">@badakstock</span></td><td class=\"num\">56,400</td><td>차트&middot;산업 해설</td><td>이메일만</td></tr>\n                <tr><td><span class=\"handle\">@ho_ho_ju_ju</span></td><td class=\"num\">54,700</td><td>매크로&middot;섹터</td><td>낙서장 추천 코드</td></tr>\n              </tbody>\n            </table>\n          </div>\n          <p><strong>프로필 링크를 먼저 보는 습관을 권합니다.</strong> 뒤에 팔 것이 있는 사람과 없는 사람은 같은 정보라도 다르게 읽어야 합니다.</p>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>주장별 검증</h3></div>\n          <div class=\"claims\">\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">숫자 전부 일치</span><span class=\"src\">@badakstock</span></div>\n              <h4>삼성바이오로직스 3조 유상증자 &mdash; 시총 5조 감소</h4>\n              <div class=\"kv found\"><span class=\"lbl\">주장</span><span>좋은 인수 소식에도 주가가 5조원 하락한 이유는 유상증자에 따른 지분 희석이다. 펩타이드 원료 회사를 2.7조에 인수한다.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span><strong>세 숫자 모두 맞습니다.</strong> 유상증자 <strong>3조 9억원</strong>(8/28 이사회 의결), 폴리펩타이드그룹 인수 <strong>2조 7,062억원</strong>, 시가총액 <strong>73조 7,877억 &rarr; 68조 7,883억</strong>. 주가는 <strong>6.78% 하락</strong>한 148만 6,000원에 마감했습니다.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">다만</span><span>희석되는 비율은 <strong>4.9%</strong>인데 주가는 <strong>6.78%</strong> 빠졌습니다. <strong>약 1.9%포인트가 남습니다.</strong> 희석만으로는 설명되지 않는 부분인데 원문은 여기를 다루지 않았습니다. <em>설명이 맞다고 해서 완전한 것은 아닙니다.</em></span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">시점 누락</span><span class=\"src\">@badakstock</span></div>\n              <h4>&ldquo;금리 인상 확률 35% &rarr; 59%&rdquo;</h4>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span><strong>방향은 맞고 숫자는 단정할 수 없습니다.</strong> Yahoo Finance는 <strong>57%</strong>, 국내 경제지는 <strong>&ldquo;60% 안팎&rdquo;</strong>으로 적었습니다. 이 확률은 연방금리선물 시장에서 <strong>실시간으로 움직입니다.</strong> 오전에 57%였다가 오후에 59%일 수 있습니다.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">판별</span><span>문제는 숫자를 하나로 못 박은 것입니다. <strong>이런 수치에는 &lsquo;몇 시 기준&rsquo;이 붙어야 검증이 가능합니다.</strong> 시점 없는 확률은 나중에 맞았는지 틀렸는지 확인할 방법이 없습니다. <em>이 지적은 저희에게도 해당됩니다 &mdash; 저희도 57%라고만 적고 기준 시각을 안 남겼습니다.</em></span></div>\n            </div></div>\n\n            <div class=\"claim v-bad\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip bad\">형식 자체가 문제</span><span class=\"src\">@bullstory1</span></div>\n              <h4>&ldquo;SK하이닉스 지금 기회입니다 &mdash; 180만&rdquo;</h4>\n              <div class=\"kv found\"><span class=\"lbl\">판정</span><span><strong>사실 검증의 대상이 아닙니다.</strong> 참&middot;거짓을 가릴 수 있는 형식이 아니기 때문입니다.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">근거</span><span><strong>첫째, 왜 그 가격인지가 없습니다.</strong> 실적도 비교 대상도 계산 과정도 적혀 있지 않습니다. <strong>둘째, 기한이 없습니다.</strong> 언제까지 180만인지가 없으니 영원히 &ldquo;아직 안 온 것&rdquo;으로 남습니다. <strong>셋째, 프로필에 텔레그램 채널(t.me)과 유료 사이트가 걸려 있습니다.</strong></span></div>\n              <div class=\"kv found\"><span class=\"lbl\">읽는 법</span><span>뒤에 팔 것이 있는 사람이 종목과 가격을 함께 던지면, 그 글은 정보가 아니라 <strong>미끼로 읽어야 합니다.</strong> 다만 <strong>해당 계정의 신고 여부는 확인할 수 없고, 위법이라고 단정하지 않습니다.</strong> 독자가 알고 보셔야 한다는 뜻입니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">검증 불가</span><span class=\"src\">@bullstory1</span></div>\n              <h4>&ldquo;세력들 전략 다 까발립니다. 삭제 당하기 전에 얼른 보세요&rdquo;</h4>\n              <div class=\"kv found\"><span class=\"lbl\">내용</span><span>이어진 글은 <strong>1단계 매집 &rarr; 2단계 작전 &rarr; 3단계 하이라이트</strong>라는 3단계 서사였습니다.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span><strong>검증이 불가능한 종류의 주장입니다.</strong> 누가, 어느 종목에서, 언제 그랬는지가 없습니다. <em>이름이 없는 이야기는 참&middot;거짓을 가릴 수 없습니다.</em> 그리고 &ldquo;삭제 당하기 전에&rdquo;는 급하게 만드는 장치입니다 &mdash; 실제로 삭제될 이유가 없는 내용이었습니다.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">참고</span><span>이 글의 반응은 <strong>좋아요 32개</strong>였습니다. 팔로워 7.4만 계정에서 나온 수치입니다. <strong>사람들이 이미 걸러 읽고 있다는 뜻으로 보입니다.</strong></span></div>\n            </div></div>\n\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>오늘 얻은 판별법</h3></div>\n          <p class=\"sec-sub\">종목 이름 + 구체적인 숫자 + 시간 압박, 이 셋이 같이 오면 사람은 거의 예외 없이 조급해집니다. <strong>그렇게 설계된 글이기 때문입니다.</strong></p>\n          <ol class=\"lessons\">\n            <li><strong>프로필 링크를 먼저 보십시오.</strong> 텔레그램&middot;단톡방&middot;유료 사이트가 걸려 있으면 같은 글이라도 다르게 읽어야 합니다. 3초면 확인됩니다.</li>\n            <li><strong>숫자에 시점이 붙어 있는지 보십시오.</strong> &ldquo;확률 59%&rdquo;는 검증 불가이고, &ldquo;오후 3시 기준 59%&rdquo;는 검증 가능합니다.</li>\n            <li><strong>틀렸을 때 확인할 방법이 있는지 보십시오.</strong> 기한 없는 목표 가격은 영원히 틀리지 않습니다. 그게 문제입니다.</li>\n            <li><strong>급하게 만드는 표현을 의심하십시오.</strong> &ldquo;삭제되기 전에&rdquo;, &ldquo;지금 아니면 늦습니다&rdquo;는 내용이 아니라 장치입니다.</li>\n            <li><strong>팔로워는 정확도의 근거가 아닙니다.</strong> 오늘 가장 문제가 큰 글은 1위 계정에서 나왔고, 가장 정확한 글은 세 곳 중 두 번째로 작은 계정에서 나왔습니다.</li>\n          </ol>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">04</span><h3>다음 추적 대상</h3></div>\n          <ol class=\"lessons\">\n            <li><strong>&ldquo;SK하이닉스 180만&rdquo;의 운명.</strong> 기한이 없어 현재로서는 판정 불가 상태로 열어둡니다. 해당 계정이 나중에 기한을 붙이는지도 함께 봅니다.</li>\n            <li><strong>삼성바이오로직스 1.9%포인트 간극.</strong> 희석 4.9%보다 6.78% 더 빠진 부분이 무엇으로 설명되는지 추적합니다. 11월 30일 신주 상장까지 이어지는 사안입니다.</li>\n            <li><strong>인상 확률의 기준 시각.</strong> 앞으로 이 수치를 쓸 때 저희부터 &lsquo;몇 시 기준&rsquo;을 남깁니다.</li>\n          </ol>\n        </section>"}, {"date": "2026-08-31", "dow": "월", "summary": "월요일 코스피·코스닥이 잭슨홀 매파 발언 여파로 개장 직후 동반 3%대 급락했습니다. 추적하던 반도체 투톱 조정 지속 예측은 적중했고, 원화 강세 지속 예측은 빗나가 하루 만에 다시 약세로 돌아섰습니다.", "tally": {"ok": 5, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 3%대 급락", "추적 2건 결론", "월요일판"], "title": "잭슨홀 후폭풍 — 코스피 3%대 급락, 원화 강세도 하루 만에 반납", "standfirst": "월요일인 오늘(8/31) 코스피는 잭슨홀 여파로 개장 직후 2.58% 급락한 뒤 오전 한때 3%대로 낙폭을 키우며 6,500선까지 밀렸고, 코스닥도 동반 급락했습니다. 지난 금요일(8/28, 현지시간) 뉴욕증시는 다우·나스닥·S&P500이 모두 소폭 내리며 마감했지만 주간 기준으로는 반등했습니다. 원/달러 환율은 지난주 1,380원대에서 오늘 1,410원대로 급반전해 강달러 흐름이 다시 나타났습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "이투데이·아시아경제·국제뉴스·블록미디어·서울경제·아주경제·뉴스웨이·인베스팅닷컴·Investrade·Yahoo Finance·investing.com·포쓰저널(2026-08-27~31 스니펫 기준)", "body": "<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">추적</span><h3>추적 결과 — 2건 결론, 하나는 맞고 하나는 틀렸습니다</h3></div>\n  <div class=\"heads\">\n    <div class=\"head-card\">\n      <h4>반도체 투톱 조정, 예측대로 8/31까지 이어졌습니다</h4>\n      <p>8/29 보고서에서 반도체 투톱의 조정이 다음 거래일(8/31)까지 이어지는지를 추적 대상으로 걸어뒀습니다. 오늘 개장 직후 두 대장주 모두 3~4%대 약세로 출발했고, 코스피 전체도 2.58% 급락한 뒤 오전 한때 3%대까지 낙폭을 키우며 <strong>조정이 이어졌다는 예측이 맞았습니다</strong>(서울경제·아시아경제).</p>\n    </div>\n    <div class=\"head-card\">\n      <h4>원화 강세, 하루 만에 꺾이며 예측이 틀렸습니다</h4>\n      <p>8/30 보고서는 매파 발언에도 오히려 강세를 보인 원화 흐름이 다음 거래일에도 유지되는지를 걸어뒀습니다. 확인해보니 지난주 <strong>1,380원대</strong>까지 강세를 보였던 원/달러 환율이 오늘 <strong>1,418.56원</strong>으로 출발해 1,409~1,420원대에서 거래되며 하루 만에 반전됐습니다. \"매파 발언 → 달러 강세\"라는 통상적 패턴으로 되돌아온 것으로, <strong>강세 지속 예측은 빗나갔습니다</strong>(investing.com).</p>\n    </div>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>오늘 시장</h3></div>\n  <p class=\"sec-sub\">월요일인 오늘(8/31) 국내 증시는 잭슨홀 여파로 개장 직후 급락했습니다. 미국 증시는 가장 최근 마감인 8/28(금, 현지시간) 기준입니다. 한국 관행대로 <span class=\"up\">상승은 빨강</span>, <span class=\"down\">하락은 파랑</span>으로 표시하며 미국 지수도 같은 기준을 적용합니다.</p>\n  <div class=\"tscroll\">\n    <table>\n      <thead><tr><th>항목</th><th>수치</th><th>의미</th></tr></thead>\n      <tbody>\n        <tr><td>코스피 (8/31 09:23 기준, 장중)</td><td class=\"num down\">6,581.24 (-3.06%)</td><td>잭슨홀 매파 발언 여파로 개장 직후 2.58% 급락한 뒤 낙폭 확대, 6,500선까지 후퇴(이투데이·아시아경제)</td></tr>\n        <tr><td>코스닥 (8/31 09:23 기준, 장중)</td><td class=\"num down\">808.69 (-3.54%)</td><td>코스피와 동반 급락(아시아경제)</td></tr>\n        <tr><td>반도체 투톱 (8/31 장중, 2종목 평균)</td><td class=\"num down\">-3~4%대</td><td>미국 반도체주 약세와 중국 업체 경쟁 심화 우려 겹침(서울경제)</td></tr>\n        <tr><td>다우 (8/28 마감)</td><td class=\"num down\">53,559 (-0.02%)</td><td>낙폭은 제한적, 주간 기준 +1.0%(Investrade·Yahoo Finance)</td></tr>\n        <tr><td>나스닥 (8/28 마감)</td><td class=\"num down\">26,402 (-0.52%)</td><td>주간 기준으로는 +0.9%(Investrade)</td></tr>\n        <tr><td>S&amp;P500 (8/28 마감)</td><td class=\"num down\">7,711 (-0.25%)</td><td>주간 기준 +0.5%(Investrade)</td></tr>\n        <tr><td>원/달러 환율 (8/31 장중)</td><td class=\"num\">1,409~1,420원대</td><td>시가 1,418.56원, 지난주 1,380원대에서 급반전(investing.com)</td></tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"prose\">\n    <p>코스피·코스닥의 정확한 최종 마감 수치는 오늘 검색 스니펫에는 담기지 않아 장중 데이터로 대체했습니다. MSCI 리밸런싱에 따른 실제 매매는 오늘 장 마감 후 이뤄질 예정이라 그 효과는 아직 반영되지 않았습니다.</p>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>오늘 확인된 것들</h3></div>\n  <div class=\"claims\">\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">코스피·코스닥</span></div>\n      <h4>양대 지수, 잭슨홀 충격에 개장 직후 동반 급락</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>코스피는 전 거래일보다 175.30포인트(2.58%) 내린 6,613.58로 출발한 뒤 낙폭을 키워 오전 9시 23분 기준 3.06% 하락한 6,581.24를 기록했습니다. 코스닥도 16.74포인트(2.00%) 내린 821.67로 출발해 같은 시각 3.54% 내린 808.69까지 밀렸습니다(이투데이, 아시아경제).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">잭슨홀·연준</span></div>\n      <h4>워시 의장 매파 발언 이후 9월 금리인상 확률 급등</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8/28(현지시간) 워시 연준 의장의 잭슨홀 기조연설 직후 연방금리선물시장에서 9월 금리 인상 확률이 <strong>35%에서 60% 안팎으로</strong> 급등했습니다. 워시 의장은 향후 금리 경로를 미리 제시해온 '포워드 가이던스'의 사실상 폐기를 선언했습니다(인베스팅닷컴).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">원/달러 환율</span></div>\n      <h4>원화 강세, 하루 만에 꺾이고 1,410원대로 급반전</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>지난주 2025년 9월 이후 최고 수준인 1,380원대까지 강세를 보였던 원/달러 환율이 오늘 <strong>1,418.56원</strong>으로 출발해 1,409.32~1,420.77원 범위에서 거래됐습니다(investing.com).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">뉴욕증시(8/28)</span></div>\n      <h4>미국 3대 지수, 금요일 소폭 하락 마감…주간으로는 반등</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>다우 53,559(-0.02%), S&amp;P500 7,711(-0.25%), 나스닥 26,402(-0.52%)로 마감했습니다. 주간 기준으로는 S&amp;P500 +0.5%, 나스닥 +0.9%, 다우 +1.0%로 반등했습니다(Investrade, Yahoo Finance).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">반도체 업황</span></div>\n      <h4>중국 CXMT 매출 급증, 반도체 경쟁 심화 우려 재부각</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>중국 메모리 업체 창신메모리(CXMT)의 상반기 매출이 전년 대비 <strong>874%</strong> 급증한 것으로 나타나면서 국내 반도체 업종의 경쟁 심화 우려가 다시 부각됐습니다(블록미디어).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">검토 단계</span><span class=\"src\">미국 정부</span></div>\n      <h4>반도체 고강도 관세, 여전히 최종 확정 전</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>서버·노트북·게임콘솔까지 포괄하는 고강도 반도체 관세는 국가별 관세율·수입 할당량 아이디어까지 논의되고 있지만 <strong>아직 최종 정책으로 확정되지 않았습니다.</strong> 시장 충격 완화를 위한 단계적 도입 방안도 검토 중입니다(아주경제, 뉴스웨이).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">예정</span><span class=\"src\">MSCI 리밸런싱</span></div>\n      <h4>MSCI 리밸런싱 실제 매매, 오늘 장 마감 후 시행 예정</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8/13 발표된 MSCI 한국지수 편입(LG이노텍)·편출(HLB·LG디스플레이·포스코인터내셔널·삼성에피스홀딩스) 종목의 실제 리밸런싱 매매는 8/31 장 마감 기준으로 이뤄지고, 변경된 지수는 9/1부터 적용됩니다. 실제 자금 유입 규모는 아직 확인되지 않아 <strong>검증 보류</strong>로 남깁니다(포쓰저널).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">검증 보류</span><span class=\"src\">코스피·코스닥</span></div>\n      <h4>오늘 최종 마감 수치는 검색 스니펫에 없어 검증 보류</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>오늘 검색된 스니펫은 오전 9시대 장중 데이터까지만 확인됩니다. 코스피·코스닥의 정확한 최종 마감 지수와 등락률은 <strong>검증 보류</strong>로 남기고 다음 보고서에서 확인합니다.</span></div>\n    </div></div>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>쟁점 — 하락폭이 얼마나 되돌려질지, 금리와 수급 재료가 엇갈립니다</h3></div>\n  <p class=\"sec-sub\">오늘 급락 이후 남은 재료는 방향이 갈립니다.</p>\n  <div class=\"versus\">\n    <div class=\"side bull\">\n      <h4>반등 근거</h4>\n      <p>MSCI 리밸런싱 실제 매매가 오늘 장 마감 기준으로 이뤄지고 변경된 지수는 9/1부터 적용됩니다. 편입 종목에는 지수 추종 자금의 매수 수요가 발생할 수 있습니다. 원전 관련주는 웨스팅하우스 지분 인수 논의가 이어지고 있어 별도 수급 재료로 남아 있습니다.</p>\n      <p class=\"src\">포쓰저널·이투데이·파이낸셜뉴스 · 2026-08-11~31</p>\n    </div>\n    <div class=\"side bear\">\n      <h4>조정 압력 근거</h4>\n      <p>워시 의장의 매파적 잭슨홀 발언으로 9월 금리인상 확률이 급등했고, 미국 반도체주 약세와 중국 CXMT의 매출 급증이 겹치며 국내 반도체 업종 전반의 투자심리가 위축됐습니다. 여기에 반도체 고강도 관세 확대 검토까지 불확실성으로 남아 있습니다.</p>\n      <p class=\"src\">인베스팅닷컴·블록미디어·아주경제 · 2026-08-27~31</p>\n    </div>\n  </div>\n  <div class=\"callout\">\n    <h4>왜 이게 결정적인가</h4>\n    <p>오늘 급락은 잭슨홀 매파 발언과 반도체 업종 우려가 겹친 결과지만, 같은 날 장 마감 후 MSCI 리밸런싱 실제 매매가 이뤄집니다. 금리·관세發 조정 압력과 지수 추종 자금의 기계적 수급이 <strong>서로 다른 방향으로</strong> 작용할 수 있어, 이 둘의 상대적 크기가 9월 초 흐름을 가늠하는 첫 신호가 됩니다.</p>\n    <p><strong>확인 방법</strong> — 코스피·코스닥 최종 마감 수치, MSCI 리밸런싱 관련 외국인 수급, 반도체 고강도 관세의 확정 여부를 다음 보고서에서 확인합니다.</p>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">04</span><h3>다음 추적 대상</h3></div>\n  <ol class=\"lessons\">\n    <li><strong>코스피·코스닥 8/31 최종 마감 수치와 낙폭.</strong> 오늘은 장중 데이터만 확인됐습니다.</li>\n    <li><strong>MSCI 리밸런싱 실제 자금 유입 규모.</strong> 8/31 종가 기준 매매, 9/1 지수 반영 이후 확인합니다.</li>\n    <li><strong>반도체 고강도 관세(서버·노트북 포함) 최종 확정 여부.</strong> 여전히 검토 단계입니다.</li>\n    <li><strong>원전주 강세 지속 여부.</strong> 웨스팅하우스 지분 인수 논의가 이어지는지 봅니다.</li>\n    <li><strong>원/달러 환율 1,410원대 약세가 다음 거래일에도 유지되는지.</strong> 하루 만에 뒤집힌 흐름이 지속되는지 확인합니다.</li>\n  </ol>\n\n  <p class=\"prose\"><strong>후속(9/3 확인)</strong> — 코스피는 8/31 실제로 31.14포인트(0.46%) 오른 6,820.02로 강보합 마감했습니다. 개장 직후 3%대까지 벌어졌던 낙폭은 장중 모두 되돌려졌고, 원/달러 환율도 9/2 1,368.7원까지 밀리며 이날 예측했던 1,410원대 약세가 아니라 원화 강세 쪽으로 흘러갔습니다(머니투데이·이데일리).</p>\n</section>"}, {"date": "2026-08-30", "dow": "일", "summary": "일요일인 오늘 국내외 증시는 휴장입니다. 추적하던 두 건 중 코스닥 사이드카 빈도는 방향성만 확인됐고(7/28까지 42회, 검증 보류), 워시 의장의 매파 발언 이후 국채금리는 예상대로 소폭 올랐지만 원/달러 환율은 오히려 강세로 반대 방향을 보였습니다.", "tally": {"ok": 3, "warn": 2, "bad": 0}, "kicker": ["자동생성·검색기반", "추적 2건 결론", "일요일판"], "title": "국채금리는 예상대로, 원화는 반대로 — 워시 매파 발언 이후 엇갈린 반응", "standfirst": "일요일인 오늘(8/30) 국내외 증시는 모두 휴장입니다. 가장 최근 마감인 8/28 코스피는 반도체 투톱 급락에 6,788.88(-1.79%)로 밀렸고, 8/29(현지시간) 뉴욕증시는 AI 관련주 매도세에 나스닥이 1.2% 내리며 4거래일 연속 약세를 이어갔습니다. 워시 연준의장의 매파적 잭슨홀 발언 이후 미 10년물 국채금리는 소폭 올랐지만, 원/달러 환율은 오히려 강세를 보여 통상적 패턴과 어긋났습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "한국경제·더페어뉴스·뉴스1·아주경제·뉴스웨이·서울경제·다음뉴스·CNBC·Advisor Perspectives(dshort)·ETFdb·tradingeconomics·Punchy Pigeon(비공식 집계)(2026-08-25~30 스니펫 기준)", "body": "<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">추적</span><h3>추적 결과 — 2건 결론, 방향은 하나만 맞았습니다</h3></div>\n  <div class=\"heads\">\n    <div class=\"head-card\">\n      <h4>코스닥 사이드카 빈도 — 방향은 맞고, 정밀 수치는 검증 보류입니다</h4>\n      <p>8/10 보고서에서 \"6거래일 중 3번 발동\"이 비정상적으로 잦은지를 추적 대상으로 걸어뒀습니다. 오늘 검색으로 확인한 바로는 2026년 들어 7월 28일까지 코스닥 사이드카가 <strong>누적 42회</strong> 발동된 것으로 집계돼, 예년보다 훨씬 잦았다는 방향성 자체는 뒷받침됩니다. 다만 이 수치는 개인 블로그 집계에서만 확인됐고 국내 주요 매체로 재확인하지 못해, 정확한 최신 발동 횟수는 <strong>검증 보류</strong>로 남깁니다.</p>\n    </div>\n    <div class=\"head-card\">\n      <h4>워시 발언 이후 — 금리는 예상대로, 환율은 반대로 움직였습니다</h4>\n      <p>8/29 보고서는 워시 의장의 매파적 잭슨홀 발언이 국채금리·원/달러 환율에 어떻게 반영되는지를 추적 대상으로 걸어뒀습니다. 확인해보니 미 10년물 국채금리는 <strong>4.672%(8/27)에서 4.73%(8/28)로 소폭 상승</strong>해 매파적 해석에 부합했습니다. 그런데 원/달러 환율은 같은 기간 오히려 <strong>1,380원대까지 강세</strong>를 보여 2025년 9월 이후 최고 수준을 기록했습니다. \"매파 발언 → 달러 강세 → 원화 약세\"라는 통상적 도식과는 <strong>정반대</strong> 방향입니다. 정확한 원인은 검증 보류로 남기고 다음 거래일에도 이 흐름이 이어지는지 계속 봅니다.</p>\n    </div>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>오늘 시장</h3></div>\n  <p class=\"sec-sub\">오늘(8/30)은 일요일로 국내외 증시 모두 휴장입니다. 가장 최근 확정된 마감은 국내는 8/28(금), 미국은 8/29(현지시간 금)입니다. 한국 관행대로 <span class=\"up\">상승은 빨강</span>, <span class=\"down\">하락은 파랑</span>으로 표시하며 미국 지수도 같은 기준을 적용합니다.</p>\n  <div class=\"tscroll\">\n    <table>\n      <thead><tr><th>항목</th><th>수치</th><th>의미</th></tr></thead>\n      <tbody>\n        <tr><td>코스피 (8/28 마감)</td><td class=\"num down\">6,788.88 (-1.79%)</td><td>반도체 투톱 급락, 외국인 1조 7,586억원 순매도(한국경제·더페어뉴스)</td></tr>\n        <tr><td>다우 (8/29 마감)</td><td class=\"num down\">-0.2%</td><td>AI 관련주 차익실현 속 낙폭은 제한적(뉴스1)</td></tr>\n        <tr><td>나스닥 (8/29 마감)</td><td class=\"num down\">-1.2%</td><td>AI 거품 우려로 4거래일 연속 약세(뉴스1)</td></tr>\n        <tr><td>S&amp;P500 (8/29 마감)</td><td class=\"num down\">-0.6%</td><td>엔비디아 -3%대, 델 -9%대(외신 종합)</td></tr>\n        <tr><td>원/달러 환율</td><td class=\"num\">1,380원대</td><td>2025년 9월 이후 최고 원화 강세(tradingeconomics 집계)</td></tr>\n        <tr><td>미 10년물 국채금리</td><td class=\"num\">4.73% (8/28)</td><td>8/27 4.672%에서 소폭 상승(Advisor Perspectives·ETFdb)</td></tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"prose\">\n    <p>다음 거래일인 월요일(8/31)에는 MSCI 리밸런싱 실제 매매(종가 기준)와 워시 발언 이후 국내 반도체 투톱의 추가 조정 여부가 겹칩니다. 주말 사이 확인한 사실들은 대부분 이 결과를 미리 가늠하기 위한 재료입니다.</p>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>주말 사이 확인된 것들</h3></div>\n  <div class=\"claims\">\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">뉴욕증시</span></div>\n      <h4>8/29(현지시간) 뉴욕증시, AI 관련주 매도세에 4거래일 연속 하락</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>나스닥이 <strong>1.2% 하락</strong>하며 8월 이후 최장인 4거래일 연속 약세를 이어갔고, S&amp;P500은 0.6%, 다우는 0.2% 내렸습니다. 델은 AI 사업 부문의 부진한 가이던스에 9%대 급락했고, 엔비디아도 3%대 하락했습니다. 연준이 선호하는 물가지표는 7월 기준 안정세를 보였고, 시장은 여전히 9월 금리 인하를 기대하는 분위기입니다(뉴스1 및 외신 종합).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">산업통상자원부</span></div>\n      <h4>웨스팅하우스 공동 지분인수설, 산업부가 공식 부인</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>미국 정부가 한국에 원전 기업 웨스팅하우스 지분의 공동 인수를 제안했다는 보도가 나오자, 산업통상자원부는 <strong>\"한미 양국이 공동 출자해 지분을 인수한다는 것은 사실과 다르다\"</strong>고 밝혔습니다. 다만 산업부와 한국전력이 미국 측 제안을 받아 투자 구조를 검토 중이라는 점은 부인하지 않았습니다. 이 보도 이후 한전기술·두산에너빌리티 등 원전 관련주가 동반 강세를 보인 바 있습니다(한국경제, 다음뉴스).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">검토 단계</span><span class=\"src\">미국 정부</span></div>\n      <h4>서버·노트북 포함 반도체 관세, 여전히 최종 확정 전</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8/27 보도된 노트북·게임콘솔·서버까지 포괄하는 고강도 반도체 관세 검토는 국가별 관세율·수입 할당량 아이디어까지 나왔지만 <strong>아직 최종 정책으로 확정되지 않았습니다.</strong> 세부안은 향후 수개월 동안 달라질 수 있다고 보도됐습니다(아주경제, 뉴스웨이, 서울경제).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">검증 보류</span><span class=\"src\">원/달러 환율</span></div>\n      <h4>원화, 2025년 9월 이후 최고 강세권 — 정확한 마감 시각은 대조 안 됨</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8월 말 원/달러 환율이 <strong>1,380원대</strong>로 2025년 9월 이후 가장 강한 원화 수준에 도달했다고 집계됐습니다. 다만 정확한 마감 시각과 국내 주요 매체의 1차 확인이 되지 않아, 워시 의장의 매파 발언과 동시에 벌어진 이례적 흐름이라는 해석은 <em>검증 보류</em>로 남겨둡니다(tradingeconomics).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">미 국채 10년물</span></div>\n      <h4>10년물 국채금리, 잭슨홀 앞두고 소폭 상승</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>미 10년물 국채금리는 8/27 <strong>4.672%</strong>에서 8/28 <strong>4.73%</strong>로 올랐습니다. 8/27 시점에는 잭슨홀 심포지엄을 앞두고 금리가 \"little changed\"로 보도됐으나, 워시 의장의 매파적 발언 이후 소폭 상승했습니다(Advisor Perspectives dshort, CNBC).</span></div>\n    </div></div>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>쟁점 — 월요일(8/31), 반등 재료와 조정 압력이 동시에 시험대에 오릅니다</h3></div>\n  <p class=\"sec-sub\">주말 동안 새로 확인된 사실들도 이 구도를 바꾸지 못했습니다. 재료는 여전히 두 갈래입니다.</p>\n  <div class=\"versus\">\n    <div class=\"side bull\">\n      <h4>반등 근거</h4>\n      <p>MSCI는 8/31 종가 기준으로 실제 매매가 이뤄지고 변경된 지수는 9/1부터 적용됩니다. 편입 종목에는 지수 추종 자금의 매수 수요가 발생합니다. 원전 관련주는 웨스팅하우스 지분 인수 논의가 부인되지 않은 채 이어지고 있어 수급 재료로 남아 있습니다.</p>\n      <p class=\"src\">이투데이·파이낸셜뉴스·한국경제 · 2026-08-11~26</p>\n    </div>\n    <div class=\"side bear\">\n      <h4>조정 압력 근거</h4>\n      <p>워시 의장의 매파적 잭슨홀 발언과 반도체 업종 전반의 차익실현 심리가 겹치며 8/28 국내 반도체 투톱이 급락했고, 8/29 뉴욕에서도 AI 관련주 매도세가 이어졌습니다. 여기에 반도체 관세 확대 검토까지 불확실성으로 남아 있습니다.</p>\n      <p class=\"src\">한국경제·뉴스1·아주경제 · 2026-08-27~29</p>\n    </div>\n  </div>\n  <div class=\"callout\">\n    <h4>왜 이게 결정적인가</h4>\n    <p>MSCI 리밸런싱에 따른 기계적 매수 수요와, 뉴욕발 AI 관련주 조정이 국내 반도체 투톱으로 이어질지는 <strong>같은 날(8/31) 정반대 방향으로</strong> 코스피에 작용할 수 있는 재료입니다. 여기에 매파 발언에도 오히려 강세를 보인 원화 흐름까지 겹쳐, 어느 쪽이 우세한지가 9월 초 흐름을 가늠하는 첫 신호가 됩니다.</p>\n    <p><strong>확인 방법</strong> — 8/31 코스피·코스닥 마감 지수, 반도체 투톱 등락률, 원/달러 환율 마감가, MSCI 리밸런싱 관련 외국인 수급을 다음 보고서에서 확인합니다.</p>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">04</span><h3>다음 추적 대상</h3></div>\n  <ol class=\"lessons\">\n    <li><strong>반도체 투톱 조정이 8/31까지 이어지는지.</strong> 8/28 급락과 8/29 뉴욕발 AI 매도세가 겹쳐 하루짜리 조정인지, 추세인지를 가립니다.</li>\n    <li><strong>MSCI 리밸런싱 실제 자금 유입 규모.</strong> 8/31 종가 기준 매매, 9/1 지수 반영 이후 확인합니다.</li>\n    <li><strong>트럼프 반도체 관세(서버·노트북 포함) 최종 확정 여부.</strong> 여전히 검토 단계입니다.</li>\n    <li><strong>원전주 강세 지속 여부.</strong> 산업부의 공동 인수설 부인에도 관련주 반응이 이어지는지 봅니다.</li>\n    <li><strong>원화 강세가 다음 거래일에도 유지되는지.</strong> 매파 발언과 반대로 움직인 흐름이 일회성인지 확인합니다.</li>\n  </ol>\n</section>\n"}, {"date": "2026-08-29", "dow": "토", "summary": "코스피가 8/28 반도체 투톱 급락에 6,788.88(-1.79%)로 4거래일 만에 하락 전환했고, 케빈 워시 연준의장은 첫 잭슨홀 연설에서 금리 인하 기대를 사실상 접는 매파적 발언을 내놨습니다.", "tally": {"ok": 5, "warn": 2, "bad": 0}, "kicker": ["자동생성·검색기반", "추적 2건 결론", "주말판"], "title": "코스피, 반도체 투톱 급락에 6,788선 후퇴 — 워시 의장 첫 잭슨홀 연설은 매파적", "standfirst": "8/28 코스피는 삼성전자·SK하이닉스 급락과 외국인·기관 동반 순매도에 6,788.88(-1.79%)로 4거래일 만에 하락 전환했고, 코스닥은 838.41로 보합권에 머물렀습니다. 미국에서는 케빈 워시 연준의장이 취임 후 첫 잭슨홀 기조연설에서 \"물가가 충분히 잡히지 않으면 금리를 더 올릴 수 있다\"고 밝혀 연초의 금리 인하 기대를 사실상 접었습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "한국경제·헤럴드경제·서울신문·디지털타임스·EBN·비즈니스코리아·뉴시스·청년일보·굿모닝경제·머니투데이·아주경제·서울경제·뉴데일리·파이낸셜뉴스·investing.com·ts2.tech·bloomingbit(2026-08-27~29 스니펫 기준)", "body": "<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">추적</span><h3>추적 결과 — 2건 결론, 1건은 예측이 빗나갔습니다</h3></div>\n  <div class=\"heads\">\n    <div class=\"head-card\">\n      <h4>레버리지, 코스피→코스닥 재이동 — 예측이 맞았습니다</h4>\n      <p>8/10 보고서에서 \"레버리지 거래대금이 줄어든 게 아니라 코스닥으로 옮긴 것인지\"를 추적 대상으로 걸어뒀습니다. 오늘 검색으로 확인했습니다 — 단일종목 레버리지 규제 이후 'KODEX 코스닥150'과 'KODEX 코스닥150레버리지'로 개인 자금이 꾸준히 순유입되며 코스닥 지수 레버리지 수익률이 60%를 웃돈 것으로 나타났습니다. <strong>규제로 눌린 자금이 사라진 게 아니라 코스닥으로 옮겨갔다</strong>는 8/10 시점의 우려가 맞았습니다(파이낸셜뉴스).</p>\n    </div>\n    <div class=\"head-card\">\n      <h4>한국은행 금리 인상 이후 매도세 — 예측이 부분적으로 틀렸습니다</h4>\n      <p>8/28 보고서는 장중 기준으로 \"외국인·기관 순매도가 금리 인상 이후 이어지는지\"를 추적 대상으로 걸어뒀습니다. 확인해보니 <strong>정작 금리 인상 당일(8/27)에는 외국인·기관이 각각 1,456억원·1,814억원 순매수</strong>했고, 순매도 주체는 오히려 개인(1조 9,120억원)이었습니다. 외국인·기관의 대규모 매도(8/28, 외국인 1조 7,586억원·기관 2,842억원)는 <strong>금리 인상 자체가 아니라 다음날 불거진 반도체 업종 전반의 차익실현 심리</strong>가 원인으로 파악됩니다. \"금리 인상 → 곧바로 외국인 이탈\"이라는 단순 도식은 이번엔 들어맞지 않았습니다(한국경제, 파이낸셜뉴스).</p>\n    </div>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>오늘 시장</h3></div>\n  <p class=\"sec-sub\">오늘(8/29)은 토요일로 국내외 증시 모두 휴장입니다. 가장 최근 확정된 마감은 8/28(금)입니다. 한국 관행대로 <span class=\"up\">상승은 빨강</span>, <span class=\"down\">하락은 파랑</span>으로 표시합니다.</p>\n  <div class=\"tscroll\">\n    <table>\n      <thead><tr><th>항목</th><th>수치</th><th>의미</th></tr></thead>\n      <tbody>\n        <tr><td>코스피 (8/28 마감)</td><td class=\"num down\">6,788.88 (-1.79%)</td><td>4거래일 만에 하락 전환. 외국인 1조 7,586억원 순매도(한국경제)</td></tr>\n        <tr><td>코스닥 (8/28 마감)</td><td class=\"num up\">838.41 (+0.09%)</td><td>보합권 마감(한국경제)</td></tr>\n        <tr><td>다우 (8/28 현지 마감)</td><td class=\"num down\">53,559.99 (-0.02%)</td><td>거의 보합(ts2.tech·vittarthi 집계)</td></tr>\n        <tr><td>나스닥 (8/28 현지 마감)</td><td class=\"num down\">26,402.42 (-0.52%)</td><td>반도체 차익실현(bloomingbit)</td></tr>\n        <tr><td>원/달러 환율</td><td class=\"num\">1,379원대 (검증 보류)</td><td>2025년 9월 이후 최고 원화 강세로 보도됨(투자닷컴 계열 집계, 정확한 마감 시각 대조 안 됨)</td></tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"prose\">\n    <p>월요일(8/31)은 MSCI 리밸런싱 실제 매매(종가 기준)와 워시 의장 발언 이후 첫 거래일이 겹치는 날입니다. 이번 주말 확인한 사실들은 대부분 그 결과를 미리 가늠하기 위한 재료입니다.</p>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>오늘 움직인 것들</h3></div>\n  <div class=\"claims\">\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">삼성전자·SK하이닉스</span></div>\n      <h4>반도체 투톱 급락 — 외국인·기관 순매도의 직접 원인</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8/28 삼성전자는 <strong>3.38% 하락한 257,000원</strong>, SK하이닉스는 <strong>4.45% 하락한 1,653,000원</strong>으로 마감했습니다. 유가증권시장에서 외국인이 1조 7,586억원, 기관이 2,842억원을 순매도했고 개인은 4,250억원을 순매수했습니다. 글로벌 반도체 업종 전반의 밸류에이션 부담이 차익실현 매물로 이어졌다는 분석입니다(한국경제, 청년일보, 헤럴드경제).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">케빈 워시 연준의장</span></div>\n      <h4>워시 의장 첫 잭슨홀 연설 — \"물가 안 잡히면 금리 더 올린다\"</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8/28(현지시간) 와이오밍 잭슨홀에서 열린 취임 후 첫 기조연설에서 워시 의장은 <strong>고용시장이 크게 흔들리지 않은 상태에서 물가가 2% 목표를 향해 충분히 둔화하지 않으면 추가 인상에 나설 수 있다</strong>는 입장을 밝혔습니다. 구체적 금리 경로는 제시하지 않았지만, 시장에서는 연초의 금리 인하 기대가 사실상 폐기된 것으로 받아들이고 있습니다(머니투데이, 아주경제, 서울경제, 뉴데일리).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">검증 보류</span><span class=\"src\">미국 3대 지수</span></div>\n      <h4>미국 증시, 워시 연설 앞두고 반도체 차익실현에 소폭 하락 마감</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8/28(현지시간) 다우는 <strong>9.45포인트(-0.02%) 하락한 53,559.99</strong>, S&P500은 <strong>0.25% 하락한 7,711.76</strong>, 나스닥은 <strong>0.52% 하락한 26,402.42</strong>로 마감했다고 보도됐습니다. 나스닥 하락폭은 블루밍빗이 별도로 교차 확인했지만, 다우·S&P500 수치는 국내 주요 매체로 재확인하지 못해 <em>검증 보류</em>로 남겨둡니다(ts2.tech, vittarthi.com, bloomingbit).</span></div>\n    </div></div>\n\n    <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">태양광 관련주</span></div>\n      <h4>美 대중국 태양광 관세 결정에 국내 태양광주 동반 상승</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>미국 정부가 중국산으로 의심되는 태양광 제품에 관세를 부과하기로 하면서, 미국에 생산 거점을 둔 <strong>한화큐셀·OCI홀딩스</strong>가 반사이익을 볼 것이라는 전망이 나왔습니다. 8/28 국내 증시에서 HD현대에너지솔루션, 신성이엔지, OCI홀딩스, 대주전자재료, 한화솔루션 등이 상승했다고 보도됐습니다(businesskorea).</span></div>\n    </div></div>\n\n    <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n      <div class=\"ctop\"><span class=\"chip warn\">검토 단계</span><span class=\"src\">미국 정부</span></div>\n      <h4>서버·노트북 포함 반도체 관세, 여전히 검토 단계</h4>\n      <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8/27 CNBC 등이 보도한 노트북·게임콘솔·서버까지 포괄하는 고강도 반도체 관세 검토는 8/28 이후 새 진전 소식 없이 <strong>여전히 검토 단계</strong>입니다. 러트닉 상무장관이 밀고 있는 미국 내 생산 투자와 관세 면제 연동 구상도 최종 확정되지 않았습니다(아주경제, 뉴스웨이, 서울경제).</span></div>\n    </div></div>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>쟁점 — 월요일(8/31), 반등 재료와 조정 압력이 동시에 시험대에 오릅니다</h3></div>\n  <p class=\"sec-sub\">주말 사이 쌓인 두 갈래 재료가 다음 거래일에 한꺼번에 확인됩니다.</p>\n  <div class=\"versus\">\n    <div class=\"side bull\">\n      <h4>반등 근거</h4>\n      <p>MSCI는 8월 정기 리뷰 결과에 따라 <strong>8/31 종가 기준으로 실제 매매</strong>가 이뤄지고 변경된 지수는 9/1부터 적용됩니다. 편입 종목에는 지수 추종 자금의 매수 수요가 발생합니다. 증권가 일각에서는 9월부터 통화정책·반도체·주주환원 재료가 차례로 부각되며 반등 국면에 접어들 수 있다는 전망도 나옵니다.</p>\n      <p class=\"src\">이투데이·파이낸셜뉴스 · 2026-08-11~13</p>\n    </div>\n    <div class=\"side bear\">\n      <h4>조정 압력 근거</h4>\n      <p>워시 의장의 매파적 잭슨홀 발언과 반도체 업종 전반의 차익실현 심리가 겹치면서, 8/28 국내 반도체 투톱(삼성전자·SK하이닉스)이 3~4%대 급락했습니다. 이 흐름이 월요일까지 이어질지가 관건입니다.</p>\n      <p class=\"src\">한국경제·머니투데이 · 2026-08-28~29</p>\n    </div>\n  </div>\n  <div class=\"callout\">\n    <h4>왜 이게 결정적인가</h4>\n    <p>MSCI 리밸런싱에 따른 기계적 매수 수요와, 워시 발언 이후 반도체 투톱의 추가 조정 여부는 <strong>같은 날(8/31) 정반대 방향으로</strong> 코스피에 작용할 수 있는 재료입니다. 둘 중 어느 쪽이 우세한지가 9월 초 흐름을 가늠하는 첫 신호가 됩니다.</p>\n    <p><strong>확인 방법</strong> — 8/31 코스피·코스닥 마감 지수, 반도체 투톱 등락률, MSCI 리밸런싱 관련 외국인 수급을 다음 보고서에서 확인합니다.</p>\n  </div>\n</section>\n\n<section>\n  <div class=\"sec-head\"><span class=\"sec-n\">04</span><h3>다음 추적 대상</h3></div>\n  <ol class=\"lessons\">\n    <li><strong>워시 의장 잭슨홀 발언 이후 국채금리·원/달러 환율 변화.</strong> 매파적 발언이 실제 금리·환율에 반영되는지 확인합니다. → <em>8/30 추적 결과: 국채금리는 부합(4.672%→4.73%), 원/달러는 오히려 강세(1,380원대)로 어긋났습니다.</em></li>\n    <li><strong>반도체 투톱 조정이 8/31까지 이어지는지.</strong> 8/28 급락이 하루짜리 차익실현인지, 추세인지를 가립니다.</li>\n    <li><strong>MSCI 리밸런싱 실제 자금 유입 규모.</strong> 8/31 종가 기준 매매, 9/1 지수 반영 이후 확인합니다.</li>\n    <li><strong>트럼프 반도체 관세(서버·노트북 포함) 최종 확정 여부.</strong> 여전히 검토 단계입니다.</li>\n    <li><strong>코스닥 사이드카 추가 발동 여부.</strong> 8/10 이후 새 사례가 확인되지 않아 계속 추적합니다.</li>\n  </ol>\n</section>"}, {"date": "2026-08-28", "dow": "금", "summary": "한국은행이 두 달 연속 기준금리를 인상해 3.00%가 됐고, 코스피는 8/27 급등분을 반납하며 마감한 뒤 8/28 장중엔 6,840선까지 밀렸습니다.", "tally": {"ok": 2, "warn": 1, "bad": 0}, "kicker": ["자동생성·검색기반", "검증 3건"], "title": "한국은행 기준금리 2연속 인상 — 코스피, 급등분 반납하고 장중 6,840선 하회", "standfirst": "한국은행이 8/27 기준금리를 3.00%로 두 달 연속 인상하며 긴축 사이클에 들어갔습니다. 같은 날 미국에서는 엔비디아 실적에 나스닥이 1.57% 뛰었지만, 서버·노트북까지 포함하는 반도체 관세 검토 소식도 함께 나왔습니다. 코스피는 8/27 6,912선에서 상승폭을 줄이며 마감했고, 8/28 장중엔 외국인·기관 매도에 6,840선을 하회했습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "머니투데이·파이낸셜뉴스·한국경제·서울신문·코리아타임즈·CNBC·헤럴드경제·중앙이코노미뉴스·investing.com(2026-08-27~28 스니펫 기준)", "body": "<section>\n          <div class=\"sec-head\"><span class=\"sec-n\">추적</span><h3>추적 현황 — 아직 결론 난 항목 없음</h3></div>\n          <div class=\"heads\">\n            <div class=\"head-card\">\n              <h4>웨스팅하우스 지분 공동 인수설 — 산업부는 \"사실무근\"</h4>\n              <p>8/26 보고서에서 열어둔 추적 대상입니다. 이후 보도(한국경제)는 미국이 브룩필드 보유 지분(51%) 인수나 IPO 신주 매입을 검토 중이라는 내용을 이어갔지만, <strong>산업통상부 관계자는 \"한미 공동 출자 방안은 사실과 다르다\"고 공식 부인</strong>했습니다. 진전으로 보기 어려워 추적을 계속합니다.</p>\n            </div>\n            <div class=\"head-card\">\n              <h4>코스닥 사이드카 추가 발동 — 오늘 검색으로도 확인되지 않음</h4>\n              <p>8/10 이후 새 사이드카 발동 보도는 오늘 검색에서도 나오지 않았습니다. 8월 초(7/31~8/4) 3거래일 연속 발동 이후 추가 사례는 없는 것으로 보입니다.</p>\n            </div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>오늘 시장</h3></div>\n          <p class=\"sec-sub\">가장 최근 확정된 마감은 8/27입니다. 8/28 국내 마감은 검색 시점에 아직 매체에 반영되지 않아 장중 수치로 별도 표시합니다. 한국 관행대로 <span class=\"up\">상승은 빨강</span>, <span class=\"down\">하락은 파랑</span>으로 표시합니다.</p>\n          <div class=\"tscroll\">\n            <table>\n              <thead><tr><th>항목</th><th>수치</th><th>의미</th></tr></thead>\n              <tbody>\n                <tr><td>코스피 (8/27 마감)</td><td class=\"num up\">6,912.37 (+1.53%)</td><td>장 초반 +2.76% 급등 후 금리 인상 소식에 상승폭 축소(파이낸셜뉴스)</td></tr>\n                <tr><td>코스닥 (8/27 마감)</td><td class=\"num up\">837.65 (+1.30%)</td><td>이차전지주 강세, 상한가 10종목</td></tr>\n                <tr><td>다우 (8/27 현지 마감)</td><td class=\"num up\">53,569.44 (+0.20%)</td><td>혼조 속 소폭 상승(코리아타임즈)</td></tr>\n                <tr><td>나스닥 (8/27 현지 마감)</td><td class=\"num up\">26,541.35 (+1.57%)</td><td>엔비디아 실적에 기술주 랠리(코리아타임즈)</td></tr>\n                <tr><td>원/달러 환율</td><td class=\"num\">1,381.6원대</td><td>검색 시점 실시간 기준, 1,378~1,386원 범위(investing.com)</td></tr>\n              </tbody>\n            </table>\n          </div>\n          <div class=\"prose\">\n            <p><strong>오늘(8/28) 장중</strong> — 코스피는 개장 직후 하락 전환해 <strong>6,840선을 하회</strong>했습니다. 외국인·기관 동반 순매도가 원인으로 보도됐습니다(서울신문, 머니투데이). 코스닥은 개장 직후 소폭 상승(+0.31%대)이 확인됐으나, 마감 결과는 <em>검증 보류</em>입니다.</p>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>오늘 움직인 것들</h3></div>\n          <div class=\"claims\">\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">일정 확정</span><span class=\"src\">한국은행</span></div>\n              <h4>기준금리 3.00%로 인상 — 두 달 연속, 긴축 사이클 진입</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>한국은행 금융통화위원회는 8/27 기준금리를 <strong>연 3.00%로 0.25%p 인상</strong>했습니다. 7월에 이어 <strong>두 달 연속(백투백) 인상</strong>이며, 지난해 5월 2.50%로 내린 뒤 1년 2개월 이어진 동결 기조가 끝났습니다. 한은은 올해 성장률 전망도 5월 2.6%에서 <strong>3.3%로 0.7%p 상향</strong>했습니다(머니투데이).</span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">검토 단계</span><span class=\"src\">미국 정부</span></div>\n              <h4>트럼프 행정부, 서버·노트북까지 포함하는 반도체 관세 검토</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>CNBC 보도(8/27)에 따르면 미 행정부는 <strong>개별 칩을 넘어 서버·노트북·게임기 등 완제품까지</strong> 포괄하는 관세 구조를 검토 중입니다. 러트닉 상무장관은 <strong>미국 내 생산 공약과 관세 면제를 연동</strong>하는 방식을 선호하는 것으로 전해졌습니다. <em>초기 단계이며 시행 여부와 시기는 미정</em>입니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">SK하이닉스</span></div>\n              <h4>美 인디애나 HBM 패키징 공장 기공 — 2029년 하반기 양산 목표</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>SK하이닉스가 8/27(현지시간) 인디애나주 웨스트라피엣에서 <strong>첨단 패키징 생산기지 기공식</strong>을 열었습니다. 투자 규모 <strong>40억달러 이상</strong>, 부지 54만㎡(축구장 약 75개). 2028년 10월 클린룸 완공, <strong>2029년 하반기 HBM 양산</strong> 목표입니다. 미 정부는 CHIPS법에 따라 <strong>보조금 4억5,800만달러·대출 최대 5억달러</strong>를 지원합니다(헤럴드경제, 중앙이코노미뉴스).</span></div>\n            </div></div>\n\n            <div class=\"claim\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip neutral\">검증 보류</span><span class=\"src\">코스피 8/28 장중</span></div>\n              <h4>코스피, 개장 후 6,840선 하회 — 외국인·기관 순매도</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>서울신문·머니투데이(8/28 오전)에 따르면 코스피는 <strong>개장 직후 하락 전환해 6,840선을 하회</strong>했고 외국인·기관이 동반 순매도했습니다. 마감 결과는 검색 시점 기준 확인되지 않아 다음 보고서에서 따라갑니다. <strong>[8/29 후속]</strong> 코스피는 6,788.88(-1.79%)로 마감해 4거래일 만에 하락 전환했습니다. 다만 외국인·기관의 순매도는 반도체 업종 차익실현이 주된 원인으로 파악되며, 금리 인상 당일(8/27) 자체는 외국인·기관이 오히려 순매수였습니다.</span></div>\n            </div></div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>쟁점 — 엔비디아 랠리와 관세 리스크, 어느 쪽이 이기나</h3></div>\n          <p class=\"sec-sub\">간밤 미국 증시와 오늘 국내 장이 반대로 움직인 배경입니다.</p>\n          <div class=\"versus\">\n            <div class=\"side bull\">\n              <h4>실적 랠리 · 강세 근거</h4>\n              <p>엔비디아가 <strong>8.74% 급등</strong>하며 나스닥을 1.57% 끌어올렸습니다. AI 데이터센터 수요가 실적으로 증명됐다는 해석이 나왔습니다.</p>\n              <p class=\"src\">코리아타임즈 · 2026-08-27</p>\n            </div>\n            <div class=\"side bear\">\n              <h4>관세·금리 · 경계 근거</h4>\n              <p>미 행정부가 <strong>서버·노트북까지 포함하는 반도체 관세</strong>를 검토 중이고, 한국은행은 <strong>두 달 연속 금리 인상</strong>으로 긴축에 들어갔습니다. 오늘 코스피는 외국인·기관 매도에 6,840선을 밀렸습니다.</p>\n              <p class=\"src\">CNBC·서울신문 · 2026-08-27~28</p>\n            </div>\n          </div>\n          <div class=\"callout\">\n            <h4>왜 이게 결정적인가</h4>\n            <p>어젯밤 미국 시장은 엔비디아 실적을 반겼지만, 그 실적을 만든 공급망(반도체)에 관세가 붙을 수 있다는 소식이 같은 날 나왔습니다. 국내는 여기에 <strong>금리 인상까지 겹쳐</strong> 두 재료가 동시에 상쇄됐고, 그 결과가 오늘 코스피의 상승폭 축소 개장 이후 하락 전환입니다.</p>\n              <p><strong>확인 방법</strong> — 반도체 관세가 실제로 발표되는지, 그리고 국내 증시가 금리 인상 이후에도 추가로 밀리는지를 다음 보고서에서 확인합니다.</p>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">04</span><h3>다음 추적 대상</h3></div>\n          <ol class=\"lessons\">\n            <li><strong>한국은행 2연속 인상 이후 코스피 자금 이탈이 이어지는지.</strong> 오늘 장중 외국인·기관 순매도가 하루로 끝나는지 지켜봅니다.</li>\n            <li><strong>트럼프 반도체 관세(서버·노트북 포함)의 실제 발표 여부.</strong> 검토 단계이며 시행 시기가 정해지지 않았습니다.</li>\n            <li><strong>웨스팅하우스 지분 인수설의 실제 진전.</strong> 산업부는 부인했지만 미국 측 제안 보도는 계속 나오고 있습니다.</li>\n            <li><strong>MSCI 리밸런싱 실제 자금 유입 규모.</strong> 8/31 종가 기준 시행 이후 확인합니다.</li>\n            <li><strong>코스닥 사이드카 추가 발동 여부.</strong> 8/10 이후 새 사례가 없어 계속 추적합니다.</li>\n          </ol>\n        </section>"}, {"date": "2026-08-26", "dow": "수", "summary": "MSCI 편입·편출 예측이 그대로 맞았다 — 코스피 6,742·코스닥 827 마감, 원전주는 웨스팅하우스 기대에 급등", "tally": {"ok": 1, "warn": 0, "bad": 0}, "kicker": ["자동생성·검색기반", "MSCI 예측 적중"], "title": "MSCI 편출입 예측이 적중했습니다 — LG이노텍 편입, HLB 등 4종목 편출", "standfirst": "8/10 보고서에서 짚었던 MSCI 편입·편출 후보가 실제 결과와 정확히 일치했습니다. 코스피는 6,742선, 코스닥은 827선에서 마감했고, 원전주는 웨스팅하우스 지분 인수 기대에 급등했습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "뉴시스·인포스탁데일리·비즈니스코리아·디지털타임스·포쓰저널·헤럴드경제·매일신문·비즈니스포스트·워싱턴포스트·블루밍빗(2026-08-25~26 스니펫 기준)", "body": "<section>\n          <div class=\"sec-head\"><span class=\"sec-n\">추적</span><h3>지난 추적 결과 — MSCI 예측 적중</h3></div>\n          <div class=\"heads\">\n            <div class=\"head-card\" style=\"border-left-color:var(--ok)\">\n              <h4>MSCI 8월 정기 리뷰 — 후보 예측이 그대로 맞았습니다</h4>\n              <p>8/10 보고서에서 <strong>“LG이노텍 편입 유력, 포스코인터내셔널·삼성에피스홀딩스·HLB·LG디스플레이 편출 후보”</strong>로 적어뒀습니다. 8/13 실제 발표에서 <strong>LG이노텍이 MSCI 한국지수에 신규 편입</strong>됐고, <strong>HLB·LG디스플레이·포스코인터내셔널·삼성에피스홀딩스 4종목이 그대로 편출</strong>됐습니다(디지털타임스, 포쓰저널, 시사저널). 지수 구성 종목은 <strong>78개에서 74개로</strong> 줄었고, 리밸런싱은 <strong>8/31 종가 기준 9/1 반영</strong>됩니다. 예상 패시브 자금 유입 규모는 증권사별로 <strong>7,850억~4,390억원</strong>까지 갈렸습니다(헤럴드경제).</p>\n            </div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>오늘 시장</h3></div>\n          <p class=\"sec-sub\">국내 8/26 마감 수치는 검색 시점에 아직 매체에 반영되지 않아, 가장 최근 확인된 8/25 마감을 기준으로 정리합니다. 한국 관행대로 <span class=\"up\">상승은 빨강</span>, <span class=\"down\">하락은 파랑</span>으로 표시합니다.</p>\n          <div class=\"tscroll\">\n            <table>\n              <thead><tr><th>항목</th><th>수치</th><th>의미</th></tr></thead>\n              <tbody>\n                <tr><td>코스피 (8/25 마감)</td><td class=\"num up\">6,742.74 (+0.68%)</td><td>장 초반 -2.40% 급락 후 반등 마감(뉴시스)</td></tr>\n                <tr><td>코스닥 (8/25 마감)</td><td class=\"num up\">827.15 (+1.70%)</td><td>반도체·바이오 중심 상승(인포스탁데일리)</td></tr>\n                <tr><td>다우 (8/25 현지 마감)</td><td class=\"num up\">전일比 +0.2%</td><td>혼조 속 소폭 상승(워싱턴포스트)</td></tr>\n                <tr><td>나스닥 (8/25 현지 마감)</td><td class=\"num down\">25,980.19 (-0.77%)</td><td>기술주 매도세, 이란 관련 경제 압박 지속(블루밍빗)</td></tr>\n                <tr><td>원/달러 환율 (8/25 마감)</td><td class=\"num up\">1,386.1원 (+3.7원)</td><td>반도체 반등에도 환율은 상승(뉴시스)</td></tr>\n              </tbody>\n            </table>\n          </div>\n          <div class=\"prose\">\n            <p><strong>주의해서 읽을 부분</strong> — 위 수치는 모두 8/25(전 거래일) 마감 기준입니다. 8/26 국내 마감은 검색 시점 기준 매체 보도가 아직 확인되지 않아 <em>검증 보류</em>로 남겨둡니다.</p>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>오늘 움직인 것들</h3></div>\n          <div class=\"claims\">\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">기대감 선반영</span><span class=\"src\">원전주</span></div>\n              <h4>한전기술·현대건설·두산에너빌리티 급등 — 웨스팅하우스 지분 인수 기대</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>미국 정부가 한국에 <strong>웨스팅하우스 지분 공동 인수를 제안</strong>했다는 소식에 원전 관련주가 일제히 강세를 보였습니다. 8/25 종가 기준 <strong>두산에너빌리티 +10.55%(80,700원)</strong>, <strong>한전기술 +10%대</strong>, <strong>현대건설 +9%대</strong>(매일신문) — 다른 매체는 장중 기준으로 더 큰 폭을 보도했습니다(비즈니스포스트). <em>지분 인수는 아직 협상 단계</em>이고 실제 계약이나 수주가 확정된 것은 아닙니다.</span></div>\n            </div></div>\n\n            <div class=\"claim\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip neutral\">금리 일정</span><span class=\"src\">한국은행</span></div>\n              <h4>8/27 한국은행 금통위 — 기준금리 2.5% 동결 여부 발표</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>미국 연준 기준금리는 <strong>3.50~3.75%로 동결</strong> 상태이고, 한국은행 기준금리는 <strong>2.5% 동결</strong> 상태입니다. 다음 통화정책방향 결정회의는 <strong>내일(8/27)</strong>로 예정돼 있습니다.</span></div>\n            </div></div>\n\n            <div class=\"claim\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip neutral\">검증 보류</span><span class=\"src\">코스닥 사이드카</span></div>\n              <h4>8/10 이후 추가 사이드카 발동 여부는 확인되지 않음</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>8/10 시점까지 <strong>이달 세 번째 매수 사이드카</strong>가 발동됐다는 보도(한국경제, EBN, 매일신문)는 확인됩니다. 다만 <strong>8/10 이후 추가 발동 여부는 오늘 검색으로 확인되지 않아</strong> 추적을 계속합니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">일정 확정</span><span class=\"src\">MSCI</span></div>\n              <h4>MSCI 한국지수 리밸런싱 — 8/31 종가 기준 9/1 반영</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>LG이노텍 편입, HLB·LG디스플레이·포스코인터내셔널·삼성에피스홀딩스 편출이 <strong>확정</strong>됐습니다. 패시브 자금 유입 규모 추정치는 증권사별로 <strong>7,850억~4,390억원</strong>까지 벌어져(헤럴드경제) 실제 유입 규모는 시행 이후 확인이 필요합니다.</span></div>\n            </div></div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>다음 추적 대상</h3></div>\n          <ol class=\"lessons\">\n            <li><strong>MSCI 리밸런싱 실제 자금 유입 규모.</strong> 7,850억~4,390억원으로 추정치 폭이 큽니다. 8/31 종가 기준 시행 이후 실제 수급을 확인합니다.</li>\n            <li><strong>원전주 강세가 재료 소멸 후에도 유지되는지.</strong> 웨스팅하우스 지분 인수는 아직 협상 단계입니다. 실제 진전이 있는지 봅니다.</li>\n            <li><strong>코스닥 사이드카 추가 발동 여부.</strong> 8/10 이후 새 데이터가 확인되지 않았습니다. 계속 추적합니다.</li>\n            <li><strong>8/27 한국은행 금통위 결과.</strong> 기준금리 2.5% 동결이 유지되는지 확인합니다.</li>\n          </ol>\n        \n          <p class=\"prose\"><strong>후속(9/3 확인)</strong> — MSCI 편입 이후 증권사들은 LG이노텍에 785억~4,390억원의 패시브 자금 유입을 추정했지만(헤럴드경제), 실제로는 9/1 종가가 590,000원으로 전일 대비 8.10% 급락해 유입 기대가 주가를 지지하지 못했습니다(중앙이코노미뉴스). 정확한 순매수 확정치는 여전히 검증 보류입니다.</p>\n        </section>"}, {"date": "2026-08-10", "dow": "월", "summary": "추적하던 두 건 결판 — 레버리지는 꺾이고, 호르무즈는 안 열렸다", "tally": {"ok": 1, "warn": 0, "bad": 1}, "kicker": ["추적 결과 2건", "코스피 6,300 회복"], "title": "추적하던 두 건이 결판났습니다 — 하나는 맞고 하나는 틀렸습니다", "standfirst": "지난 보고서에서 “이 숫자로 판가름난다”고 지목한 레버리지 비중이 실제로 꺾였습니다. 반대로 유가가 5.3% 급락하며 반영했던 호르무즈 개방은 아직 오지 않았습니다.", "sources": "한국경제 증권·경제·국제면(2026-08-10) · 전자신문", "body": "<section>\n          <div class=\"sec-head\"><span class=\"sec-n\">추적</span><h3>지난 보고서 결과</h3></div>\n          <div class=\"heads\">\n            <div class=\"head-card\" style=\"border-left-color:var(--ok)\">\n              <h4>✅ 레버리지 쟁점 — 강세론 쪽이 맞았습니다</h4>\n              <p>8/6 보고서에서 <strong>“코스피200 지수형 레버리지 비중이 실제로 줄어드는가로 판가름난다”</strong>고 적고 추적 대상으로 걸어뒀습니다. 오늘 결과가 나왔습니다 — 당국 규제 이후 <strong>12조원에 육박하던 거래가 8,000억원대로</strong> 줄었습니다. 한국경제가 지적한 “지수형으로 환승” 흐름은 규제로 차단됐고, <strong>모건스탠리의 “레버리지 해소” 전제가 사후적으로 성립</strong>했습니다. 같은 날 코스피는 <strong>6,300선을 회복</strong>했습니다.</p>\n            </div>\n            <div class=\"head-card\">\n              <h4>❌ 호르무즈 — 시장이 선반영한 개방이 오지 않았습니다</h4>\n              <p>8/5에 트럼프·베선트가 개방 임박을 시사하며 <strong>브렌트유가 5.3% 급락</strong>했고, 저는 <span class=\"handle\">@davidkim</span>의 “합의 50 대 50”을 <em>시장보다 보수적</em>이라고 판정했습니다. <strong>그 판정이 틀렸습니다.</strong> 닷새 뒤인 오늘, 호르무즈에는 여전히 <strong>선원 6,000명이 발이 묶여</strong> 있고, 이란은 최고안보수장에 <strong>강경파를 앉혔습니다.</strong> 트럼프는 “돈 없는 이란을 지켜보고 있다”며 경제 압박으로 방향을 틀었습니다. 보수적이었던 쪽이 옳았습니다.</p>\n            </div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>오늘 시장</h3></div>\n          <p class=\"sec-sub\">한국 관행대로 <span class=\"up\">상승은 빨강</span>, <span class=\"down\">하락은 파랑</span>으로 표시합니다.</p>\n          <div class=\"tscroll\">\n            <table>\n              <thead><tr><th>항목</th><th>수치</th><th>의미</th></tr></thead>\n              <tbody>\n                <tr><td>코스피</td><td class=\"num up\">6,300선 회복 (장 초반 +1%대)</td><td>레버리지 규제 이후 안정 회복</td></tr>\n                <tr><td>코스닥150 지수</td><td class=\"num up\">+6.25%</td><td>선물 +6.05%. <strong>매수 사이드카 발동</strong> — 프로그램 매수호가 5분 정지</td></tr>\n                <tr><td>사이드카 발동 빈도</td><td class=\"num up\">6거래일 중 3번</td><td>이달 세 번째. 과열 신호로 읽어야 함</td></tr>\n                <tr><td>레버리지 거래대금</td><td class=\"num down\">12조 → 8,000억대</td><td><strong>추적하던 지표.</strong> 당국 규제 효과 확인</td></tr>\n                <tr><td>美 국채금리</td><td class=\"num up\">20년래 고점</td><td>AI 투자·주택시장 압박 요인</td></tr>\n              </tbody>\n            </table>\n          </div>\n          <div class=\"prose\">\n            <p><strong>주의해서 읽을 부분</strong> — 코스닥 급등은 좋은 소식처럼 보이지만, <strong>6거래일 중 3번의 사이드카는 정상 장세가 아닙니다.</strong> 레버리지가 규제로 눌린 직후에 이런 변동성이 나온다면, 자금이 코스피 대형주에서 코스닥으로 옮겨간 결과일 수 있습니다. 실제로 오늘 <strong>“삼전닉스 던지고 코스닥 담는 1% 초고수들”</strong> 기사가 나왔습니다. <em>레버리지가 줄어든 게 아니라 또 자리를 옮긴 것인지</em>는 다음 추적 대상입니다. <strong>[8/29 후속]</strong> 코스닥150·코스닥150레버리지 ETF 순유입이 확인되며 실제로 코스닥으로 옮겨간 것으로 추적 결론이 났습니다.</p>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>오늘 움직인 것들</h3></div>\n          <div class=\"claims\">\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">과열 주의</span><span class=\"src\">코스닥</span></div>\n              <h4>코스닥 5%대 급등 · 매수 사이드카 발동</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>코스닥150선물 <strong>+6.05%</strong>, 코스닥150지수 <strong>+6.25%</strong>. 프로그램 매수호가 5분간 정지. <strong>이달 세 번째, 6거래일 중 3번</strong>. ‘천스닥’ 도전 기사까지 나왔습니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">증권가 신중</span><span class=\"src\">고려아연</span></div>\n              <h4>美 상무장관 광물 투자 모범사례 언급에 급등</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>언급 자체로 주가가 급등했으나 <strong>증권가는 신중한 입장</strong>입니다. 정책 발언 한 줄에 반응한 것이지 실적이나 계약이 바뀐 게 아닙니다. K방산주도 <strong>美 국방부 발언</strong>에 같은 구조로 질주했습니다. <em>발언 기반 급등은 발언으로 되돌아갑니다.</em></span></div>\n            </div></div>\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">실적 동반</span><span class=\"src\">알테오젠</span></div>\n              <h4>7거래일째 상승 — 호실적 + 블랙록 지분 매입</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>위 두 건과 달리 <strong>실적과 실제 지분 매입</strong>이 근거로 붙어 있습니다. 같은 ‘급등’이라도 무엇이 뒷받침하는지가 다릅니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">자금 이동</span><span class=\"src\">글로벌</span></div>\n              <h4>美 기술주 쏠림 탈피 — 유럽증시로 자금 이동</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>유가 하락과 실적 호조로 유럽증시에 다시 돈이 몰리고 있습니다. 동시에 <strong>美 국채금리가 20년래 고점</strong>이라 AI 투자와 주택시장을 누르고 있습니다. 미국 기술주 일변도 포트폴리오에는 불리한 조합입니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">일정</span><span class=\"src\">MSCI</span></div>\n              <h4>13일 MSCI 편·출입 발표</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>편입·편출 종목은 패시브 자금이 기계적으로 따라붙어 <strong>수급이 크게 흔들립니다.</strong> 발표 전 ‘유력 후보’ 기사가 도는 시기라, 이때 나오는 종목 추천은 특히 걸러 들으십시오.</span></div>\n            </div></div>\n\n            <div class=\"claim v-bad\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip bad\">당국 경고</span><span class=\"src\">금감원</span></div>\n              <h4>“원금 전부 잃을 수도” — 금감원 경고</h4>\n              <div class=\"kv found\"><span class=\"lbl\">사실</span><span>금감원이 특정 상품에 대해 원금 전액 손실 가능성을 경고했습니다. 8/6 보고서에서 짚은 <strong>ETN의 발행사 신용위험</strong>과 같은 계열의 문제입니다. 이름이 비슷한 상품일수록 <strong>구조를 확인하고 들어가야 합니다.</strong></span></div>\n            </div></div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>다음 추적 대상</h3></div>\n          <ol class=\"lessons\">\n            <li><strong>코스닥 사이드카 빈도.</strong> 6거래일 중 3번은 비정상입니다. 이 빈도가 줄어드는지 봅니다. → <em>8/30 추적 결과: 2026년 들어 7/28까지 42회 발동(비공식 집계) — 이례적으로 빈번했다는 방향성은 확인되나 1차 매체 재확인은 안 돼 정확한 수치는 검증 보류.</em></li>\n            <li><strong>레버리지가 정말 줄었는지, 코스닥으로 옮긴 건지.</strong> 거래대금은 8,000억대로 꺾였지만, 같은 날 “삼전닉스 던지고 코스닥 담는다”는 흐름이 잡혔습니다. 8/5의 ‘환승’이 반복되는지 확인합니다.</li>\n            <li><strong>호르무즈.</strong> 유가는 이미 개방을 반영해 급락했는데 실제로는 열리지 않았습니다. 이 격차가 어떻게 정리되는지 봅니다.</li>\n            <li><strong>13일 MSCI 발표.</strong> 수급 이벤트로 표시해둡니다. → <em>8/26 추적 결과: LG이노텍 편입, HLB·LG디스플레이·포스코인터내셔널·삼성에피스홀딩스 4종목 편출로 확정 — 예측 적중.</em></li>\n          </ol>\n        </section>"}, {"date": "2026-08-06", "dow": "목", "summary": "50K+ 계정만 대조 — ETF/ETN 혼동, 빅테크 부채 수치 불일치", "tally": {"ok": 3, "warn": 4, "bad": 0}, "kicker": ["50K+ 3곳", "검증 7건"], "title": "큰 계정도 틀립니다 — 오늘은 상품 종류를 틀렸습니다", "standfirst": "팔로워 5만 이상 스레드 주식 계정 3곳의 주장을 모아 1차 자료와 대조했습니다. 사실인 것과 아닌 것을 갈라놓고, 계정끼리 부딪히는 지점을 표시합니다.", "sources": "스레드 프로필 직접 측정(@badakstock, @ho_ho_ju_ju, @bstory_economy 외 7곳) · 한국경제 · 아시아경제·디지털데일리·파이낸셜뉴스(SK실트론) · ETF Trends·한국경제(SMHU) · 아주경제·서울경제·ZDNet(빅테크 부채) · 파이낸셜뉴스·전자신문(모건스탠리)", "body": "<section>\n          <div class=\"sec-head\"><span class=\"sec-n\">핵심</span><h3>오늘 먼저 볼 두 가지</h3></div>\n          <div class=\"heads\">\n            <div class=\"head-card\">\n              <h4>ETF가 아니라 ETN입니다 — 경고에서 정작 중요한 위험이 빠졌습니다</h4>\n              <p><span class=\"handle\">@bstory_economy</span>가 신규 반도체 3배 상품 <strong>SMHU</strong>를 “ETF”로 소개하며 레버리지 위험을 경고했습니다. 그런데 SMHU는 <strong>ETN(상장지수증권)</strong>입니다. ETF는 자산을 실제로 보유하지만 ETN은 <strong>발행사의 무담보 채권</strong>입니다. 발행사가 무너지면 지수가 올라도 돈을 못 받습니다. 3배 변동성보다 앞서 확인해야 할 위험인데 경고에서 빠졌습니다.</p>\n            </div>\n            <div class=\"head-card amber\">\n              <h4>빅테크 부채 숫자가 공개 집계와 맞지 않습니다</h4>\n              <p><span class=\"handle\">@ho_ho_ju_ju</span>가 “빅테크 6개사 장부 부채 1.4조 달러, 약정 1.8조 달러”라고 했습니다. 공개 집계는 <strong>4개사 약정 약 2.4조 달러</strong>, <strong>5대 빅테크 미인식 리스 약 1.1조 달러</strong>입니다. 대상 기업 수와 금액이 모두 어긋납니다. 방향(부채 급증)은 맞지만 숫자는 그대로 쓰기 어렵습니다.</p>\n            </div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>대조 대상 — 50K+만</h3></div>\n          <p class=\"sec-sub\">팔로워 5만 이상만 대조 대상에 넣었습니다. 아래 수치는 전부 프로필에서 직접 측정했습니다.</p>\n          <div class=\"tscroll\">\n            <table>\n              <thead><tr><th>계정</th><th>팔로워</th><th>영역</th><th>판정</th></tr></thead>\n              <tbody>\n                <tr class=\"pass\"><td class=\"handle\">@badakstock</td><td class=\"num\">56,500</td><td>차트·산업 해설</td><td><span class=\"chip ok\">대조</span></td></tr>\n                <tr class=\"pass\"><td class=\"handle\">@ho_ho_ju_ju</td><td class=\"num\">54,500</td><td>매크로·섹터·리포트</td><td><span class=\"chip ok\">대조</span></td></tr>\n                <tr class=\"pass\"><td class=\"handle\">@bstory_economy</td><td class=\"num\">54,300</td><td>미국주식 입문</td><td><span class=\"chip ok\">대조</span></td></tr>\n                <tr><td class=\"handle\">@us_stock_info</td><td class=\"num\">42,300</td><td>미국주식·코인</td><td><span class=\"chip neutral\">기준 미달</span></td></tr>\n                <tr><td class=\"handle\">@writer92tothemoney</td><td class=\"num\">32,800</td><td>거시·밸류에이션</td><td><span class=\"chip neutral\">기준 미달</span></td></tr>\n                <tr><td class=\"handle\">@_hee_r_chan</td><td class=\"num\">15,600</td><td>채권금리·시황</td><td><span class=\"chip neutral\">기준 미달</span></td></tr>\n                <tr><td class=\"handle\">@davidkim_peoplenlife</td><td class=\"num\">4,642</td><td>미국주식·양자컴퓨팅</td><td><span class=\"chip neutral\">기준 미달</span></td></tr>\n                <tr><td class=\"handle\">@1page_economy</td><td class=\"num\">1,944</td><td>속보·실적 요약</td><td><span class=\"chip neutral\">기준 미달</span></td></tr>\n                <tr><td class=\"handle\">@mz_invest_ssam</td><td class=\"num\">1,053</td><td>재테크·ISA</td><td><span class=\"chip neutral\">기준 미달</span></td></tr>\n                <tr><td class=\"handle\">@wooviewing</td><td class=\"num\">992</td><td>반도체·테슬라</td><td><span class=\"chip neutral\">기준 미달</span></td></tr>\n              </tbody>\n            </table>\n          </div>\n          <div class=\"prose\">\n            <p><strong>읽기 전 알아둘 것</strong> — 팔로워가 크다고 정확한 게 아닙니다. 오늘 잡힌 오류 두 건 모두 5만 이상 계정에서 나왔습니다. 반대로 992명짜리 <span class=\"handle\">@wooviewing</span>은 SK하이닉스 실적을 “가격 사이클이지 물량 사이클이 아니다”라고 갈라 읽었는데, 규모와 정확도가 별개라는 걸 보여줍니다.</p>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>주장별 검증</h3></div>\n          <div class=\"claims\">\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">@badakstock</span></div>\n              <h4>SK, SK실트론을 두산에 2조 3,000억에 매각</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>지분 70.6%, 2조 3,000억. 7월 31일 계약 체결.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span><strong>전부 일치합니다.</strong> 다만 계정은 “AI 슈퍼사이클인데 왜 팔았나”를 의문으로 남겼는데 <strong>공시된 답이 있습니다</strong> — SK는 재무구조 강화와 미래성장 투자 재원 확보가 목적이고, 두산은 웨이퍼(전공정)까지 확보해 수직계열화를 완성합니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">사실이나 분류 오류</span><span class=\"src\">@bstory_economy</span></div>\n              <h4>반도체 3배 SMHU 출시</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>“반도체 3배 ETF 출시 SMHU”. SMH는 엔비디아 17% 비중. 3배는 조심하라.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>출시는 사실 — <strong>8월 4일 REX Shares가 Cboe BZX에 SMHU(3배 롱)·SMHD(-3배 숏) 상장</strong>, 보수 0.70%(SOXL 0.75%). 그러나 <strong>ETF가 아니라 ETN입니다.</strong> ETN은 발행사 무담보 채권이라 신용위험이 붙습니다. 3배 경고는 했지만 <em>정작 ETN 고유의 위험은 언급되지 않았습니다.</em></span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">숫자 불일치</span><span class=\"src\">@ho_ho_ju_ju</span></div>\n              <h4>빅테크 부채 1.4조 달러 · 약정 1.8조 달러</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>빅테크 6개사가 장부에 올린 부채 1.4조 달러, 약정 1.8조 달러.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>공개 집계와 대상·금액이 모두 어긋납니다. 보도 수치는 <strong>알파벳·메타·MS·아마존 4개사 약정 약 2.4조 달러</strong>, <strong>5대 빅테크(+오라클) 미인식 리스 약 1.1조 달러</strong>(인식분 2,850억의 약 4배)입니다. 알파벳 단독 미집행 약정만 9,020억 달러입니다. <strong>방향은 맞지만 숫자는 인용 불가.</strong></span></div>\n            </div></div>\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">@badakstock</span></div>\n              <h4>광통신주 급등 — FCC의 중국산 광트랜시버 규제</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>대한광통신 장중 21% 상승. 미 FCC가 AI 데이터센터용 중국산 광트랜시버 수입 차단 규정 준비, 대상 중국 기업 세계 점유율 27%.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>규제 추진과 테마 급등은 확인됩니다. <strong>주목할 점은 계정이 스스로 단 단서</strong>입니다 — “오늘 오른 종목 중 이 규제와 직접 상관없는 곳도 섞여 있다”. 테마 급등을 전하면서 과열을 함께 짚은 드문 경우입니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">검증 보류</span><span class=\"src\">@badakstock</span></div>\n              <h4>곡물값 급등 — 밀 39.25%, 대두 19.66%, 옥수수 10.91%</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>연초 대비 상승률. 2010년 러시아 폭염 때 밀이 36% 올랐고 이듬해 아랍의 봄이 왔다. 지금은 그때보다 더 올랐다.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>개별 수치는 독립 확인하지 못했습니다. <strong>구조적으로 유의할 점</strong> — 2010년 밀 상승과 아랍의 봄을 나란히 놓는 건 강력한 서사지만, 상관과 인과는 다릅니다. 곡물값은 정치 불안의 여러 요인 중 하나였습니다. 이런 역사 대입은 설득력이 높은 만큼 <em>검증 없이 받아들이기 쉽습니다.</em></span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">확인 불가</span><span class=\"src\">@ho_ho_ju_ju</span></div>\n              <h4>국민연금, 기판 관련주 대량 매입</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>국민연금이 삼성전기·이수페타시스 같은 기판 관련주를 대량 매입.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>보유 내역은 공시로 조회 가능하나 <strong>“대량”의 기준이 제시되지 않아 검증이 성립하지 않습니다.</strong> 또한 연기금 매수는 벤치마크 추종에 따른 기계적 리밸런싱인 경우가 많아, 종목 선호로 읽으면 과대 해석이 됩니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">태도 양호</span><span class=\"src\">@bstory_economy</span></div>\n              <h4>팔란티어·IGV 저항선 돌파</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>팔란티어가 저항을 뚫었고 IGV 소프트웨어 ETF도 같이 돌파. 3배 상품은 조심하라.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>가격 판단이라 참·거짓을 가릴 대상이 아닙니다. 다만 <strong>기록해둘 것</strong> — 돌파를 알리면서 레버리지 자제를 함께 말한 건 방향만 파는 계정과 구분되는 지점입니다. 단 “단톡방에서 먼저 추천했다”는 언급은 <em>유료·비공개 채널 유도</em>로 읽힐 수 있어 감안해서 보십시오.</span></div>\n            </div></div>\n\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">03</span><h3>쟁점 — 레버리지는 청산됐나, 이동했나</h3></div>\n          <p class=\"sec-sub\">어제부터 이어지는 쟁점입니다. 같은 사실을 두 진영이 정반대로 읽고 있습니다.</p>\n          <div class=\"versus\">\n            <div class=\"side bull\">\n              <h4>청산됐다 · 강세</h4>\n              <p>과도한 레버리지의 <strong>절반 이상이 이미 해소</strong>. 최근 하락은 펀더멘털이 아니라 수급에 따른 기술적 조정. 따라서 <strong>코스피 9,000</strong>(상승여력 36%), 투자의견 비중확대로 상향.</p>\n              <p class=\"src\">모건스탠리 · 2026-08-03</p>\n            </div>\n            <div class=\"side bear\">\n              <h4>이동했다 · 경계</h4>\n              <p>레버리지는 사라진 게 아니라 <strong>장소만 바꿨다.</strong> 단일종목 규제를 피해 코스피200 지수형으로 환승하며 비중이 <strong>44% → 57% → 76%</strong>로 상승. 코스피200 내 삼성전자·하이닉스 비중은 여전히 <strong>60%</strong>.</p>\n              <p class=\"src\">한국경제 단독 · 2026-08-05</p>\n            </div>\n          </div>\n          <div class=\"callout\">\n            <h4>왜 이게 결정적인가</h4>\n            <p>강세론의 토대가 “레버리지가 빠졌으니 안전하다”입니다. 그런데 한경 보도대로면 레버리지는 그대로 있고 <strong>형태만 더 위험해졌습니다.</strong> 개별종목 레버리지는 그 종목만 흔들지만, 지수형은 선물·프로그램 매매를 거쳐 <strong>지수 전체 종목으로 번집니다.</strong> 게다가 종가 리밸런싱 탓에 오후 2시 30분 이후 대량 주문이 몰립니다.</p>\n            <p><strong>확인 방법</strong> — <strong>코스피200 지수형 레버리지 비중이 실제로 줄어드는가</strong>로 판가름납니다. 매일 추적합니다.</p>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">04</span><h3>시장은 실제로 어떻게 반영했나</h3></div>\n          <p class=\"sec-sub\">한국 관행대로 <span class=\"up\">상승은 빨강</span>, <span class=\"down\">하락은 파랑</span>으로 표시합니다.</p>\n          <div class=\"tscroll\">\n            <table>\n              <thead><tr><th>항목</th><th>수치</th><th>의미</th></tr></thead>\n              <tbody>\n                <tr><td>브렌트유 10월물</td><td class=\"num down\">79.36달러 −5.3%</td><td>3주 만에 80달러 하회. 호르무즈 개방 임박이 가격에 반영됨</td></tr>\n                <tr><td>美 7월 ADP 민간고용</td><td class=\"num\">+44,000명</td><td>예상 하회. 고용 둔화 → 금리 인하 여지 확대</td></tr>\n                <tr><td>엔/달러</td><td class=\"num\">157엔대 중반</td><td>미·일 28년 만의 공동개입에도 개입 직후보다 2엔 이상 약세</td></tr>\n                <tr><td>코스피 레버리지 지수형 비중</td><td class=\"num up\">76%</td><td>44%→57%→76%. 쏠림 구조 심화 — 위 쟁점의 핵심 지표</td></tr>\n              </tbody>\n            </table>\n          </div>\n          <div class=\"prose\">\n            <p><strong>정리</strong> — 매크로(유가 하락, 고용 둔화)는 주식에 우호적입니다. 반면 <strong>국내 수급 구조와 환율은 반대 방향</strong>입니다. 모건스탠리가 보는 건 앞의 절반이고, 한경이 보는 건 뒤의 절반입니다. 둘 다 자기 자리에서는 맞습니다.</p>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">05</span><h3>오늘 얻은 판별법</h3></div>\n          <ol class=\"lessons\">\n            <li><strong>상품 종류를 확인하십시오.</strong> ETF와 ETN은 이름이 비슷하지만 위험이 다릅니다. ETN은 발행사가 무너지면 지수가 올라도 회수하지 못합니다. 큰 계정도 이걸 섞어 씁니다.</li>\n            <li><strong>숫자에는 대상 범위가 따라붙어야 합니다.</strong> 몇 개 회사인지, 무엇을 합산했는지가 빠지면 검증이 불가능합니다.</li>\n            <li><strong>역사 비유는 설득력 순으로 위험합니다.</strong> 잘 짜인 서사일수록 검증 없이 받아들이게 됩니다. 상관과 인과를 분리해서 읽으십시오.</li>\n            <li><strong>뒤에 팔 것이 있는지 보십시오.</strong> 유료채널·단톡방이 안내된 계정과 그렇지 않은 계정은 같은 정보라도 다르게 읽어야 합니다.</li>\n            <li><strong>팔로워는 정확도의 근거가 아닙니다.</strong> 오늘 오류 두 건 모두 5만 이상 계정에서 나왔고, 992명 계정이 실적을 더 정교하게 갈라 읽었습니다.</li>\n          </ol>\n        </section>"}, {"date": "2026-08-05", "dow": "수", "summary": "모건스탠리 강세론의 전제가 국내 보도와 충돌", "tally": {"ok": 3, "warn": 2, "bad": 2}, "kicker": ["계정 4곳", "검증 7건"], "title": "강세론의 전제가 국내 보도와 정면으로 부딪힙니다", "standfirst": "스레드 주식 계정들의 주장을 모아 서로 대조하고, 실제 시장·1차 자료와 맞는지 검증했습니다.", "sources": "스레드 계정 실측 · 한국경제 증권·경제·국제면 · 파이낸셜뉴스·전자신문·디지털타임스(모건스탠리) · EBN·뉴스스페이스(APR 실적) · GuruFocus·StockAnalysis(밸류에이션)", "body": "<section>\n          <div class=\"sec-head\"><span class=\"sec-n\">핵심</span><h3>오늘 먼저 볼 두 가지</h3></div>\n          <div class=\"heads\">\n            <div class=\"head-card\">\n              <h4>코스피 강세론의 핵심 전제가 국내 보도와 충돌합니다</h4>\n              <p>모건스탠리는 “레버리지 청산이 절반 이상 끝났다”며 코스피 9,000을 제시했는데, 같은 시점 한국경제 단독 보도는 <strong>레버리지가 청산된 게 아니라 개별종목에서 지수형으로 옮겨갔다</strong>(44%→76%)고 전합니다. 둘 다 사실이면 강세론의 근거가 성립하지 않습니다.</p>\n            </div>\n            <div class=\"head-card amber\">\n              <h4>중동 관련 주장들이 하루 만에 낡았습니다</h4>\n              <p>호르무즈 봉쇄를 전제로 한 분석들이 올라온 당일, 트럼프·베선트가 개방 임박을 시사하며 <strong>유가가 5.3% 급락</strong>했습니다. 이 분야 글은 작성 시각을 먼저 봐야 합니다.</p>\n            </div>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">01</span><h3>대조 대상 계정</h3></div>\n          <div class=\"tscroll\">\n            <table>\n              <thead><tr><th>계정</th><th>팔로워</th><th>성격</th><th>최고 반응</th></tr></thead>\n              <tbody>\n                <tr><td class=\"handle\">@badakstock</td><td class=\"num\">56,500</td><td>차트·산업 해설, 번호형 장문</td><td class=\"num\">👍2,900 💬168</td></tr>\n                <tr><td class=\"handle\">@writer92tothemoney</td><td class=\"num\">32,800</td><td>거시·밸류에이션, 유료채널 유도</td><td class=\"num\">—</td></tr>\n                <tr><td class=\"handle\">@davidkim_peoplenlife</td><td class=\"num\">4,642</td><td>미국주식·양자컴퓨팅</td><td class=\"num\">👍194 💬47</td></tr>\n                <tr><td class=\"handle\">@1page_economy</td><td class=\"num\">1,944</td><td>속보·실적 요약</td><td class=\"num\">👍126</td></tr>\n              </tbody>\n            </table>\n          </div>\n          <div class=\"prose\">\n            <p><strong>읽는 법 한 가지</strong> — <span class=\"handle\">@badakstock</span>은 종목을 찍지 않고 “왜 움직였나”만 설명합니다. <span class=\"handle\">@writer92tothemoney</span>는 바이오에 유료채널 5개를 안내합니다. 같은 정보라도 <strong>뒤에 팔 것이 있는 계정과 없는 계정은 다르게 읽어야 합니다.</strong></p>\n          </div>\n        </section>\n\n        <section>\n          <div class=\"sec-head\"><span class=\"sec-n\">02</span><h3>주장별 검증</h3></div>\n          <div class=\"claims\">\n\n            <div class=\"claim v-bad\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip bad\">기간 오류</span><span class=\"src\">@1page_economy</span></div>\n              <h4>에이피알(APR) 실적</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>“상반기 매출 7,675억, 영업이익 1,906억, 각각 +134.2%/+134.5%”. 연간 가이던스 3조.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>숫자는 정확히 일치합니다. <strong>그런데 기간을 틀렸습니다.</strong> 이건 상반기가 아니라 <strong>2분기 실적</strong>입니다. 상반기 누적은 <strong>1조 3,609억</strong>입니다. 회사 규모를 약 4분의 1로 축소해 전달한 셈입니다. 또 “가이던스 3조”는 증권가 전망(<strong>2조원 후반대</strong>)보다 높습니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-bad\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip bad\">시장과 어긋남</span><span class=\"src\">@davidkim_peoplenlife</span></div>\n              <h4>“미·이란 합의 금요일까지 50 대 50”</h4>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>시장은 이미 훨씬 앞서 있습니다. 같은 날 <strong>베선트 재무장관이 “오늘이나 내일 합의가 이뤄질 수 있다”</strong>고 시점을 특정했고, 트럼프는 “호르무즈가 곧 열릴 것”이라 했습니다. 결정적으로 <strong>브렌트유가 79.36달러로 5.3% 급락</strong>해 3주 만에 80달러를 깼습니다. 가격이 이미 합의 쪽에 크게 베팅했습니다. 50 대 50은 <strong>시장 반영보다 보수적</strong>입니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">@1page_economy</span></div>\n              <h4>모건스탠리, 코스피 목표 9,000 · 비중확대 상향</h4>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>8월 3일 발표. 투자의견 <strong>비중확대(Overweight) 상향</strong>, 목표 9,000, 상승여력 <strong>36%</strong>. 복수 매체 확인. 다만 계정은 “Neutral → Overweight”라 했는데 실제는 <strong>“비중유지(Equalweight) → 비중확대”</strong>로 용어가 부정확합니다. 함께 언급한 “한국 GDP 3.4%, 0.6%p 상향”은 <em>확인되지 않았습니다.</em></span></div>\n            </div></div>\n\n            <div class=\"claim v-ok\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip ok\">사실</span><span class=\"src\">@writer92tothemoney</span></div>\n              <h4>어도비 저평가</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>YTD −38%, forward P/E 9배(5년 평균 27배 대비).</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>Forward P/E <strong>8.91</strong>, YTD <strong>−35~37%</strong>. 방향과 수치 모두 대체로 맞습니다. 소프트웨어 업종 중간값 18.5 대비 51.8% 낮습니다.</span></div>\n            </div></div>\n\n            <div class=\"claim v-warn\"><div class=\"vrail\"></div><div class=\"cbody\">\n              <div class=\"ctop\"><span class=\"chip warn\">기준 선택 주의</span><span class=\"src\">@writer92tothemoney</span></div>\n              <h4>세일즈포스 저평가</h4>\n              <div class=\"kv said\"><span class=\"lbl\">주장</span><span>13.6배, 업종 평균 24배 대비 저평가.</span></div>\n              <div class=\"kv found\"><span class=\"lbl\">확인</span><span>Forward P/E <strong>13.03</strong>으로 수치는 근사합니다. 다만 <strong>업종 평균을 24배로 잡았는데 실제 소프트웨어 업종 중간값은 18.5</strong>입니다. <em>저평가 폭이 실제보다 크게 보입니다.</em></span><
