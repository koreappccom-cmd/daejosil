u003ctr>\u003ctd>코스닥 (9/15 마감)\u003c/td>\u003ctd class=\"num up\">812.41 (+0.70%)\u003c/td>\u003ctd>5.62포인트 오름, 코스피와 대조적으로 반등(firebat 마감시황 종합)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/14 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">52,421.20 (-0.29%)\u003c/td>\u003ctd>152.09포인트 내림, AI 감속론에 반도체주 약세(뉴스핌 글로벌마켓리포트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/14 마감)\u003c/td>\u003ctd class=\"num down\">7,619.98 (-0.48%)\u003c/td>\u003ctd>37.00포인트 내림(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/14 마감)\u003c/td>\u003ctd class=\"num down\">26,186.41 (-0.56%)\u003c/td>\u003ctd>146.62포인트 내림, 3대 지수 동반 하락(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/14, 현지시간)\u003c/td>\u003ctd class=\"num\">장중 5.014% / 마감 4.987%\u003c/td>\u003ctd>2023년 10월 이후 최고치(ZDNet코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 2년물 국채금리 (9/14)\u003c/td>\u003ctd class=\"num\">4.658%\u003c/td>\u003ctd>2024년 7월 이후 최고치(ZDNet코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>9월 FOMC 인상확률 (CME 페드워치, 9/15 기준)\u003c/td>\u003ctd class=\"num\">92.4%\u003c/td>\u003ctd>0.25%p 인상 전망, 매체별로 86~92%대 소폭 엇갈림(CBC뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/16, 실시간)\u003c/td>\u003ctd class=\"num\">1,346원대\u003c/td>\u003ctd>1,347원대 후보에 근접, 정확한 전일 종가는 검증 보류(Investing.com)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 기준금리\u003c/td>\u003ctd class=\"num\">3.50~3.75%\u003c/td>\u003ctd>FOMC 실제 결정은 한국시간 9/17 새벽 발표\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>코스피·코스닥의 9/16 당일 개장·마감 수치는 검색 시점 기준 확인되지 않아 9/15 확정 마감치로 표를 채웠습니다. 오늘 실제 등락은 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 마감\u003c/span>\u003c/div>\n      \u003ch4>코스피, 9/15 57.11포인트(0.85%) 내린 6,627.26으로 마감 — 4거래일 연속 하락\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>firebat 마감시황에 따르면 코스피는 전 거래일(6,684.37) 대비 0.85% 내린 6,627.26으로 마감해 9/10 이후 4거래일 연속 하락을 이어갔습니다. 고유가와 국채금리 재상승, FOMC 경계감이 배경으로 꼽혔습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 마감\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 9/15 5.62포인트(0.70%) 오른 812.41로 마감 — 코스피와 대조적 반등\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스닥은 전 거래일(806.79) 대비 0.70% 오른 812.41로 마감했습니다. 2차전지 관련 종목군이 강세를 보이며 지수를 끌어올린 것으로 보도됐습니다(뉴스핌).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">뉴욕증시\u003c/span>\u003c/div>\n      \u003ch4>다우·S&amp;P500·나스닥, 9/14(현지시간) 3대 지수 동반 하락\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>뉴스핌 글로벌마켓리포트에 따르면 다우 152.09포인트(0.29%), S&amp;P500 37.00포인트(0.48%), 나스닥 146.62포인트(0.56%)가 각각 내렸습니다. AI 기업 수장들이 개발 속도 조절을 촉구하면서 반도체 관련주가 위축된 영향으로 보도됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">美 국채금리\u003c/span>\u003c/div>\n      \u003ch4>10년물 금리, 장중 5.014%까지 올랐다가 4.987%로 마감 — 2023년 10월 이후 최고\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>ZDNet코리아에 따르면 美 10년물 국채금리는 9/14(현지시간) 장중 5.014%까지 올라 2023년 10월 이후 최고치를 기록한 뒤 4.987%로 마감했습니다. 2년물은 4.658%로 2024년 7월 이후 최고치, 30년물은 5.353%선에서 거래됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">9월 FOMC 확률\u003c/span>\u003c/div>\n      \u003ch4>인상 확률, 매체별로 86~92%대에서 소폭 엇갈리며 재상승\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>CBC뉴스는 CME 페드워치 기준 92.4%를, 다른 매체는 90% 안팎을 보도해 지난 9/13 보고서의 86.3%보다 전반적으로 더 높아진 것은 확인되나 \u003cstrong>정확한 소수점 수치는 매체마다 조금씩 다릅니다.\u003c/strong> 실제 결정은 한국시간 9/17 새벽 발표됩니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">대미투자\u003c/span>\u003c/div>\n      \u003ch4>대미투자 1호 프로젝트, 텍사스 엔시날 가스복합화력발전소로 최종 확정\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이투데이·헤럴드경제·EBN에 따르면 한미 3,500억달러 대미투자의 첫 사업은 텍사스 엔시날 가스복합화력발전소로 확정됐습니다. 설비용량 약 6.3GW, 총사업비는 당초 198억달러에서 223억달러로 조정 합의됐고, 반도체 메모리 팹 투자는 이번 프로젝트에서 제외됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">구조 미확정\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>지분 인수, 브룩필드 매입과 신주 인수 두 방식이 동시에 거론\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>한국경제·쿠키뉴스에 따르면 브룩필드 보유 지분(약 51%) 매입과 웨스팅하우스 IPO 신주 인수 두 방식이 함께 논의되고 있으며, 15% 지분 기준 가치는 22억5천만~30억달러로 추정됩니다. \u003cstrong>다만 확정된 구조는 아니며 이사회 참여 여부를 두고 韓·美 입장이 갈립니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">산업통상부 해명\u003c/span>\u003c/div>\n      \u003ch4>산업부, \"구체적인 사항 아직 정해진 바 없다\" 9/15 해명자료로 재확인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>네이트뉴스에 따르면 산업통상부는 9/15 웨스팅하우스 지분 인수 등 대미투자 원전 프로젝트 관련 보도에 대해 \"구체적인 사항은 아직 정해진 바 없다\"는 설명자료를 냈습니다. \u003cstrong>최종 합의 시점은 여전히 미정입니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>오늘 1,346원대 거래 — 지난 상충 보도 중 1,347원대에 근접\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>Investing.com 실시간 시세 기준 원/달러는 1,346원대에서 거래되고 있습니다. 지난 보고서가 제기한 1,347원대·1,382원대 두 후보 중 1,347원대 쪽에 더 가까운 흐름이지만, \u003cstrong>9/14~15 당시의 정확한 종가는 이번 검색으로도 확인되지 않아 검증 보류\u003c/strong>로 남깁니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 국채금리·FOMC 경계감과, 대미투자 확정에 따른 불확실성 해소가 부딪힙니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">美 국채금리가 3년 만의 최고치권에서 FOMC 결정을 기다리는 가운데, 대미투자 1호 프로젝트 확정으로 불확실성 하나는 해소됐지만 웨스팅하우스·원전 관련 협상은 여전히 안갯속입니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>불확실성 해소 근거\u003c/h4>\n      \u003cp>한미 대미투자 1호 프로젝트(텍사스 엔시날 가스발전소, 223억달러)가 최종 확정되며 협상 관련 불확실성 하나가 해소됐습니다. 코스닥은 2차전지 관련 강세로 코스피와 대조적으로 반등했고, 6,600선도 지켜냈습니다.\u003c/p>\n      \u003cp class=\"src\">이투데이·헤럴드경제·뉴스핌 · 2026-09-14~09-16\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>美 10년물 국채금리가 장중 5.014%까지 오르며 2023년 10월 이후 최고치를 기록했고, 9월 FOMC 인상 확률도 92.4%까지 재상승했습니다. 웨스팅하우스 지분 인수는 산업부가 \"정해진 바 없다\"고 재확인할 정도로 구조가 여전히 불확실하며, 코스피는 4거래일 연속 하락 중입니다.\u003c/p>\n      \u003cp class=\"src\">ZDNet코리아·CBC뉴스·네이트뉴스 · 2026-09-14~09-15\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>9월 FOMC 실제 결정(한국시간 9/17 새벽)이 이번 주 최대 변수로 남아 있습니다. 인상이 현실화될 경우 국채금리·코스피에 추가 부담이 될 수 있고, 동결될 경우 코스피의 4거래일 연속 하락에 제동이 걸릴 수 있습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피·코스닥 9/16 최종 마감 수치, 9월 FOMC 실제 결정과 점도표, 원/달러 환율 정확한 종가를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>9월 FOMC(한국시간 9/17 새벽) 실제 결정.\u003c/strong> 86~92%대로 엇갈린 인상 확률이 실제 결정과 부합하는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스피·코스닥 9/16 최종 마감 수치.\u003c/strong> 4거래일 연속 하락에 제동이 걸리는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>美 10년물 국채금리 5%대 진정 여부.\u003c/strong> FOMC 결정 전후로 추가 상승하는지, 진정되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 인수 최종 구조 확정 시점.\u003c/strong> 브룩필드 매입과 신주 인수 중 어느 쪽으로 결론 나는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>삼성전자·SK하이닉스 美 현지 팹 투자 별도 협상 여부.\u003c/strong> 대미투자 1호에서 제외된 이후 어떻게 진행되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>원/달러 환율 정확한 종가.\u003c/strong> 1,347원대·1,382원대 상충 보도의 정확한 수치를 계속 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-15", "dow": "화", "summary": "화요일인 오늘 코스피는 전날(9/14) 3.26%(225.54포인트) 내린 6,684.37로 3거래일 연속 하락 마감한 데 이어, 오늘 개장에서도 0.38%(25.12포인트) 내린 6,659.25로 하락 출발했습니다. 코스닥은 9/14 1.69% 내린 806.79로 마감해 장중 무너졌던 800선을 다시 회복했고, 9/15 개장은 0.04% 소폭 하락에 그쳤습니다. 전날 급락을 이끌었던 삼성전자·SK하이닉스는 개장 초반 반등했습니다. 美 10년물 국채금리는 장중 5%선을 돌파했습니다. 지난 보고서가 추적하던 두 항목이 결론났는데, 9/14 마감 낙폭은 장중보다 줄어 6,600선·800선 모두 지켜졌고, 국채금리 상승세는 FOMC 직전까지 그대로 이어졌습니다.", "tally": {"ok": 7, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 9/14 -3.26% 마감, 9/15 개장도 하락", "코스닥 800선 회복 후 소폭 하락 출발", "美 10년물 금리 5% 돌파"], "title": "코스피 3거래일 연속 하락 마감 후 개장도 약세 — 국채금리는 5%선 돌파, 반도체는 저가매수 반등", "standfirst": "화요일인 오늘(9/15) 코스피는 전날(9/14) 전 거래일(6,909.91) 대비 225.54포인트(3.26%) 내린 6,684.37로 3거래일 연속 하락 마감했고, 오늘 개장에서도 25.12포인트(0.38%) 내린 6,659.25로 다시 약세 출발했습니다. 코스닥은 9/14 13.85포인트(1.69%) 내린 806.79로 마감해 장중 한때 무너졌던 800선을 마감 시점에는 다시 회복했고, 9/15 개장은 0.30포인트(0.04%) 소폭 하락에 그쳐 전날보다 낙폭이 진정된 모습입니다. 전날 급락을 이끌었던 삼성전자(-4.24%)·SK하이닉스(-7.12%)는 오늘 개장 초반 각각 0.40%·1.00% 반등했습니다. 한편 美 10년물 국채금리는 지난주 3년 만의 최고치(장중 4.99%대)를 넘어 오늘 장중 5%선을 돌파하며 FOMC(9/15~16, 결과는 한국시간 9/17 새벽 발표) 직전까지 상승세를 이어갔습니다. 지난 보고서(9/14)가 추적 대상으로 걸어둔 '코스피·코스닥 마감 낙폭'과 '국채금리 5% 근접 여부'는 오늘 모두 결론났습니다. 원/달러 환율은 매체 간 1,347원대와 1,382원대로 수치가 크게 엇갈려 이번 보고서에서는 검증 보류로 남겼습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "아시아경제·이투데이·머니투데이·Businesskorea·위키트리·TokenPost·국제뉴스·노컷뉴스·뉴시스(2026-09-14~09-15 스니펫 기준)", "body": "\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 마감 낙폭은 장중보다 줄었고, 국채금리는 5%를 넘겼습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>코스피·코스닥 9/14 마감, 장중 최대 낙폭보다는 줄어든 채 지지선을 지켰습니다\u003c/h4>\n      \u003cp>9/14 보고서는 코스피·코스닥의 최종 마감 수치와 6,600선·800선 방어 여부를 추적 대상으로 걸어뒀습니다. 확인해보니 코스피는 장중 한때 3.48%(6,669.34)까지 밀렸다가 마감은 3.26%(225.54포인트) 내린 \u003cstrong>6,684.37\u003c/strong>로 낙폭을 다소 줄이며 6,600선을 지켰습니다. 코스닥도 장중 2.54%(799.77)까지 밀려 800선이 무너졌었지만, 마감은 1.69%(13.85포인트) 내린 \u003cstrong>806.79\u003c/strong>로 800선을 다시 회복했습니다. \u003cstrong>낙폭 확대 우려와 달리 마감 직전 저가 매수가 들어오며 두 지지선 모두 지켜졌습니다\u003c/strong>(아시아경제·이투데이·머니투데이·위키트리).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>美 10년물 국채금리, 지난주 3년 최고치를 넘어 5%선까지 돌파\u003c/h4>\n      \u003cp>9/14 보고서는 지난주 장중 4.99%대까지 오른 美 10년물 국채금리가 FOMC(9/15~16) 직전까지 상승세를 이어가는지를 추적 대상으로 걸어뒀습니다. 확인해보니 오늘(9/15) 장중 \u003cstrong>5%선을 돌파\u003c/strong>하며 상승 흐름이 그대로 이어진 것으로 확인됐습니다. \u003cstrong>정확한 소수점 수치와 발표 시각은 스니펫에서 추가 확인되지 않아 세부 수치는 검증 보류\u003c/strong>로 남깁니다(TokenPost).\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">화요일인 오늘(9/15) 코스피·코스닥은 전날 급락 이후 장 초반 소폭 하락 출발했습니다. 표는 9/14 최종 마감치와 9/15 개장 수치를 함께 담았습니다. 미국 지수는 검색 스니펫에서 확보한 수치의 신뢰도가 낮아 표에서 제외했습니다(아래 확인된 것들 참고). 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/14 마감)\u003c/td>\u003ctd class=\"num down\">6,684.37 (-3.26%)\u003c/td>\u003ctd>225.54포인트 내림, 3거래일 연속 하락 마감(Businesskorea·아시아경제·위키트리)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스피 (9/15 개장)\u003c/td>\u003ctd class=\"num down\">6,659.25 (-0.38%)\u003c/td>\u003ctd>25.12포인트 내려 출발, 하락 지속(머니투데이·국제뉴스·노컷뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/14 마감)\u003c/td>\u003ctd class=\"num down\">806.79 (-1.69%)\u003c/td>\u003ctd>13.85포인트 내림, 800선은 지켜냄(아시아경제·이투데이·머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/15 개장)\u003c/td>\u003ctd class=\"num down\">806.49 (-0.04%)\u003c/td>\u003ctd>0.30포인트 소폭 하락 출발(국제뉴스·머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>삼성전자 (9/15 개장 초반, 9시36분경)\u003c/td>\u003ctd class=\"num up\">250,000원 (+0.40%)\u003c/td>\u003ctd>전날 급락 후 반등 출발(TokenPost)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>SK하이닉스 (9/15 개장 초반, 9시36분경)\u003c/td>\u003ctd class=\"num up\">1,714,000원 (+1.00%)\u003c/td>\u003ctd>전날 급락 후 반등 출발(TokenPost)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/15)\u003c/td>\u003ctd class=\"num\">5%선 돌파\u003c/td>\u003ctd>2023년 10월 이후 3년 최고치 경신 지속, 세부 수치 검증 보류(TokenPost)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율\u003c/td>\u003ctd class=\"num\">검증 보류\u003c/td>\u003ctd>1,347원대·1,382원대 두 수치가 상충, 아래에서 다룸\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 기준금리\u003c/td>\u003ctd class=\"num\">3.50~3.75%\u003c/td>\u003ctd>FOMC 결정은 한국시간 9/17 새벽 발표 예정\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>코스피·코스닥 9/15 최종 마감 수치는 검색 시점 기준 아직 확인되지 않아 개장 초반 데이터로 표를 채웠습니다. 최종 마감은 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 마감\u003c/span>\u003c/div>\n      \u003ch4>코스피, 9/14 225.54포인트(3.26%) 내린 6,684.37로 마감 — 3거래일 연속 하락\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>Businesskorea·아시아경제·위키트리의 9/14 보도에 따르면 코스피는 전 거래일(6,909.91) 대비 225.54포인트(3.26%) 내린 6,684.37로 마감해 3거래일 연속 하락했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 마감\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 9/14 13.85포인트(1.69%) 내린 806.79로 마감 — 800선은 지킴\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>아시아경제·이투데이·머니투데이에 따르면 코스닥은 9/14 1.69%(13.85포인트) 내린 806.79로 마감해 장중 무너졌던 800선을 마감 시점에는 다시 회복했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 개장(9/15)\u003c/span>\u003c/div>\n      \u003ch4>코스피, 25.12포인트(0.38%) 내린 6,659.25로 개장 — 하락 흐름 지속\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>머니투데이·국제뉴스·노컷뉴스의 9/15 보도에 따르면 코스피는 전 거래일(6,684.37) 대비 25.12포인트 내린 6,659.25로 개장했습니다. 일부 매체 제목에서 등락 방향 표기가 엇갈렸지만, 두 수치(6,684.37→6,659.25)를 대조하면 하락 출발이 맞습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 개장(9/15)\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 0.30포인트(0.04%) 소폭 내린 806.49로 개장\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>국제뉴스·머니투데이에 따르면 코스닥은 9/15 전 거래일 대비 0.30포인트(0.04%) 소폭 내린 806.49로 개장하며 전날의 급격한 낙폭보다는 진정된 모습을 보였습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">반도체 대형주\u003c/span>\u003c/div>\n      \u003ch4>삼성전자·SK하이닉스, 전날 급락 후 개장 초반 반등\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>TokenPost에 따르면 9/15 오전 9시36분경 삼성전자는 25만원(+0.40%), SK하이닉스는 171만4,000원(+1.00%)으로 각각 반등하며 거래를 이어갔습니다. 두 종목은 전날(9/14) 각각 4%대·7%대 급락하며 코스피 하락을 주도한 바 있습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">美 국채금리\u003c/span>\u003c/div>\n      \u003ch4>美 10년물 국채금리, 장중 5%선 돌파\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>TokenPost에 따르면 美 10년물 국채금리는 9/15 장중 5%선을 돌파했습니다. 지난주 3년 만의 최고치(장중 4.99%대)를 기록한 데 이어 FOMC(9/15~16) 직전까지 상승세가 이어진 것으로, \u003cstrong>정확한 소수점 수치는 스니펫에서 확인되지 않아 검증 보류\u003c/strong>입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 상충\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>환율 수치, 매체별로 1,347원대와 1,382원대로 크게 엇갈림\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>머니투데이·뉴시스는 9/14 오후 3시30분 기준가를 1,347.3원으로 보도한 반면, 다른 검색 스니펫은 9/15 개장 시 \"8.5원 상승한 1,382원 출발\"이라는 수치를 제시했습니다. 두 수치의 격차(약 35원)가 하루 변동폭치고는 지나치게 커 \u003cstrong>둘 중 하나 이상이 오기이거나 다른 시점의 데이터로 추정되며, 정확한 환율은 검증 보류\u003c/strong>로 남깁니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">뉴욕증시\u003c/span>\u003c/div>\n      \u003ch4>가장 최근 뉴욕 마감 수치, 문맥 혼입 의심으로 이번 보고서에서는 제외\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>검색 스니펫에서 다우·S&amp;P500·나스닥 마감 수치 후보를 확인했으나, 함께 딸려온 설명 문구(\"7월 CPI 안정\" 등)가 최근 시점과 맞지 않아 다른 시점 기사가 섞였을 가능성이 있습니다. \u003cstrong>원 기사 매체명도 스니펫에서 명확히 식별되지 않아 이번 보고서 표에서는 제외하고 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 유지\u003c/span>\u003cspan class=\"src\">9월 FOMC\u003c/span>\u003c/div>\n      \u003ch4>CME 페드워치 인상 확률 86%대, 지난 보고서 수치와 유사한 수준 유지\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>검색 스니펫 종합 기준 CME 페드워치의 9월 FOMC(9/15~16, 발표는 한국시간 9/17 새벽) 0.25%p 인상 확률은 86% 안팎으로 확인돼, 지난 9/13 보고서가 인용한 86.3%와 비슷한 수준을 유지하고 있습니다. \u003cstrong>다만 이번 검색에서는 원 인용 매체명이 스니펫에 명확히 드러나지 않아 출처 신뢰도는 제한적입니다.\u003c/strong> 실제 결정은 한국시간 9/17 새벽 3시 발표, 파월 기자회견은 3시30분입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 국채금리 5% 돌파의 경계감과, 반도체 저가매수의 기대감이 부딪힙니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">美 10년물 국채금리가 5%선을 넘기며 긴축 경계감이 커진 한편, 전날 급락했던 삼성전자·SK하이닉스는 개장 초반 반등하며 저가 매수 유입 조짐을 보였습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>반등 근거\u003c/h4>\n      \u003cp>코스피·코스닥은 9/14 장중 최대 낙폭(코스피 -3.48%, 코스닥 -2.54%)보다 줄어든 채로 마감했고, 6,600선·800선도 지켜졌습니다. 9/15 개장 초반에는 전날 급락을 이끌었던 삼성전자(+0.40%)·SK하이닉스(+1.00%)가 나란히 반등하며 저가 매수 유입 조짐을 보였습니다.\u003c/p>\n      \u003cp class=\"src\">아시아경제·이투데이·머니투데이·TokenPost · 2026-09-14~09-15\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>美 10년물 국채금리는 지난주 3년 만의 최고치를 기록한 데 이어 오늘 장중 5%선까지 돌파해 긴축 경계감이 계속 커지고 있습니다. CME 페드워치 기준 9월 FOMC 인상 확률도 86% 안팎에서 유지되고 있어, 코스피·코스닥의 개장 초반 하락 출발과도 맞닿아 있습니다.\u003c/p>\n      \u003cp class=\"src\">TokenPost·검색 스니펫 종합 · 2026-09-15\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>이 시리즈가 오랫동안 추적해온 FOMC 인상 확률이 이번 주(한국시간 9/17 새벽) 실제 결정으로 결론 납니다. 동시에 국채금리 5% 돌파가 국내 증시에 추가 부담으로 작용할지, 아니면 반도체 저가 매수가 이를 상쇄할지가 이번 주 흐름을 가를 변수입니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피·코스닥 9/15 최종 마감 수치, 원/달러 환율 실제치(1,347원대 vs 1,382원대), 9/17 새벽 FOMC 실제 결정을 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피·코스닥 9/15 최종 마감 수치.\u003c/strong> 개장 초반 하락이 마감까지 이어지는지, 반도체 저가매수에 반등 전환되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>원/달러 환율 실제치.\u003c/strong> 1,347원대와 1,382원대로 엇갈린 보도 중 어느 쪽이 맞는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>9월 FOMC(한국시간 9/17 새벽) 실제 결정.\u003c/strong> 86% 안팎으로 보도된 인상 확률이 실제 결정과 부합하는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>美 10년물 국채금리 5% 돌파 이후 흐름.\u003c/strong> FOMC 전후로 추가 상승하는지, 진정되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 인수 구조 및 반도체 대미투자 1호 프로젝트.\u003c/strong> 한·미 대미투자 합의문 서명 여부를 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치.\u003c/strong> 여전히 확인되지 않았습니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-14", "dow": "월", "summary": "월요일인 오늘 코스피는 개장과 동시에 3.14% 급락해 6,692.61로 출발했고, 오전 한때 3.48%(6,669.34)까지 낙폭을 키우며 지난 10일 이후 3거래일 연속 하락을 이어갔습니다. 코스닥도 800선이 무너졌습니다(799.77, -2.54%). 美 10년물 국채금리는 지난주 장중 4.992%까지 오르며 3년 만의 최고치를 기록했고, 9월 FOMC 인상 확률은 매체별로 57%에서 86.3%까지 제각각 보도되며 여전히 수렴되지 않고 있습니다. 지난 보고서가 추적하던 '코스피 7,000선 재탈환' 여부는 결론났는데, 재탈환은 이뤄지지 않고 오히려 낙폭이 커졌습니다.", "tally": {"ok": 6, "warn": 4, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 개장 3.14%↓ 6,692.61", "코스닥 800선 붕괴", "美 10년물 금리 3년 최고치"], "title": "코스피 개장 3%대 급락 후 낙폭 확대, 코스닥 800선 붕괴 — 국채금리는 3년래 최고치", "standfirst": "월요일인 오늘(9/14) 코스피는 전 거래일(6,909.91) 대비 217.30포인트(3.14%) 내린 6,692.61로 개장했고, 오전 9시3분 기준으로는 240.34포인트(3.48%) 내린 6,669.34까지 낙폭을 더 키우며 지난 10일 이후 3거래일 연속 하락을 이어갔습니다. 코스닥도 개장가 806.27(-1.75%)에서 낙폭을 키워 799.77(-2.54%)까지 밀리며 800선이 무너졌고, 삼성전자(-3.28%)·SK하이닉스(-5.02%) 등 대형 반도체주가 동반 약세를 보였습니다. 美 10년물 국채금리는 지난 10일(현지시간) 장중 4.992%까지 올라 2023년 10월 이후 3년 만의 최고치를 기록했고, 9월 FOMC(9/15~16) 인상 확률은 매체별로 57%~86.3%까지 크게 갈리며 여전히 수렴되지 않고 있습니다. 지난 보고서(9/12)가 추적하던 '코스피 7,000선 재탈환' 여부는 오늘 결론났는데, 재탈환은 이뤄지지 않고 오히려 하락세가 심화됐습니다. 웨스팅하우스 지분 인수는 산업부가 일부 보도를 부인하며 구조가 여전히 불확실하고, 반도체 대미투자 1호 프로젝트는 텍사스 엔시날 발전소로 사실상 확정돼 이번 주 발표가 유력합니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "이투데이·아시아경제·머니투데이·국민일보·쿠키뉴스·한국경제·헤럴드경제·베타뉴스(2026-09-10~09-14 스니펫 기준)", "body": "\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 코스피 7,000선 재탈환은 불발, 낙폭이 오히려 커졌습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card\">\n      \u003ch4>코스피 9/11 급락, 월요일에도 이어지며 반등 없이 낙폭 확대\u003c/h4>\n      \u003cp>9/12 보고서는 코스피의 9/11 1.76% 급락이 월요일(9/14) 개장 이후에도 이어지는지, 7,000선 재탈환 여부를 추적 대상으로 걸어뒀습니다. 확인해보니 코스피는 개장 직후 217.30포인트(3.14%) 내린 6,692.61로 출발했고, 오전 9시3분 기준으로는 240.34포인트(3.48%) 내린 6,669.34까지 낙폭을 더 키웠습니다. \u003cstrong>하락 지속 예측은 맞았지만 7,000선 재탈환은 이뤄지지 않았고, 오히려 지난 10일 이후 3거래일 연속 하락으로 상황이 악화됐습니다.\u003c/strong> 코스닥도 800선이 무너지며(-2.54%, 799.77) 동반 약세를 보였습니다(머니투데이·이투데이·국민일보).\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">월요일인 오늘(9/14) 코스피·코스닥은 개장과 동시에 급락했고, 검색 시점 기준 최종 마감 수치는 아직 확인되지 않아 오전 장중 수치로 표를 채웠습니다. 미국 지수는 가장 최근 마감인 9/11(금, 현지시간) 기준입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시하며 미국 지수와 금리도 같은 기준을 적용합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/14 개장)\u003c/td>\u003ctd class=\"num down\">6,692.61 (-3.14%)\u003c/td>\u003ctd>217.30포인트 내려 출발(이투데이·아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스피 (9/14 오전 9:03 기준)\u003c/td>\u003ctd class=\"num down\">6,669.34 (-3.48%)\u003c/td>\u003ctd>240.34포인트 내림, 3거래일 연속 하락(국민일보)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/14 개장)\u003c/td>\u003ctd class=\"num down\">806.27 (-1.75%)\u003c/td>\u003ctd>14.37포인트 내려 출발(이투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/14 오전 기준)\u003c/td>\u003ctd class=\"num down\">799.77 (-2.54%)\u003c/td>\u003ctd>20.87포인트 내려 800선 붕괴(국민일보)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스피 (9/11 마감, 참고)\u003c/td>\u003ctd class=\"num down\">6,909.91 (-1.76%)\u003c/td>\u003ctd>직전 마감 기준점(머니투데이·비즈니스코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/11 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">52,348.39 (-1.09%)\u003c/td>\u003ctd>주말 휴장으로 신규 마감 없음(CBC뉴스·tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/11 마감)\u003c/td>\u003ctd class=\"num up\">25,870.65 (+0.20%)\u003c/td>\u003ctd>메모리 반도체주 반등(tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/11 마감)\u003c/td>\u003ctd class=\"num down\">7,482.71 (-0.28%)\u003c/td>\u003ctd>우량주 약세(tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/14, 전망치)\u003c/td>\u003ctd class=\"num\">1,334~1,351원 예상\u003c/td>\u003ctd>실제 체결가는 검색 시점 미확인, 검증 보류(이투데이 환율전망)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/10, 현지시간)\u003c/td>\u003ctd class=\"num\">4.965% (+12.5bp)\u003c/td>\u003ctd>장중 4.992%까지, 2023년 10월 이후 3년 최고치(이투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>9월 FOMC 인상확률 (매체별)\u003c/td>\u003ctd class=\"num\">57%~86.3%\u003c/td>\u003ctd>여전히 수렴 안 됨, 워시 의장 첫 시험대(각 매체 상이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 기준금리\u003c/td>\u003ctd class=\"num\">3.50~3.75%\u003c/td>\u003ctd>다음 FOMC는 9/15~16일\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>코스피·코스닥의 9/14 최종 마감 수치는 검색 시점 기준 아직 확인되지 않아 개장 및 오전 장중 데이터로 표를 채웠습니다. 최종 마감 수치는 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 개장\u003c/span>\u003c/div>\n      \u003ch4>코스피, 전 거래일 대비 3.14% 내린 6,692.61로 출발\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이투데이·아시아경제의 9/14 오전 9시3분 보도에 따르면 코스피는 전 거래일(6,909.91) 대비 217.30포인트(3.14%) 내린 6,692.61로 개장했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 낙폭 확대\u003c/span>\u003c/div>\n      \u003ch4>오전 9시3분 기준 낙폭이 3.48%까지 커지며 3거래일 연속 하락\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>같은 시각 코스피는 240.34포인트(3.48%) 내린 6,669.34까지 낙폭을 키우며 지난 10일 이후 3거래일 연속 하락을 이어갔습니다(국민일보).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 800선 붕괴\u003c/span>\u003c/div>\n      \u003ch4>코스닥도 800선 아래로 밀려남\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스닥은 개장가 806.27(-1.75%)에서 낙폭을 더 키워 오전 한때 20.87포인트(2.54%) 내린 799.77까지 밀리며 800선이 무너졌습니다(국민일보).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">반도체 대형주\u003c/span>\u003c/div>\n      \u003ch4>삼성전자 3.28%, SK하이닉스 5.02% 동반 약세\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>같은 시각 삼성전자는 3.28%, SK하이닉스는 5.02% 내리는 등 대형 반도체주가 나란히 약세를 보였습니다(국민일보).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">투자자별 수급\u003c/span>\u003c/div>\n      \u003ch4>개인 홀로 순매수, 외국인·기관은 동반 순매도\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>오전 9시3분 기준 개인이 1조5,866억원을 순매수하며 방어에 나섰지만, 외국인이 1조535억원, 기관이 5,403억원을 각각 순매도하며 지수를 끌어내렸습니다(국민일보).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 미확인\u003c/span>\u003cspan class=\"src\">최종 마감\u003c/span>\u003c/div>\n      \u003ch4>9/14 최종 마감 수치는 검색 시점 기준 확인되지 않음\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>위 표의 코스피·코스닥 수치는 개장 및 오전 장중 데이터입니다. 이날 최종 마감이 낙폭을 더 키웠는지 일부 만회했는지는 \u003cstrong>검증 보류\u003c/strong>이며, 정확한 종가는 다음 보고서에서 확인합니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">美 국채금리\u003c/span>\u003c/div>\n      \u003ch4>10년물 금리, 2023년 10월 이후 3년 만의 최고치\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>美 10년물 국채금리는 지난 10일(현지시간) 장중 4.992%까지 오르며 2023년 10월 이후 3년 만의 최고치를 기록했고, 종가 기준으로도 하루 새 12.5bp 오른 4.965%를 나타냈습니다(이투데이).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">9월 FOMC\u003c/span>\u003c/div>\n      \u003ch4>인상 확률, 이번 주만 57%·60.4%·73.4%로 제각각 보도\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>9월 FOMC(9/15~16) 인상 확률은 이번 주 검색에서만 57%, 60.4%, 73.4% 등으로 다르게 보도됐고, 지난 9/12 보고서가 인용했던 86.3%(파이낸셜뉴스)와도 크게 달라 \u003cstrong>매체 간 수렴은 여전히 이뤄지지 않고 있습니다.\u003c/strong> 케빈 워시 연준 의장은 취임 후 첫 금리 결정 시험대에 올랐다고 보도됐습니다(이투데이).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>산업부, \"한·미 공동출자 지분 인수\" 보도는 \"사실과 다르다\"\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>산업통상부는 '한·미가 공동 출자해 웨스팅하우스(WEC) 지분을 인수한다'는 일부 보도에 대해 \"사실과 다르다\"고 밝혔습니다. 미국 측은 800억달러 규모 자국 원전 건설을 위해 지분 공동인수를 제안한 것으로 알려졌지만, \u003cstrong>정확한 인수 구조와 서명 시점은 여전히 확인되지 않아 검증 보류\u003c/strong>입니다(쿠키뉴스·한국경제).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">발표 임박, 미확정\u003c/span>\u003cspan class=\"src\">반도체 대미투자\u003c/span>\u003c/div>\n      \u003ch4>1호 프로젝트, 텍사스 엔시날 발전소로 사실상 확정 — 이번 주 발표 유력\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>대미투자 1호 프로젝트는 미국 텍사스주 엔시날 가스복합화력발전소로 사실상 확정돼 이번 주 공식 발표가 유력하다는 보도가 나왔습니다. 다만 \u003cstrong>정부의 공식 발표는 검색 시점까지 이뤄지지 않아 미확정\u003c/strong>입니다(헤럴드경제).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 시장은 \"긴축\"을 반영 중인데, 트럼프는 \"인하\"를 압박합니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">국채금리 급등과 매체별로 최고 86%까지 보도된 인상 확률이 한쪽에, 로이터 서베이의 동결 전망과 트럼프 대통령의 인하 압박이 다른 한쪽에 놓여 있습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>긴축 경계 근거\u003c/h4>\n      \u003cp>美 10년물 국채금리가 3년 만의 최고치(장중 4.992%)로 치솟았고, 8월 근원 CPI가 예상을 웃돈 데 이어 9월 FOMC 인상 확률이 매체에 따라 최고 86.3%까지 보도됐습니다. 코스피·코스닥은 이런 긴축 경계감 속에 오늘 개장과 동시에 3%대·2%대로 급락했습니다.\u003c/p>\n      \u003cp class=\"src\">이투데이·파이낸셜뉴스 · 2026-09-10~09-14\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>동결·인하 기대 근거\u003c/h4>\n      \u003cp>로이터 설문에서는 월가 이코노미스트의 70%가 동결을 예상했고, 트럼프 대통령은 오히려 연준에 금리 인하를 압박하며 \"인하하지 않으면 일부 국가와 무역을 중단하겠다\"고 언급한 것으로 보도됐습니다. 인상 확률 자체도 57%까지 낮게 보도된 자료가 있어 시장 컨센서스가 하나로 모이지 않고 있습니다.\u003c/p>\n      \u003cp class=\"src\">베타뉴스·필드뉴스 · 2026-09-11~09-14\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>이 시리즈가 가장 오래 추적해온 'FOMC 확률 매체별 엇갈림'이 이번 주(9/15~16) 실제 결정으로 결론 납니다. 동시에 코스피가 3거래일 연속 하락하며 이것이 단기 조정인지 추세 전환의 시작인지도 이번 주 흐름에 달려 있습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피·코스닥 9/14 최종 마감 수치, 9/15~16 FOMC 실제 결정, 웨스팅하우스·반도체 대미투자 발표 여부를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피·코스닥 9/14 최종 마감 수치.\u003c/strong> 낙폭이 장중보다 더 커지는지, 6,600선·800선 방어 여부를 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>9월 FOMC(9/15~16) 실제 결정.\u003c/strong> 매체별로 57~86.3%까지 갈린 인상 확률 중 어느 쪽이 맞는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>美 10년물 국채금리 4.99%대 추가 상승 지속 여부.\u003c/strong> FOMC 전후로 진정되는지 봅니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 인수 구조 확정 및 서명 여부.\u003c/strong> 산업부 부인 이후 협상이 어떻게 정리되는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>반도체 대미투자 1호(텍사스 엔시날 발전소) 공식 발표 여부.\u003c/strong> 이번 주 발표가 실제로 이뤄지는지 봅니다.\u003c/li>\n    \u003cli>\u003cstrong>트럼프의 美-이란 관련 확전 여부.\u003c/strong> 날짜가 뒤섞인 보도가 많아 계속 재확인이 필요합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-13", "dow": "일", "summary": "일요일인 오늘 국내외 증시는 휴장입니다. 미국 8월 근원 CPI가 예상(0.2%)을 웃돈 0.3%로 발표되면서 CME 페드워치 기준 9월 FOMC 금리 인상 확률이 86.3%까지 뛰었지만, 로이터 설문에서는 월가 이코노미스트 70%가 오히려 동결을 예상해 시장과 전문가 전망이 정반대로 갈렸습니다. 코스피 9/11 급락 이후 흐름과 트럼프발 이란 리스크에 대한 결론은 각각 월요일 개장과 추가 확인을 기다려야 합니다.", "tally": {"ok": 3, "warn": 2, "bad": 0}, "kicker": ["자동생성·검색기반", "미 8월 근원CPI 예상 상회", "9월 FOMC 인상확률 86%로 급등", "월가는 70% 동결 전망"], "title": "美 근원물가 예상 상회에 FOMC 인상확률 86%로 급등 — 월가 서베이는 \"동결\" 70%", "standfirst": "일요일인 오늘(9/13) 국내외 증시는 모두 휴장이며, 가장 최근 마감은 코스피 6,909.91(9/11, -1.76%)·코스닥 820.64(9/11, -1.95%)입니다. 이번 주 새로 확인된 것은 미국 8월 CPI로, 헤드라인은 전년 대비 3.4% 상승했지만 근원 CPI가 전월 대비 0.3% 올라 시장 예상치(0.2%)를 웃돌면서 CME 페드워치 기준 9월 FOMC(9/15~16) 금리 인상 확률이 86.3%까지 급등했습니다. 반면 로이터가 진행한 설문에서는 월가 이코노미스트·애널리스트의 70%가 오히려 동결을 예상한다고 답해 시장 가격과 전문가 컨센서스가 정반대 방향을 가리키고 있습니다. 지난 보고서(9/12)가 추적 대상으로 걸어둔 코스피 월요일 반등 여부와 트럼프-이란 확전 여부는 오늘은 결론이 나지 않아 다음 보고서로 넘깁니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "파이낸셜뉴스·CBC뉴스·스페셜경제·베타뉴스·다음(v.daum)(2026-09-10~09-13 스니펫 기준)", "body": "\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">일요일인 오늘(9/13) 국내외 증시는 모두 휴장입니다. 표는 가장 최근 마감(코스피·코스닥·미국 3대 지수 모두 9/11) 수치이며, 오늘 새로 확인된 것은 미국 8월 CPI 발표와 9월 FOMC 확률 변화입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/11 마감)\u003c/td>\u003ctd class=\"num down\">6,909.91 (-1.76%)\u003c/td>\u003ctd>124.01포인트 내려 7,000선 재붕괴(머니투데이·비즈니스코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/11 마감)\u003c/td>\u003ctd class=\"num down\">820.64 (-1.95%)\u003c/td>\u003ctd>16.28포인트 내림(아시아경제·이투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/11 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">52,348.39 (-1.09%)\u003c/td>\u003ctd>트럼프의 美-이란 휴전 종료 선언 이후 하락(CBC뉴스·tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/11 마감)\u003c/td>\u003ctd class=\"num up\">25,870.65 (+0.20%)\u003c/td>\u003ctd>메모리 반도체주 반등에 소폭 상승(tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/11 마감)\u003c/td>\u003ctd class=\"num down\">7,482.71 (-0.28%)\u003c/td>\u003ctd>우량주 약세(tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미 8월 CPI (9/11 발표)\u003c/td>\u003ctd class=\"num\">전년비 3.4%\u003c/td>\u003ctd>근원 CPI는 전월비 0.3%로 예상치(0.2%) 상회, 근원 전년비 2.4%(파이낸셜뉴스·CBC뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>9월 FOMC 인상 확률 (CME 페드워치)\u003c/td>\u003ctd class=\"num\">86.3%\u003c/td>\u003ctd>근원물가 서프라이즈 이후 급등, 9/12 오전 기준(파이낸셜뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 기준금리\u003c/td>\u003ctd class=\"num\">3.50~3.75%\u003c/td>\u003ctd>다음 FOMC는 9/15~16일\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>일요일(9/13)에는 새 거래일 데이터가 없어 9/11 확정 마감 수치로 표를 채웠습니다. 다음 거래일은 월요일(9/14)부터입니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미국 CPI\u003c/span>\u003c/div>\n      \u003ch4>8월 근원 CPI, 예상(0.2%)보다 높은 0.3%로 발표\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>미국 노동통계국이 9/11 발표한 8월 CPI는 전년 동월 대비 3.4% 상승했고, 근원 CPI는 전월 대비 0.3% 올라 시장 예상치(0.2%)를 웃돌았습니다. 근원 CPI의 전년 동월 대비 상승률은 2.4%였습니다(파이낸셜뉴스·CBC뉴스·스페셜경제).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">9월 FOMC\u003c/span>\u003c/div>\n      \u003ch4>CME 페드워치 인상 확률, 근원물가 발표 이후 86.3%로 급등\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>시카고상업거래소(CME) 페드워치 기준 9월 FOMC(9/15~16) 0.25%p 금리 인상 확률은 근원물가 발표 이후 86.3%까지 올랐습니다(파이낸셜뉴스, 9/12 오전 기준). 지난 보고서들이 추적해온 매체별 55~66%대 엇갈림에서 크게 벗어난 수치로, \u003cstrong>실제 FOMC 결정과 얼마나 부합하는지는 계속 추적합니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">로이터 서베이\u003c/span>\u003c/div>\n      \u003ch4>월가 이코노미스트 70%는 오히려 \"동결\" 예상 — 시장 확률과 반대\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>로이터가 실시한 설문에서는 월가 이코노미스트·애널리스트의 70%가 9월 FOMC에서 금리 동결을 예상한다고 답해, CME 페드워치의 시장 내재 확률(86.3% 인상)과 정반대 방향을 가리켰습니다(베타뉴스). \u003cstrong>시장 가격과 전문가 전망이 이렇게 크게 엇갈리는 것 자체가 이번 주 관전 포인트입니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">전망 엇갈림\u003c/span>\u003cspan class=\"src\">코스피 9월 밴드\u003c/span>\u003c/div>\n      \u003ch4>증권사별 9월 코스피 예상 밴드, 6,300~8,500까지 편차 큼\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이번 주 검색에서 나온 9월 코스피 예상 밴드는 매체·증권사마다 6,300~7,600, 6,500~8,500(삼성증권), 6,600~8,000(신한투자증권) 등으로 폭넓게 갈렸습니다. 90조원 규모 개인 매물이 지수 상단을 제한할 수 있다는 분석도 함께 나왔습니다. \u003cstrong>특정 종목이 아닌 지수 전체에 대한 증권사 전망이며, 실제 등락과는 별개로 검증 보류\u003c/strong>입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">이란·호르무즈\u003c/span>\u003c/div>\n      \u003ch4>트럼프-이란 관련 확전 보도, 시점이 뒤섞여 오늘은 판단을 보류합니다\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>지난 보고서(9/12)가 추적 대상으로 걸어둔 '트럼프의 美-이란 휴전 종료 선언 이후 실제 확전 여부'를 오늘 다시 검색했으나, 검색 결과 다수가 지난 7월 이란 전쟁 초기 보도(호르무즈 전면 봉쇄 등)와 이번 주 보도로 추정되는 내용이 뒤섞여 나와 정확한 시점을 구분하기 어려웠습니다. \u003cstrong>날짜가 불분명한 자료로 확전 여부를 단정할 수 없어 이 항목은 계속 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 시장은 \"인상\"에, 전문가는 \"동결\"에 걸었습니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">미국 8월 근원물가가 예상을 웃돌면서 채권·선물시장이 반영하는 9월 금리 인상 확률과, 로이터 설문에 응한 월가 전문가들의 예상이 정반대로 갈렸습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>인상 쪽 근거\u003c/h4>\n      \u003cp>8월 근원 CPI가 전월 대비 0.3% 올라 예상(0.2%)을 웃돌았고, CME 페드워치 기준 시장이 반영하는 9월 인상 확률은 86.3%까지 뛰었습니다. 물가가 쉽게 꺾이지 않는다는 신호로 해석됩니다.\u003c/p>\n      \u003cp class=\"src\">파이낸셜뉴스·CBC뉴스 · 2026-09-11~09-12\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>동결 쪽 근거\u003c/h4>\n      \u003cp>로이터 설문에 응한 월가 이코노미스트·애널리스트의 70%는 여전히 9월 동결을 예상한다고 답했습니다. 지난 보고서들이 지적해온 매체별 55~66%대 확률 엇갈림과 마찬가지로, 시장 가격과 전문가 컨센서스가 함께 움직이지 않고 있습니다.\u003c/p>\n      \u003cp class=\"src\">베타뉴스(로이터 설문 인용)\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>지난 몇 주간 이 보고서가 계속 지적해온 'FOMC 확률 매체별 엇갈림'이 이번에는 시장 가격(선물)과 전문가 서베이라는 서로 다른 종류의 지표 사이의 괴리로 한 단계 더 커졌습니다. 9/15~16 FOMC에서 실제로 어느 쪽이 맞았는지가 이 시리즈에서 가장 오래 추적해온 항목의 결론이 됩니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 월요일(9/14) 개장 이후 코스피 7,000선 재탈환 여부, 9/15~16 FOMC 실제 결정, 트럼프-이란 관련 확전 여부(날짜 재확인 포함)를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피 9/11 1.76% 급락이 월요일(9/14) 개장 이후에도 이어지는지.\u003c/strong> 7,000선 재탈환 여부를 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>9월 FOMC(9/15~16) 실제 결정.\u003c/strong> 시장 확률(86.3% 인상)과 월가 서베이(70% 동결) 중 어느 쪽이 맞는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>트럼프-이란 관련 확전·호르무즈 통제권 갈등 여부.\u003c/strong> 이번 주 보도와 지난 7월 보도가 뒤섞여 나온 만큼, 날짜를 명확히 재확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 인수 구조 및 반도체 대미투자 1호 프로젝트.\u003c/strong> 한·미 대미투자 합의문 서명 여부를 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치.\u003c/strong> 여전히 확인되지 않았습니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-12", "dow": "토", "summary": "토요일인 오늘 국내 증시는 휴장이지만, 이번 주 코스피는 9/9 종가 기준 33거래일 만에 7,000선을 탈환한 뒤 9/11 1.76% 급락하며 사흘 만에 다시 7,000선을 내줬습니다. 코스닥도 9/9·9/10 이틀 연속 오른 뒤 9/11 1.95% 내렸습니다. 현지시간 9/10 트럼프 대통령의 '미국-이란 휴전 종료' 선언 이후 미 증시는 다우·S&P500이 하락하며 혼조 마감했습니다. 지난 보고서가 추적하던 두 항목이 결론났는데, 코스피 7,000선 안착은 예측보다 더 강했고 다우 9/8 하락폭은 1.17%대 쪽 수치가 실제에 더 가까웠던 것으로 확인됐습니다.", "tally": {"ok": 5, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 7,000선 탈환 뒤 재이탈", "트럼프, 美-이란 휴전 종료 선언", "다우 9/8 하락폭 재확인"], "title": "코스피 두 달 만에 7,000선 딛고 사흘 만에 다시 이탈 — 트럼프발 이란 리스크 부각", "standfirst": "토요일인 오늘(9/12) 국내 증시는 휴장이며, 이번 주 코스피는 9/9 종가 기준 33거래일 만에 7,000선(7,051.64, +1.40%)을 탈환했다가 9/10 소폭 조정(-0.25%, 7,033.92)을 거쳐 9/11 1.76%(124.01포인트) 급락한 6,909.91로 다시 7,000선을 내줬습니다. 같은 기간 코스닥은 9/9 +2.28%, 9/10 +0.79%로 2거래일 연속 오른 뒤 9/11 1.95% 내린 820.64로 마감했습니다. 현지시간 9/10 트럼프 미국 대통령이 '미국-이란 휴전은 끝났다'고 선언하면서 국제 유가와 미 국채금리가 오르고, 미 증시(9/11)는 다우·S&P500이 하락, 나스닥만 소폭 올라 혼조 마감했습니다. 지난 보고서(9/9)가 추적하던 코스피·코스닥 9/9 마감 수치와 다우지수 9/8 하락폭 두 항목이 오늘 결론났는데, 코스피는 예측보다 더 강하게 7,000선을 회복했고 다우 하락폭은 매체 수치 중 1.17%대 쪽이 실제에 더 가까웠던 것으로 확인됐습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "머니투데이·아시아경제·이투데이·비즈니스코리아·EBN·CBC뉴스·tradingkey·MBC뉴스·한국경제·파이낸셜뉴스·서울경제·뉴스토마토(2026-09-04~09-12 스니펫 기준)", "body": "\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 2건 결론, 둘 다 예측이 맞았거나 더 강했습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>코스피 9/9 마감, 예상보다 더 강하게 7,000선을 회복했습니다\u003c/h4>\n      \u003cp>9/9 보고서는 장초반 7,000선 돌파가 종가까지 유지되는지를 추적 대상으로 걸어뒀습니다. 확인해보니 코스피는 그날 \u003cstrong>97.12포인트(1.40%) 오른 7,051.64\u003c/strong>로 마감해 33거래일 만에 종가 기준 7,000선을 회복했고, 코스닥도 \u003cstrong>18.49포인트(2.28%) 오른 830.37\u003c/strong>로 마감해 장초반 1%대 상승을 넘어 2%대까지 확대됐습니다. \u003cstrong>반등 지속 예측이 맞았고, 코스피는 예상보다 더 강했습니다\u003c/strong>(파이낸셜뉴스·머니투데이·아시아경제). 다만 이 강세는 사흘을 넘기지 못했고, 아래에서 다시 다룹니다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>다우 9/8 하락폭, 1.17%대 쪽이 맞았지만 매체 격차는 더 커졌습니다\u003c/h4>\n      \u003cp>9/9 보고서는 다우지수 9/8 하락폭이 0.90%(CBC뉴스)와 1.17%(KRMG 등) 중 어느 쪽에 가까운지를 걸어뒀습니다. 오늘 재확인한 결과 다우는 \u003cstrong>628.18포인트(1.18%) 내린 52,786.07\u003c/strong>로 마감해 1.17% 쪽 수치에 근접했습니다. 다만 같은 날을 이투데이는 0.77% 하락으로 보도해 \u003cstrong>세 번째 수치가 추가로 발견됐고, 매체 간 격차는 좁혀지지 않았습니다.\u003c/strong>\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">토요일인 오늘(9/12) 국내외 증시는 모두 휴장입니다. 이번 주 코스피는 9/9 7,000선을 회복한 뒤 9/11 다시 이를 내줬습니다. 미국 증시는 가장 최근 마감인 9/11(현지시간) 기준입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시하며 미국 지수도 같은 기준을 적용합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/9 마감)\u003c/td>\u003ctd class=\"num up\">7,051.64 (+1.40%)\u003c/td>\u003ctd>97.12포인트 오름, 33거래일 만에 종가 기준 7,000선 회복(파이낸셜뉴스·아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스피 (9/10 마감)\u003c/td>\u003ctd class=\"num down\">7,033.92 (-0.25%)\u003c/td>\u003ctd>17.72포인트 내림, 7,000선은 유지(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스피 (9/11 마감)\u003c/td>\u003ctd class=\"num down\">6,909.91 (-1.76%)\u003c/td>\u003ctd>124.01포인트 내려 7,000선 재붕괴(머니투데이·비즈니스코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/9 마감)\u003c/td>\u003ctd class=\"num up\">830.37 (+2.28%)\u003c/td>\u003ctd>18.49포인트 오름(머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/10 마감)\u003c/td>\u003ctd class=\"num up\">836.92 (+0.79%)\u003c/td>\u003ctd>6.55포인트 오름, 2거래일 연속 상승(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/11 마감)\u003c/td>\u003ctd class=\"num down\">820.64 (-1.95%)\u003c/td>\u003ctd>16.28포인트 내림(아시아경제·이투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/11 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">52,348.39 (-1.09%)\u003c/td>\u003ctd>트럼프의 美-이란 휴전 종료 선언 이후 하락(CBC뉴스·tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/11 마감)\u003c/td>\u003ctd class=\"num up\">25,870.65 (+0.20%)\u003c/td>\u003ctd>메모리 반도체주 반등에 소폭 상승(tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/11 마감)\u003c/td>\u003ctd class=\"num down\">7,482.71 (-0.28%)\u003c/td>\u003ctd>우량주 약세(tradingkey)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/11 마감)\u003c/td>\u003ctd class=\"num\">1,345.9원\u003c/td>\u003ctd>비즈니스코리아 집계, 상승 마감(비즈니스코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 기준금리\u003c/td>\u003ctd class=\"num\">3.50~3.75%\u003c/td>\u003ctd>다음 FOMC는 9/15~16일\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>토요일(9/12)에는 새 거래일 데이터가 없어 9/9~9/11 사흘간 확정된 마감 수치로 표를 채웠습니다. 다음 거래일은 월요일(9/14)부터입니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피\u003c/span>\u003c/div>\n      \u003ch4>7,000선 회복 후 사흘 만에 재붕괴\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스피는 9/9 종가 기준 33거래일 만에 7,000선(7,051.64, +1.40%)을 회복했으나, 9/10 소폭 조정(-0.25%)을 거쳐 9/11 1.76%(124.01포인트) 급락한 6,909.91로 마감하며 다시 7,000선을 내줬습니다(파이낸셜뉴스·아시아경제·머니투데이).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥\u003c/span>\u003c/div>\n      \u003ch4>2거래일 연속 상승 뒤 9/11 하락\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스닥은 9/9(+2.28%), 9/10(+0.79%) 이틀 연속 오른 뒤 9/11 1.95%(16.28포인트) 내린 820.64로 마감했습니다(아시아경제·이투데이).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">트럼프·이란\u003c/span>\u003c/div>\n      \u003ch4>트럼프, \"미국-이란 휴전은 끝났다\" 선언\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>트럼프 미국 대통령은 현지시간 9/10 소셜미디어를 통해 미국-이란 종전 양해각서 체결 3주 만에 \"휴전이 끝났다\"고 밝혔습니다. 이란 외무부 대변인은 \"미국과의 협상을 요청한 사실이 없다\"고 반박했고, 미 재무부는 곧이어 이란 최고지도자 자금 조달책에 제재를 발표했습니다(MBC뉴스).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">뉴욕증시(9/11)\u003c/span>\u003c/div>\n      \u003ch4>이란 리스크로 다우·S&amp;P500 하락, 나스닥은 반도체주에 소폭 상승\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>다우는 1.09% 내린 52,348.39, S&amp;P500은 0.28% 내린 7,482.71로 마감한 반면, 나스닥은 메모리 반도체주 반등에 0.20% 오른 25,870.65로 마감해 지수별로 엇갈렸습니다(CBC뉴스·tradingkey).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 불확실\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>9/11 마감 1,345.9원, 주말 시세는 검증 보류\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>비즈니스코리아는 9/11 원/달러 환율이 1,345.9원으로 상승 마감했다고 보도했습니다. 토요일인 오늘(9/12) 국제 외환시장의 1,341원대 시세는 휴장 중 참고용 호가로, 다음 매매기준율 고시(월요일)까지 \u003cstrong>정확한 수치는 검증 보류\u003c/strong>로 남깁니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">웨스팅하우스·반도체투자\u003c/span>\u003c/div>\n      \u003ch4>지분 인수 두 가지 안, 이달 중순 대미투자 합의문 서명과 맞물려 탄력 기대\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>웨스팅하우스 지분(브룩필드 51%·카메코 49%)을 둘러싼 구주 인수와 IPO 신주 인수 두 가지 안은 여전히 병행 검토 중입니다. 이달 중순 서명 예정인 한·미 대미투자 최종 합의문에 '미국 내 원전 8기 건설 추진'이 담길 것이라는 전망이 나오면서 지분 인수 논의에도 탄력이 붙을 것으로 보도됐지만, \u003cstrong>서명 여부와 반도체 대미투자 1호 프로젝트의 실제 발표는 아직 이뤄지지 않아 검증 보류\u003c/strong>입니다(한국경제·머니투데이).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">9월 FOMC\u003c/span>\u003c/div>\n      \u003ch4>인상 확률 57%·66.7% 두 수치 공존, 여전히 수렴 안 됨\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>9월 FOMC(9/15~16) 0.25%p 인상 확률은 한 자료에서 57%(동결 43%)로, 다른 자료에서는 66.7%로 제시돼 지난 보고서들이 지적한 매체별 엇갈림이 오늘 검색에서도 그대로 남아 있습니다. \u003cstrong>수렴 여부는 계속 검증 보류\u003c/strong>이며, 실제 결정은 FOMC 회의 이후 확인됩니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">특징주(9/10)\u003c/span>\u003c/div>\n      \u003ch4>샘표, 코스피 상한가 — 코스닥에서도 상한가 종목 다수\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>9/10 코스피에서는 샘표가 55만7,000원(+29.99%)으로 상한가를 기록해 상승 종목 상위에 올랐고, 코스닥에서는 알파칩스·원익IPS·더코디 등이 나란히 29%대 상한가로 마감했습니다(EBN).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 7,000선 회복이 일시적이었는지, 트럼프발 이란 리스크가 새 변수로 자리잡을지\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피가 33거래일 만에 7,000선을 회복했다가 사흘 만에 다시 내줬고, 그 사이 트럼프 대통령의 미국-이란 휴전 종료 선언이 새로운 지정학 변수로 등장했습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>회복 근거\u003c/h4>\n      \u003cp>코스피는 9/9 종가 기준으로 예상보다 강하게 7,000선을 탈환했고, 코스닥도 2거래일 연속 상승했습니다. 웨스팅하우스 지분 인수와 반도체 대미투자 1호 프로젝트 모두 이달 중순 한·미 대미투자 합의문 서명과 맞물려 진전 기대가 남아 있습니다.\u003c/p>\n      \u003cp class=\"src\">파이낸셜뉴스·아시아경제·한국경제 · 2026-09-09~09-12\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>트럼프 대통령의 휴전 종료 선언 이후 국제 유가와 미 국채금리가 오르며 코스피는 9/11 1.76% 급락해 7,000선을 다시 내줬고, 미 증시도 다우·S&amp;P500이 하락하며 혼조 마감했습니다. 9월 FOMC 확률도 57%와 66.7%로 여전히 수렴되지 않아 다음 주 변동성을 키우는 변수로 남아 있습니다.\u003c/p>\n      \u003cp class=\"src\">CBC뉴스·tradingkey·MBC뉴스 · 2026-09-10~09-11\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>코스피가 두 달 가까이 걸려 회복한 7,000선을 사흘 만에 다시 내준 것은 최근 반도체·AI 모멘텀에 의존한 반등이 얼마나 취약한지를 보여줍니다. 트럼프발 이란 리스크가 일시적 뉴스플로우인지, 유가·금리를 통해 국내 증시에 지속적인 부담을 주는 변수로 자리잡을지가 다음 주 방향을 가늠하는 신호가 됩니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 월요일(9/14) 개장 이후 코스피·코스닥 흐름, 미국-이란 긴장의 실제 격화 여부, 웨스팅하우스·반도체투자 합의문 서명 여부를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피 9/11 1.76% 급락이 다음 거래일(월요일)에도 이어지는지.\u003c/strong> 7,000선 재탈환 여부를 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스닥 9/11 하락이 다음 거래일에도 이어지는지.\u003c/strong>\u003c/li>\n    \u003cli>\u003cstrong>트럼프의 美-이란 휴전 종료 선언 이후 실제 군사적 충돌이나 호르무즈해협 통제권 갈등으로 격화되는지.\u003c/strong>\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 인수 구조 및 반도체 대미투자 1호 프로젝트.\u003c/strong> 9월 중순 예정된 한·미 대미투자 최종 합의문 서명이 실제 이뤄지는지, 원전 8기 건설 조항 포함 여부를 봅니다.\u003c/li>\n    \u003cli>\u003cstrong>9월 FOMC(9/15~16) 실제 결정.\u003c/strong> 확률 수치(57%/43% vs 66.7%) 수렴 여부와 실제 결정을 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치.\u003c/strong> 여전히 확인되지 않았습니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-09", "dow": "수", "summary": "수요일인 오늘 코스피는 전일(9/8) 0.58% 조정을 거친 뒤 다시 반등 출발해 장초반 7,000선을 돌파했고, 코스닥도 1%대 상승폭을 키웠습니다. 반면 미국 증시는 이란 관련 지정학 리스크로 유가가 뛰며 3대 지수가 동반 하락했습니다. 지난 보고서가 추적하던 두 항목이 결론났는데, 코스피 9/7 마감은 예측대로 개장보다 더 강했고, 원/달러 환율의 1,340원 하회 흐름은 마감까지 유지되지 못해 예측이 부분적으로 빗나갔습니다.", "tally": {"ok": 4, "warn": 5, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 장초반 7,000선 돌파", "미국 증시 이란 리스크로 하락", "추적 2건 결론"], "title": "코스피 다시 7,000선 도전, 미국은 이란 리스크로 하락 — 환율 1,340원대서 공방", "standfirst": "수요일인 오늘(9/9) 코스피는 전일 40.87포인트(0.58%) 내린 뒤 18.35포인트(0.26%) 오른 6,972.87로 반등 출발했고, 장초반에는 7,000선을 돌파했다는 보도가 나왔습니다. 코스닥도 0.39% 오른 채 출발해 장초반 1%대 상승으로 상승폭을 키웠습니다. 반면 미국 증시는 9/8(현지시간) 이란 관련 무력 충돌 소식에 유가가 배럴당 99.5달러 근처까지 오르며 인플레이션 우려가 부각돼 다우·나스닥·S&P500이 동반 하락했습니다. 지난 보고서(9/7)가 추적하던 코스피·코스닥 9/7 최종 마감 수치와 원/달러 환율 9/7 마감가 두 항목이 오늘 결론났는데, 코스피는 개장보다 더 크게 뛰어 예측이 적중했지만 원화는 1,340원 하회 흐름을 지키지 못해 예측이 부분적으로 빗나갔습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "아시아경제·이투데이·비즈니스코리아·KRMG·CBC뉴스·kgosu 환율정보·서울경제·아시아투데이·머니투데이(2026-09-04~09 스니펫 기준)", "body": "\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 2건 결론, 코스피는 예측 적중, 환율은 부분적으로 빗나갔습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card\">\n      \u003ch4>코스피 9/7 마감, 개장보다 더 크게 뛰어 7,000선 턱밑까지 갔습니다\u003c/h4>\n      \u003cp>9/7 보고서는 개장 3%대·1%대 급등이 마감까지 유지되는지를 추적 대상으로 걸어뒀습니다. 확인해보니 코스피는 그날 \u003cstrong>308.18포인트(4.61%) 오른 6,995.39\u003c/strong>로 마감해 개장 때 상승폭(3.34%)보다 오히려 더 커졌고, 코스닥도 \u003cstrong>8.69포인트(1.07%) 오른 822.19\u003c/strong>로 마감해 개장 때의 1%대 상승을 지켜냈습니다. \u003cstrong>반등 지속 예측이 맞았고, 코스피는 예상보다 더 강했습니다.\u003c/strong> 엔비디아·오픈AI 등 AI 생태계 확장 기대와 뉴욕증시 반도체주 훈풍이 배경으로 꼽혔습니다(비즈니스코리아·이투데이·아시아경제).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>원/달러 1,340원 하회, 마감까지 못 가고 다시 1,340원대로 올라섰습니다\u003c/h4>\n      \u003cp>9/7 보고서는 장초반 1,339.5원까지 떨어졌던 원화 강세가 마감과 다음 거래일까지 이어지는지를 걸어뒀습니다. 확인해보니 9/7 환율은 '1,340원대 안정적 하락 마감'으로 보도돼(비즈니스코리아) 1,340원 하회 흐름이 마감까지 유지되지 못했고, 9/8 매매기준율도 \u003cstrong>1,344.50원\u003c/strong>으로 고시돼(kgosu 환율정보) 다음 거래일까지도 하회 흐름이 이어지지 않았습니다. \u003cstrong>하회 지속 예측은 부분적으로 빗나갔습니다.\u003c/strong> 다만 정확한 9/7 종가 자체는 스니펫에서 확인되지 않아 세부 수치는 검증 보류로 남습니다.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">수요일인 오늘(9/9) 코스피는 전일 조정을 딛고 다시 반등 출발했습니다. 미국 증시는 가장 최근 마감인 9/8(화, 현지시간) 기준입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시하며 미국 지수도 같은 기준을 적용합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/8 마감)\u003c/td>\u003ctd class=\"num down\">6,954.52 (-0.58%)\u003c/td>\u003ctd>40.87포인트 내림, 9/7 급등 이후 하루 조정(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/8 마감)\u003c/td>\u003ctd class=\"num down\">811.88 (-1.25%)\u003c/td>\u003ctd>10.31포인트 내림(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스피 (9/9 개장)\u003c/td>\u003ctd class=\"num up\">6,972.87 (+0.26%)\u003c/td>\u003ctd>18.35포인트 오른 채 출발, 장초반 7,000선 돌파 보도(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/9 개장)\u003c/td>\u003ctd class=\"num up\">815.06 (+0.39%)\u003c/td>\u003ctd>3.18포인트 오른 채 출발, 장초반 1%대 상승으로 확대(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/8 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">52,787 (-1.17%)\u003c/td>\u003ctd>626.72포인트 하락. CBC뉴스는 -0.90%로 보도해 수치가 엇갈림(KRMG·CBC뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/8 마감)\u003c/td>\u003ctd class=\"num down\">26,421 (-0.32%)\u003c/td>\u003ctd>85.58포인트 하락(KRMG)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/8 마감)\u003c/td>\u003ctd class=\"num down\">7,673 (-0.58%)\u003c/td>\u003ctd>44.94포인트 하락(KRMG)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/9 새벽)\u003c/td>\u003ctd class=\"num\">약 1,342원\u003c/td>\u003ctd>9/8 매매기준율은 1,344.50원(kgosu 환율정보)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 기준금리\u003c/td>\u003ctd class=\"num\">3.50~3.75%\u003c/td>\u003ctd>다음 FOMC는 9/15~16일\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>코스피·코스닥의 9/9 최종 마감 수치는 검색 시점 기준 아직 확인되지 않아 개장 및 장초반 데이터로 대체했습니다. 최종 마감 수치는 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피·코스닥\u003c/span>\u003c/div>\n      \u003ch4>하루 조정 후 다시 반등 출발\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스피는 9/8 40.87포인트(0.58%) 내린 6,954.52로 마감한 뒤, 9/9 18.35포인트(0.26%) 오른 6,972.87로 다시 반등 출발했습니다(아시아경제).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">세부 미확인\u003c/span>\u003cspan class=\"src\">코스피 7,000선\u003c/span>\u003c/div>\n      \u003ch4>장초반 7,000선 돌파 보도, 정확한 시각·고점은 검증 보류\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>아시아경제는 9/9 장초반 코스피가 7,000선을 돌파했고 코스닥도 1% 넘게 올랐다고 보도했습니다. 다만 정확한 돌파 시각과 고점 수치는 스니펫에서 확인되지 않아 세부 수치는 검증 보류로 남깁니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">뉴욕증시(9/8)\u003c/span>\u003c/div>\n      \u003ch4>이란 관련 지정학 리스크로 3대 지수 동반 하락, 다우 낙폭은 매체마다 다름\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>9/8(현지시간) 미국 3대 지수는 이란 관련 무력 충돌 소식에 유가가 배럴당 99.5달러 근처까지 오르며 인플레이션 우려가 부각돼 동반 하락했습니다. 다우 낙폭은 626.72포인트(1.17%, KRMG 등)로 집계되기도, 0.90%(CBC뉴스)로 보도되기도 해 \u003cstrong>정확한 수치는 검증 보류\u003c/strong>입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>1,340원대에서 안정, 강세 기조는 유지\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>9/9 새벽 국제 외환시장에서 원/달러 환율은 1,342원 안팎을 나타냈고, 9/8 매매기준율은 1,344.50원(현찰 살 때 1,368.02원·팔 때 1,320.98원)으로 고시됐습니다(kgosu 환율정보).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">고려아연\u003c/span>\u003c/div>\n      \u003ch4>주주총회, 가처분 기각 이후 예정대로 진행\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>고려아연은 9/9 주주총회를 열었는데, 의결권 제한 가처분 신청이 기각되면서 예정대로 진행됐습니다(이투데이).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">특징주\u003c/span>\u003c/div>\n      \u003ch4>태양광 관련주가 오늘 특징주로 거론됐지만 등락률은 미확인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이투데이·서울경제 등은 HD현대에너지솔루션·신성이엔지·OCI홀딩스·대주전자재료·한화솔루션 등을 오늘 증시 특징주로 거론했습니다. 다만 구체적인 등락률 수치는 스니펫에서 확인되지 않아 \u003cstrong>검증 보류\u003c/strong>로 남깁니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">9월 FOMC\u003c/span>\u003c/div>\n      \u003ch4>인상 57%·동결 43%라는 새 수치, 그러나 기존 55~66%대 엇갈림은 여전\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이번 주 검색에서는 9월 FOMC에서 기준금리를 0.25%p 올릴 가능성이 57%, 동결 가능성이 43%라는 수치가 나왔습니다. 다만 정확한 출처와 시점을 특정하기 어렵고, 지난 보고서들이 지적한 매체별 55~66%대 엇갈림과 마찬가지로 \u003cstrong>수렴 여부는 검증 보류\u003c/strong>로 남깁니다. 기준금리는 3.50~3.75%, 다음 FOMC는 9/15~16일입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">반도체 대미투자\u003c/span>\u003c/div>\n      \u003ch4>1호 프로젝트, \"에너지 분야 중심\"으로 재확인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>김정관 산업통상자원부 장관은 대미투자 1호 프로젝트를 에너지 분야 중심으로 추진한다고 재확인하며, 미국이 반도체 팹 건설을 요구한다는 일부 보도에 대해 \"에너지 외 다른 분야를 논의할 수 없는 일정\"이라고 선을 그었습니다(서울경제·아시아투데이·아시아경제·머니투데이). 9월 중 발표라는 일정은 유지되고 있습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>브룩필드·카메코 지분 구조는 재확인됐지만 한국 측 진전은 없습니다\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>웨스팅하우스는 브룩필드(지분 51%)와 카메코(49%)가 보유 중이며 최근 기업공개(IPO)를 추진 중인 것으로 확인됐습니다. 다만 한국의 지분 인수 구조(신주 인수 vs 지분 매입)나 소관 부처에 대한 새로운 진전은 오늘 검색에서 확인되지 않아 \u003cstrong>검증 보류\u003c/strong>로 남깁니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — AI·반도체發 랠리가 이어질지, 미국발 지정학 리스크가 발목 잡을지\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피가 9/8 하루 조정을 거쳐 9/9 다시 7,000선 돌파를 시도하고 있지만, 미국 증시는 이란 관련 지정학 리스크로 하락 마감해 두 시장의 방향이 엇갈리고 있습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>반등 지속 근거\u003c/h4>\n      \u003cp>9/7 코스피 급등을 이끌었던 AI·반도체 훈풍이 완전히 꺾이지 않았고, 원화 강세 기조도 1,340원대에서 유지되고 있어 외국인 자금 유입 여력이 남아 있습니다. 반도체 대미투자 1호 프로젝트도 에너지 분야로 방향이 정리되며 불확실성이 일부 걷혔습니다.\u003c/p>\n      \u003cp class=\"src\">아시아경제·서울경제·아시아투데이 · 2026-09-08~09\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>미국 3대 지수는 이란 관련 무력 충돌로 유가가 뛰며 인플레이션 우려 속에 동반 하락했고, 9월 FOMC 확률은 새 수치(57%/43%)가 나왔음에도 여전히 매체별로 수렴되지 않고 있습니다. 다우 낙폭 수치 자체도 매체마다 달라 미국 시장 상황을 정확히 가늠하기 어렵습니다.\u003c/p>\n      \u003cp class=\"src\">KRMG·CBC뉴스 · 2026-09-08\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>코스피가 하루 조정 뒤 다시 7,000선에 도전하는 흐름과, 미국이 지정학 리스크로 하락한 흐름이 같은 주간에 겹쳐 있습니다. 국내 증시가 미국발 하락을 얼마나 반영하는지, 아니면 AI·반도체 모멘텀으로 독자적인 강세를 이어가는지가 이번 주 방향을 가늠하는 신호가 됩니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피·코스닥 9/9 최종 마감 수치, 다우지수 9/8 정확한 낙폭, 9월 FOMC 확률의 수렴 여부를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피 9/9 최종 마감 수치.\u003c/strong> 장초반 7,000선 돌파가 종가까지 유지되는지 확인합니다. \u003cem>[9/12 후속] 코스피는 마감까지 상승폭이 더 커져 +1.40%(7,051.64)로 33거래일 만에 종가 기준 7,000선을 회복했습니다.\u003c/em>\u003c/li>\n    \u003cli>\u003cstrong>코스닥 9/9 최종 마감 수치.\u003c/strong> 장초반 1%대 상승을 지켜내는지 봅니다. \u003cem>[9/12 후속] 코스닥도 +2.28%(830.37)로 상승폭을 키우며 2%대 상승으로 마감했습니다.\u003c/em>\u003c/li>\n    \u003cli>\u003cstrong>미국 다우지수 9/8 하락폭 정확한 수치.\u003c/strong> 매체별 0.90%(CBC뉴스)와 1.17%(KRMG 등) 중 어느 쪽이 맞는지 확인합니다. \u003cem>[9/12 후속] 실제 하락폭은 628.18포인트(1.18%)로 확인돼 1.17%(KRMG 등) 쪽에 더 가까웠으나, 이투데이(0.77%)까지 겹쳐 매체 간 격차는 더 커졌습니다.\u003c/em>\u003c/li>\n    \u003cli>\u003cstrong>9월 FOMC 금리 확률.\u003c/strong> 57%/43% 수치와 기존 55~66%대 엇갈림이 수렴되는지, 9/15~16 실제 결정은 어떻게 나는지 봅니다.\u003c/li>\n    \u003cli>\u003cstrong>반도체 대미투자 1호(에너지 분야) 프로젝트, 9월 중 실제 발표되는지.\u003c/strong>\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 인수 구조와 소관 부처, 언제 결론 나는지.\u003c/strong> 계속 확인이 필요합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-07", "dow": "월", "summary": "월요일인 오늘 코스피는 개장 직후 3%대, 코스닥은 1%대 오르며 강하게 출발했고, 원/달러 환율은 1,339.5원까지 떨어지며 1년 11개월 만에 최저치를 기록했습니다. 지난 보고서가 추적하던 코스피 반등 지속과 원화 강세 지속 두 항목 모두 오늘 개장·장중 데이터로 결론이 났지만, 최종 마감 수치는 아직 확인되지 않았습니다. 미 국채금리는 19개월 만에 최고 수준이고 9월 FOMC 확률은 매체마다 55~66%대로 여전히 엇갈려 있습니다.", "tally": {"ok": 4, "warn": 5, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 개장 3%대 급등", "원화 1,340원 하회", "추적 2건 결론"], "title": "코스피 개장 3%대 급등, 원화는 1,340원 밑으로 — 미국 국채금리는 19개월래 최고", "standfirst": "월요일인 오늘(9/7) 코스피는 전 거래일보다 3.34%(223.57포인트) 오른 6,910.78로 출발해 오전 9시5분에도 3.06%(6,892.15) 상승을 유지했고, 코스닥도 1.16% 오른 822.91로 동반 상승 출발했습니다. 원/달러 환율은 장초반 1,339.5원까지 떨어지며 2024년 10월 이후 1년 11개월 만에 최저치를 기록했고, 지난 보고서(9/5)가 추적하던 코스피 반등 지속과 원화 강세 지속 두 항목 모두 오늘 장 초반 데이터로 결론이 났습니다. 다만 미 10년물 국채금리는 4.797%로 19개월 만에 최고 수준이고, 9월 FOMC 금리 인상 확률은 매체별로 55~66%대까지 여전히 엇갈려 있어 오늘 급등이 마감까지 유지될지는 불확실합니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "아시아경제·이투데이·머니투데이·이데일리·파이낸셜뉴스·세계일보·EBN·뉴스토마토·한국경제·문화일보·헤럴드경제·글로벌 마켓 리포트(뉴스핌 계열)(2026-09-01~07 스니펫 기준)", "body": "\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 2건 결론, 둘 다 예측이 맞았습니다(잠정)\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card\">\n      \u003ch4>코스피 반등, 9/7 개장까지 그대로 이어졌습니다\u003c/h4>\n      \u003cp>9/5 보고서는 코스피 9/4 1.64% 반등이 다음 거래일(9/7)에도 이어지는지를 추적 대상으로 걸어뒀습니다. 확인해보니 코스피는 9/7 개장 직후 전 거래일 대비 \u003cstrong>3.34%(223.57포인트) 오른 6,910.78\u003c/strong>로 출발했고, 오전 9시5분 기준으로도 \u003cstrong>3.06%(6,892.15)\u003c/strong> 상승을 유지했습니다. 코스닥도 1.16%(9.41포인트) 오른 822.91로 동반 상승 출발해 \u003cstrong>반등 지속 예측이 맞았습니다\u003c/strong>(아시아경제·이투데이·머니투데이). 다만 개장·장중 수치이며 최종 마감 종가는 다음 보고서에서 확인합니다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card\">\n      \u003ch4>원화 강세, 1,350원대를 지나 1,340원 밑까지 진행됐습니다\u003c/h4>\n      \u003cp>9/5 보고서는 원/달러 환율 1,350원대 강세가 다음 거래일에도 유지되는지를 걸어뒀습니다. 실제로는 예상보다 더 강해져 9/7 장초반 환율이 전장 대비 10.9원(0.81%) 내린 \u003cstrong>1,339.5원\u003c/strong>까지 떨어지며 2024년 10월 4일 이후 \u003cstrong>1년 11개월 만에 최저치\u003c/strong>를 기록했습니다. \u003cstrong>강세 지속 예측이 맞았고 폭도 예상보다 컸습니다\u003c/strong>(이투데이). 다만 같은 시각 다른 집계는 1,345.21원, 예상범위 1,343~1,356원을 제시해 정확한 수치는 매체별로 다소 엇갈립니다.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">월요일인 오늘(9/7) 국내 증시는 개장 직후 강하게 반등했습니다. 미국 증시는 가장 최근 마감인 9/2(수, 현지시간) 기준입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시하며 미국 지수도 같은 기준을 적용합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/7 개장)\u003c/td>\u003ctd class=\"num up\">6,910.78 (+3.34%)\u003c/td>\u003ctd>223.57포인트 급등 출발, 오전 9시5분 기준 +3.06%(6,892.15)로 소폭 축소(아시아경제·이투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/7 개장)\u003c/td>\u003ctd class=\"num up\">822.91 (+1.16%)\u003c/td>\u003ctd>9.41포인트 오른 채 출발, 장중 825.54까지 올랐다가 821.55까지 밀리기도 함(머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/2 마감, 최신)\u003c/td>\u003ctd class=\"num up\">53,061.95 (+0.56%)\u003c/td>\u003ctd>295.07포인트 상승 마감(글로벌 마켓 리포트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/2 마감, 최신)\u003c/td>\u003ctd class=\"num up\">26,217.83 (+0.45%)\u003c/td>\u003ctd>118.05포인트 상승 마감(글로벌 마켓 리포트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/2 마감, 최신)\u003c/td>\u003ctd class=\"num up\">7,666.60 (+0.46%)\u003c/td>\u003ctd>35.13포인트 상승 마감(글로벌 마켓 리포트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/7 장초반)\u003c/td>\u003ctd class=\"num\">1,339.5원 (-10.9원)\u003c/td>\u003ctd>1년 11개월 만에 최저치, 다른 집계는 1,345.21원도 제시(이투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미 10년물 국채금리\u003c/td>\u003ctd class=\"num up\">4.797%\u003c/td>\u003ctd>2년물은 4.369%, ISM 제조업 가격지수는 71.1(이데일리)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 기준금리\u003c/td>\u003ctd class=\"num\">3.50~3.75%\u003c/td>\u003ctd>다음 FOMC는 9/15~16일(이데일리)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>코스피·코스닥의 9/7 최종 마감 종가는 검색 시점 기준 아직 확인되지 않아 개장 및 오전 9시5분 장중 데이터로 대체했습니다. 최종 마감 수치는 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피·코스닥\u003c/span>\u003c/div>\n      \u003ch4>양대 지수, 3%대·1%대 동반 급등 출발\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스피는 9/7 전 거래일보다 223.57포인트(3.34%) 오른 6,910.78로 출발했고, 코스닥도 9.41포인트(1.16%) 오른 822.91로 동반 상승 출발했습니다(아시아경제·이투데이·머니투데이).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">수급\u003c/span>\u003c/div>\n      \u003ch4>외국인·기관 동반 순매수, 개인은 순매도\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>9/7 개장 이후 외국인과 기관이 각각 632.6억원, 611.3억원 순매수한 반면, 개인 투자자는 1조 2,458억원 순매도한 것으로 집계됐습니다(관련 보도 종합).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">업종\u003c/span>\u003c/div>\n      \u003ch4>전기전자·의료정밀 업종 중심으로 강세\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>업종별로는 전기전자(4.43%), 의료정밀(2.55%), 유통업(2.29%), 기계장비(1.61%), 운송장비·부품(1.03%) 순으로 강세를 보였습니다(관련 보도 종합).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>1,340원 하회 vs 1,345원대, 집계마다 다릅니다\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이투데이는 9/7 장초반 환율이 1,339.5원까지 떨어져 1년 11개월 만에 최저치를 기록했다고 보도했지만, 다른 집계 사이트는 같은 시각 1,345.21원, 장중 예상범위 1,343~1,356원을 제시해 \u003cstrong>정확한 수치는 검증 보류\u003c/strong>로 남깁니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">뉴욕증시(9/2)\u003c/span>\u003c/div>\n      \u003ch4>미국 3대 지수, 나란히 상승 마감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>다우 53,061.95(+0.56%), S&amp;P500 7,666.60(+0.46%), 나스닥 26,217.83(+0.45%)로 마감했습니다(글로벌 마켓 리포트).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">9월 FOMC\u003c/span>\u003c/div>\n      \u003ch4>금리 인상 확률, 매체·기관마다 55~66%대로 여전히 엇갈립니다\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이데일리는 CME 페드워치 기준 0.25%p 인상 가능성 66.2%, 동결 가능성 49.8%를 전했습니다(두 수치를 더하면 100%를 넘어 \u003cstrong>수치 자체의 정합성은 낮아 보입니다\u003c/strong>). 같은 시점 칼시(Kalshi)는 인상 55%·동결 43%, 마켓워치는 60.3%를 보도해 \u003cstrong>수렴 여부는 여전히 검증 보류\u003c/strong>입니다. 미 10년물 국채금리는 4.797%로 높은 수준을 유지 중입니다(이데일리·EBN).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">이견\u003c/span>\u003cspan class=\"src\">반도체 대미투자\u003c/span>\u003c/div>\n      \u003ch4>\"9월 중 발표\" 재확인됐지만 대상 분야는 엇갈립니다\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>김정관 산업통상자원부 장관은 대미 1호 투자 프로젝트를 9월 중 발표할 것이라고 재확인하며 \"에너지 분야를 중심으로 막판 조율이 이어지고 있다\"고 밝혔습니다(뉴스토마토·아시아경제). 반면 청와대는 1호 후보로 메모리 반도체가 논의되고 있다는 보도는 사실과 다르다고 부인해, \u003cstrong>대상 분야를 둘러싼 보도가 엇갈리는 상태\u003c/strong>입니다(문화일보).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>지분 인수 구조, 두 가지 안이 그대로 남아 있습니다\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>브룩필드 보유 지분(51%) 인수안과 웨스팅하우스 상장(IPO) 시 신주 인수안이 함께 거론되는 가운데, 정부는 한전 등 직접 투자 외에 한·미 관세 협상 후속으로 조성되는 대미투자펀드 재원을 활용하는 방안도 검토 중인 것으로 보도됐습니다(한국경제). 최종 구조와 소관 부처는 \u003cstrong>여전히 검증 보류\u003c/strong>입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">MSCI 리밸런싱\u003c/span>\u003c/div>\n      \u003ch4>지난달 편입종목의 실제 외국인 순매수 확정치, 아직 미확인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>지난달 MSCI 한국지수에 새로 편입된 종목을 두고 최대 4,300억~4,390억원의 외국인 패시브 자금 유입이 예상됐다는 보도가 있었지만, 편입 이후 \u003cstrong>실제 확정 순매수치는 오늘 검색 스니펫에서도 확인되지 않아 검증 보류\u003c/strong>로 남깁니다(헤럴드경제).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 개장 급등이 마감까지 갈지, 미국발 금리 경계가 발목 잡을지\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피가 개장 3%대까지 오르며 강하게 출발했지만, 미 국채금리가 19개월 만에 최고 수준을 유지하고 있고 9월 FOMC 확률도 매체마다 엇갈려 있어 상승폭이 마감까지 유지될지는 불확실합니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>반등 지속 근거\u003c/h4>\n      \u003cp>원화 강세가 1,340원 밑으로까지 진행되며 외국인 자금 유입 여력이 커졌고, 실제로 개장 이후 외국인·기관이 동반 순매수에 나섰습니다. 반도체 대미투자 1호 프로젝트도 9월 중 발표가 재확인되며 불확실성 해소 기대가 남아 있습니다.\u003c/p>\n      \u003cp class=\"src\">아시아경제·이투데이·뉴스토마토 · 2026-09-07\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>미 10년물 국채금리가 4.797%로 19개월 만에 최고 수준을 유지 중이고, 9월 FOMC 금리 인상 확률은 매체별로 55~66%대까지 여전히 수렴되지 않았습니다. 웨스팅하우스 지분 인수 구조와 반도체 투자 대상 분야를 둘러싼 이견도 그대로 남아 있습니다.\u003c/p>\n      \u003cp class=\"src\">이데일리·EBN·한국경제·문화일보 · 2026-09-01~07\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>개장 3%대 급등은 최근 이 보고서가 다뤄온 조정 국면 이후 가장 큰 폭의 반등입니다. 이 폭이 마감까지 유지되는지가 잭슨홀 이후 이어진 변동성 장세가 진정 국면으로 들어섰는지를 가늠하는 신호가 됩니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피·코스닥 9/7 최종 마감 수치, 원/달러 환율 마감가, 9월 FOMC 확률의 수렴 여부를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피·코스닥 9/7 최종 마감 수치.\u003c/strong> 개장 3%대·1%대 급등이 마감까지 유지되는지
