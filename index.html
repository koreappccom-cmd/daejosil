.44원\u003c/td>\u003ctd>오늘 범위 1,352.66~1,375.73원(Investing.com)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>수요일인 오늘(9/23) 오전 9시15분 기준 코스피는 전 거래일보다 1.50%(105.32포인트) 오른 7,123.23에서 거래되고 있습니다. 전기·전자(+2.13%), 의료·정밀기기(+2.03%), 화학(+1.78%) 등 업종이 강세를 보였다고 이투데이가 전했습니다(장중 수치, 마감 아님). 연준 기준금리는 지난 9/17 인상된 3.75~4.00%에서 오늘 새로 확인된 변동은 없고, 미 10년물 국채금리는 9/16 기준 4.975%로 이틀 연속 5% 안팎을 오간 뒤 소폭 진정된 상태입니다(뉴스핌).\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 마감\u003c/span>\u003c/div>\n      \u003ch4>코스피, 9/22 장중 2.20% 급등했다가 대부분 반납 — 0.15% 오른 7,017.91 마감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>비즈니스코리아·파이낸셜뉴스에 따르면 코스피는 전장보다 2.20% 오른 7,161.61에 출발해 한때 7,171.44까지 올랐으나, 오후 들어 외국인 매도세 확대와 기관의 순매도 전환, SK하이닉스(-1.82%) 차익 실현이 맞물려 상승폭 대부분을 반납했습니다. 이날 개인이 1조8,793억원, 기관이 364억원 순매도했고 외국인만 2,613억원 순매수했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 마감\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 5거래일 연속 상승 뒤 하루 만에 0.23% 내린 834.38 마감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>아시아경제에 따르면 코스닥은 1.89포인트 내린 834.38로 마감해, 9/17부터 이어진 5거래일 연속 상승 흐름이 하루 만에 멈췄습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미국 증시\u003c/span>\u003c/div>\n      \u003ch4>나스닥, 마이크론 급등 등 반도체 강세에 이틀 연속 사상 최고치\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스에 따르면 나스닥은 27,244.28(+0.45%)로 마감해 이틀 연속 사상 최고 기록을 새로 썼습니다. 마이크론이 5%대 급등했고, 인텔·ARM·AMD 등도 반도체 강세 흐름에 동반 상승한 것으로 보도됐습니다. 반면 다우존스는 51,863.80(-0.36%)으로 소폭 내려 대형 우량주와 기술주가 혼조세를 보였습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">특징주 · 자사주\u003c/span>\u003c/div>\n      \u003ch4>KSS해운, 자사주 197만주(198억원) 취득 계획 공시에 장중 16% 급등 — 종목 추천 아님\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이투데이에 따르면 KSS해운은 오전 9시29분 기준 전 거래일보다 16% 오른 1만1,670원에 거래됐으며, 이는 전날 발표된 12월 22일까지 198억원 규모 자사주 197만주 장내매수 공시 영향으로 풀이됩니다. 이 시리즈는 최근 7일 내 이 종목을 다룬 적이 없습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">확정 안 됨\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>웨스팅하우스 지분율, 한국 20%대 요구 vs 미국 7%대 상한 — 구체 수치·가격 미확정\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스에 따르면 정부는 웨스팅하우스 지분 20% 안팎 확보를 목표로 협상해왔으나 미국 측은 지분율 상한을 7%대로 못 박은 것으로 전해졌습니다. \u003cstrong>구체적인 지분율이나 가격은 아직 확정되지 않았습니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">방향 엇갈림\u003c/span>\u003cspan class=\"src\">이란-호르무즈\u003c/span>\u003c/div>\n      \u003ch4>이란, 해상제한구역 아라비아해까지 확대 발표 — 동시에 외교채널서 재개방 조건 논의\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스·MBC뉴스에 따르면 이란 혁명수비대는 호르무즈·오만해에 이어 아라비아해 일부까지 포함하는 새 해상제한구역을 선포했습니다. 같은 시기 이란 외무장관은 유엔총회에서 미국 특사를 만나 해협 재개방 조건을 제시한 것으로 보도돼, 수사적 긴장과 외교 협상이 동시에 진행되는 모습입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 지수는 반등했지만 수급·외교 일정은 여전히 불투명합니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피·나스닥은 강세 신호를 냈지만, 코스피의 상승폭 반납과 대미투자·이란 관련 불확실성은 오늘도 해소되지 않았습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>강세 근거\u003c/h4>\n      \u003cp>코스피가 이틀 연속 7,000선을 지켰고, 나스닥은 반도체 강세에 힘입어 이틀 연속 사상 최고치를 새로 썼습니다. 오늘 코스피도 개장 후 업종 전반이 강세로 출발했습니다. 이란-호르무즈 관련해서는 우려했던 추가 확전 대신 외교 협상 채널이 가동 중입니다.\u003c/p>\n      \u003cp class=\"src\">머니투데이·비즈니스코리아·파이낸셜뉴스·이투데이 · 2026-09-22~09-23\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>코스피는 장중 2%대 급등분을 대부분 반납한 채 마감해 상승 동력이 약해졌다는 해석도 가능합니다. 웨스팅하우스 지분율은 한·미 간 격차가 20%대 대 7%대로 여전히 크고, 대미투자 MOU 서명은 대통령의 제동 발언 이후 오히려 더 불투명해졌습니다. 다우는 나스닥과 달리 소폭 하락했습니다.\u003c/p>\n      \u003cp class=\"src\">파이낸셜뉴스·한국일보·네이트뉴스 · 2026-09-21~09-23\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>코스피가 상승분을 반납한 배경(외국인·기관 수급)과 대미투자 MOU의 실제 서명 여부, 스타십 9/28 발사 결과가 이번 주 시장 흐름의 다음 분수령이 될 전망입니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피 9/23 마감치와 외국인·기관 수급 확정치, 한미 MOU 실제 서명 여부, 웨스팅하우스 지분 최종 확정치를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>한미 대미투자 MOU 실제 서명 여부.\u003c/strong> 대통령의 '속도전 제동' 발언 이후에도 9월 내 타결·서명이 이뤄지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 최종 확정치.\u003c/strong> 한국 20%대 요구와 미국 7%대 상한 사이에서 실제 어느 수준으로 정리되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스피 9/21 외국인 순매매 확정치.\u003c/strong> 뉴스핌 '614억원 순매수'와 머니투데이 '동반 매도' 상충을 KRX 공식 통계로 대조합니다.\u003c/li>\n    \u003cli>\u003cstrong>스페이스X 스타십 14차 시험비행.\u003c/strong> 9월 28일 실제 발사에서 첫 궤도 진입과 스타링크 V3 위성 배치가 성공하는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>이란 신규 해상제한구역.\u003c/strong> 아라비아해까지 넓힌 통제구역 선언이 실제 선박 통제·나포로 이어지는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>KSS해운 자사주 매입 진행 상황.\u003c/strong> 12월 22일 완료 예정인 197만주 장내매수가 실제로 어떻게 집행되는지 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-22", "dow": "화", "summary": "화요일인 오늘 확인한 가장 최근 거래일(9/21) 마감치에서 코스피는 113.49포인트(1.65%) 오른 7,007.72로 7거래일 만에 7,000선을 재탈환했고, 코스닥도 5거래일 연속 상승한 836.27(+1.11%)로 마감했습니다. 반도체 수출이 9월 1~20일 기준 역대 최대인 341억달러(전년비 +259.4%)를 기록한 점이 배경으로 꼽혔습니다. 미국 3대 지수는 현지시간 9/21 다우·S&P500·나스닥이 모두 상승 마감했습니다. 국내에서는 대미투자 1호 사업의 국회 보고가 오늘 오전 예정대로 진행됐고, 웨스팅하우스 지분 확보 목표는 기존 15%에서 7%+α로 낮아졌다는 보도가 나왔습니다. 원/달러 환율은 오늘 1,370~1,387원 사이에서 넓게 움직이고 있습니다.", "tally": {"ok": 5, "warn": 4, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 9/21 마감 7,007.72(+1.65%) — 7거래일 만에 7,000선 재탈환", "코스닥 9/21 마감 836.27(+1.11%) — 5거래일 연속 상승", "美 3대지수 9/21(현지시간) 동반 상승 — 다우+0.98%·S&P+0.43%·나스닥+0.44%", "웨스팅하우스 지분 목표 15%→7%+α로 하향 보도"], "title": "코스피, 7거래일 만에 7,000선 재탈환 — 웨스팅하우스 지분은 7%대로 낮아졌다", "standfirst": "화요일인 오늘(9/22) 이 시리즈가 확인한 가장 최근 거래일인 9/21(월) 마감 기준으로 코스피는 전 거래일보다 113.49포인트(1.65%) 오른 7,007.72로 마감해 지난 9/10(7,033.92) 이후 7거래일 만에 종가 기준 7,000선을 되찾았습니다. 반도체 수출이 9월 1~20일 기준 341억달러(전년비 +259.4%)로 역대 최대를 기록하며 삼성전자가 4.98% 오른 점이 지수 상승을 이끌었다고 보도됐습니다. 코스닥도 9.15포인트(1.11%) 오른 836.27로 마감해 5거래일 연속 상승을 이어갔습니다. 미국 3대 지수는 현지시간 9/21 다우 53,277.01(+0.98%)·S&P500 7,674.37(+0.43%)·나스닥 26,180.46(+0.44%)으로 모두 상승 마감했습니다. 이 시리즈가 지켜본 대미투자 1호 사업 국회 보고는 오늘 오전 9시30분 예정대로 진행됐지만, 뒤이을 한미 MOU 서명·발표 시점은 '22일 오후, 시차를 감안하면 22일 오후 10시 이후 유력'으로 다시 보도돼 실제 서명 여부는 이번 검색 시점까지 확인되지 않았습니다. 웨스팅하우스 지분 확보 목표는 기존 '15%+의결권'에서 '7%+α' 수준으로 낮아져 논의되고 있다는 보도도 새로 나왔습니다. 원/달러 환율은 오늘 1,369.66~1,387.40원 사이에서 넓게 움직이고 있습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "파이낸셜뉴스·신아일보·서울신문·머니투데이·이투데이·투자닷컴·헤럴드경제·SBS Biz·뉴스1·한국경제(2026-09-21~09-22 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 코스피 7,000선 재탈환, 대미투자 국회 보고는 예정대로 진행됐습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>코스피·코스닥 9/21 최종 마감 — 코스피는 장중 상승폭을 더 키워 7,000선 재탈환, 코스닥은 장중 반전을 딛고 결국 플러스 마감\u003c/h4>\n      \u003cp>코스피는 장중 1.28%(6,982.32)에서 마감까지 상승폭이 더 커져 113.49포인트(1.65%) 오른 \u003cstrong>7,007.72\u003c/strong>로 마감, 9/10 이후 7거래일 만에 종가 기준 7,000선을 되찾았습니다. 코스닥은 장중 한때 -0.12%까지 밀렸던 흐름이 마감까지 이어지지 않고 다시 강세로 돌아와 1.11% 오른 \u003cstrong>836.27\u003c/strong>로 마감해 5거래일 연속 상승을 이어갔습니다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>대미투자 국회 보고 — 22일 예정대로 진행, 다만 MOU 서명 시점은 다시 바뀌어 보도\u003c/h4>\n      \u003cp>정부는 실제로 9/22 오전 9시30분 국회 재정경제위원회·산업통상자원중소벤처기업위원회에 대미투자 1호 사업을 비공개 보고했습니다. 다만 뒤이을 한미 MOU 서명·발표는 지난 보고서가 전한 '23일 유력'에서 '22일 오후, 시차 고려 시 오후 10시 이후 유력'으로 다시 바뀌어 보도됐고, \u003cstrong>이번 검색 시점까지 실제 서명 여부는 확인되지 않았습니다.\u003c/strong>\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>코스피 외국인 매수 전환(9/18)의 9/21 지속 여부 — 매체 간 서술이 상충합니다\u003c/h4>\n      \u003cp>뉴스핌 등은 외국인이 장중 순매도로 돌아섰다가 마감엔 다시 614억원 순매수로 마무리됐다고 전했지만, 머니투데이는 같은 날을 '개미·외인 동반 매도'로 보도했습니다. 기관이 1조원 넘게 순매수하며 반도체 대형주를 사들인 점은 공통적으로 확인되나, \u003cstrong>외국인의 정확한 순매매 확정치는 검증 보류로 남습니다.\u003c/strong>\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">화요일인 오늘(9/22) 국내 증시는 검색 시점 기준 새 마감치가 없어 가장 최근 거래일인 9/21(월) 마감치를 표에 담았습니다. 미국 지수도 현지시간 가장 최근 마감인 9/21(월) 수치입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/21 마감)\u003c/td>\u003ctd class=\"num up\">7,007.72 (+1.65%)\u003c/td>\u003ctd>113.49포인트 오름, 7거래일 만에 7,000선 재탈환(파이낸셜뉴스·신아일보)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/21 마감)\u003c/td>\u003ctd class=\"num up\">836.27 (+1.11%)\u003c/td>\u003ctd>9.15포인트 오름, 5거래일 연속 상승(서울신문·머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/21 마감, 현지시간)\u003c/td>\u003ctd class=\"num up\">53,277.01 (+0.98%)\u003c/td>\u003ctd>517.80포인트 오름\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/21 마감)\u003c/td>\u003ctd class=\"num up\">7,674.37 (+0.43%)\u003c/td>\u003ctd>33.21포인트 오름\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/21 마감)\u003c/td>\u003ctd class=\"num up\">26,180.46 (+0.44%)\u003c/td>\u003ctd>113.29포인트 오름\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/22, 실시간)\u003c/td>\u003ctd class=\"num\">1,372.44원\u003c/td>\u003ctd>개장 1,385.84원, 전일 종가 1,385.61원, 오늘 범위 1,369.66~1,387.40원(Investing.com)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>반도체 수출이 9월 1~20일 기준 341억달러(전년비 +259.4%)로 역대 최대를 기록하면서 삼성전자가 4.98% 오른 274,000원에 마감해 지수 상승을 이끌었다고 여러 매체가 전했습니다. 연준 기준금리는 지난 9/17 인상된 3.75~4.00%에서 오늘 새로 확인된 변동은 없습니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 마감\u003c/span>\u003c/div>\n      \u003ch4>코스피, 9/21 113.49포인트(1.65%) 오른 7,007.72 마감 — 7거래일 만에 7,000선 재탈환\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스·신아일보·인워24 등에 따르면 코스피는 반도체 수출 호조와 삼성전자 강세(+4.98%, 274,000원)에 힘입어 지난 9/10(7,033.92) 이후 7거래일 만에 종가 기준 7,000선을 회복했습니다. 장중 고점은 7,027.58이었습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 마감\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 9/21 9.15포인트(1.11%) 오른 836.27 마감 — 5거래일 연속 상승\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>서울신문·머니투데이·뉴스1에 따르면 코스닥은 반도체 장비주 강세와 개인 순매수(1,426억원)에 힘입어 5거래일 연속 상승했습니다. 같은 날 외국인·기관은 순매도한 것으로 보도됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미국 증시\u003c/span>\u003c/div>\n      \u003ch4>미국 3대 지수, 9/21(현지시간) 동반 상승 마감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>다우존스는 517.80포인트(0.98%) 오른 53,277.01, S&amp;P500은 33.21포인트(0.43%) 오른 7,674.37, 나스닥은 113.29포인트(0.44%) 오른 26,180.46으로 각각 마감해 3대 지수가 모두 상승했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">특징주\u003c/span>\u003c/div>\n      \u003ch4>반도체 장비주(이오테크닉스·원익IPS), 코스닥 상승 견인 — 종목 추천 아님\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>서울신문·센머니에 따르면 9/21 코스닥에서는 이오테크닉스·원익IPS 등 반도체 장비주가 강세를 보였고, 신규 상장한 네오사피엔스도 급등한 것으로 보도됐습니다. 두 종목 모두 최근 7일 내 이 시리즈에서 다뤄진 적이 없습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">방향 엇갈림\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>웨스팅하우스 지분 확보 목표, 기존 15%에서 7%+α로 낮아져 논의 — 확정 아님\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>한국경제에 따르면 한국의 웨스팅하우스 지분 확보 목표가 당초 15% 안팎에서 '7%+α' 수준으로 크게 낮아져 논의되고 있으며, 이사회 진입은 어려울 것으로 보인다고 전했습니다. \u003cstrong>최종 확정 여부는 검증 보류입니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">시점 혼선\u003c/span>\u003cspan class=\"src\">대미투자 MOU\u003c/span>\u003c/div>\n      \u003ch4>한미 MOU 서명 시점, '23일 유력'에서 '22일 오후 22시 이후 유력'으로 다시 바뀜\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>헤럴드경제에 따르면 김정관 산업통상부 장관의 23일 해외출장 일정 때문에 22일 오전 국회 보고 이후 오후 늦게, 시차를 감안하면 오후 10시 이후 서명 가능성이 높다고 정치권 관계자가 전했습니다. \u003cstrong>실제 서명이 이뤄졌는지는 이번 검색 시점까지 확인되지 않았습니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">코스피 수급\u003c/span>\u003c/div>\n      \u003ch4>코스피 9/21 외국인 순매매, 매체 간 상충 — 614억원 순매수 vs 동반 매도\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>뉴스핌 기반 정리는 외국인이 장중 매도 전환 이후 마감엔 614억원 순매수로 마무리됐다고 전했으나, 머니투데이는 같은 날을 '개미·외인 동반 매도'로 보도했습니다. \u003cstrong>정확한 확정치는 KRX 공식 통계 대조가 필요해 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">스페이스X 스타십\u003c/span>\u003c/div>\n      \u003ch4>스타십 14차 시험비행, 오늘 밤 예정 재확인 — 발사 결과는 아직 미확인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>스페이스X는 9/22 한국시간 오후 9시15분~10시30분 스타십 14차 시험비행을 진행해 처음으로 지구 궤도에 진입시키고 스타링크 V3 위성 26기를 배치할 계획이라고 밝혔습니다. \u003cstrong>실제 발사 결과는 이번 검색 시점까지 확인되지 않았습니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 지수는 반등했지만 대미투자·웨스팅하우스 협상 세부는 여전히 불투명합니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피·코스닥 마감과 미국 증시는 뚜렷한 강세를 보였지만, 이 시리즈가 추적해온 대미투자·웨스팅하우스 관련 일정과 조건은 오늘도 매체마다 다르게 전해졌습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>강세 근거\u003c/h4>\n      \u003cp>코스피가 7거래일 만에 7,000선을 되찾았고 코스닥도 5거래일 연속 상승했습니다. 반도체 수출이 역대 최대를 기록했고, 미국 3대 지수도 동반 상승 마감했습니다. 대미투자 국회 보고도 예정대로 진행됐습니다.\u003c/p>\n      \u003cp class=\"src\">파이낸셜뉴스·서울신문·SBS Biz·뉴스1 · 2026-09-21~09-22\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>웨스팅하우스 지분 목표가 7%+α로 낮아졌다는 보도는 협상이 한국에 불리하게 좁혀지고 있음을 시사합니다. MOU 서명 시점은 다시 한번 바뀌었고, 코스피 외국인 수급도 매체 간 상충해 확정치가 없습니다.\u003c/p>\n      \u003cp class=\"src\">한국경제·헤럴드경제·뉴스핌·머니투데이 · 2026-09-21~09-22\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>오늘 밤 MOU 서명 여부와 스타십 14차 시험비행 결과가 겹치고, 코스피가 7,000선을 다음 거래일에도 지키는지가 이번 주 흐름의 분수령이 될 전망입니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 한미 MOU 실제 서명 시점과 웨스팅하우스 지분 최종 확정치, 코스피 9/22 마감의 7,000선 안착 여부, 스타십 14차 발사 결과를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>한미 대미투자 MOU 서명.\u003c/strong> '22일 오후 22시 이후 유력'으로 알려진 서명이 실제 이뤄졌는지, 시점이 다시 바뀌지는 않았는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 확보 목표.\u003c/strong> 7%+α로 낮아졌다는 보도의 최종 확정 수치와 이사회 참여 여부를 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스피 7,000선 안착 여부.\u003c/strong> 7,007.72 마감 이후 다음 거래일에도 7,000선을 지키는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스피 9/21 외국인 순매매 확정치.\u003c/strong> 매체 간 상충한 수치를 KRX 공식 통계로 대조합니다.\u003c/li>\n    \u003cli>\u003cstrong>스페이스X 스타십 14차 시험비행.\u003c/strong> 오늘 밤 예정된 발사의 실제 결과와 궤도 진입 성공 여부를 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>이란-미국 호르무즈 해협.\u003c/strong> 추가 확전 여부를 계속 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-21", "dow": "월", "summary": "월요일인 오늘 코스피는 장중 한때 1.28%(6,982.32)까지 오르며 개장 상승폭(0.64%)을 더 키웠으나, 코스닥은 개장 0.43% 상승에서 장중 -0.12%로 방향이 뒤집혔습니다(모두 장중 수치, 최종 마감 아님). 원/달러 환율은 매매기준율 1,383.8원으로 고시돼 1,380원대 후반에서 유지되며 1,400원과는 거리를 뒀습니다. 대미투자 국회 보고는 기존 21~22일 범위에서 22일로 확정됐고 MOU 서명·발표는 23일이 유력하다는 보도가 나왔습니다. 뉴욕증시는 9/19(금) 수치가 매체 간 혼선을 보여 가장 최근 확정된 9/18 마감치를 유지했고, 스페이스X는 9/22 스타십 14차 시험비행을 앞두고 있습니다.", "tally": {"ok": 4, "warn": 4, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 9/21 장중 +1.28% 6,982.32 (장중, 마감 아님)", "코스닥 9/21 개장 +0.43%에서 장중 -0.12%로 반전", "대미투자 국회보고 22일 확정, MOU 서명·발표 23일 유력", "원/달러 매매기준율 1,383.8원 — 1,400원과는 거리"], "title": "코스피 장중 6,982까지 상승 — 코스닥은 강세에서 약세로 돌아섰다", "standfirst": "월요일인 오늘(9/21) 코스피는 개장 0.64%(6,938.34) 상승에서 오전 9시5분 기준 1.28%(6,982.32)까지 상승폭을 더 키웠지만, 코스닥은 개장 0.43%(830.71) 상승 이후 같은 시각 -0.12%로 방향이 뒤집혀 코스피와 엇갈린 흐름을 보였습니다. 이는 모두 장중 수치이며 최종 마감치가 아닙니다. 서울 외환시장에서 원/달러 환율은 전일 마감보다 3.7원 높은 1,387.0원에 출발했고, 이날 매매기준율은 1,383.8원으로 고시돼 1,380원대 후반에서 유지되며 이 시리즈가 추적해온 1,400원 재돌파는 아직 실현되지 않았습니다. 이 시리즈가 지켜본 대미투자 국회 보고는 기존 21~22일의 넓은 범위에서 22일 오전 9시30분으로 확정됐고, '상업적 합리성' 확보를 둘러싼 한미 간 이견이 일부 해소되며 MOU 서명·발표는 이르면 23일 이뤄질 가능성이 커졌습니다. 뉴욕증시는 9/19(금, 현지시간) 마감 지수 수치가 검색 결과에서 9/18 수치와 동일하게 반복돼 확정하지 못해, 가장 최근 확정 마감인 9/18 수치를 유지했습니다. 스페이스X는 9/22 한국시간 오후 9시15분 스타십 14차 시험비행을 앞두고 있습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "뉴스1·아시아경제·newspim·토큰포스트·서울신문·파이낸셜뉴스·헤럴드경제·SBS Biz·PPSS·CBC뉴스(2026-09-18~09-21 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">월요일인 오늘(9/21) 검색 시점은 국내 증시 장중이라 코스피·코스닥은 장중(오전 9시대) 수치이며 최종 마감이 아닙니다. 뉴욕 3대 지수는 매체 간 9/19(금) 수치가 9/18과 겹쳐 나와 확정이 어려워, 가장 최근 확정된 9/18(현지시간) 마감치를 유지합니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/21 오전 9시5분, 장중)\u003c/td>\u003ctd class=\"num up\">6,982.32 (+1.28%)\u003c/td>\u003ctd>개장 +0.64%(6,938.34)에서 장중 상승폭 확대, 마감 아님(뉴스1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/21 오전 9시5분, 장중)\u003c/td>\u003ctd class=\"num down\">전일 대비 -0.12%\u003c/td>\u003ctd>개장 +0.43%(830.71)에서 장중 하락 전환, 마감 아님(뉴스1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/21 매매기준율)\u003c/td>\u003ctd class=\"num up\">1,383.8원\u003c/td>\u003ctd>서울외국환중개 고시, 개장가는 1,387.0원(전일 종가 대비 +3.7원)(토큰포스트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/18 마감, 현지시간, 최근 확정치)\u003c/td>\u003ctd class=\"num down\">51,682.64 (-0.18%)\u003c/td>\u003ctd>95.40포인트 내림(newspim)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/18 마감)\u003c/td>\u003ctd class=\"num up\">7,650.50 (+0.17%)\u003c/td>\u003ctd>12.74포인트 오름(newspim)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/18 마감)\u003c/td>\u003ctd class=\"num up\">26,522.55 (+0.39%)\u003c/td>\u003ctd>104.25포인트 오름(newspim)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>9/19(금, 현지시간) 뉴욕증시 마감 지수 수치는 검색 결과가 9/18 수치와 동일하게 반복돼 나와 확정하기 어려웠습니다. 일부 매체는 기술주·반도체·자본재가 강세를, 공익사업·내구소비재가 약세를 보였다는 업종별 방향만 전했을 뿐 지수 등락률은 특정하지 않아, 정확한 9/19 마감치는 검증 보류로 남깁니다. 美 10년물 국채금리의 9/21 시점 새 수치도 이번 검색에서 확인되지 않아, 가장 최근 확인값인 FOMC 직후(9/17) 4.93%를 참고치로 유지합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 장중\u003c/span>\u003c/div>\n      \u003ch4>코스피, 장중 1%대 강세로 확대 — 개장 0.64%에서 오전 9시대 1.28%까지 상승폭 키움\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>뉴스1·아시아경제·newspim에 따르면 코스피는 9/21 전 거래일보다 44.11포인트(0.64%) 오른 6,938.34로 출발한 뒤, 오전 9시5분 기준으로는 88.09포인트(1.28%) 오른 6,982.32까지 상승폭을 넓혔습니다. 이는 장중 수치이며 최종 마감치가 아닙니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">방향 엇갈림\u003c/span>\u003cspan class=\"src\">코스닥 장중\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 개장 강세에서 장중 약세로 급반전 — 코스피와 방향 엇갈려\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스닥은 9/21 전 거래일보다 3.59포인트(0.43%) 오른 830.71로 출발했으나, 뉴스1의 같은 시각(오전 9시5분) '2보' 기사에서는 코스피가 1.28% 오른 것과 대조적으로 코스닥이 0.12% 내린 것으로 전해졌습니다. \u003cstrong>개장 이후 방향이 뒤바뀐 것으로 보이나 정확한 지수값과 최종 마감은 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>원/달러 환율, 소폭 상승 출발 — 1,380원대 후반 유지, 1,400원과는 거리\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>토큰포스트에 따르면 9/21 달러-원 환율은 전일 마감보다 3.7원 높은 1,387.0원에 출발했습니다. 서울외국환중개가 이날 고시한 매매기준율은 1,383.8원입니다. 이 시리즈가 지난 9/18부터 추적해 온 1,400원 재돌파 여부는 아직 실현되지 않았고, 1,380원대에서 등락이 이어지고 있습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">특징주\u003c/span>\u003c/div>\n      \u003ch4>한화에어로스페이스·LG에너지솔루션·위메이드맥스, 개별 재료로 시장 관심 — 종목 추천 아님\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>인포스탁·newspim 등 특징주 보도에 따르면 한화에어로스페이스는 해외 방산 수주가 이어지는 흐름이, LG에너지솔루션은 ESS(에너지저장장치) 배터리 수주 잔량이 약 2년치까지 쌓인 데다 미·중 관련 소식이 겹친 점이, 위메이드맥스는 미국 스테이블코인 관련 법안이 의회 본회의 상정에 근접했다는 소식이 각각 관심 재료로 거론됐습니다. 세 종목 모두 최근 7일 내 이 시리즈에서 다뤄진 적이 없습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">대미투자·웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>대미투자 국회 보고, 22일로 확정 — MOU 서명·발표는 23일 유력\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>서울신문·파이낸셜뉴스에 따르면 앞서 21~22일 범위로 알려졌던 대미투자 1호 사업 국회 보고가 22일 오전 9시30분 국회 산업통상자원중소벤처기업위원회 비공개 보고로 확정됐습니다. 투자금 회수 가능성 등 '상업적 합리성'을 확보해야 한다는 한국 측 요구를 미국이 일부 수용하며 접점을 찾은 것으로 보도됐고, MOU 서명·발표는 이르면 23일 이뤄질 가능성이 커졌습니다. 다만 실제 서명 여부는 아직 확인되지 않았습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">스페이스X 스타십\u003c/span>\u003c/div>\n      \u003ch4>스타십 14차 시험비행, 9/22 목표 재확인 — \"첫 수익 비행\" 발언 추가 확인, 결과는 미정\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>헤럴드경제·SBS Biz·PPSS에 따르면 스페이스X는 9/22 한국시간 오후 9시15분~10시30분 스타십 14차 시험비행을 진행하며, 브렛 존슨 스페이스X 최고재무책임자(CFO)는 이번 비행을 \"상장 후 스타십이 처음으로 수익을 창출하는 비행\"이라고 설명했습니다. \u003cstrong>실제 발사 결과와 방산·우주항공 테마에 미치는 영향은 여전히 검증 보류입니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">뉴욕증시 9/19\u003c/span>\u003c/div>\n      \u003ch4>뉴욕증시 9/19(금) 마감 지수 수치, 매체 간 혼선으로 확정 어려움\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>일부 검색 결과에서 9/19 다우 하락폭으로 제시된 수치가 9/18 수치(95.40달러)와 동일하게 나와 신뢰하기 어려웠습니다. \u003cstrong>정확한 9/19 마감 지수는 검증 보류로 남기고, 가장 최근 확정 마감인 9/18 수치를 표에 유지했습니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">호르무즈 해협\u003c/span>\u003c/div>\n      \u003ch4>호르무즈 해협 추가 확전 여부, 9/17 이후 새로운 사실은 확인되지 않음\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이달 초(9월 9일 전후) 이란이 최근 일주일 새 美 군함을 최소 3차례 겨냥해 미사일을 발사했다는 보도가 있었으나, 이는 이 시리즈가 추적을 시작한 9/17 이전 시점의 소식입니다. 오늘 검색에서는 9/17 이후 시점의 새로운 확전 관련 사실이 확인되지 않았습니다. \u003cstrong>추가 확전 여부는 계속 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 코스피·코스닥 방향이 갈렸고, 핵심 일정은 여전히 이틀 앞입니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피는 장중 상승폭을 키웠지만 코스닥은 방향이 뒤집혔고, 대미투자·스타십 등 이번 시리즈가 추적해온 핵심 일정은 22~23일로 여전히 며칠 남아 있습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>강세 근거\u003c/h4>\n      \u003cp>코스피는 개장 0.64%에서 장중 1.28%까지 상승폭을 키웠고, 원/달러 환율은 1,400원과는 거리를 둔 1,380원대에서 안정적으로 유지되고 있습니다. 대미투자 국회 보고 일정도 21~22일의 넓은 범위에서 22일로 확정되며 불확실성이 줄었습니다.\u003c/p>\n      \u003cp class=\"src\">뉴스1·아시아경제·토큰포스트·서울신문 · 2026-09-21\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>코스닥은 개장 강세가 장중 약세로 뒤바뀌어 코스피와 다른 흐름을 보였고, 뉴욕증시 9/19 마감 수치는 매체 간 혼선으로 확정하지 못했습니다. 대미투자 MOU 서명은 아직 이뤄지지 않았고, 호르무즈 해협의 추가 확전 여부도 여전히 확인되지 않았습니다.\u003c/p>\n      \u003cp class=\"src\">newspim·newspim 글로벌마켓리포트 · 2026-09-19~09-21\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>오늘 장중 코스피·코스닥의 방향이 갈린 만큼 최종 마감 수치가 다음 보고서의 첫 확인 대상이며, 9/22 국회 보고·스타십 시험비행과 9/23 MOU 서명 유력 시점이 겹쳐 이번 주 중반이 이 시리즈가 추적해온 여러 일정의 분수령이 될 전망입니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피·코스닥 9/21 최종 마감치, 9/22 대미투자 국회 보고 및 스타십 14차 시험비행 결과, 9/23 MOU 서명 여부를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피·코스닥 9/21 최종 마감.\u003c/strong> 코스피의 장중 1%대 강세와 코스닥의 장중 약세 전환이 마감까지 어떻게 이어지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>한미 대미투자 MOU 서명.\u003c/strong> 22일 국회 보고 이후 23일 유력으로 좁혀진 서명·발표가 실제 그 일정대로 이뤄지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스피 외국인 매수 전환.\u003c/strong> 9/18 매수 전환이 9/21에도 이어졌는지, 오늘 검색에서는 확인되지 않아 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>원/달러 환율.\u003c/strong> 1,383원대가 1,400원 재돌파로 이어지는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>스페이스X 스타십 14차 시험비행.\u003c/strong> 9/22 한국시간 오후 9시15분 목표 발사의 실제 결과와 방산·우주항공 테마 영향을 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>이란-미국 호르무즈 해협 무력충돌.\u003c/strong> 9/17 이후 추가 확전 여부를 계속 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-20", "dow": "일", "summary": "일요일인 오늘은 국내 증시 휴장일로, 최근 거래일인 9/18(금) 마감 수치(코스피 +2.66% 6,894.23, 코스닥 +0.60% 827.12)에서 변동이 없습니다. 미국은 현지시간 9/18 반도체주 강세에 나스닥(+0.39%)·S&P500(+0.17%)이 오르고 다우만 소폭(-0.18%) 내렸습니다. 대미투자 국회 보고는 22일로 구체화됐고 발표는 23일이 유력하다는 보도가 나왔으며, 스페이스X는 스타십 14차 시험비행을 9/22 한국시간 오후 9시15분 목표로 첫 지구 궤도 진입을 시도한다고 밝혔습니다. 원/달러 환율과 美 10년물 국채금리의 최신 수치는 이번 검색에서 확인되지 않아 검증 보류로 남깁니다.", "tally": {"ok": 3, "warn": 4, "bad": 0}, "kicker": ["자동생성·검색기반", "일요일 휴장 — 코스피·코스닥 9/18 마감치 유지", "美 나스닥 +0.39%·S&P500 +0.17%, 다우 -0.18% (9/18 현지시간)", "대미투자 국회보고 22일로 구체화, 발표는 23일 유력", "스타십 14차 시험비행 9/22 21:15(KST) 목표"], "title": "일요일 휴장 속 미국 반도체주는 올랐다 — 대미투자 발표는 23일로 좁혀졌다", "standfirst": "일요일인 오늘(9/20)은 국내 증시 휴장일로, 국내 지수는 가장 최근 거래일인 금요일(9/18) 마감 수치(코스피 6,894.23, 코스닥 827.12)에서 변동이 없습니다. 반면 미국 3대 지수는 현지시간 9/18 마감에서 엔비디아·브로드컴·마이크론 등 반도체주 강세에 힘입어 나스닥이 0.39%, S&P500이 0.17% 올랐고, 다우만 국채금리·유가 부담에 0.18% 내렸습니다. 이 시리즈가 추적해온 한미 대미투자 국회 보고는 기존 21~22일 예정에서 22일로 더 구체화됐고, 발표는 23일이 유력하다는 보도가 나왔습니다. 스페이스X는 스타십 14차 시험비행을 9/22 한국시간 오후 9시15분~10시30분 사이 진행해 처음으로 지구 궤도에 진입시키고 스타링크 V3 위성 26기를 배치할 계획이라고 밝혔습니다. 원/달러 환율과 미국 10년물 국채금리의 정확한 최신 수치는 이번 검색에서 확인되지 않아 검증 보류로 남깁니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "뉴스핌·EBN·SBS Biz·서울경제·이투데이·PPSS·이코리아(2026-09-17~09-19 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">일요일인 오늘(9/20)은 국내 증시 휴장일이라 코스피·코스닥 수치는 가장 최근 거래일인 9/18(금) 마감치와 변동이 없습니다. 미국 지수는 가장 최근 마감인 현지시간 9/18 기준으로 새로 업데이트합니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/18 마감, 휴장으로 변동 없음)\u003c/td>\u003ctd class=\"num up\">6,894.23 (+2.66%)\u003c/td>\u003ctd>가장 최근 거래일 마감치 유지(머니투데이·비즈니스코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/18 마감, 휴장으로 변동 없음)\u003c/td>\u003ctd class=\"num up\">827.12 (+0.60%)\u003c/td>\u003ctd>가장 최근 거래일 마감치 유지(머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/18 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">51,682.64 (-0.18%)\u003c/td>\u003ctd>95.40포인트 내림, 국채금리·유가 부담(뉴스핌·EBN)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/18 마감)\u003c/td>\u003ctd class=\"num up\">7,650.50 (+0.17%)\u003c/td>\u003ctd>12.74포인트 오름, 반도체주 강세가 견인(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/18 마감)\u003c/td>\u003ctd class=\"num up\">26,522.55 (+0.39%)\u003c/td>\u003ctd>104.25포인트 오름(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>필라델피아 반도체지수 (9/18 마감)\u003c/td>\u003ctd class=\"num up\">전일 대비 +2.78%\u003c/td>\u003ctd>엔비디아·브로드컴·마이크론 강세(뉴스핌)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>원/달러 환율과 美 10년물 국채금리의 9/19(토) 시점 정확한 수치는 이번 검색에서 확인되지 않았습니다. 가장 최근 확인된 값은 각각 9/18 오후 3시30분 기준 1,383.30원, 9/17 FOMC 이후 4.93%입니다. 다음 거래일(9/21 월) 개장 수치를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">뉴욕증시\u003c/span>\u003c/div>\n      \u003ch4>다우·S&amp;P500·나스닥, 현지시간 9/18 소폭 혼조 마감 — 반도체주 강세가 나스닥·S&amp;P500 견인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>뉴스핌·EBN에 따르면 다우는 95.40포인트(0.18%) 내린 51,682.64로 마감했고, S&amp;P500은 12.74포인트(0.17%) 오른 7,650.50, 나스닥은 104.25포인트(0.39%) 오른 26,522.55로 각각 마감했습니다. 미 국채금리가 다시 5%를 넘어선 데다 국제유가도 높은 수준을 유지해 투자심리가 위축됐지만, 엔비디아·브로드컴·마이크론 등 반도체주가 강세를 보이며 나스닥과 S&amp;P500을 끌어올렸습니다. 필라델피아 반도체지수는 2.78% 급등했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">대미투자·웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>대미투자 국회 보고, 22일로 구체화 — 발표는 23일이 유력하다는 보도\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>SBS Biz에 따르면 기존 21~22일로 알려졌던 대미투자 국회 보고 일정이 22일로 좁혀졌고, 실제 발표는 23일이 유력한 것으로 보도됐습니다. 서울경제는 웨스팅하우스 지분 투자를 놓고 한국의 경영 참여(이사회 참여) 요구와 미국 측 입장이 여전히 이견을 좁히지 못하고 있다고 전했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">스페이스X 스타십\u003c/span>\u003c/div>\n      \u003ch4>스타십 14차 시험비행, 9/22 한국시간 오후 9시15분~10시30분 목표 — 첫 지구 궤도 진입 시도\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>SBS Biz·PPSS·이코리아에 따르면 스페이스X는 9월 22일 한국시간 오후 9시15분부터 10시30분 사이 스타십 14차 시험비행을 진행합니다. 지난 7월 준궤도 비행에 그친 13차와 달리 이번엔 지구 상공 약 275㎞ 궤도에 올려 6차례 선회 후 10시간 만에 칠레 서쪽 태평양에 착수시킬 계획이며, 신형 스타링크 V3 위성 26기를 처음으로 실제 궤도에 배치합니다. 13차 시험기에서 회수한 내열타일 2장을 재장착해 첫 타일 재사용 사례도 시도합니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>원/달러 환율, 9/19(토) 시점 정확한 수치는 검색 스니펫에서 확인되지 않음\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>오늘 검색에서는 9/19 시점의 환율 마감·기준가가 확인되지 않았습니다. 가장 최근 확인된 값은 9/18 오후 3시30분 기준 매매기준율 1,383.30원입니다. \u003cstrong>1,400원 재돌파 여부는 다음 거래일(9/21) 수치로 확인합니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">美 국채금리\u003c/span>\u003c/div>\n      \u003ch4>美 10년물 국채금리, 9/19 시점 정확한 수치는 매체 간 서술이 엇갈려 확인 보류\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>일부 검색 결과는 아시아 거래시간 중 4.96%대 거래를 언급했으나, 인용 시점과 배경 서술이 서로 다른 기사들이 섞여 있어 정확한 9/19 수치로 확정하기 어렵습니다. 가장 확실히 확인된 값은 9/17 FOMC 발표 직후의 4.93%입니다. \u003cstrong>정확한 최신 수치는 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">호르무즈 해협\u003c/span>\u003c/div>\n      \u003ch4>이란-미국 호르무즈 해협 추가 확전 여부, 오늘 검색으로는 새 사실 확인 안 됨\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>오늘 검색 스니펫에서는 9/19~20 시점의 새로운 확전 관련 사실이 확인되지 않았습니다. \u003cstrong>추가 확전 여부는 계속 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">LG이노텍 MSCI\u003c/span>\u003c/div>\n      \u003ch4>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치, 오늘도 확인되지 않음\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>오늘 검색에서도 정확한 순매수 확정치는 나오지 않았습니다. \u003cstrong>계속 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 반도체 강세는 이어졌지만, 대미투자·환율·금리는 여전히 불확실합니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">일요일 휴장 속에서도 미국 반도체주 강세와 대미투자 일정 구체화라는 두 가지 새 소식이 나왔지만, 원/달러 환율과 국채금리의 최신 수치, 호르무즈 정세는 여전히 확인되지 않았습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>안정 근거\u003c/h4>\n      \u003cp>미국 나스닥·S&amp;P500이 현지시간 9/18 반도체주 강세에 힘입어 올랐고, 필라델피아 반도체지수는 2.78% 급등했습니다. 대미투자 발표 일정도 21~22일이라는 넓은 범위에서 22일 국회보고·23일 발표로 더 구체화됐습니다.\u003c/p>\n      \u003cp class=\"src\">뉴스핌·EBN·SBS Biz · 2026-09-18~09-19\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>다우는 국채금리·유가 부담에 소폭 내렸고, 웨스팅하우스 지분 협상에서 한국의 경영 참여 요구와 미국 측 입장 차이는 여전히 좁혀지지 않았습니다. 원/달러 환율과 10년물 국채금리의 정확한 최신 수치는 확인되지 않아 불확실성이 남아 있습니다.\u003c/p>\n      \u003cp class=\"src\">서울경제·이투데이 · 2026-09-17~09-19\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>다음 거래일(9/21 월) 코스피 외국인 매수세 지속 여부와, 9/22~23으로 좁혀진 대미투자 발표·같은 날 예정된 스타십 14차 시험비행이 겹쳐 다음 주 초 증시 방향을 가를 변수로 남았습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피 외국인 매수세의 9/21 지속 여부, 대미투자 발표(9/23 유력)의 실제 이행 여부, 스페이스X 스타십 14차 시험비행 결과를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>한미 대미투자 발표.\u003c/strong> 국회 보고가 22일로 좁혀졌고 발표는 23일이 유력하다는 보도가 나온 만큼, 실제 그 일정대로 이뤄지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스피 외국인 매수 전환.\u003c/strong> 9/18 매수 전환이 다음 거래일(9/21 월)에도 이어지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>원/달러 환율.\u003c/strong> 1,383원대가 1,400원 재돌파로 이어지는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>스페이스X 스타십 14차 시험비행.\u003c/strong> 9/22 한국시간 오후 9시15분 목표 발사의 실제 결과와 방산·우주항공 테마 영향을 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치.\u003c/strong> 여전히 확인되지 않았습니다.\u003c/li>\n    \u003cli>\u003cstrong>이란-미국 호르무즈 해협 무력충돌.\u003c/strong> 추가 확전 여부를 계속 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-19", "dow": "토", "summary": "토요일인 오늘은 국내 증시 휴장일로, 가장 최근 거래일인 9/18(금) 마감 기준으로 정리합니다. 코스피는 반도체 강세와 외국인·기관 동반 매수에 힘입어 2.66% 오른 6,894.23으로 마감했고, 7거래일 연속 순매도하던 외국인은 매수로 전환했습니다(정확한 규모는 매체 간 4,206억~4,362억원으로 엇갈림). 코스닥도 0.60% 올라 827.12로 마감했습니다. 원/달러 환율은 9/18 오후 3시30분 기준 1,383.30원으로 전일과 비슷한 수준을 유지했습니다. 미국은 현지시간 9/17 다우·S&P500·나스닥이 동반 반등했고, 당초 9/18로 예정됐던 한미 대미투자 MOU 서명은 웨스팅하우스 반대로 국회 보고(9/21~22 연기)와 함께 밀렸습니다. 스페이스X 스타십 14차 시험비행은 9/22 예정(28일 연기 가능성)으로 아직 결과가 나오지 않았습니다.", "tally": {"ok": 5, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 9/18 +2.66% 6,894.23 마감, 외국인 8거래일 만에 매수 전환", "코스닥 9/18 +0.60% 827.12 마감", "한미 대미투자 MOU 9/18 서명 → 국회보고 연기로 지연"], "title": "코스피, 반도체 힘입어 6,894 마감 — 외국인 8거래일째 아닌 매수로 돌아섰다", "standfirst": "토요일인 오늘(9/19)은 국내 증시 휴장일로, 가장 최근 거래일인 금요일(9/18) 마감 수치를 기준으로 정리합니다. 코스피는 반도체 강세와 외국인·기관의 동반 매수에 힘입어 178.82포인트(2.66%) 오른 6,894.23으로 마감해 7,000선에 다시 다가섰습니다. 7거래일 연속 순매도를 이어가던 외국인은 이날 매수 우위로 전환했는데, 정확한 순매수 규모는 4,206억원(비즈니스코리아)과 4,362억원(전자신문 인용)으로 매체마다 다소 엇갈립니다. 코스닥도 4.94포인트(0.60%) 오른 827.12로 동반 상승했습니다. 서울 외환시장에서 원/달러 환율은 9/18 오후 3시30분 기준 1,383.30원으로, 전일 대비 큰 변동 없이 1,380원대 후반에서 유지됐습니다. 미국에서는 현지시간 9/17 다우·S&P500·나스닥 3대 지수가 동반 반등했고, 한미 대미투자 양해각서(MOU)는 국회 보고가 9/21~22로 미뤄지면서 당초 9/18 예정이었던 서명도 함께 지연된 것으로 확인됐습니다. 스페이스X는 스타십 14차 시험비행을 9/22 현지시간 기준으로 예고했으나 28일로 연기될 가능성도 함께 보도됐습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "머니투데이·아시아경제·비즈니스코리아·뉴스1·newspim·철강금속신문·이투데이·서울신문·파이낸셜뉴스·전자신문(2026-09-16~09-18 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 외국인 매도, 8거래일째 아닌 매수 전환으로 마무리됐습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>코스피 외국인 순매도, 8거래일 연속 이어지지 않고 매수 전환 — 예측이 빗나갔습니다\u003c/h4>\n      \u003cp>7거래일 연속 2조원대 순매도가 8거래일째로 이어지는지를 지켜보던 추적이 결론났습니다. 외국인은 9/18 오히려 매수 우위로 돌아섰습니다. 다만 정확한 순매수 규모는 \u003cstrong>4,206억원(비즈니스코리아)과 4,362억원(전자신문 인용)\u003c/strong>으로 매체마다 엇갈리고, 같은 날 기관 순매수 규모도 \u003cstrong>3조 1,675억원과 1조 5,025억원\u003c/strong>으로 격차가 커 확정치는 검증 보류로 남깁니다.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">토요일인 오늘(9/19)은 국내 증시 휴장일이라 당일 개장·마감 수치가 없습니다. 코스피·코스닥은 가장 최근 거래일인 9/18(금) 마감치로, 미국 지수는 현지시간 9/17 마감치로 표를 채웠습니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/18 마감)\u003c/td>\u003ctd class=\"num up\">6,894.23 (+2.66%)\u003c/td>\u003ctd>178.82포인트 오름, 반도체 강세·외국인 매수 전환(머니투데이·비즈니스코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/18 마감)\u003c/td>\u003ctd class=\"num up\">827.12 (+0.60%)\u003c/td>\u003ctd>4.94포인트 오름(머니투데이·뉴스1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/17 마감, 현지시간)\u003c/td>\u003ctd class=\"num up\">51,778.04 (+0.61%)\u003c/td>\u003ctd>316.14포인트 오름, 전날 FOMC 충격 되돌림(newspim 글로벌마켓리포트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/17 마감)\u003c/td>\u003ctd class=\"num up\">7,637.76 (+1.14%)\u003c/td>\u003ctd>85.95포인트 오름(newspim)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/17 마감)\u003c/td>\u003ctd class=\"num up\">26,418.30 (+1.69%)\u003c/td>\u003ctd>439.87포인트 오름(newspim)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/18, 오후 3시30분 기준)\u003c/td>\u003ctd class=\"num\">1,383.30원\u003c/td>\u003ctd>매매기준율, 전일 대비 큰 변동 없음(철강금속신문)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>외국인 코스피 순매수 (9/18)\u003c/td>\u003ctd class=\"num up\">+4,206억~4,362억원\u003c/td>\u003ctd>8거래일 만에 매도에서 매수로 전환, 정확한 규모는 매체 간 엇갈림(비즈니스코리아·전자신문)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>다음 거래일인 월요일(9/21) 개장 전까지는 국내 증시 관련 새 수치가 나오지 않습니다. 이번 주말 사이 발표되는 대미투자 국회 보고(9/21~22 예정) 일정과 겹쳐, 월요일 개장 흐름을 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 마감\u003c/span>\u003c/div>\n      \u003ch4>코스피, 9/18 178.82포인트(2.66%) 오른 6,894.23 마감 — 반도체 강세·외국인 매수 전환\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>머니투데이·아시아경제·비즈니스코리아에 따르면 코스피는 반도체 업황 개선 기대감과 기술주 중심의 강력한 매수세에 힘입어 전 거래일 대비 2.66% 오른 6,894.23으로 마감했습니다. 외국인·기관이 동반 순매수하며 지수를 끌어올렸습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 마감\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 9/18 4.94포인트(0.60%) 오른 827.12 마감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>머니투데이·뉴스1에 따르면 코스닥은 전 거래일보다 0.60% 오른 827.12로 마감해 코스피와 동반 상승했습니다. 기관 215억원, 개인 122억원 순매수, 외국인 425억원 순매도로 집계됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">외국인·기관 순매수\u003c/span>\u003c/div>\n      \u003ch4>외국인·기관 순매수 규모, 매체마다 수치가 크게 다릅니다\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>외국인 순매수는 비즈니스코리아 4,206억원, 전자신문 인용 보도 4,362억원으로 엇갈립니다. 기관 순매수는 더 크게 갈려 비즈니스코리아는 3조 1,675억원, 뉴스핌 인용 보도는 1조 5,025억원으로 두 배 넘게 차이가 납니다. \u003cstrong>정확한 확정치는 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>원/달러 환율, 9/18 오후 3시30분 기준 1,383.30원 — 전일과 비슷한 수준 유지\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>철강금속신문에 따르면 9/18 서울외환시장에서 미국 달러 매매기준율은 1달러당 1,383.30원을 기록했습니다. 전날(9/17) 마감가 1,382.2원과 큰 차이 없이 1,380원대 후반에서 등락했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">뉴욕증시\u003c/span>\u003c/div>\n      \u003ch4>다우·S&amp;P500·나스닥, 현지시간 9/17 3대 지수 동반 반등 — 나스닥 1.69%↑\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>newspim 글로벌마켓리포트에 따르면 다우는 316.14포인트(0.61%) 오른 51,778.04, S&amp;P500은 85.95포인트(1.14%) 오른 7,637.76, 나스닥은 439.87포인트(1.69%) 오른 26,418.30으로 각각 마감했습니다. 국제유가와 미 국채금리가 동반 하락하고 고용지표가 양호하게 나오면서, 전날 연준의 금리 인상 충격을 하루 만에 되돌린 것으로 보도됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">웨스팅하우스·MOU\u003c/span>\u003c/div>\n      \u003ch4>한미 대미투자 MOU, 9/18 서명도 국회 보고 연기에 따라 함께 지연 확인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>여러 매체(이투데이·서울신문·파이낸셜뉴스 등)에 따르면 정부는 9/17 예정이던 대미투자 국회 보고를 9/21~22로 연기했고, 이에 따라 9/18로 예정됐던 한미 MOU 서명도 함께 지연됐습니다. 웨스팅하우스 지분 협상에서 한국은 15% 이상 지분과 이사회 참여를 요구하는 반면 미국은 소수 지분만 검토하고 있어 이견이 계속되고 있습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">스페이스X 스타십\u003c/span>\u003c/div>\n      \u003ch4>스타십 14차 시험비행, 9/22 예정이나 아직 발사 전 — 28일 연기 가능성도 보도\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>보도에 따르면 스페이스X는 스타십 14차 시험비행에서 처음으로 지구 궤도 진입과 스타링크 V3 위성 26기 배치를 시도할 계획이며, 발사 목표일은 9/22(현지시간)로 알려졌습니다. 다만 일부 보도는 발사가 9/28로 늦춰질 수 있다고 전했습니다. \u003cstrong>실제 발사와 결과는 아직 나오지 않아 방산·우주항공 테마와의 연관성은 계속 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 반도체·매수 전환이 웃돌았지만, 수치 격차와 MOU 지연이 발목을 잡습니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피·코스닥이 동반 상승하고 외국인·기관도 매수로 돌아섰지만, 정확한 매수 규모는 매체마다 크게 엇갈립니다. 웨스팅하우스 반대로 한미 MOU 서명까지 지연되면서 대미투자를 둘러싼 불확실성은 여전히 남아 있습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>반등 근거\u003c/h4>\n      \u003cp>코스피가 반도체 강세에 2.66% 오르며 6,894.23으로 7,000선에 다시 다가섰고, 7거래일 연속 팔던 외국인도 매수로 전환했습니다. 미국 3대 지수도 현지시간 9/17 동반 반등하며 전날 금리 인상 충격을 하루 만에 되돌렸고, 원/달러 환율도 급격한 변동 없이 안정적인 흐름을 보였습니다.\u003c/p>\n      \u003cp class=\"src\">머니투데이·비즈니스코리아·newspim · 2026-09-17~09-18\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>외국인·기관의 순매수 규모가 매체마다 수천억원에서 조 단위까지 크게 엇갈려 정확한 수급 판단이 어렵습니다. 당초 9/18로 예정됐던 한미 대미투자 MOU 서명은 웨스팅하우스 반대로 국회 보고와 함께 밀렸고, 韓·美 지분율 이견도 아직 풀리지 않았습니다.\u003c/p>\n      \u003cp class=\"src\">이투데이·서울신문·전자신문 · 2026-09-16~09-18\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>외국인의 매수 전환이 다음 거래일(9/21 월)에도 이어지는지, 그리고 9/21~22로 미뤄진 국회 보고 이후 실제 MOU 서명이 이뤄지는지가 다음 주 초 증시 방향을 가를 변수로 남았습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피 외국인 매수세의 9/21 지속 여부, 한미 대미투자 MOU의 실제 서명 시점, 스페이스X 스타십 14차 시험비행 결과를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>한미 대미투자 MOU 서명.\u003c/strong> 국회 보고(9/21~22 예정) 이후 실제 언제 이뤄지는지, 웨스팅하우스 반대가 해소되는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스피 외국인 매수 전환.\u003c/strong> 9/18 매수 전환이 다음 거래일(9/21 월)에도 이어지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>원/달러 환율.\u003c/strong> 1,383원대가 1,400원 재돌파로 이어지는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>스페이스X 스타십 14차 시험비행.\u003c/strong> 9/22(또는 28일 연기) 실제 발사 결과와 방산·우주항공 테마 영향을 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치.\u003c/strong> 여전히 확인되지 않았습니다.\u003c/li>\n    \u003cli>\u003cstrong>이란-미국 호르무즈 해협 무력충돌.\u003c/strong> 추가 확전 여부를 계속 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-18", "dow": "금", "summary": "금요일인 오늘 코스피는 전날(9/17) 개장 직후 0.91% 올라 장중 6,795.53까지 올랐지만 외국인이 7거래일 연속(2조 2,318억원) 순매도하며 상승분을 반납, 2.56포인트(0.04%) 내린 6,715.41로 사실상 보합 마감했습니다. 코스닥은 기관 순매수에 힘입어 0.76% 오른 822.18로 반등을 지켜냈습니다. 원/달러 환율은 FOMC 여파로 13.6원 오른 1,382.2원에 마감해 3주 만에 1,380원대로 복귀했고, 美 10년물 국채금리는 오히려 4.93%로 내려앉아 진정되는 모습을 보였습니다. 방산·우주항공 테마가 스페이스X 스타십 기대감에 급등한 가운데, 9/18로 예정됐던 한미 대미투자 MOU 서명은 웨스팅하우스 자체의 반대로 무산·연기됐습니다.", "tally": {"ok": 5, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 9/17 -0.04% 6,715.41 마감, 외국인 7거래일 연속 순매도", "코스닥 9/17 +0.76% 822.18 마감", "웨스팅하우스 MOU 서명 9/18→무산·연기"], "title": "코스피, 오르다 되돌림에 보합 마감 — 외국인 7거래일째 팔았고 웨스팅하우스 서명은 웨스팅하우스가 막았다", "standfirst": "금요일인 오늘(9/18) 코스피는 전 거래일(9/17) 개장 직후 0.91%(61.05포인트) 오른 6,779.02로 출발해 장중 6,795.53까지 올랐지만, 외국인이 2조 2,318억원을 순매도(7거래일 연속 매도)하며 상승분을 고스란히 반납해 2.56포인트(0.04%) 내린 6,715.41로 사실상 보합 마감했습니다. 코스닥은 기관 순매수(449억원)에 힘입어 6.20포인트(0.76%) 오른 822.18로 마감해 코스피와 대조적으로 반등을 지켜냈습니다. 서울 외환시장에서 원/달러 환율은 FOMC 금리 인상 여파로 전일 대비 13.6원 오른 1,382.2원에 마감해 3주 만에 1,380원대로 복귀했습니다. 반면 美 10년물 국채금리는 FOMC 이후 진정되는 쪽으로 방향을 틀어 7bp 이상 하락한 4.93%를 기록했습니다. 코스피에서는 스페이스X의 스타십 시험비행 기대감에 방산·우주항공 테마가 전방위 급등해 비츠로테크가 상한가를 기록했습니다. 이 시리즈가 추적해온 웨스팅하우스 지분 협상은 9/18로 예정됐던 한미 대미투자 양해각서(MOU) 서명이 다른 누구도 아닌 웨스팅하우스 자체의 반대로 무산되며 새로운 국면을 맞았습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "위키트리·비즈니스코리아·머니투데이·뉴스핌·아시아경제·국제뉴스·이투데이·서울경제·서울신문·한국일보·CNBC·서플·SBS Biz(2026-09-16~09-18 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 지수는 보합·반등으로 갈렸고, 웨스팅하우스 서명은 웨스팅하우스 자신이 막았습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>코스피·코스닥 9/17 마감 확인 — 코스피는 상승분 반납, 코스닥은 반등 지켜냄\u003c/h4>\n      \u003cp>FOMC 금리인상 이후 첫 거래일 반응이 어땠는지를 지켜보던 추적이 결론났습니다. 코스피는 개장 직후 0.91% 올라 장중 6,795.53까지 올랐지만 외국인이 2조 2,318억원을 순매도(7거래일 연속)하며 상승분을 반납, \u003cstrong>2.56포인트(0.04%) 내린 6,715.41\u003c/strong>로 사실상 보합 마감했습니다. 코스닥은 기관 순매수(449억원)에 힘입어 \u003cstrong>6.20포인트(0.76%) 오른 822.18\u003c/strong>로 마감해 반등을 지켜냈습니다(위키트리·머니투데이·비즈니스코리아).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>美 10년물 국채금리, FOMC 이후 진정 — 4.93%로 하락\u003c/h4>\n      \u003cp>FOMC 이후 국채금리가 계속 오르는지 진정되는지를 지켜보던 추적이 결론났습니다. 10년물은 오히려 7bp 이상 하락한 \u003cstrong>4.93%\u003c/strong>로 5%대 아래로 내려왔고, 30년물도 6bp 내린 5.282%, 2년물은 5bp 내린 4.67%를 기록했습니다. 다만 국내 국고채 3년물은 3.7bp 오른 4.090%로 반대 방향을 보여 \u003cstrong>한미 금리 흐름은 엇갈렸습니다\u003c/strong>(CNBC·서플).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>웨스팅하우스 지분 협상, 9/18 MOU 서명 결국 웨스팅하우스 반대로 무산·연기\u003c/h4>\n      \u003cp>韓 '15%+의결권' vs 美 '5~10%' 이견의 절충안이 언제 나오는지를 지켜보던 추적이 결론났습니다. 당초 9/18로 알려졌던 한미 대미투자 양해각서(MOU) 서명이 정부도 미국도 아닌 \u003cstrong>웨스팅하우스 자체의 반대\u003c/strong>로 막판 무산됐습니다. 정부는 9/17 예정이던 국회 보고도 21~22일로 미뤘고, 텍사스 엔시날 LNG 발전소의 전력판매가격 미확정도 새로운 걸림돌로 확인됐습니다(이투데이·서울경제).\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">금요일인 오늘(9/18) 코스피·코스닥의 당일 개장·마감 수치는 검색 시점 기준 확인되지 않아, 가장 최근 확정 마감인 9/17 종가로 표를 채웠습니다. 미국 지수는 가장 최근 마감인 현지시간 9/16 기준입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/17 마감)\u003c/td>\u003ctd class=\"num down\">6,715.41 (-0.04%)\u003c/td>\u003ctd>2.56포인트 내림, 장중 6,795.53까지 올랐다가 외국인 매도에 반납(위키트리·머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/17 마감)\u003c/td>\u003ctd class=\"num up\">822.18 (+0.76%)\u003c/td>\u003ctd>6.20포인트 오름, 기관 순매수가 견인(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/16 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">51,461.90 (-1.21%)\u003c/td>\u003ctd>631.21포인트 내림, 금리 인상 이후 매파 발언에 하락(서울신문)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/16 마감)\u003c/td>\u003ctd class=\"num down\">25,978.43 (-0.01%)\u003c/td>\u003ctd>3.15포인트 내림, 사실상 보합(서울신문)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>필라델피아 반도체지수 (9/16 마감)\u003c/td>\u003ctd class=\"num up\">11,246.11 (+0.63%)\u003c/td>\u003ctd>70.56포인트 오름, 반도체 상대적 선방(마켓인)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/17, FOMC 이후)\u003c/td>\u003ctd class=\"num\">4.93%\u003c/td>\u003ctd>7bp 이상 하락, 5%대 아래로 진정(CNBC)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/17 마감)\u003c/td>\u003ctd class=\"num down\">1,382.2원 (+13.6원)\u003c/td>\u003ctd>3주 만에 1,380원대 복귀(파이낸셜뉴스·머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>외국인 코스피 순매도 (9/17)\u003c/td>\u003ctd class=\"num\">-2조 2,318억원\u003c/td>\u003ctd>7거래일 연속 순매도(뉴스핌)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>코스피·코스닥의 9/18 당일 개장·마감 수치는 검색 시점 기준 확인되지 않아 9/17 확정 마감치로 표를 채웠습니다. 오늘 실제 등락은 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 마감\u003c/span>\u003c/div>\n      \u003ch4>코스피, 9/17 2.56포인트(0.04%) 내린 6,715.41로 사실상 보합 마감 — 외국인 7거래일 연속 순매도\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>위키트리·머니투데이에 따르면 코스피는 개장 직후 0.91%(61.05포인트) 오른 6,779.02로 출발해 장중 6,795.53까지 올랐으나, 외국인이 2조 2,318억원을 순매도(7거래일 연속)하며 오후 들어 상승분을 반납했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 마감\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 9/17 6.20포인트(0.76%) 오른 822.18로 마감 — 기관 순매수가 견인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>아시아경제·머니투데이에 따르면 코스닥은 기관 투자자가 449억원 순매수를 이어가며 지수 상승을 이끌었고, 개인과 외국인은 각각 251억원·338억원을 순매도했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>원/달러 환율, 9/17 13.6원 오른 1,382.2원 마감 — 3주 만에 1,380원대 복귀\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스·머니투데이에 따르면 서울 외환시장에서 원/달러 환율은 전 거래일 대비 13.6원 오른 1,382.2원에 마감했습니다. 지난 8월 27일(1,380.9원) 이후 3주 만에 1,380원대로 돌아온 것으로, FOMC 금리 인상 여파로 풀이됩니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">美 국채금리\u003c/span>\u003c/div>\n      \u003ch4>美 10년물 국채금리, FOMC 이후 오히려 4.93%로 하락 — 5%대 아래로 진정\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>CNBC에 따르면 FOMC의 금리 인상 발표 이후 10년물 국채금리는 7bp 이상 하락한 4.93%를 기록했습니다. 30년물은 6bp 내린 5.282%, 2년물은 5bp 내린 4.67%로 장기물 중심으로 진정되는 모습을 보였습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">테마주 동향\u003c/span>\u003c/div>\n      \u003ch4>방산·우주항공 테마 전방위 급등 — 비츠로테크 상한가, 스페이스X 스타십 기대감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>뉴스핌·이투데이에 따르면 9/17 코스피에서 우주항공국방 업종이 5.33%, 조선 업종이 5.00% 오르는 등 방산·우주항공 테마가 강세를 보였습니다. 비츠로테크는 상한가(+30.00%), 나라스페이스테크는 29.92% 올랐고, 스페이스X의 스타십 시험비행 기대감이 배경으로 꼽혔습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">서명 무산\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>한미 대미투자 MOU, 9/18 서명 예정이었으나 웨스팅하우스 반대로 연기\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이투데이·서울경제에 따르면 당초 9/18로 알려졌던 한미 대미투자 양해각서 서명이 웨스팅하우스 자체의 반대로 무산됐습니다. 정부는 9/17 예정이던 국회 보고도 21~22일로 미뤘고, 텍사스 엔시날 발전소의 전력판매가격 미확정도 걸림돌로 지목됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">LG이노텍 MSCI\u003c/span>\u003c/div>\n      \u003ch4>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치, 오늘도 확인되지 않음\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>오늘 검색에서도 정확한 순매수 확정치는 나오지 않았습니다. 다만 9/1 시장 전체적으로 외국인이 1,329억원을 순매도했고 LG이노텍이 하락 폭이 큰 종목 중 하나로 언급돼, 앞서 추정됐던 785억~4,390억원 규모의 패시브 유입이 그대로 실현되지는 않은 것으로 보입니다. \u003cstrong>정확한 확정치는 계속 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip neutral\">검증 보류\u003c/span>\u003cspan class=\"src\">호르무즈 해협\u003c/span>\u003c/div>\n      \u003ch4>호르무즈 해협 추가 확전 여부, 오늘 검색으로는 새로운 사실 확인 안 됨\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>오늘 검색 스니펫에서는 9/17~18 시점의 새로운 확전 관련 사실이 확인되지 않았습니다. \u003cstrong>추가 확전 여부는 계속 검증 보류로 남깁니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 지수 되돌림·외국인 매도와, 금리 진정·테마 강세가 부딪힙니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피가 장중 상승분을 반납하고 보합 마감한 반면 코스닥은 반등을 지켰고, 국채금리는 FOMC 이후 오히려 진정됐습니다. 그러나 외국인의 7거래일 연속 순매도와 웨스팅하우스발 MOU 서명 연기가 새로운 불확실성으로 남았습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>진정 근거\u003c/h4>\n      \u003cp>美 10년물 국채금리가 FOMC 이후 오히려 4.93%로 내려앉아 5%대 부담이 줄었고, 코스닥은 기관 순매수에 힘입어 반등을 지켜냈습니다. 필라델피아 반도체지수도 소폭이나마 오르며 반도체 업종이 선방했고, 방산·우주항공 테마는 스페이스X 스타십 기대감에 강하게 반응했습니다.\u003c/p>\n      \u003cp class=\"src\">CNBC·아시아경제·마켓인·뉴스핌 · 2026-09-16~09-17\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>코스피는 장중 6,795.53까지 오르고도 외국인이 7거래일 연속 2조원대를 순매도하며 상승분을 모두 반납했습니다. 원/달러 환율은 3주 만에 1,380원대로 재상승했고, 웨스팅하우스 지분 협상은 정부·미국이 아닌 웨스팅하우스 자체의 반대로 9/18 서명이 무산되며 새로운 불확실성이 생겼습니다.\u003c/p>\n      \u003cp class=\"src\">뉴스핌·파이낸셜뉴스·이투데이·서울경제 · 2026-09-17\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>외국인의 코스피 순매도가 7거래일째로 이어진 가운데, 이 매도세가 8거래일째로 연장되는지와 웨스팅하우스발 MOU 서명이 언제 다시 추진되는지가 다음 거래일의 방향을 가를 변수로 남았습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피 외국인 순매도 지속 여부, 한미 대미투자 MOU 재추진 시점, 원/달러 환율의 1,400원 재돌파 여부를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>한미 대미투자 MOU 서명.\u003c/strong> 국회 보고(9/21~22 예정) 이후 실제 언제 이뤄지는지, 웨스팅하우스 반대가 해소되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>코스피 외국인 순매도.\u003c/strong> 7거래일 연속 매도가 8거래일째로 이어지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>원/달러 환율.\u003c/strong> 1,382원대가 1,400원 재돌파로 이어지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>방산·우주항공 테마.\u003c/strong> 스페이스X 스타십 시험비행 결과 이후에도 강세가 지속되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치.\u003c/strong> 여전히 확인되지 않았습니다.\u003c/li>\n    \u003cli>\u003cstrong>이란-미국 호르무즈 해협 무력충돌.\u003c/strong> 추가 확전 여부를 계속 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-17", "dow": "목", "summary": "목요일인 오늘 새벽 연준은 기준금리를 3.75~4.00%로 0.25%p 인상해 3년 2개월 만에 첫 인상을 단행했습니다. 코스피는 전날(9/16) 4거래일 만에 반등해 1.37% 오른 6,717.97로 마감했지만, 같은 시각 미국은 금리 인상과 워시 의장의 매파 발언에 다우가 1.21% 내리는 등 3대 지수가 동반 하락했습니다. 10년물 국채금리는 인상 후에도 진정되지 않고 장중 5.04%까지 재상승했고, 美-이란 휴전 종료 선언은 실제로 호르무즈 해협 무력충돌로 이어졌습니다. 웨스팅하우스 지분 협상은 韓 '15%+의결권'과 美 '5~10%'로 이견이 구체화됐습니다.", "tally": {"ok": 6, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "FOMC 0.25%p 인상, 기준금리 3.75~4.00%", "코스피 9/16 +1.37% 6,717.97 마감", "다우 9/16 현지시간 -1.21%, 국채금리 장중 5.04%"], "title": "연준, 3년 2개월 만에 기준금리 인상 — 코스피는 반등했지만 국채금리·호르무즈는 더 얼어붙었다", "standfirst": "목요일인 오늘(9/17) 새벽 3시(한국시간) 연준은 기준금리를 3.50~3.75%에서 3.75~4.00%로 0.25%p 인상한다고 발표했습니다. 2023년 7월 이후 3년 2개월 만의 인상으로, 위원 만장일치 결정이었고 점도표는 연내 추가 인상 가능성까지 시사했습니다. 국내 증시는 이 발표 전인 9/16 4거래일 만에 반등해 코스피가 1.37%(90.71포인트) 오른 6,717.97로, 코스닥이 0.44%(3.57포인트) 오른 815.98로 각각 마감했습니다. 그러나 같은 날(현지시간 9/16) 뉴욕 증시는 금리 인상과 워시 연준의장의 매파적 기자회견에 다우 1.21%, S&P500 0.45%가 내렸고, 10년물 국채금리는 인상 이후에도 진정되지 않고 장중 5.04%까지 재상승했습니다. 이 시리즈가 추적해온 美-이란 휴전 종료 선언은 실제로 호르무즈 해협 무력충돌로 격화됐고, 웨스팅하우스 지분 협상은 韓 '15%+의결권'과 美 '5~10%'로 이견이 구체적인 수치로 드러났습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "아시아경제·데일리안·한국경제TV·CBC뉴스·국제뉴스·베타뉴스·토큰포스트·뉴데일리·헤럴드경제·서울신문·Investing.com(2026-09-16~09-17 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — FOMC는 예상대로 인상, 이란은 실제 무력충돌로 격화됐습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>9월 FOMC, 3년 2개월 만에 기준금리 0.25%p 인상 — 3.75~4.00%로 확정\u003c/h4>\n      \u003cp>매체별로 58~92%까지 엇갈렸던 인상 확률 추적이 오늘 결론났습니다. 연준은 한국시간 9/17 오전 3시 발표에서 기준금리를 3.50~3.75%에서 \u003cstrong>3.75~4.00%로 0.25%p 인상\u003c/strong>했습니다. 2023년 7월 이후 첫 인상이며 위원 만장일치 결정이었습니다. 점도표는 18명 중 12명이 연내 1회 추가 인상, 4명이 2회 추가 인상을 제시해 매파적 색채가 뚜렷했습니다(토큰포스트·뉴데일리).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>美 10년물 국채금리, 진정은커녕 장중 5.04%까지 재차 상승\u003c/h4>\n      \u003cp>FOMC 결정 직후 국채금리가 진정되는지를 지켜보던 추적이 결론났습니다. 10년물은 인상 발표 이후 5.01%로 마감했고 장중에는 \u003cstrong>5.04%\u003c/strong>까지 올랐습니다. 2년물도 4.67%에서 4.73%로 상승했습니다. 다만 이 고점의 의미를 두고 매체마다 '2007년 7월 이후'와 '2023년 10월 이후' 최고치로 서로 다르게 설명해 정확한 기준은 검증 보류로 남습니다(국제뉴스·베타뉴스).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>美-이란 휴전 종료 선언, 끝내 호르무즈 해협 실제 무력충돌로 이어졌습니다\u003c/h4>\n      \u003cp>트럼프 대통령의 휴전 종료 선언 이후를 지켜보던 추적이 결론났습니다. 호르무즈 해협의 통제권을 명확히 정리하지 못했던 종전 양해각서(MOU)가 결국 깨졌고, 이란이 해협을 지나는 민간 유조선을 공격하자 미국이 이를 위반으로 규정해 이란 내 군사시설을 공습했습니다. \u003cstrong>정확한 공격 일자는 매체에서 '지난 7일'로만 확인돼 세부 시점은 검증 보류\u003c/strong>입니다(헤럴드경제).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>삼성전자·SK하이닉스 美 현지 팹, 대미투자 1호 제외 이후 별도 협상은 진행 중\u003c/h4>\n      \u003cp>대미투자 1호 프로젝트(텍사스 가스발전소)에서 빠졌던 반도체 메모리 팹 투자가 이후 어떻게 되는지를 지켜보던 추적이 일부 결론났습니다. SK하이닉스가 인텔과 미국 내 메모리 생산을 협의 중이라는 보도가 나왔고, 최태원 회장도 미국 전공정 팹 건설 의향을 밝혔습니다. \u003cstrong>다만 최종 투자 결정은 아직 나오지 않았습니다\u003c/strong>(서울신문·헤럴드경제).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>웨스팅하우스 지분 구조, 韓 '15%+의결권' vs 美 '5~10%'로 이견 구체화\u003c/h4>\n      \u003cp>지분 인수 구조와 이사회 참여 여부를 지켜보던 추적도 일부 진전됐습니다. 한국은 지분 15%와 의결권 확보를 목표로 하는 반면, 미국은 5~10%대의 비의결권에 가까운 지분만 검토하는 것으로 보도돼 막판 신경전이 벌어지고 있습니다. \u003cstrong>최종 구조는 여전히 미확정\u003c/strong>입니다(서울신문·한국경제).\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">목요일인 오늘(9/17) 코스피·코스닥의 당일 개장·마감 수치는 검색 시점 기준 확인되지 않아, 가장 최근 확정 마감인 9/16 종가로 표를 채웠습니다. 미국 지수는 FOMC 발표가 있었던 현지시간 9/16 마감 기준입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/16 마감)\u003c/td>\u003ctd class=\"num up\">6,717.97 (+1.37%)\u003c/td>\u003ctd>90.71포인트 오름, 반도체 저가매수에 상승폭 확대 마감(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/16 마감)\u003c/td>\u003ctd class=\"num up\">815.98 (+0.44%)\u003c/td>\u003ctd>3.57포인트 오름(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/16 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">51,461.90 (-1.21%)\u003c/td>\u003ctd>631.21포인트 내림, 금리 인상에 하락(데일리안·한국경제TV)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/16 마감)\u003c/td>\u003ctd class=\"num down\">7,551.81 (-0.45%)\u003c/td>\u003ctd>33.92포인트 내림(데일리안)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/16 마감)\u003c/td>\u003ctd class=\"num down\">25,978.43 (-0.01%)\u003c/td>\u003ctd>3.15포인트 내림, 사실상 보합(데일리안·CBC뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/16 결정 직후)\u003c/td>\u003ctd class=\"num\">5.01% / 장중 5.04%\u003c/td>\u003ctd>금리 인상 이후 오히려 상승(국제뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 2년물 국채금리\u003c/td>\u003ctd class=\"num\">4.67% → 4.73%\u003c/td>\u003ctd>금리 인상 반영(국제뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 기준금리\u003c/td>\u003ctd class=\"num\">3.75~4.00%\u003c/td>\u003ctd>0.25%p 인상, 2023년 7월 이후 첫 인상(토큰포스트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/17, 실시간)\u003c/td>\u003ctd class=\"num\">1,355.76원\u003c/td>\u003ctd>전일 종가 1,347.03원, 오늘 변동범위 1,345.24~1,356.99원(Investing.com)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>코스피·코스닥의 9/17 당일 개장·마감 수치는 검색 시점 기준 확인되지 않아 9/16 확정 마감치로 표를 채웠습니다. FOMC 금리 인상 이후 첫 국내 거래일 반응은 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 마감\u003c/span>\u003c/div>\n      \u003ch4>코스피, 9/16 90.71포인트(1.37%) 오른 6,717.97로 마감 — 4거래일 연속 하락 이후 반등\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>아시아경제에 따르면 코스피는 전 거래일(6,627.26) 대비 1.37% 오른 6,717.97로 마감했습니다. 전날 지나친 낙폭이라는 판단에 삼성전자·SK하이닉스 등 반도체 대형주로 저가 매수세가 유입된 영향으로 보도됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스닥 마감\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 9/16 3.57포인트(0.44%) 오른 815.98로 마감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>아시아경제에 따르면 코스닥은 전 거래일(812.41) 대비 0.44% 오른 815.98로 마감해 코스피와 함께 동반 반등했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">뉴욕증시\u003c/span>\u003c/div>\n      \u003ch4>다우·S&amp;P500·나스닥, 현지시간 9/16 3대 지수 동반 하락 — 다우 1.21%↓\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>데일리안·한국경제TV·CBC뉴스에 따르면 다우는 631.21포인트(1.21%) 내린 51,461.90, S&amp;P500은 33.92포인트(0.45%) 내린 7,551.81, 나스닥은 3.15포인트(0.01%) 내린 25,978.43으로 각각 마감했습니다. 워시 연준의장이 기자회견에서 \"인플레이션 위험이 개선되지 않고 있다\"고 매파적으로 발언하자 지수가 낙폭을 키운 것으로 보도됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">FOMC\u003c/span>\u003c/div>\n      \u003ch4>연준, 기준금리 0.25%p 인상 — 3.75~4.00%로 확정\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>토큰포스트·뉴데일리에 따르면 연준은 한국시간 9/17 오전 3시 발표에서 기준금리를 3.50~3.75%에서 3.75~4.00%로 0.25%p 인상했습니다. 2023년 7월 이후 3년 2개월 만의 인상이며 위원 만장일치 결정이었습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">수치 엇갈림\u003c/span>\u003cspan class=\"src\">美 국채금리\u003c/span>\u003c/div>\n      \u003ch4>10년물 국채금리, 금리 인상 후에도 5%대 유지 — 최고치 기준은 매체마다 다름\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>국제뉴스·베타뉴스에 따르면 10년물 국채금리는 금리 인상 직후 5.01%로 마감했고 장중 5.04%까지 올랐습니다. 다만 이 수준을 국제뉴스는 '2007년 7월 이후 최고치'로 설명한 반면, 앞선 보고서가 인용한 ZDNet코리아는 같은 주의 고점(장중 5.014%)을 '2023년 10월 이후 최고치'로 설명해 \u003cstrong>기준 시점이 매체마다 엇갈립니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>원/달러, 오늘 1,355원대 거래 — 전일 종가는 1,347.03원으로 확인\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>Investing.com에 따르면 원/달러 환율은 현재 1,355.76원에 거래되고 있으며 전일 종가는 1,347.03원, 오늘 변동범위는 1,345.24~1,356.99원입니다. 지난 보고서가 검증 보류로 남겼던 9/16 환율(1,347원대 추정)이 오늘 데이터로 재확인됐습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">이견 지속\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>지분 협상, 韓 '15%+의결권' vs 美 '5~10%'로 막판 신경전\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>서울신문·한국경제에 따르면 한국은 웨스팅하우스 지분 15%와 의결권 확보를 목표로 하는 반면, 미국은 5~10%대의 비의결권에 가까운 지분만 검토하는 것으로 보도됐습니다. \u003cstrong>이사회 참여 여부를 둘러싼 이견이 구체적인 수치로 드러났고, 최종 구조는 여전히 미확정입니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">확전\u003c/span>\u003cspan class=\"src\">이란·호르무즈\u003c/span>\u003c/div>\n      \u003ch4>美-이란 휴전 종료 이후, 호르무즈 해협서 실제 무력충돌 발생\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>헤럴드경제에 따르면 미·이란 종전 양해각서(MOU)가 호르무즈 해협 통제권 문제를 정리하지 못한 채 깨졌고, 이란이 해협을 지나는 민간 유조선을 공격하자 미국이 이란 내 군사시설을 공습했습니다. \u003cstrong>정확한 공격 일자는 '지난 7일'로만 확인돼 세부 시점은 검증 보류\u003c/strong>입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">반도체 대미투자\u003c/span>\u003c/div>\n      \u003ch4>SK하이닉스, 인텔과 美 현지 메모리 생산 협의 진행\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>서울신문에 따르면 SK하이닉스가 인텔과 미국 내 메모리 생산을 협의 중인 것으로 보도됐습니다. 최태원 SK그룹 회장도 미국 전공정 팹 건설 의향을 밝히며 여러 지역을 조사하고 있다고 언급했습니다. \u003cstrong>다만 최종 투자 결정은 아직 나오지 않았습니다.\u003c/strong>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 금리 인상 후 되돌림 기대와, 채권·지정학 경계감이 부딪힙니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피는 9/16 반도체 저가매수로 4거래일 만에 반등했지만, 같은 시각 미국은 실제 금리 인상과 매파적 발언에 3대 지수가 동반 하락했습니다. FOMC라는 최대 변수는 해소됐지만 국채금리·지정학 리스크라는 다음 변수가 곧바로 이어졌습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>반등 근거\u003c/h4>\n      \u003cp>코스피·코스닥은 9/16 전날 급락을 되돌리며 동반 반등했고, 그동안 이 시리즈가 추적해온 FOMC 불확실성도 오늘 결정으로 해소됐습니다. 대미투자 1호 프로젝트에 이어 반도체 메모리 팹도 SK하이닉스-인텔 협의로 별도 진행되고 있어 협상 관련 불확실성이 순차적으로 줄어드는 모습입니다.\u003c/p>\n      \u003cp class=\"src\">아시아경제·서울신문·헤럴드경제 · 2026-09-16~09-17\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>금리 인상 직후에도 美 10년물 국채금리는 진정되지 않고 장중 5.04%까지 재차 상승했고, 점도표는 연내 추가 인상 가능성까지 시사했습니다. 뉴욕 3대 지수는 워시 의장의 매파 발언에 동반 하락했고, 같은 시점 호르무즈 해협에서는 실제 무력충돌이 발생해 유가·안전자산 수요를 자극할 수 있는 지정학 변수가 새로 불거졌습니다.\u003c/p>\n      \u003cp class=\"src\">데일리안·국제뉴스·헤럴드경제 · 2026-09-16~09-17\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>FOMC라는 최대 변수가 해소된 직후에도 국채금리가 더 오르고 지정학 리스크까지 겹치면서, 국내 증시가 9/16의 반등을 이어갈지 다시 시험대에 놓였습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 코스피·코스닥 9/17 최종 마감 수치, 美 10년물 국채금리의 FOMC 이후 추가 흐름, 호르무즈 해협 확전 여부를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피·코스닥 9/17 최종 마감 수치.\u003c/strong> FOMC 금리인상 이후 첫 거래일 반응, 9/16 반등이 이어지는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>美 10년물 국채금리 흐름.\u003c/strong> FOMC 이후에도 이어진 상승세가 계속되는지, 진정되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 협상.\u003c/strong> 韓 '15%+의결권'과 美 '5~10%' 사이 절충안이 언제 나오는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>이란-미국 호르무즈 해협 무력충돌.\u003c/strong> 추가 확전 여부와 유가·안전자산 시장 영향을 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>삼성전자·SK하이닉스 美 현지 메모리 팹 투자.\u003c/strong> SK하이닉스-인텔 협의의 결론 시점을 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>LG이노텍 MSCI 리밸런싱 실제 외국인 순매수 확정치.\u003c/strong> 여전히 확인되지 않았습니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-16", "dow": "수", "summary": "수요일인 오늘 코스피는 전날(9/15) 0.85% 내린 6,627.26으로 마감해 9/10 이후 4거래일 연속 하락했고, 코스닥은 반대로 0.70% 올라 812.41로 마감했습니다. 미국 3대 지수는 AI 감속론에 반도체 관련주가 위축되며 동반 하락했고, 美 10년물 국채금리는 장중 5.014%까지 올라 2023년 10월 이후 최고치를 기록했습니다. 9월 FOMC 인상 확률은 92.4%까지 재상승했습니다. 지난 보고서가 추적하던 항목 중 반도체 대미투자 1호 프로젝트는 텍사스 엔시날 가스발전소(총사업비 223억달러)로 확정됐고, 웨스팅하우스 지분 인수는 구조가 부분적으로 드러났지만 여전히 미정입니다.", "tally": {"ok": 5, "warn": 4, "bad": 0}, "kicker": ["자동생성·검색기반", "코스피 9/15 -0.85% 마감 6,627.26, 4거래일 연속 하락", "코스닥 9/15 +0.70% 812.41로 반등", "美 10년물 금리 장중 5.014%, 마감 4.987%"], "title": "코스피 4거래일 연속 하락 마감, 코스닥은 나홀로 반등 — 대미투자 1호는 텍사스 발전소로 확정", "standfirst": "수요일인 오늘(9/16) 코스피는 전날(9/15) 전 거래일(6,684.37) 대비 57.11포인트(0.85%) 내린 6,627.26으로 마감해 9/10 이후 4거래일 연속 하락을 이어갔습니다. 코스닥은 같은 날 5.62포인트(0.70%) 오른 812.41로 마감해 코스피와 대조적으로 반등했습니다. 미국 증시는 현지시간 9/14 다우 152.09포인트(0.29%), S&P500 37.00포인트(0.48%), 나스닥 146.62포인트(0.56%) 등 3대 지수가 동반 하락했는데, AI 기업 수장들의 개발 속도 조절 촉구 발언에 반도체 관련주가 위축된 영향으로 보도됐습니다. 美 10년물 국채금리는 9/14(현지시간) 장중 5.014%까지 올라 2023년 10월 이후 최고치를 기록한 뒤 4.987%로 마감했고, 9월 FOMC(9/15~16, 결과는 한국시간 9/17 새벽 발표) 0.25%p 인상 확률은 CME 페드워치 기준 92.4%까지 재상승했습니다. 지난 보고서가 추적하던 항목 중 5건이 오늘 결론나거나 진전됐는데, 한미 반도체 대미투자 1호 프로젝트는 텍사스 엔시날 가스복합화력발전소(총사업비 223억달러)로 최종 확정됐고, 웨스팅하우스 지분 인수는 브룩필드 지분 매입과 신주 인수 두 방식이 동시에 논의되고 있는 것으로 확인됐지만 최종 구조는 여전히 미정입니다. 원/달러 환율은 매체 간 상충되던 수치 중 1,347원대 쪽에 조금 더 가까운 흐름이 이어지는 것으로 보이나 정확한 종가는 여전히 검증 보류입니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "firebat.co.kr·뉴스핌·이투데이·헤럴드경제·EBN·CBC뉴스·ZDNet코리아·쿠키뉴스·네이트뉴스·한국경제·Investing.com(2026-09-14~09-16 스니펫 기준)", "body": "\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 반도체 대미투자 1호는 확정, 웨스팅하우스 구조는 부분적으로만 드러났습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>반도체 대미투자 1호 프로젝트, 텍사스 엔시날 가스발전소로 최종 확정\u003c/h4>\n      \u003cp>9/6 보고서가 추적 대상으로 걸어둔 대미투자 1호 프로젝트가 오늘 확인됐습니다. 한미 3,500억달러 대미투자의 첫 사업은 텍사스 엔시날 가스복합화력발전소(설비용량 약 6.3GW)로 최종 확정됐고, 총사업비는 미국 측의 250억달러 증액 요구를 거쳐 \u003cstrong>223억달러\u003c/strong>로 합의됐습니다. 다만 러트닉 美 상무장관이 요구해온 반도체 메모리 팹 투자는 이번 프로젝트에 포함되지 않았습니다(이투데이·헤럴드경제·EBN).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>웨스팅하우스 지분 인수, 두 가지 방식이 동시에 논의 중이나 구조는 여전히 미정\u003c/h4>\n      \u003cp>9/6·9/12 보고서가 추적하던 웨스팅하우스 지분 인수 구조는 브룩필드 보유 지분(약 51%) 매입과 신주 인수(IPO) 두 방식이 함께 논의되는 것으로 확인됐습니다. 초기 원자로 4기를 AP1000 2기·APR1400 2기로 나누는 데 공감대가 형성됐다는 보도도 나왔습니다. 그러나 \u003cstrong>산업통상부는 9/15 해명자료를 통해 구체적인 사항은 아직 정해진 바 없다고 재확인\u003c/strong>했고, 원전 8기 관련 별도 합의문 서명도 이뤄지지 않았습니다(한국경제·쿠키뉴스·네이트뉴스).\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>코스피 9/15 마감, 하락은 이어졌지만 반등 전환은 없었음\u003c/h4>\n      \u003cp>9/15 보고서는 개장 하락(6,659.25, -0.38%)이 마감까지 이어지는지, 반도체 저가매수에 반등 전환되는지를 추적 대상으로 걸어뒀습니다. 확인해보니 코스피는 마감까지 낙폭이 오히려 커져 57.11포인트(0.85%) 내린 \u003cstrong>6,627.26\u003c/strong>으로 마감했습니다. \u003cstrong>하락 지속 예측은 맞았지만 반등 전환은 이뤄지지 않았고\u003c/strong>, 9/10 이후 4거래일 연속 하락으로 이어졌습니다. 6,600선은 간신히 지켜졌습니다(firebat 마감시황).\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">수요일인 오늘(9/16) 오전 검색 시점 기준 국내 지수의 당일 개장·장중 수치는 신뢰할 수 있는 스니펫으로 확인되지 않아, 가장 최근 확정 마감인 9/15 종가로 표를 채웠습니다. 미국 지수도 가장 최근 마감인 현지시간 9/14 기준입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/15 마감)\u003c/td>\u003ctd class=\"num down\">6,627.26 (-0.85%)\u003c/td>\u003ctd>57.11포인트 내림, 9/10 이후 4거래일 연속 하락(firebat 마감시황)\u003c/td>\u003c/tr>\n        \
