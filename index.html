<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
</head>
<body>
<title>대조실 — 스레드 주식 계정 주장 검증</title>

<style>
  :root {
    --ground:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF1F6;
    --ink:#131820; --ink-2:#3A4453; --muted:#66717F;
    --line:#DCE2EB; --line-2:#C6CFDB;
    --accent:#1E3E6B; --accent-soft:#E8EEF7;
    --ok:#16745A; --ok-soft:#E3F1EC;
    --warn:#90650B; --warn-soft:#F7EEDA;
    --bad:#A93529; --bad-soft:#F8E7E4;
    --up:#C4362A; --down:#2A5C9F;
    --shadow:0 1px 2px rgba(19,24,32,.05), 0 12px 28px -22px rgba(19,24,32,.35);
    --sans:-apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Segoe UI, Roboto, sans-serif;
    --mono:ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", Consolas, "Malgun Gothic", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0C1015; --surface:#141A22; --surface-2:#1B222C;
      --ink:#E7ECF3; --ink-2:#B9C3D0; --muted:#8692A2;
      --line:#242D39; --line-2:#33404F;
      --accent:#82A9DF; --accent-soft:#172436;
      --ok:#4BBF97; --ok-soft:#12271F;
      --warn:#D8A63F; --warn-soft:#2A2313;
      --bad:#E0796B; --bad-soft:#2C1815;
      --up:#E8695A; --down:#6C9EE0;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -24px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0C1015; --surface:#141A22; --surface-2:#1B222C;
    --ink:#E7ECF3; --ink-2:#B9C3D0; --muted:#8692A2;
    --line:#242D39; --line-2:#33404F;
    --accent:#82A9DF; --accent-soft:#172436;
    --ok:#4BBF97; --ok-soft:#12271F;
    --warn:#D8A63F; --warn-soft:#2A2313;
    --bad:#E0796B; --bad-soft:#2C1815;
    --up:#E8695A; --down:#6C9EE0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -24px rgba(0,0,0,.9);
  }
  :root[data-theme="light"] {
    --ground:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF1F6;
    --ink:#131820; --ink-2:#3A4453; --muted:#66717F;
    --line:#DCE2EB; --line-2:#C6CFDB;
    --accent:#1E3E6B; --accent-soft:#E8EEF7;
    --ok:#16745A; --ok-soft:#E3F1EC;
    --warn:#90650B; --warn-soft:#F7EEDA;
    --bad:#A93529; --bad-soft:#F8E7E4;
    --up:#C4362A; --down:#2A5C9F;
    --shadow:0 1px 2px rgba(19,24,32,.05), 0 12px 28px -22px rgba(19,24,32,.35);
  }

  body { background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.68; letter-spacing:-.011em; -webkit-font-smoothing:antialiased; }
  p { margin:0; text-wrap:pretty; }
  strong { font-weight:700; color:var(--ink); }
  em { font-style:normal; background:var(--accent-soft); padding:0 4px; border-radius:3px; }

  .shell { max-width:1180px; margin:0 auto; padding:0 22px 90px; }
  .cols { display:grid; grid-template-columns:250px 1fr; gap:38px; align-items:start; }

  .side-rail { position:sticky; top:0; padding:30px 0 24px; display:flex; flex-direction:column; gap:20px; max-height:100vh; overflow-y:auto; }
  .logo { display:flex; flex-direction:column; gap:3px; padding-bottom:15px; border-bottom:2px solid var(--ink); }
  .logo b { font-size:22px; font-weight:800; letter-spacing:-.04em; }
  .logo span { font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); }

  .navgroup { display:flex; flex-direction:column; gap:9px; }
  .navtab { appearance:none; cursor:pointer; width:100%; text-align:left; font-family:inherit;
    background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
    color:var(--accent); border-radius:9px; padding:9px 12px;
    display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; letter-spacing:-.015em; }
  .navtab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .navtab .n { margin-left:auto; font-family:var(--mono); font-size:11px; font-weight:700; opacity:.75; }

  .rail-label { font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding-left:2px; }
  .datelist { display:flex; flex-direction:column; gap:6px; }
  .dbtn { appearance:none; text-align:left; cursor:pointer; width:100%; font-family:inherit; color:inherit;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:10px 12px; display:flex; flex-direction:column; gap:5px;
    transition:border-color .14s ease, background .14s ease; }
  .dbtn:hover { border-color:var(--line-2); }
  .dbtn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .dbtn .d1 { font-family:var(--mono); font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:6px; }
  .dbtn .dow { font-size:10px; font-weight:600; color:var(--muted); }
  .dbtn .d2 { font-size:12px; color:var(--muted); line-height:1.42; }
  .dbtn.on { background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 42%,transparent); }
  .dbtn.on .d1 { color:var(--accent); }
  .dbtn.on .d2 { color:var(--ink-2); }
  .tally { display:flex; gap:4px; }
  .tally i { font-style:normal; font-family:var(--mono); font-size:9px; font-weight:700; padding:1px 5px; border-radius:4px; }
  .tally .t-ok { color:var(--ok); background:var(--ok-soft); }
  .tally .t-wa { color:var(--warn); background:var(--warn-soft); }
  .tally .t-ba { color:var(--bad); background:var(--bad-soft); }

  .backup { border:1px solid var(--line); border-radius:9px; padding:11px 12px; background:var(--surface-2); display:flex; flex-direction:column; gap:5px; }
  .backup b { font-size:11.5px; font-weight:700; }
  .backup span { font-size:11px; color:var(--muted); line-height:1.45; }
  .backup .path { font-family:var(--mono); font-size:9.5px; line-height:1.5; color:var(--accent);
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:5px 7px; margin-top:3px; word-break:break-all; }

  main { padding-top:30px; min-width:0; }
  .report { display:flex; flex-direction:column; gap:44px; }
  .mast { display:flex; flex-direction:column; gap:13px; }
  .kicker { font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .kicker .dot { width:3px; height:3px; border-radius:50%; background:var(--line-2); }
  .mast h2 { font-size:clamp(25px,4.4vw,35px); line-height:1.19; letter-spacing:-.032em; font-weight:800; text-wrap:balance; margin:0; }
  .standfirst { font-size:16px; color:var(--ink-2); max-width:62ch; }

  section { display:flex; flex-direction:column; gap:17px; }
  .sec-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .sec-n { font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.1em; }
  .sec-head h3 { font-size:20px; font-weight:750; letter-spacing:-.024em; margin:0; text-wrap:balance; }
  .sec-sub { font-size:14.5px; color:var(--muted); max-width:64ch; }
  .prose { display:flex; flex-direction:column; gap:12px; max-width:68ch; }

  .heads { display:flex; flex-direction:column; gap:13px; }
  .head-card { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--bad); border-radius:12px; padding:19px 21px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; }
  .head-card.amber { border-left-color:var(--warn); }
  .head-card.good { border-left-color:var(--ok); }
  .head-card h4 { margin:0; font-size:16.5px; font-weight:750; letter-spacing:-.02em; text-wrap:balance; }
  .head-card p { font-size:15px; color:var(--ink-2); }

  .chip { display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.05em; padding:3px 9px; border-radius:999px; border:1px solid transparent; white-space:nowrap; }
  .chip.ok { color:var(--ok); background:var(--ok-soft); border-color:color-mix(in srgb,var(--ok) 28%,transparent); }
  .chip.warn { color:var(--warn); background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 28%,transparent); }
  .chip.bad { color:var(--bad); background:var(--bad-soft); border-color:color-mix(in srgb,var(--bad) 28%,transparent); }
  .chip.neutral { color:var(--muted); background:var(--surface-2); border-color:var(--line); }

  .tscroll { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  table { width:100%; border-collapse:collapse; font-size:14.5px; min-width:520px; }
  th { text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap; }
  td { padding:13px 16px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td { border-bottom:0; }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .handle { font-family:var(--mono); font-size:13px; font-weight:600; }
  tr.pass td { background:color-mix(in srgb,var(--ok) 5%,transparent); }
  .up { color:var(--up); font-weight:700; }
  .down { color:var(--down); font-weight:700; }

  .claims { display:flex; flex-direction:column; gap:12px; }
  .claim { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; }
  .vrail { width:4px; flex-shrink:0; }
  .claim.v-ok .vrail { background:var(--ok); }
  .claim.v-warn .vrail { background:var(--warn); }
  .claim.v-bad .vrail { background:var(--bad); }
  .cbody { padding:16px 19px; display:flex; flex-direction:column; gap:9px; flex:1; min-width:0; }
  .ctop { display:flex; flex-wrap:wrap; align-items:center; gap:9px; }
  .ctop .src { font-family:var(--mono); font-size:12px; color:var(--muted); font-weight:600; }
  .claim h4 { margin:0; font-size:15.5px; font-weight:720; letter-spacing:-.018em; text-wrap:balance; }
  .kv { font-size:14.5px; display:flex; gap:9px; align-items:baseline; }
  .kv .lbl { font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted); flex-shrink:0; padding-top:3px; width:34px; }
  .kv.said span { color:var(--ink-2); }
  .kv.found span { color:var(--ink); }

  .versus { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .side { border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--surface); display:flex; flex-direction:column; gap:9px; }
  .side h4 { margin:0; font-size:12.5px; font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase; }
  .side.bull h4 { color:var(--up); }
  .side.bear h4 { color:var(--down); }
  .side p { font-size:14.5px; color:var(--ink-2); }
  .side .src { font-size:12.5px; color:var(--muted); margin-top:auto; padding-top:4px; }

  .callout { background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 26%,transparent); border-radius:12px; padding:17px 19px; display:flex; flex-direction:column; gap:8px; }
  .callout h4 { margin:0; font-size:14.5px; font-weight:750; letter-spacing:-.015em; }
  .callout p { font-size:14.5px; color:var(--ink-2); }

  ol.lessons { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px; counter-reset:l; }
  ol.lessons li { counter-increment:l; display:flex; gap:14px; font-size:15px; color:var(--ink-2); padding-bottom:12px; border-bottom:1px solid var(--line); }
  ol.lessons li:last-child { border-bottom:0; padding-bottom:0; }
  ol.lessons li::before { content:counter(l); font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); flex-shrink:0; padding-top:3px; }

  .rfoot { border-top:1px solid var(--line); padding-top:18px; font-size:12.5px; color:var(--muted); line-height:1.6; display:flex; flex-direction:column; gap:7px; }
  .rfoot .disc { font-weight:600; color:var(--ink-2); }

  @media (max-width: 900px) {
    .cols { grid-template-columns:1fr; gap:20px; }
    .side-rail { position:static; max-height:none; padding-bottom:6px; }
    .datelist { flex-direction:row; overflow-x:auto; padding-bottom:5px; gap:8px; }
    .dbtn { min-width:200px; flex-shrink:0; }
    .versus { grid-template-columns:1fr; }
    .shell { padding:0 16px 70px; }
    main { padding-top:8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

  /* 채널 글 (네이버 원고) */
  .navtab.alt { background:var(--surface); color:var(--ink-2); border-color:var(--line); }
  .navtab.alt.on, .navtab.on { outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent); }
  .post { display:flex; flex-direction:column; gap:14px; max-width:70ch; font-size:16.5px; line-height:1.78; }
  .post h2 { font-size:19px; font-weight:750; letter-spacing:-.02em; margin:18px 0 0; }
  .post h3 { font-size:16.5px; font-weight:700; margin:10px 0 0; }
  .post p { margin:0; }
  .post hr { border:0; border-top:1px solid var(--line); margin:10px 0; }
  .post blockquote { margin:0; padding:10px 16px; border-left:3px solid var(--line-2); background:var(--surface); border-radius:0 8px 8px 0; color:var(--ink-2); font-size:15px; }
  .post blockquote p + p { margin-top:6px; }
  .post ul { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; }
  .post table { min-width:0; }
  .post .tscroll { margin:4px 0; }
  .post sub { font-size:12.5px; color:var(--muted); vertical-align:baseline; }
  .post del { color:var(--muted); }
  .post .banner { border:1px solid var(--warn); background:var(--warn-soft); border-radius:10px; padding:10px 14px; font-size:14px; }
  .post .banner p { color:var(--ink-2); }
  .pstat { font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .pstat.ready { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent); background:var(--ok-soft); }
  .pstat.hold { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 40%,transparent); background:var(--warn-soft); }

  /* 스레드 — 게시될 그대로의 순수 텍스트 */
  .tcard { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); max-width:440px; overflow:hidden; }
  .tcard-top { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface-2); font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em; }
  .tcard-top .sp { margin-left:auto; }
  .tpost { margin:0; padding:18px 18px 20px; font-family:var(--sans); font-size:16px; line-height:1.62; white-space:pre-wrap; word-break:keep-all; color:var(--ink); }
  .tcopy { appearance:none; cursor:pointer; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.04em; padding:4px 10px; border-radius:7px; border:1px solid color-mix(in srgb,var(--accent) 40%,transparent); background:var(--accent-soft); color:var(--accent); }
  .tcopy:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tcopy.done { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent); background:var(--ok-soft); }
  .tnote { font-size:13.5px; color:var(--muted); max-width:60ch; }
  .tstack { display:flex; flex-direction:column; gap:14px; }
</style>

<div class="shell">
  <div class="cols">
    <nav class="side-rail">
      <div class="logo"><b>대조실</b><span>Cross-check Desk</span></div>
      <div class="navgroup">
        <button class="navtab" type="button" id="tabReports">보고서 <span class="n" id="repCount"></span></button>
        <div class="rail-label">일자별</div>
        <div class="datelist" id="dl"></div>
      </div>
      <div class="navgroup">
        <button class="navtab alt" type="button" id="tabPosts">채널 글 <span class="n" id="postCount"></span></button>
        <div class="rail-label">네이버 채널 원고 · 검수 상태는 글마다 표시</div>
        <div class="datelist" id="pl"></div>
      </div>
      <div class="navgroup">
        <button class="navtab alt" type="button" id="tabThreads">스레드 <span class="n" id="threadCount"></span></button>
        <div class="rail-label">짧은 글 · 네이버 글과 따로 씀</div>
        <div class="datelist" id="tl"></div>
      </div>
      <div class="backup">
        <b>데이터 백업</b>
        <span id="bkNote"></span>
        
      </div>
    </nav>
    <main><div class="report" id="rep"></div></main>
  </div>
</div>

<script id="REPORT_DATA" type="application/json">{"site": "대조실", "tagline": "스레드 주식 계정 주장 × 1차 자료 검증", "updated": "2026-09-28", "reports": [{"date": "2026-09-29", "dow": "화", "summary": "스페이스X 스타십이 14차 시험비행에서 처음으로 지구 궤도 진입에 성공하며 방산·우주항공 테마에 관심이 쏠리는 가운데, 코스피는 전날 장중 7,000선을 웃돌고도 마감엔 2.70% 급락(6,889.74)한 데 이어 오늘도 6,844.41(-0.66%)로 추가 하락 출발했습니다. 코스닥도 843.87(-0.32%)로 동반 약세였습니다. 원/달러 환율은 1,357원대로 소폭 내렸고, 美 10년물 국채금리는 5.2%대의 19년 만의 최고 수준을 유지하며 여전히 부담 요인으로 꼽힙니다. HLB그룹주는 전일 무더기 상한가에 이어 계열사 HLB바이오스텝이 17%대 추가 급등했습니다.", "tally": {"ok": 1, "warn": 2, "bad": 0}, "kicker": ["자동생성·검색기반", "추적 결과: 스타십 14차 시험비행, 첫 지구 궤도 진입 성공", "추적 결과: 코스피 9/28 장중 7,000선 회복 후 결국 2.70% 급락 마감(6,889.74)", "추적 결과: HLB바이오스텝 17%대 추가 급등, 모회사 상한가 지속은 검증 보류", "코스피 9/29 개장 6,844.41(-0.66%), 코스닥도 동반 약세", "美 10년물 국채금리 5.2%대 지속, 10월 FOMC 인상 확률 66~70%대 매체 간 상충"], "title": "스타십은 궤도 진입 쾌거, 코스피는 급락 반전 뒤 추가 하락 출발", "standfirst": "스페이스X 스타십이 14차 시험비행에서 처음으로 지구 궤도 진입에 성공하며 우주항공 테마에 관심이 쏠린 하루였지만, 코스피는 전날 장중 7,000선을 회복하고도 마감엔 2.70% 급락하는 반전을 겪었고 오늘도 6,800원대로 추가 하락 출발했습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "뉴스1·아시아경제·뉴스핌·머니투데이·서울신문·CBC뉴스·토큰포스트·파이낸셜뉴스·이투데이·헤럴드경제·경향신문 (2026-09-29 오전 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>추적 결과\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">어제까지 열려 있던 추적 항목 중 오늘 확인된 세 건입니다.\u003c/p>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">확인됨\u003c/span>\u003cspan class=\"src\">스타십 14차 시험비행 발사 결과\u003c/span>\u003c/div>\n      \u003ch4>스타십, 14차 시험비행에서 처음으로 지구 궤도 진입 성공\u003c/h4>\n      \u003cdiv class=\"kv said\">\u003cspan class=\"lbl\">이전\u003c/span>\u003cspan>9월 28일로 연기 확정됐던 스타십 14차 시험비행이 실제로 발사돼 첫 궤도 진입과 스타링크 V3 위성 배치에 성공하는지가 지난 추적 항목이었습니다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">확인\u003c/span>\u003cspan>스타십은 9/28 미국 중부시간 오전 7시15분 발사돼 2023년 이후 13차례 모두 실패했던 궤도 진입에 처음 성공했습니다. 발사 약 26분 만에 목표 궤도에 안착했고 스타링크 V3 위성 26기를 처음으로 실궤도에 배치했습니다. 이후 약 8시간 궤도에 머물다 칠레 앞바다에 착수하며 전체 비행은 약 9시간 50분이었습니다(헤럴드경제·경향신문·이투데이). 방산·우주항공 테마주 영향은 다음 거래일 반응에서 확인이 필요합니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">부분 확인\u003c/span>\u003cspan class=\"src\">코스피 9/28 최종 마감\u003c/span>\u003c/div>\n      \u003ch4>장중 7,000선 회복했던 코스피, 마감엔 오히려 2.70% 급락 반전\u003c/h4>\n      \u003cdiv class=\"kv said\">\u003cspan class=\"lbl\">이전\u003c/span>\u003cspan>재개장 첫날 장중 7,000선이 무너진 코스피가 마감까지 낙폭을 키우는지, 개인 순매수가 방어에 성공하는지가 열린 질문이었습니다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">확인\u003c/span>\u003cspan>코스피는 장중 한때 7,065.90까지 올라 7,000선을 웃돌기도 했으나 결국 상승분을 지키지 못하고 급락 전환, 191.18포인트(2.70%) 내린 6,889.74로 마감했습니다. 외국인·기관이 4조원 넘게 동반 매도한 것으로 보도됐지만, 개인 순매수가 낙폭을 방어했는지는 구체적 수급 수치가 확인되지 않아 검증 보류입니다. 코스닥은 대조적으로 2.10포인트(0.25%) 오른 846.58로 마감했습니다(머니투데이·뉴스1·서울신문).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">부분 확인\u003c/span>\u003cspan class=\"src\">HLB그룹주 상한가 랠리 지속 여부\u003c/span>\u003c/div>\n      \u003ch4>HLB바이오스텝 17%대 추가 급등, 모회사 상한가 지속은 확인 안 됨\u003c/h4>\n      \u003cdiv class=\"kv said\">\u003cspan class=\"lbl\">이전\u003c/span>\u003cspan>담관암 신약 '리픽투' FDA 허가로 무더기 상한가를 기록한 HLB그룹주 랠리가 다음 거래일에도 이어지는지가 열린 질문이었습니다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">확인\u003c/span>\u003cspan>HLB바이오스텝은 전일 상한가에 이어 9/29 오전에도 17%대 급등하며 랠리를 이어갔습니다. 다만 상한가로 직행했던 모회사 HLB 본사주가 9/29에도 상한가를 다시 기록했는지는 이번 검색 스니펫에서 구체적으로 확인되지 않아 검증 보류로 남습니다(CBC뉴스).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">오늘(9/29, 화) 오전 개장·장초반 스니펫 기준입니다. 장중 수치이며 최종 마감과 다를 수 있습니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/29 개장)\u003c/td>\u003ctd class=\"num down\">6,844.41 (-0.66%)\u003c/td>\u003ctd>전일 6,889.74 마감 대비 45.33포인트 하락 출발(뉴스1·아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스피 (9/29 장초반)\u003c/td>\u003ctd class=\"num down\">6,854.58 (-0.51%)\u003c/td>\u003ctd>개장 이후 낙폭이 소폭 줄어든 흐름(뉴스1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/29 개장)\u003c/td>\u003ctd class=\"num down\">843.87 (-0.32%)\u003c/td>\u003ctd>전일 846.58 마감 대비 2.71포인트 하락 출발, 코스피와 동반 약세(뉴스1·이투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/29 개장)\u003c/td>\u003ctd class=\"num\">1,357.0원\u003c/td>\u003ctd>전일 종가 대비 8.1원 낮게 출발, 매매기준율 1,360.0원(토큰포스트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>미국 다우존스 (9/25, 금 마감)\u003c/td>\u003ctd class=\"num up\">51,828.62 (+0.93%)\u003c/td>\u003ctd>3대 지수 동반 반등, 이번 주 국내 개장 전 마지막 미국 마감(교도통신 인용)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>필라델피아 반도체지수 (9/25)\u003c/td>\u003ctd class=\"num up\">+1.13%\u003c/td>\u003ctd>3대 지수보다 강한 반도체주 강세(CNBC 인용)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/24)\u003c/td>\u003ctd class=\"num up\">5.22~5.23%\u003c/td>\u003ctd>2007년 6월 이후 최고치, 19년 만의 최고 수준(파이낸셜뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>10월 FOMC 금리인상 확률\u003c/td>\u003ctd class=\"num\">66~70%대\u003c/td>\u003ctd>파이낸셜뉴스(9/26)는 66%, 이투데이·네이트(9/27)는 60% 넘는 수준으로 보도 — 정확한 최신치는 검증 보류(파이낸셜뉴스·이투데이)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>특징주\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">9/29 오전 스니펫 기준 등락률입니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>종목\u003c/th>\u003cth>등락률\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>에임드바이오\u003c/td>\u003ctd class=\"num up\">+18.50%\u003c/td>\u003ctd>바이오·제약주 강세(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>삼천당제약\u003c/td>\u003ctd class=\"num up\">+8.98%\u003c/td>\u003ctd>바이오·제약주 강세(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>보로노이\u003c/td>\u003ctd class=\"num up\">+6.70%\u003c/td>\u003ctd>바이오·제약주 강세(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>메지온\u003c/td>\u003ctd class=\"num up\">+6.15%\u003c/td>\u003ctd>바이오·제약주 강세(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>참엔지니어링\u003c/td>\u003ctd class=\"num up\">상승\u003c/td>\u003ctd>참저축은행 지분 100억3,800만원 추가 취득 발표 이후 상승(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>로보티즈\u003c/td>\u003ctd class=\"num down\">-2.70%\u003c/td>\u003ctd>로봇주 약세(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>레인보우로보틱스\u003c/td>\u003ctd class=\"num down\">-2.27%\u003c/td>\u003ctd>로봇주 약세(뉴스핌)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>케어젠\u003c/td>\u003ctd class=\"num down\">-2.01%\u003c/td>\u003ctd>로봇주 약세(뉴스핌)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>검증 보류\u003c/h3>\u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>이번 검색으로 확정하지 못한 항목\u003c/h4>\n    \u003cp>코스피·코스닥 9/29 최종 마감 수치, HLB 본사주의 9/29 상한가 재기록 여부, 10월 FOMC 금리인상 확률의 정확한 최신치(매체 간 66%·70%대 상충)는 오늘 검색 시점까지 확인되지 않아 검증 보류로 다음 추적에 넘깁니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n"}, {"date": "2026-09-28", "dow": "월", "summary": "추석 연휴를 마치고 재개장한 코스피가 뉴욕 증시의 금요일 반등에도 불구하고 하락 출발해 오전 한때 7,000선 아래로 밀렸습니다. 오전 9시49분 기준 코스피는 82.30포인트(1.16%) 내린 6,998.62, 삼성전자(-1.14%)·SK하이닉스(-2.63%) 반도체 투톱도 동반 약세였습니다. 반면 HLB그룹주는 미국 FDA의 담관암 신약 '리픽투' 허가 소식에 무더기 상한가(HLB +29.95%)로 대조적인 흐름을 보였습니다. 원/달러 환율은 1,350~1,360원대에서 거래됐고, 美 10년물 국채금리는 5.1%대 고공행진을 이어가는 중입니다.", "tally": {"ok": 4, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "추적 결과: 국채금리 부담, 반도체 투톱 동반 하락으로 실제 전이 확인", "추적 결과: 재개장 첫날 코스피 장중 7,000선 붕괴(6,998.62, -1.16%) — 최종 마감은 검증 보류", "HLB그룹주, 美 FDA 담관암 신약 '리픽투' 허가에 무더기 상한가(+29.95%)", "원/달러 환율 1,350~1,360원대, 美 10년물 국채금리 5%대 중반 지속"], "title": "코스피 재개장 첫날 7,000선 붕괴 — 국채금리 부담, 반도체 투톱 덮쳐", "standfirst": "추석 연휴를 마치고 재개장한 코스피가 지난주 금요일 뉴욕 증시의 반등에도 불구하고 하락 출발해, 오전 한때 7,000선 아래로 밀렸습니다. 삼성전자·SK하이닉스 반도체 투톱이 국채금리 부담 속에 동반 약세를 보인 가운데, HLB그룹주는 美 FDA의 담관암 신약 허가 소식에 무더기 상한가로 홀로 대조적인 흐름을 보였습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "뉴스1·아주경제·헤럴드경제·뉴데일리·핀포인트뉴스·세계일보·이투데이·파이낸셜뉴스·토큰포스트·newspim (2026-09-28 오전 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>추적 결과\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">어제까지 열려 있던 추적 항목 중 오늘 재개장 데이터로 확인된 두 건입니다.\u003c/p>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">확인됨\u003c/span>\u003cspan class=\"src\">국채금리 부담 → 반도체 대형주 전이\u003c/span>\u003c/div>\n      \u003ch4>국채금리 부담, 재개장 첫날 반도체 투톱 동반 하락으로 실제 전이 확인\u003c/h4>\n      \u003cdiv class=\"kv said\">\u003cspan class=\"lbl\">이전\u003c/span>\u003cspan>어제 보고서는 美 10년물 국채금리가 이번 주 5.1%대에서 5.2%대까지 추가로 오른 점이, 코스피 재개장(9/28)과 반도체 대형주에 실제로 전이될지를 열린 질문으로 남겼습니다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">확인\u003c/span>\u003cspan>재개장 첫날 \u003cspan class=\"handle\">삼성전자\u003c/span>(-1.14%, 282,250원)·\u003cspan class=\"handle\">SK하이닉스\u003c/span>(-2.63%, 1,809,500원) 반도체 투톱이 동반 하락했고, 뉴스1은 개장시황 기사 제목에서 이를 직접 \"美 국채금리 부담\"으로 지목했습니다. 10년물 금리는 9/23 5.11%에서 9/25 5.17%로 소폭 낮아졌지만 여전히 2007년 7월 이후 최고 수준입니다(뉴스1·아주경제).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">부분 확인\u003c/span>\u003cspan class=\"src\">코스피·코스닥 9/28 재개장 반응\u003c/span>\u003c/div>\n      \u003ch4>뉴욕 반등에도 코스피는 하락 출발, 장중 7,000선 붕괴 — 최종 마감은 검증 보류\u003c/h4>\n      \u003cdiv class=\"kv said\">\u003cspan class=\"lbl\">이전\u003c/span>\u003cspan>나흘치 해외 변수(美 10년물 5.135%·10월 FOMC 인상확률 70%대·뉴욕증시 금요일 반등)가 재개장 첫날 코스피·코스닥에 어떻게 누적 반영될지가 어제 보고서의 열린 질문이었습니다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">확인\u003c/span>\u003cspan>코스피는 뉴욕의 금요일 반등을 따라가지 못하고 오히려 하락 출발했습니다. 장중 한때 6,989.34까지 밀리며 7,000선이 무너졌고, 오전 9시49분 기준 82.30포인트(1.16%) 내린 6,998.62를 기록했습니다. 외국인·기관이 각각 3,825억원·217억원을 순매도한 반면 개인이 1,710억원을 순매수하며 낙폭을 방어했습니다. 국채금리 부담이 뉴욕 반등 효과를 압도한 것으로 보이나, 최종 마감 수치는 이번 검색 시점까지 확인되지 않아 다음 추적으로 넘깁니다(뉴스1·아주경제·헤럴드경제·뉴데일리).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">추석 연휴 이후 첫 거래일인 오늘(9/28, 월), 오전 9시45분~9시49분 무렵 스니펫 기준입니다. 장중 수치이며 최종 마감과 다를 수 있습니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/28 오전 9:49)\u003c/td>\u003ctd class=\"num down\">6,998.62 (-1.16%)\u003c/td>\u003ctd>개장 7,057.86(-0.33%)에서 낙폭 확대, 장중 저가 6,989.34로 7,000선 붕괴(뉴스1·아주경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/28 개장)\u003c/td>\u003ctd class=\"num up\">845.48 (+0.12%)\u003c/td>\u003ctd>개장 직후 한때 +0.41%까지 상승했으나 이후 등락, 정확한 오전 후반 수치는 매체 간 엇갈려 검증 보류(뉴스1·newspim)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>삼성전자 (9/28 오전)\u003c/td>\u003ctd class=\"num down\">282,250원 (-1.14%)\u003c/td>\u003ctd>반도체 대형주 동반 약세(파이낸셜뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>SK하이닉스 (9/28 오전)\u003c/td>\u003ctd class=\"num down\">1,809,500원 (-2.63%)\u003c/td>\u003ctd>같은 시간대 -2.82%로 보도한 매체도 있어 소수점은 검증 보류(톱스타뉴스·핀포인트뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/28 오전 9시)\u003c/td>\u003ctd class=\"num\">1,359.5원\u003c/td>\u003ctd>시가 1,357.0원(-0.5원), 매매기준율 1,352.0원(토큰포스트)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우존스 (9/25 현지시간, 금)\u003c/td>\u003ctd class=\"num up\">51,828.62 (+0.93%)\u003c/td>\u003ctd>어제 보고서에서 재확인된 확정치(교도통신 인용·CNBC)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/23→9/25)\u003c/td>\u003ctd class=\"num\">5.11% → 5.17%\u003c/td>\u003ctd>2007년 7월 이후 최고 수준 지속(interactivecrypto·newspim)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피 7,000선\u003c/span>\u003c/div>\n      \u003ch4>코스피, 재개장 첫날 장중 7,000선 붕괴 — 외국인·기관 순매도, 개인 순매수로 방어\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스피는 9/28 오전 장중 한때 6,989.34까지 밀려 7,000선이 무너졌고, 오전 9시49분 기준 6,998.62(-1.16%)를 기록했습니다. 외국인·기관이 각각 3,825억원·217억원을 순매도했고, 개인이 1,710억원을 순매수하며 낙폭을 일부 흡수했습니다(아주경제·뉴데일리·헤럴드경제).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">HLB그룹주\u003c/span>\u003c/div>\n      \u003ch4>HLB그룹주, 美 FDA 담관암 신약 '리픽투' 허가에 무더기 상한가\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>HLB의 미국 자회사 엘레바 테라퓨틱스가 9/23(현지시간) FDA로부터 표적 항암제 '리픽투'(성분명 리라푸그라티닙)를 담관암 2차 치료제로 승인받았다는 소식에, HLB(+29.95%, 39,700원)를 비롯해 HLB생명과학·HLB제약 등 계열사가 일제히 상한가로 직행했습니다. HLB 측은 국내 제약·바이오 기업이 자체적으로 FDA에 신약허가신청서(NDA)를 제출해 허가받은 첫 사례라고 설명했습니다(이투데이·서울신문·파이낸셜뉴스).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>원/달러 환율, 추석 연휴 전 수준인 1,350~1,360원대에서 거래\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>원/달러 환율은 9/28 오전 9시 기준 1,359.5원에 거래됐고, 이날 시가는 전 거래일 종가보다 0.5원 낮은 1,357.0원, 서울외국환중개 고시 매매기준율은 1,352.0원이었습니다. 연휴 전 이어지던 원화 강세 흐름이 큰 변화 없이 유지되는 모습입니다(토큰포스트).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">검증 보류\u003c/span>\u003cspan class=\"src\">코스닥 오전 후반 흐름\u003c/span>\u003c/div>\n      \u003ch4>코스닥, 개장 직후 강세에서 이후 등락 — 정확한 오전 후반 수치는 매체 간 엇갈림\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스닥은 845.48(+0.12%)로 개장한 뒤 한때 +0.41%까지 오르는 강세를 보였다고 뉴스1이 전했으나, 같은 시간대를 newspim은 \"소폭 상승 후 하락\"으로 서술해 오전 후반 정확한 등락 방향은 스니펫만으로 확정하기 어렵습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">진행 중\u003c/span>\u003cspan class=\"src\">스페이스X 스타십 14차 시험비행\u003c/span>\u003c/div>\n      \u003ch4>스타십 14차 시험비행, 오늘 저녁(한국시간 오후 9시15분) 발사 예정 — 결과는 아직\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>스페이스X는 FAA의 최종 발사 승인을 받았고, 미 동부시간 9/28 오전 8시15분(한국시간 오후 9시15분)부터 75분간 발사창이 열립니다. 성공하면 스타십이 처음으로 지구 궤도(약 275km)에 진입해 6차례 선회 후 태평양에 착수하며, 스타링크 V3 위성 26기를 처음 실궤도에 배치하고 13차 비행에서 회수한 내열타일 2장을 재사용하는 첫 사례가 됩니다(디지털포커스·파이낸셜뉴스·teslaoracle).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>쟁점 — 개인 순매수 방어가 이번에도 유효할까\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">외국인·기관이 동반 매도하는 가운데 개인이 사들이며 낙폭을 줄이는 패턴은 최근 몇 차례 반복됐습니다. 오늘도 같은 구도가 마감까지 이어질지는 확인되지 않았습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>방어 가능성\u003c/h4>\n      \u003cp>개인이 오전 한때 1,710억원을 순매수하며 외국인·기관 매도(합산 약 4,042억원)의 상당 부분을 흡수했습니다. 지난 9/22~23에도 외국인·기관 매도 속에 코스피가 7,000선을 이틀 연속 지켜낸 전례가 있어, 개인 수급이 방어선 역할을 할 여지가 있습니다.\u003c/p>\n      \u003cp class=\"src\">아주경제·뉴데일리 · 2026-09-28\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>부담 요인\u003c/h4>\n      \u003cp>美 10년물 국채금리가 2007년 7월 이후 최고 수준을 이어가고 있고, 뉴욕 증시의 금요일 반등에도 코스피가 이를 따라가지 못하고 하락 출발한 점은 국채금리 부담이 개인 수급만으로 상쇄되기 어려운 수준일 가능성을 시사합니다. 최종 마감 수치가 나오기 전까지는 방향을 단정하기 어렵습니다.\u003c/p>\n      \u003cp class=\"src\">뉴스1·헤럴드경제 · 2026-09-28\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">05\u003c/span>\u003ch3>다음 확인할 것\u003c/h3>\u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>내일 이후 대조실이 다시 열어볼 항목\u003c/h4>\n    \u003cp>① 코스피 9/28 최종 마감 수치 — 7,000선 붕괴가 마감까지 이어지는지, 개인 순매수 방어가 성공하는지. ② 스페이스X 스타십 14차 시험비행(오늘 저녁 한국시간 9시15분) 실제 발사 결과 — 궤도 첫 진입과 스타링크 V3 위성 배치 성공 여부. ③ HLB그룹주 상한가 랠리가 다음 거래일에도 이어지는지. ④ 코스닥 9/28 최종 마감 수치와 등락 방향.\u003c/p>\n  \u003c/div>\n\u003c/section>\n"}, {"date": "2026-09-27", "dow": "일", "summary": "일요일인 오늘도 국내 증시는 추석 연휴와 주말이 겹쳐 나흘째 휴장을 이어갔습니다. 미국 증시는 9/25(금) 국채금리 급등 부담에도 3대 지수가 동반 반등했는데, 다우존스는 478.64포인트(0.93%) 오른 51,828.62로 마감했습니다. 이 수치는 어제 보고서가 CNBC와 날짜 표기가 엇갈린다고 지적했던 부분인데, 오늘 일본 교도통신을 인용한 독립 보도로 9/25(금) 거래분이 맞다는 점이 재확인됐습니다. 美 10년물 국채금리는 5.1%대에서 이번 주 5.2%대까지 추가로 올라 2007년 7월 이후 최고치 경신을 이어갔고, 10월 FOMC 추가 금리인상 확률은 CME 페드워치 기준 70.9%로 집계됐습니다.", "tally": {"ok": 4, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "추적 결과: 다우 9/25(금) 51,828.62 마감 — CNBC 날짜 표기 정확했음 확인", "美 10년물 국채금리 5.1%대→5.2%대, 2007년 이후 최고치 경신 지속", "10월 FOMC 추가인상 확률 CME 기준 70.9%(전날 55.4%·한달전 8.8%)", "국내 증시 나흘째(9/24~27) 휴장, 재개장은 9/28 월요일"], "title": "국내 증시 나흘째 휴장 — 뉴욕은 국채금리 5.2%대에도 금요일 동반 반등", "standfirst": "일요일인 오늘(9/27)도 국내 증시는 추석 연휴 및 주말로 휴장이 이어지며, 9월 28일 월요일 오전 9시에 정상 거래를 재개합니다. 미국 증시는 9/25(현지시간, 금) 국채금리 급등이라는 악재 속에서도 3대 지수가 동반 반등해 다우존스가 478.64포인트(0.93%) 오른 51,828.62로 마감했습니다. 美 10년물 국채금리는 2007년 7월 이후 최고 수준인 5.2%대까지 올라섰고, 10월 FOMC 추가 금리 인상 확률은 CME 페드워치 기준 70.9%로 집계됐습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "교도통신 인용 보도(류큐신보 등)·CNBC·파이낸셜뉴스·글로벌이코노믹·머니투데이 (2026-09-23~09-27 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>추적 결과\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">어제 보고서가 남긴 확인 필요 항목을 오늘 검색으로 다시 대조했습니다.\u003c/p>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">확인됨\u003c/span>\u003cspan class=\"src\">다우존스 9/25(금) 마감 날짜·수치\u003c/span>\u003c/div>\n      \u003ch4>다우존스 9/25(금) 종가 51,828.62 — CNBC의 '금요일' 표기가 맞았음\u003c/h4>\n      \u003cdiv class=\"kv said\">\u003cspan class=\"lbl\">이전\u003c/span>\u003cspan>어제 보고서는 CNBC가 전한 다우존스 478.64포인트(0.93%) 상승·51,828.62 마감이 실제로 9/25(금) 거래분인지, 기사 URL의 날짜 표기와 본문 서술이 엇갈려 검증 보류라고 전했습니다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">확인\u003c/span>\u003cspan>일본 교도통신을 인용한 복수 매체(류큐신보 등)가 9/25(금) 다우존스 종가를 동일하게 51,828.62(전일 대비 478.64포인트, 0.93% 상승)로 독립 보도해 날짜 표기가 정확했음이 재확인됐습니다. 같은 날 S&amp;P500은 +0.54%, 나스닥은 +0.45% 올라 3대 지수가 동반 반등했고, 필라델피아 반도체지수(SOX)는 +1.13%로 더 강했습니다(교도통신 인용 보도·CNBC).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">일요일인 오늘(9/27)도 국내 증시는 추석 연휴 및 주말 휴장이 이어지며, 내일(9/28) 월요일 오전 9시에 정상 거래를 재개합니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피·코스닥 (9/24~28)\u003c/td>\u003ctd class=\"num\">휴장\u003c/td>\u003ctd>추석연휴(9/24목·25금)+주말(26토·27일), 재개장은 9/28 월요일\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/25 현지시간, 금)\u003c/td>\u003ctd class=\"num up\">51,828.62 (+0.93%)\u003c/td>\u003ctd>478.64포인트 오름, 3거래일 하락 끝내고 주간 상승 마감(교도통신·CNBC)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/25 현지시간, 금)\u003c/td>\u003ctd class=\"num up\">+0.45%\u003c/td>\u003ctd>정확한 종가 포인트는 스니펫에서 추가 확인 필요(검증 보류)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/25 현지시간, 금)\u003c/td>\u003ctd class=\"num up\">+0.54%\u003c/td>\u003ctd>정확한 종가 포인트는 스니펫에서 추가 확인 필요(검증 보류)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>필라델피아 반도체지수(SOX) (9/25)\u003c/td>\u003ctd class=\"num up\">+1.13%\u003c/td>\u003ctd>3대 지수보다 강한 반등폭\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/23~26)\u003c/td>\u003ctd class=\"num\">5.1%대 → 5.2%대\u003c/td>\u003ctd>2007년 7월 이후 최고치를 주중 계속 경신(글로벌이코노믹)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>10월 FOMC 추가인상 확률 (CME, 9/23)\u003c/td>\u003ctd class=\"num\">70.9%\u003c/td>\u003ctd>전날 55.4%, 한 달 전 8.8%에서 급등(파이낸셜뉴스)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">국내 증시 일정\u003c/span>\u003c/div>\n      \u003ch4>국내 증시, 추석 연휴와 주말이 겹쳐 나흘째(9/24~27) 휴장 — 재개장은 9/28 월요일\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>코스피·코스닥의 평일 휴장일은 9월 24일(목)과 추석 당일인 25일(금)이며, 26일(토)·27일(일)은 주말이라 자연히 거래가 없습니다. 다음 정규장은 9월 28일 월요일 오전 9시입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미국 증시(9/25, 현지시간)\u003c/span>\u003c/div>\n      \u003ch4>뉴욕 3대지수, 국채금리 급등에도 금요일 동반 반등 — 다우 478.64포인트(0.93%) 올라 51,828.62\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>다우존스는 9/25(금) 478.64포인트(0.93%) 오른 51,828.62로 마감했고, S&amp;P500은 +0.54%, 나스닥은 +0.45% 상승했습니다. 필라델피아 반도체지수는 +1.13%로 3대 지수보다 강했습니다(교도통신 인용 보도·CNBC).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">진행 중\u003c/span>\u003cspan class=\"src\">미 국채금리\u003c/span>\u003c/div>\n      \u003ch4>美 10년물 국채금리, 이번 주 5.1%대에서 5.2%대까지 추가 상승 — 2007년 7월 이후 최고치 경신 지속\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>미 10년물 국채금리는 9/23 5.1%를 넘어선 데 이어 이번 주 5.2%를 돌파해 2007년 7월 이후 최고 수준을 이어가고 있습니다. 강한 9월 종합 PMI(58.4, 2021년 7월 이후 최고), 기업 원가 상승, 국제유가 상승이 복합적으로 채권시장을 압박한 것으로 보도됐습니다(글로벌이코노믹·머니투데이).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">10월 FOMC 인상확률\u003c/span>\u003c/div>\n      \u003ch4>10월 FOMC 추가 인상 확률, CME 페드워치 기준 70.9% — 하루 전 55.4%, 한 달 전 8.8%에서 급등\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>CME 페드워치에 따르면 10월 27~28일 회의에서 기준금리를 추가로 0.25%p 인상할 확률은 70.9%로 집계됐습니다. 하루 전(55.4%)과 한 달 전(8.8%)보다 크게 높아진 수치이며, 실제 인상 시 기준금리는 4.00~4.25%가 됩니다(파이낸셜뉴스).\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">검증 보류\u003c/span>\u003cspan class=\"src\">웨스팅하우스 지분 협상\u003c/span>\u003c/div>\n      \u003ch4>웨스팅하우스 지분 협상, 5~10%대에서 계속 논의 — 연휴 기간 새 진전 소식 없음\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>산업통상부는 여전히 美와 웨스팅하우스 지분투자를 5~10%대에서 협상 중인 것으로 전해집니다. 연휴 기간 동안 새로운 타결이나 서명 소식은 검색으로 확인되지 않았습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>쟁점 — 국채금리 5%대 장기화가 코스피 재개장(9/28)에 주는 신호\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">나흘간의 국내 휴장 동안 미국 국채금리·금리 인상 확률·뉴욕증시 방향이 계속 움직였고, 그 누적 영향이 월요일 재개장에 한꺼번에 반영될 가능성이 있습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>안심 근거\u003c/h4>\n      \u003cp>뉴욕 3대 지수는 국채금리 급등이라는 악재에도 불구하고 금요일 동반 반등하며 주간 기준 상승으로 마감했습니다. 특히 반도체 지수(SOX)가 3대 지수보다 강했다는 점은 국내 반도체 대형주에 우호적인 신호로 해석될 여지가 있습니다.\u003c/p>\n      \u003cp class=\"src\">교도통신 인용 보도·CNBC · 2026-09-25\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>美 10년물 국채금리는 2007년 7월 이후 최고 수준인 5.2%대까지 올라섰고, 10월 FOMC 추가 인상 확률도 70.9%로 높습니다. 강한 경기지표와 유가발 인플레이션 압력이 겹쳐 금리 상승이 단기에 꺾일 근거는 아직 확인되지 않습니다.\u003c/p>\n      \u003cp class=\"src\">글로벌이코노믹·파이낸셜뉴스 · 2026-09-23~09-26\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">05\u003c/span>\u003ch3>용어 설명\u003c/h3>\u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>CME 페드워치(FedWatch)란\u003c/h4>\n    \u003cp>시카고상품거래소(CME)가 30일 연방기금금리 선물 가격을 바탕으로 산출하는 연준 금리 결정 확률 도구입니다. 선물 가격이 실시간으로 움직이기 때문에 같은 날 안에서도 수치가 크게 바뀔 수 있어, 인용할 때는 반드시 기준 시각을 함께 표기해야 합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n"}, {"date": "2026-09-26", "dow": "토", "summary": "국내 증시는 추석 연휴와 주말이 겹쳐 나흘째(9/24~27) 휴장을 이어갔습니다. 미국 증시는 9/24(목) 혼조 마감 후 9/25(금)에는 국채금리 부담을 딛고 3대 지수가 동반 상승했는데, 다우존스는 478.64포인트(0.93%) 오른 51,828.62로 3거래일 연속 하락을 끝냈습니다. 美 10년물 국채금리는 9/24 장중 5.135%까지 올라 19년 만의 최고치를 기록했고, 10월 FOMC 추가 인상 확률은 CME 페드워치 기준 약 70%로 집계됐습니다. 지난 보고서에서 상충했던 나스닥 9/24 등락 방향은 소폭 상승(+0.01%)으로 확인됐습니다.", "tally": {"ok": 5, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "추적 결과: 나스닥 9/24 소폭 상승 마감 확인 — '가까스로 상승' 서술이 맞았음", "미국 3대지수 9/25(금) 반등, 다우 +0.93%(51,828.62)로 3거래일 하락 끝내", "美 10년물 국채금리 9/24 장중 5.135%, 19년만 최고치", "10월 FOMC 추가인상 확률 CME 기준 약 70%로 확인"], "title": "국내 증시 여전히 휴장 — 뉴욕 3대지수는 국채금리 부담 딛고 반등 마감", "standfirst": "토요일인 오늘(9/26)도 국내 증시는 추석 연휴 및 주말로 휴장이 이어지며, 9월 28일 월요일 오전 9시에 정상 거래를 재개합니다. 미국 증시는 9/24(현지시간, 목) 혼조 마감 이후 9/25(금)에는 3대 지수가 일제히 올라 다우존스가 478.64포인트(0.93%) 오른 51,828.62로 마감하며 3거래일 연속 하락을 끝냈습니다. 美 10년물 국채금리는 9/24 장중 5.135%까지 올라 2007년 7월 이후 19년 만의 최고치를 기록했고, 10월 FOMC 추가 금리 인상 확률은 CME 페드워치 기준 약 70%로 집계됐습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "글로벌이코노믹·CNBC·파이낸셜뉴스·뉴스핌·미디어파인·위키트리·CBC뉴스·이투데이·서울경제 (2026-09-24~09-26 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>추적 결과\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">지난 보고서에서 상충됐던 두 항목을 오늘 검색으로 다시 대조했습니다.\u003c/p>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">확인됨\u003c/span>\u003cspan class=\"src\">나스닥 9/24 마감 방향\u003c/span>\u003c/div>\n      \u003ch4>나스닥, 9/24(목) 소폭 상승 마감 — '가까스로 상승' 서술이 맞았음\u003c/h4>\n      \u003cdiv class=\"kv said\">\u003cspan class=\"lbl\">이전\u003c/span>\u003cspan>어제(9/25) 보고서는 나스닥 9/24 등락 방향이 CBC뉴스의 '가까스로 상승'과 다른 집계의 '소폭 하락' 사이에서 상충된다고 전했습니다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">확인\u003c/span>\u003cspan>글로벌이코노믹(2026-09-25 05:40 보도)에 따르면 나스닥종합지수는 3.336포인트(0.01%) 오른 26,939.37로 마감해 상승 쪽이 맞았습니다. 같은 날 다우존스는 161.61포인트(0.31%) 내린 51,349.98, S&P500은 1.90포인트(0.02%) 내린 7,704.13으로 혼조 마감했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">부분 확인\u003c/span>\u003cspan class=\"src\">10월 FOMC 인상확률 66.4% vs 70.9%\u003c/span>\u003c/div>\n      \u003ch4>70%대가 더 최근 수치 — 9/23 오전 55%에서 급등한 값\u003c/h4>\n      \u003cdiv class=\"kv said\">\u003cspan class=\"lbl\">이전\u003c/span>\u003cspan>어제 보고서는 10월 추가 인상 확률이 매체별로 66.4%(파이낸셜뉴스)와 70.9%로 다르게 집계됐다고 전했습니다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">확인\u003c/span>\u003cspan>파이낸셜뉴스·뉴스핌에 따르면 CME 페드워치 기준 10월 인상 확률은 9/23 오전 55% 수준이었다가 같은 날 중 70%로 급등했습니다. 66.4%는 이 급등 전후의 과도기적 수치로 보이나, 정확한 갱신 시각까지는 확인되지 않아 세부 시점은 계속 검증 보류입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">토요일인 오늘(9/26)도 국내 증시는 추석 연휴와 주말이 겹쳐 휴장입니다. 표에는 확인 가능한 가장 최신 수치를 담았습니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피·코스닥 (9/24~27)\u003c/td>\u003ctd class=\"num\">휴장\u003c/td>\u003ctd>추석연휴(9/24목·25금)+주말(26토·27일), 재개장은 9/28 월요일(위키트리·CBC뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/24 현지시간, 목)\u003c/td>\u003ctd class=\"num down\">51,349.98 (-0.31%)\u003c/td>\u003ctd>161.61포인트 내림, 3거래일 연속 하락(글로벌이코노믹)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/24 현지시간, 목)\u003c/td>\u003ctd class=\"num up\">26,939.37 (+0.01%)\u003c/td>\u003ctd>3.336포인트 오름, 근소한 상승 마감(글로벌이코노믹)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/25 현지시간, 금, 잠정)\u003c/td>\u003ctd class=\"num up\">51,828.62 (+0.93%)\u003c/td>\u003ctd>478.64포인트 오름, 3거래일 하락 끝내고 반등(CNBC)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/24 장중)\u003c/td>\u003ctd class=\"num\">5.135%\u003c/td>\u003ctd>2007년 7월 이후 19년 만의 최고치(미디어파인)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>10월 FOMC 추가인상 확률 (CME, 9/23~24)\u003c/td>\u003ctd class=\"num\">약 70%\u003c/td>\u003ctd>9/23 오전 55%에서 급등(파이낸셜뉴스·뉴스핌)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">국내 증시 일정\u003c/span>\u003c/div>\n      \u003ch4>국내 증시, 추석 연휴와 주말이 겹쳐 나흘째(9/24~27) 휴장 — 재개장은 9/28 월요일\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>위키트리·CBC뉴스에 따르면 코스피·코스닥의 평일 휴장일은 9월 24일(목)과 추석 당일인 25일(금)이며, 26일(토)·27일(일)은 주말이라 자연히 거래가 없습니다. 다음 정규장은 9월 28일 월요일 오전 9시입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미국 증시(9/24, 현지시간)\u003c/span>\u003c/div>\n      \u003ch4>뉴욕 3대지수, 9/24 혼조 마감 — 다우·S&P는 내리고 나스닥만 근소 상승\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>글로벌이코노믹(2026-09-25 05:40 보도)에 따르면 다우존스는 161.61포인트(0.31%) 내린 51,349.98, S&P500은 1.90포인트(0.02%) 내린 7,704.13으로 마감했고, 나스닥종합만 3.336포인트(0.01%) 오른 26,939.37로 혼조세를 나타냈습니다. 국채 수익률 고공행진 속에 다우는 3거래일 연속 하락이었습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">거래일 표기 확인 필요\u003c/span>\u003cspan class=\"src\">미국 증시(9/25, 현지시간 추정)\u003c/span>\u003c/div>\n      \u003ch4>뉴욕 3대지수, 국채금리 부담 딛고 반등 — 다우 478.64포인트(0.93%) 올라 3거래일 하락 끝내\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>CNBC는 \"Dow jumps more than 470 points Friday; stocks notch winning week despite Treasury yield surge\" 제하 기사에서 다우존스가 478.64포인트(0.93%) 오른 51,828.62, S&P500이 0.51% 오른 7,743.41, 나스닥이 0.5% 오른 27,068.72로 마감하며 국채금리 급등 부담에도 주간 기준 상승 마감했다고 전했습니다. 다만 기사 URL의 날짜 표기가 본문의 'Friday' 서술과 정확히 일치하는지는 추가 대조가 필요해 정확한 거래일은 검증 보류로 남깁니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미 국채금리\u003c/span>\u003c/div>\n      \u003ch4>美 10년물 국채금리 9/24 장중 5.135% — 2007년 7월 이후 19년 만의 최고치\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>미디어파인에 따르면 10년물 미국 국채 금리가 9/24 장중 5.135%까지 폭등하며 2007년 7월 이후 19년 만에 최고치를 경신했습니다. 마이클 바 연준 이사와 수잔 콜린스 보스턴 연은 총재가 추가 금리 인상 필요성을 잇달아 언급한 점이 배경으로 꼽혔습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">10월 FOMC 인상확률\u003c/span>\u003c/div>\n      \u003ch4>10월 FOMC 추가 인상 확률, CME 페드워치 기준 약 70%로 집계\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스·뉴스핌에 따르면 9/23 시카고상품거래소(CME) 페드워치에서 10월 27~28일 회의 추가 인상 확률은 70%로 반영됐으며, 이는 같은 날 오전 55% 수준에서 크게 높아진 수치입니다. 국제유가 급등과 미국 경제지표 호조가 배경으로 꼽혔습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">진행 중\u003c/span>\u003cspan class=\"src\">웨스팅하우스 지분 협상\u003c/span>\u003c/div>\n      \u003ch4>웨스팅하우스 지분 협상, 5~10%대에서 계속 논의 — 새로운 타결 소식 없음\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>이투데이·서울경제에 따르면 산업통상부는 여전히 美와 웨스팅하우스 지분투자를 5~10%대에서 협상 중인 것으로 확인됩니다. 한국은 15% 지분과 이사회 참여를 목표로 하지만 미국은 재무적 투자자 수준의 지분만 검토 중인 것으로 전해져, 지난 보고서 이후 뚜렷한 진전은 확인되지 않았습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>쟁점 — 뉴욕 금요일 반등이 코스피 재개장(9/28)에 주는 신호\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">국내 증시가 쉬는 나흘 동안 미국 국채금리·금리 인상 확률·뉴욕증시 방향이 계속 움직이고 있어, 재개장 첫날 그 누적 영향이 한꺼번에 반영될 가능성이 있습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>안심 근거\u003c/h4>\n      \u003cp>뉴욕 3대 지수는 국채금리 급등 부담에도 금요일(현지시간) 반등하며 주간 기준 상승으로 마감했습니다. 코스피도 연휴 직전 3거래일 연속 상승하며 7,000선 위에서 휴장에 들어갔습니다.\u003c/p>\n      \u003cp class=\"src\">CNBC·머니투데이 · 2026-09-23~09-25\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>美 10년물 국채금리는 19년 만의 최고치(5.135%)를 유지하고 있고, 10월 FOMC 추가 인상 확률도 70%대로 높은 수준입니다. 웨스팅하우스 지분 협상도 진전 없이 불확실성이 남아 있습니다.\u003c/p>\n      \u003cp class=\"src\">미디어파인·파이낸셜뉴스·이투데이 · 2026-09-24~09-25\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>국내 증시가 나흘간 쉬는 사이 해외 금리·환율·금리 인상 확률이 계속 움직였기 때문에, 9/28 재개장 첫 거래일에 이 변수들이 한꺼번에 반영될 수 있습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 9/28 재개장 이후 코스피·코스닥 첫 거래일 등락, 10월 FOMC(10/27~28) 확률 추이, 미국 3대지수 9/25 마감치의 정확한 거래일을 다음 보고서에서 재확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">05\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피·코스닥 9/28 재개장 첫 거래일 반응.\u003c/strong> 국채금리 5%대·FOMC 인상확률 70%대·뉴욕증시 반등을 나흘치로 한꺼번에 반영하는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>미국 증시 9/25(금) 마감 수치의 정확한 거래일.\u003c/strong> CNBC 기사 URL 날짜와 본문의 'Friday' 서술이 정확히 일치하는지 1차 자료로 재대조합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 5~10%대 협상.\u003c/strong> 최종 타결 지분율과 이사회 참여 여부가 언제 확정되는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>이란 신규 해상제한구역.\u003c/strong> 오늘 검색에서는 추가 확전이나 새 나포 소식이 확인되지 않았습니다 — 계속 추적합니다.\u003c/li>\n    \u003cli>\u003cstrong>스페이스X 스타십 14차 시험비행(9/28 예정).\u003c/strong> 실제 발사 결과와 방산·우주항공 테마 영향을 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-25", "dow": "금", "summary": "국내 증시는 추석 연휴로 이틀째(나흘째, 24~27일) 휴장을 이어갔습니다. 미국 증시는 9/24(현지시간) 국채금리 상승 부담 속에 혼조 마감했는데, 다우존스는 161.61포인트(0.31%) 내린 51,349.98을 기록했고 나스닥은 매체별로 '가까스로 상승'과 소폭 하락으로 엇갈려 보도됐습니다. 美 10년물 국채금리는 9/23 5.121%로 19년 만의 최고 수준을 유지했고, 10월 FOMC 추가 인상 확률은 매체별로 66.4%와 70.9%로 다르게 집계됐습니다. 원/달러 환율은 오늘 1,366원 안팎에서 어제와 비슷한 수준을 유지하고 있습니다. 웨스팅하우스 지분 '7%+α' 협상과 한미 MOU 서명은 여전히 결론이 나지 않았습니다.", "tally": {"ok": 4, "warn": 3, "bad": 0}, "kicker": ["자동생성·검색기반", "국내 증시 추석 연휴로 나흘째 휴장 — 재개장은 9월 28일 월요일", "미국 다우 9/24 161.61포인트(0.31%) 하락 마감, 나스닥은 매체별로 등락 방향 엇갈려", "美 10년물 국채금리 5.121%(9/23) 19년 만의 최고치 유지", "10월 FOMC 추가 인상 확률, 매체별로 66.4%와 70.9%로 다르게 집계"], "title": "국내 증시 연휴 나흘째 휴장 — 美 국채금리 5%대 지속, 10월 인상확률은 매체별로 엇갈려", "standfirst": "금요일인 오늘(9/25)도 국내 증시는 추석 연휴로 휴장을 이어갑니다. 24일부터 27일까지 나흘간 거래가 없으며, 9월 28일 월요일 오전 9시에 정상 거래를 재개합니다. 미국 증시는 9/24(현지시간) 국채금리 상승 부담을 소화하며 혼조세로 마감했는데, 다우존스는 161.61포인트(0.31%) 내린 51,349.98을 기록했고 나스닥은 매체에 따라 '가까스로 상승'과 소폭 하락으로 다르게 보도됐습니다. 美 10년물 국채금리는 9/23 5.121%까지 올라 2007년 이후 19년 만의 최고 수준을 이어갔고, 10월 FOMC 추가 금리 인상 확률은 매체별로 66.4%와 70.9%로 엇갈려 집계됐습니다. 원/달러 환율은 오늘 1,366원 안팎에서 큰 변동 없이 거래되고 있습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "국제뉴스·위키트리·CBC뉴스·파이낸셜뉴스·한국일보·한국경제·Investing.com·다음금융 (2026-09-23~09-25 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">금요일인 오늘(9/25)도 국내 증시는 추석 연휴로 휴장을 이어가며, 9월 28일 월요일 오전 9시에 거래를 재개합니다. 표에는 확인 가능한 가장 최신 수치를 담았습니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피·코스닥 (9/24~27)\u003c/td>\u003ctd class=\"num\">휴장\u003c/td>\u003ctd>추석 연휴, 재개장은 9/28 월요일(국제뉴스·위키트리)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/24 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">51,349.98 (-0.31%)\u003c/td>\u003ctd>161.61포인트 내림, 국채금리 상승 부담(CBC뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/24 마감)\u003c/td>\u003ctd class=\"num\">방향 상충\u003c/td>\u003ctd>'가까스로 상승'(CBC뉴스) vs 소폭 하락(타 집계) — 검증 보류\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>美 10년물 국채금리 (9/23)\u003c/td>\u003ctd class=\"num\">5.121%\u003c/td>\u003ctd>2007년 이후 19년 만의 최고 수준(파이낸셜뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/25, 실시간)\u003c/td>\u003ctd class=\"num\">1,366.01원\u003c/td>\u003ctd>매수 1,365.26 · 매도 1,366.75(Investing.com)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>국내 증시가 휴장인 가운데 시장의 관심은 미국 국채금리와 10월 FOMC 전망에 쏠려 있습니다. 美 10년물 국채금리는 지난주부터 이어진 상승세 속에 5%대를 유지하고 있고, 이는 9/28 국내 증시 재개장 이후 반응에 영향을 줄 변수로 꼽힙니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">국내 증시 일정\u003c/span>\u003c/div>\n      \u003ch4>국내 증시, 추석 연휴로 나흘째(9/24~27) 휴장 지속 — 재개장은 9/28 월요일\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>국제뉴스·위키트리에 따르면 올해 추석 연휴는 9월 24일부터 27일까지 이어지며, 코스피·코스닥은 이 기간 거래가 없고 9월 28일 월요일 정규장부터 거래를 재개합니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미국 증시(9/24, 현지시간)\u003c/span>\u003c/div>\n      \u003ch4>다우존스, 국채금리 상승 부담에 161.61포인트(0.31%) 내린 51,349.98 마감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>CBC뉴스에 따르면 9/24(현지시간) 다우존스30 산업평균지수는 전 거래일보다 161.61포인트(0.31%) 내린 51,349.98에 마감했습니다. 전날(9/23) 마감가 51,511.59에서 추가로 밀린 수치로, 장기 국채금리 상승 부담을 소화하는 과정으로 풀이됩니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">상충\u003c/span>\u003cspan class=\"src\">나스닥(9/24)\u003c/span>\u003c/div>\n      \u003ch4>나스닥 등락 방향, 매체별로 엇갈려 보도 — 정확한 등락률은 검증 보류\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>CBC뉴스는 같은 날 시황을 \"다우 161P↓·나스닥 가까스로 상승\"으로 제목을 달아 나스닥이 소폭 상승했다고 전했으나, 다른 집계에서는 나스닥이 소폭 하락했다는 상충된 수치도 확인됩니다. 어느 쪽이 정확한지는 1차 확정치 대조가 필요합니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미 국채금리\u003c/span>\u003c/div>\n      \u003ch4>美 10년물 국채금리 5.121%(9/23) — 2007년 이후 19년 만의 최고 수준 유지\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스에 따르면 9/23 미국채 10년물 금리는 5.121%를 기록해 2007년 7월 12일 이후 19년 2개월 만에 5.1%를 웃돌았습니다. 이 수준은 지난 보고서(9/24) 이후에도 그대로 유지되고 있는 것으로 확인됩니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">상충\u003c/span>\u003cspan class=\"src\">10월 FOMC 인상 확률\u003c/span>\u003c/div>\n      \u003ch4>10월 추가 인상 확률, 매체별로 66.4%와 70.9%로 다르게 집계\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스는 9/24 기사에서 10월 0.25%p 추가 인상 가능성을 66.4%로 보도했으나, 같은 매체의 다른 기사(9/23~24)는 하루 전 55.4%에서 70.9%로 급등했다고 전해 두 수치가 상충합니다. 기준 시각이 다른 CME 페드워치 집계로 추정되나 정확한 발표 시각은 스니펫에서 확인되지 않아 검증 보류로 남습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>원/달러 환율, 오늘 1,366원대에서 어제와 비슷한 수준 유지\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>Investing.com 기준 오늘(9/25) USD/KRW는 1,366.01원(매수 1,365.26·매도 1,366.75)으로, 어제(9/24) 실시간가 1,366.59원과 큰 차이 없이 거래되고 있습니다. 국내 증시 휴장 중이라 변동성은 제한적인 것으로 보입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">확정 안 됨\u003c/span>\u003cspan class=\"src\">웨스팅하우스·MOU\u003c/span>\u003c/div>\n      \u003ch4>웨스팅하우스 지분 '7%+α' 협상과 한미 MOU 서명, 여전히 결론 없음\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>한국경제·한국일보에 따르면 웨스팅하우스 지분 확보 목표는 '7%+α' 수준에서 계속 타진 중이며 이사회 진입은 어려울 전망입니다. 대미투자 MOU 서명 역시 9월 내 타결이 불투명하다는 보도가 이어지고 있어, 어제(9/24) 보고서 이후 새로운 진전은 확인되지 않았습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 국채금리 5%대가 코스피 재개장(9/28)에 어떤 영향을 줄지\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">국내 증시가 휴장인 나흘 동안 미국 국채금리와 인상 확률이 계속 움직이고 있어, 재개장 첫날 그 누적 영향이 한꺼번에 반영될 가능성이 있습니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>안심 근거\u003c/h4>\n      \u003cp>코스피는 연휴 직전 3거래일 연속 상승하며 7,000선 위에서 휴장에 들어갔습니다. 국채금리 5%대 진입은 지난주부터 이어진 흐름이라 이미 어느 정도 알려진 재료이기도 합니다.\u003c/p>\n      \u003cp class=\"src\">머니투데이·firebat · 2026-09-23\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>10월 FOMC 추가 인상 확률이 매체별로 66~71%까지 보도되며 높은 수준을 유지하고 있고, 미국 3대 지수도 9/23~24 이틀 연속 약세 또는 혼조 마감했습니다. 웨스팅하우스·MOU 협상도 진전 없이 불확실성이 남아 있습니다.\u003c/p>\n      \u003cp class=\"src\">파이낸셜뉴스·CBC뉴스·한국경제 · 2026-09-23~09-25\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>국내 증시가 쉬는 동안에도 해외 금리·환율 변수는 계속 움직이기 때문에, 9/28 재개장 첫 거래일에 나흘치 누적 영향이 한 번에 반영될 수 있습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 9/28 재개장 이후 코스피·코스닥 첫 거래일 등락, 10월 FOMC(10/27~28) 확률 추이, 나스닥 9/24 정확한 등락률 확정치를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피·코스닥 9/28 재개장 첫 거래일 반응.\u003c/strong> 국채금리 5%대·인상확률 상승을 나흘치로 한꺼번에 반영하는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>나스닥 9/24 정확한 등락률.\u003c/strong> '가까스로 상승'과 소폭 하락으로 엇갈린 두 보도 중 어느 쪽이 확정치와 일치하는지 대조합니다.\u003c/li>\n    \u003cli>\u003cstrong>10월 FOMC 인상 확률 66.4% vs 70.9%.\u003c/strong> 두 수치의 기준 시각을 확인해 어느 쪽이 최신값인지 정리합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분·한미 MOU 서명.\u003c/strong> '7%+α' 협상이 실제 몇 %로 마무리되는지, 서명이 9월을 넘기는지 계속 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-24", "dow": "목", "summary": "추석 연휴로 국내 증시가 9/24~25 이틀간 휴장한 가운데, 마지막 거래일인 9/23 코스피는 63.01포인트(0.90%) 오른 7,080.92, 코스닥은 10.10포인트(1.21%) 오른 844.48로 마감해 3거래일 연속 상승했습니다. 반면 미국 증시는 9/23(현지시간) 국채금리 급등의 직격탄을 맞아 다우 -0.68%, S&P500 -0.75%, 나스닥 -1.13%로 3대 지수가 동반 하락했습니다. 美 10년물 국채금리는 5.12%까지 치솟아 19년 만에 최고치를 새로 썼고, 10월 FOMC 추가 인상 확률은 하루 만에 55.4%에서 70.9%로 급등했습니다. 지난주부터 지켜본 한미 대미투자 MOU의 '22일 서명 유력' 예측은 빗나갔고, 서명 시점 자체가 9월을 넘길 수 있다는 보도가 새로 나왔습니다.", "tally": {"ok": 5, "warn": 3, "bad": 1}, "kicker": ["자동생성·검색기반", "코스피 9/23 마감 7,080.92(+0.90%) — 추석 연휴로 9/24~25 휴장, 재개장은 9/28", "미국 3대 지수 9/23 동반 하락 — 국채금리 급등에 다우 -0.68%·나스닥 -1.13%", "美 10년물 국채금리 5.12% — 19년 만에 최고, 10월 인상확률 70.9%로 급등", "한미 대미투자 MOU '22일 서명 유력' 예측 빗나가 — 9월 내 타결도 불투명"], "title": "국내 증시 추석 휴장 — 미국은 국채금리 5.12%에 3대 지수 동반 하락", "standfirst": "목요일인 오늘(9/24)부터 국내 증시는 추석 연휴로 이틀간(9/24~25) 휴장하며, 9월 28일 월요일 오전 9시에 거래를 재개합니다. 연휴 직전 마지막 거래일인 9/23 코스피는 전 거래일보다 63.01포인트(0.90%) 오른 7,080.92로 마감해 3거래일 연속 상승했고, 코스닥도 10.10포인트(1.21%) 오른 844.48로 마감했습니다. 반면 미국 증시는 같은 날(9/23, 현지시간) 국채금리가 가파르게 오르며 다우존스 51,511.59(-0.68%)·S&P500 7,706.03(-0.75%)·나스닥 26,936.04(-1.13%)로 3대 지수가 일제히 약세로 돌아섰습니다. 美 10년물 국채금리는 장중 5.12%까지 치솟아 2007년 이후 19년 만에 최고 수준을 새로 썼고, 시카고상업거래소(CME) 페드워치 기준 10월 FOMC 추가 금리 인상 확률은 하루 전 55.4%에서 70.9%로 급등했습니다. 이 시리즈가 지켜본 한미 대미투자 MOU의 '22일 오후 서명 유력' 예측은 빗나갔고, 정부가 목표로 밝혔던 9월 말 서명 시점 자체가 밀릴 수 있다는 보도가 새로 나왔습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "머니투데이·firebat·파이낸셜뉴스·한국일보·한국경제·국제뉴스·Businesskorea·뉴스1·위키트리·alphasquare/Investing.com (2026-09-23~09-24 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — '22일 서명 유력' 예측은 빗나갔습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card\">\n      \u003ch4>한미 대미투자 MOU, '22일 오후(22시 이후) 서명 유력' 보도와 달리 서명되지 않았다\u003c/h4>\n      \u003cp>지난 보고서가 지켜본 서명 시점 예측은 이번 검색 시점(9/24)까지 확인되지 않았습니다. 정부가 목표로 밝혔던 \u003cstrong>9월 말 서명 시점 자체가 밀릴 수 있다\u003c/strong>는 보도가 새로 나왔습니다(한국일보 \"대미투자 1호 서명 9월 넘기나\").\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>웨스팅하우스 지분, '15%+의결권' 목표에서 '7%+α'로 더 낮아진 채 이사회 참여도 불확실\u003c/h4>\n      \u003cp>한국은 웨스팅하우스 지분을 15% 안팎, 의결권 확보까지 목표로 했으나 최근 보도에서는 \u003cstrong>7%+α\u003c/strong> 수준에서 타진 중이며, 이사회 진입도 쉽지 않을 것으로 전해졌습니다(한국경제). 최종 지분율과 이사회 참여 여부는 여전히 확정되지 않아 검증 보류로 남습니다.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">목요일인 오늘(9/24)부터 국내 증시는 추석 연휴로 이틀간(9/24~25) 휴장하며 9월 28일(월) 오전 9시에 거래를 재개합니다. 표에는 국내는 연휴 직전 마지막 거래일인 9/23 마감치를, 미국은 같은 날(현지시간) 마감치를 담았습니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/23 마감, 연휴 직전 마지막 거래일)\u003c/td>\u003ctd class=\"num up\">7,080.92 (+0.90%)\u003c/td>\u003ctd>63.01포인트 오름, 3거래일 연속 상승(머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/23 마감)\u003c/td>\u003ctd class=\"num up\">844.48 (+1.21%)\u003c/td>\u003ctd>10.10포인트 오름(머니투데이)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/23 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">51,511.59 (-0.68%)\u003c/td>\u003ctd>352.10포인트 내림, 국채금리 급등에 약세(firebat)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/23 마감)\u003c/td>\u003ctd class=\"num down\">7,706.03 (-0.75%)\u003c/td>\u003ctd>58.61포인트 내림\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/23 마감)\u003c/td>\u003ctd class=\"num down\">26,936.04 (-1.13%)\u003c/td>\u003ctd>308.24포인트 내림, 전날 사상 최고치에서 조정(firebat)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/24, 실시간)\u003c/td>\u003ctd class=\"num\">1,366.59원\u003c/td>\u003ctd>오늘 범위 1,346.70~1,370.15원, 개장 1,354.10원(alphasquare)\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>국내 증시는 추석 연휴로 문을 닫았지만, 미국 국채금리 급등과 다음 달 FOMC 인상 전망 강화는 재개장(9/28) 이후 국내 시장 반응을 좌우할 변수로 꼽힙니다. 코스피는 연휴 직전 거래일(9/23) 장중 한때 7,153까지 오르기도 했으나, 연휴를 앞둔 관망 심리에 상승폭을 일부 반납하고 7,080.92로 마감했습니다(firebat).\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">02\u003c/span>\u003ch3>오늘 확인된 것들\u003c/h3>\u003c/div>\n  \u003cdiv class=\"claims\">\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">국내 증시 일정\u003c/span>\u003c/div>\n      \u003ch4>국내 증시, 추석 연휴로 9/24~25 이틀간 휴장 — 재개장은 9/28 월요일\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>국제뉴스·위키트리에 따르면 코스피·코스닥은 추석 연휴로 9월 24일(목)·25일(금) 휴장하며, 주말을 거쳐 9월 28일(월) 오전 9시부터 정상 거래를 재개합니다. 미국 증시는 연휴와 무관하게 정상 운영됩니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">코스피·코스닥 마감(9/23)\u003c/span>\u003c/div>\n      \u003ch4>코스피·코스닥, 연휴 직전 마지막 거래일 나란히 상승 마감\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>머니투데이에 따르면 코스피는 63.01포인트(0.90%) 오른 7,080.92, 코스닥은 10.10포인트(1.21%) 오른 844.48로 마감했습니다. firebat 집계 기준 코스피는 장중 7,153까지 올랐다가 상승폭을 일부 반납했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미국 증시(9/23, 현지시간)\u003c/span>\u003c/div>\n      \u003ch4>미국 3대 지수, 국채금리 급등에 일제히 하락 — 나스닥은 전날 사상 최고치에서 조정\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>firebat에 따르면 9/23(현지시간) 다우존스는 352.10포인트(0.68%) 내린 51,511.59, S&amp;P500은 58.61포인트(0.75%) 내린 7,706.03, 나스닥은 308.24포인트(1.13%) 내린 26,936.04로 마감했습니다. 전날(9/22) 사상 최고치를 새로 썼던 나스닥이 하루 만에 조정을 받았습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-ok\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip ok\">사실\u003c/span>\u003cspan class=\"src\">미 국채금리·연준\u003c/span>\u003c/div>\n      \u003ch4>美 10년물 국채금리 5.12% — 2007년 이후 19년 만에 최고, 10월 인상확률 70.9%로 급등\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>파이낸셜뉴스에 따르면 9/23(현지시간) 美 10년물 국채수익률은 5.12%까지 치솟아 19년 만에 최고 수준을 기록했습니다. CME 페드워치 기준 10월 FOMC 0.25%p 추가 인상 확률은 전날 55.4%에서 70.9%로 급등했고, 한 달 전(8.8%)과 비교하면 8배 넘게 뛰었습니다. 30년물 금리도 0.101%p 오른 5.404%를 기록했습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">실시간·확정 아님\u003c/span>\u003cspan class=\"src\">원/달러 환율\u003c/span>\u003c/div>\n      \u003ch4>원/달러 환율, 오늘 1,346~1,370원대에서 등락 — 장중 실시간 시세로 확정치 아님\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>alphasquare 집계 기준 오늘(9/24) 원/달러는 1,354.10원으로 출발해 1,346.70~1,370.15원 범위에서 거래되고 있고, 검색 시점 실시간가는 1,366.59원입니다. 국내 증시 휴장일이라 은행 간 거래도 평소보다 관심이 적어 변동성 해석에는 주의가 필요합니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-warn\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip warn\">확정 안 됨\u003c/span>\u003cspan class=\"src\">웨스팅하우스\u003c/span>\u003c/div>\n      \u003ch4>웨스팅하우스 지분, '7%+α'로 낮아진 협상안 — 이사회 참여는 어려울 전망\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>한국경제에 따르면 한국 측은 웨스팅하우스 지분을 '7%+α' 수준에서 타진 중이며, 이사회 진입은 쉽지 않을 것으로 전해졌습니다. 당초 목표였던 15% 안팎·의결권 확보와는 거리가 있는 수치이며, 최종 확정치는 아직 나오지 않았습니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n\n    \u003cdiv class=\"claim v-bad\">\u003cdiv class=\"vrail\">\u003c/div>\u003cdiv class=\"cbody\">\n      \u003cdiv class=\"ctop\">\u003cspan class=\"chip bad\">예측 빗나감\u003c/span>\u003cspan class=\"src\">대미투자 MOU\u003c/span>\u003c/div>\n      \u003ch4>'9월 말 서명' 목표도 밀릴 수 있다는 보도 — 대통령의 '속도전 제동' 발언 이후 더 불투명\u003c/h4>\n      \u003cdiv class=\"kv found\">\u003cspan class=\"lbl\">사실\u003c/span>\u003cspan>한국일보에 따르면 정부가 목표로 밝혔던 대미투자 1호 프로젝트 MOU의 9월 말 서명 시점 자체가 밀릴 가능성이 제기됐습니다. 이재명 대통령이 미국 측의 속도전 요구에 제동을 걸며 상업적 합리성을 따져야 한다는 입장을 재확인한 이후 나온 보도입니다.\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">03\u003c/span>\u003ch3>쟁점 — 국내 증시는 3거래일 연속 상승했지만, 재개장 이후 미국발 금리 충격을 어떻게 소화할지가 관건입니다\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">코스피·코스닥은 연휴 직전 상승세로 마감했지만, 같은 날 미국은 국채금리 급등에 3대 지수가 동반 하락했습니다. 이틀의 휴장 동안 쌓일 해외 변수를 9/28 재개장에서 한꺼번에 반영해야 합니다.\u003c/p>\n  \u003cdiv class=\"versus\">\n    \u003cdiv class=\"side bull\">\n      \u003ch4>강세 근거\u003c/h4>\n      \u003cp>코스피·코스닥은 3거래일 연속 상승하며 연휴에 들어갔습니다. 이란과의 외교 채널이 가동 중이라는 점도 지정학 리스크를 다소 누그러뜨리는 요인으로 꼽힙니다.\u003c/p>\n      \u003cp class=\"src\">머니투데이·firebat · 2026-09-23\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"side bear\">\n      \u003ch4>경계 근거\u003c/h4>\n      \u003cp>미국 국채금리가 19년 만에 최고치로 치솟았고 10월 추가 인상 확률이 하루 만에 15%p 이상 급등했습니다. 나스닥은 전날 사상 최고치에서 하루 만에 조정을 받았고, 대미투자 MOU 서명은 목표 시점을 지키지 못할 가능성이 제기됐습니다.\u003c/p>\n      \u003cp class=\"src\">파이낸셜뉴스·한국일보·firebat · 2026-09-23~09-24\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"callout\">\n    \u003ch4>왜 이게 결정적인가\u003c/h4>\n    \u003cp>국내 증시가 휴장하는 이틀(9/24~25) 동안 미국 국채금리·연준 인상 전망이 추가로 움직일 경우, 9/28 재개장 첫 거래일에 그 영향이 한꺼번에 반영될 가능성이 있습니다.\u003c/p>\n    \u003cp>\u003cstrong>확인 방법\u003c/strong> — 9/28 재개장 이후 코스피·코스닥 첫 거래일 반응, 美 10월 FOMC(10/27~28) 전망 변화, 대미투자 MOU 실제 서명 여부를 다음 보고서에서 확인합니다.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">04\u003c/span>\u003ch3>다음 추적 대상\u003c/h3>\u003c/div>\n  \u003col class=\"lessons\">\n    \u003cli>\u003cstrong>코스피·코스닥 9/28 재개장 첫 거래일 반응.\u003c/strong> 미국 국채금리 급등·3대 지수 하락을 이틀치로 한꺼번에 반영하는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>美 10월 FOMC 인상 확률 추이.\u003c/strong> 70.9%까지 오른 확률이 이후 발표되는 지표에 따라 더 오르는지, 진정되는지 계속 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>한미 대미투자 MOU 실제 서명 여부와 시점.\u003c/strong> '9월 말' 목표가 실제로 밀리는지, 밀린다면 새 목표 시점이 언제로 제시되는지 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>웨스팅하우스 지분 최종 확정치.\u003c/strong> '7%+α' 협상안이 실제 어떤 수치로 마무리되는지, 이사회 참여 여부를 확인합니다.\u003c/li>\n    \u003cli>\u003cstrong>스페이스X 스타십 14차 시험비행(9/28 예정).\u003c/strong> 국내 증시 재개장과 같은 날 예정된 발사 결과와 방산·우주항공 테마 영향을 확인합니다.\u003c/li>\n  \u003c/ol>\n\u003c/section>\n"}, {"date": "2026-09-23", "dow": "수", "summary": "수요일인 오늘 확인한 가장 최근 거래일(9/22) 마감치에서 코스피는 10.19포인트(0.15%) 오른 7,017.91로 이틀 연속 7,000선을 지켰지만, 장중 2.20% 급등분은 대부분 반납했습니다. 코스닥은 5거래일 연속 상승 뒤 0.23% 내린 834.38로 마감했습니다. 나스닥은 마이크론 등 반도체 강세에 27,244.28(+0.45%)로 이틀 연속 사상 최고치를 새로 썼고, 다우는 51,863.80(-0.36%)으로 소폭 내려 혼조 마감했습니다. 지난주부터 지켜본 원/달러 1,400원 재돌파 여부는 정반대로 결론나 오늘 1,350원대까지 내려왔습니다. 대미투자 MOU는 국회 보고까지는 예정대로 진행됐지만 대통령의 '속도전 제동' 발언 이후 실제 서명 여부는 확인되지 않았고, 이란은 호르무즈 일대 해상제한구역을 아라비아해까지 넓히면서도 동시에 미국과 외교 협상을 이어갔습니다.", "tally": {"ok": 6, "warn": 4, "bad": 1}, "kicker": ["자동생성·검색기반", "코스피 9/22 마감 7,017.91(+0.15%) — 7,000선 이틀째 사수, 장중 급등분은 반납", "나스닥 9/22 27,244.28(+0.45%) — 2거래일 연속 사상 최고", "원/달러 1,350원대로 하락 — 1,400원 재돌파 예측은 정반대로 빗나감", "이란-호르무즈, 확전 대신 외교 협상 국면 확인"], "title": "코스피, 7,000선 이틀째 지켰다 — 원/달러는 1,400원 문턱에서 정반대로 갔다", "standfirst": "수요일인 오늘(9/23) 이 시리즈가 확인한 가장 최근 거래일인 9/22(화) 마감 기준으로 코스피는 전 거래일보다 10.19포인트(0.15%) 오른 7,017.91로 마감해 9/21에 이어 이틀 연속 7,000선을 지켰습니다. 장중 한때 2.20% 급등해 7,161.61까지 올랐지만 외국인·기관 매도가 겹치며 상승폭 대부분을 반납했습니다. 코스닥은 5거래일 연속 상승 뒤 하루 만에 1.89포인트(0.23%) 내린 834.38로 마감했습니다. 미국 나스닥은 27,244.28(+0.45%)로 이틀 연속 사상 최고치를 새로 썼지만 다우는 51,863.80(-0.36%)으로 소폭 내려 혼조 마감했습니다. 이 시리즈가 지난주부터 지켜본 원/달러 1,400원 재돌파 여부는 정반대로 결론났습니다 — 환율은 오늘 1,350원대까지 내려와 있습니다. 이란은 호르무즈·오만해에 이어 아라비아해까지 해상제한구역을 넓혔다고 발표했지만, 동시에 유엔총회에서는 미국과 해협 재개방 조건을 논의하는 외교 채널도 가동 중입니다. 한미 대미투자 MOU는 22일 국회 보고까지는 예정대로 진행됐으나, 대통령이 '속도전에 제동'을 걸었다는 보도가 나오며 실제 서명은 이번 검색 시점까지 확인되지 않았습니다. 이 보고서는 검색 스니펫만으로 작성되어 스레드 계정 대조가 빠져 있습니다.", "sources": "머니투데이·비즈니스코리아·파이낸셜뉴스·아시아경제·이투데이·서울신문·서울경제·한국일보·네이트뉴스·헤럴드경제·뉴스핌·디지털포커스·MBC뉴스·SBS Biz·Investing.com (2026-09-21~09-23 스니펫 기준)", "body": "\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">추적\u003c/span>\u003ch3>추적 결과 — 코스피는 7,000선을 지켰고, 원/달러 1,400원 예측은 정반대로 빗나갔습니다\u003c/h3>\u003c/div>\n  \u003cdiv class=\"heads\">\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>코스피, 9/22에도 7,000선 지켜냈다 — 다만 장중 급등분은 대부분 반납\u003c/h4>\n      \u003cp>코스피는 9/22 10.19포인트(0.15%) 오른 \u003cstrong>7,017.91\u003c/strong>로 마감해 7,000선을 이틀째 지켰습니다. 장중 한때 2.20% 급등해 7,161.61까지 올랐지만 개인·기관 매도가 겹치며 상승폭 대부분을 반납했습니다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card\">\n      \u003ch4>원/달러 1,400원 재돌파 예측, 정반대로 빗나갔다 — 오히려 1,350원대로 내려왔다\u003c/h4>\n      \u003cp>지난주 1,382원대에서 1,400원 재돌파 여부를 지켜보던 원/달러 환율은 오늘(9/23) \u003cstrong>1,352.66~1,375.73원\u003c/strong> 범위에서 거래되며 오히려 원화 강세로 돌아섰습니다. 1,400원과는 정반대 방향입니다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>대미투자 MOU·웨스팅하우스 지분, 대통령 '속도전 제동' 발언 이후 오히려 더 불투명해졌다\u003c/h4>\n      \u003cp>9/22 국회 보고는 예정대로 진행됐지만, 뒤이을 것으로 알려졌던 MOU 서명은 이번 검색 시점까지 확인되지 않습니다. 이재명 대통령이 미국 측의 속도전 요구에 제동을 걸며 '상업적 합리성'을 따져야 한다고 밝혀, \u003cstrong>서명이 9월을 넘길 가능성\u003c/strong>이 새로 제기됐습니다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card amber\">\n      \u003ch4>스페이스X 스타십 14차 시험비행, 22일이 아닌 28일로 연기 확정\u003c/h4>\n      \u003cp>방산·우주항공 테마에 영향을 줄 것으로 지켜보던 14차 시험비행은 예정됐던 9/22가 아니라 \u003cstrong>9월 28일\u003c/strong>로 연기가 확정됐습니다. 실제 발사 결과와 테마 영향은 다음 추적 대상으로 넘깁니다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"head-card good\">\n      \u003ch4>이란-호르무즈, 우려했던 추가 확전 대신 외교 협상 국면으로 확인\u003c/h4>\n      \u003cp>이란은 해상제한구역을 아라비아해까지 넓혔다고 밝혔지만, 동시에 유엔총회 기간 미국 특사와 만나 해협 재개방 조건을 논의한 것으로 확인됐습니다. \u003cstrong>추가 군사 확전은 이번 검색에서 확인되지 않았습니다.\u003c/strong>\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-n\">01\u003c/span>\u003ch3>오늘 시장\u003c/h3>\u003c/div>\n  \u003cp class=\"sec-sub\">수요일인 오늘(9/23) 국내 증시는 검색 시점 기준 새 마감치가 없어 가장 최근 거래일인 9/22(화) 마감치를 표에 담았습니다. 미국 지수도 현지시간 가장 최근 마감인 9/22(화, 한국시간 9/23 새벽 보도) 수치입니다. 한국 관행대로 \u003cspan class=\"up\">상승은 빨강\u003c/span>, \u003cspan class=\"down\">하락은 파랑\u003c/span>으로 표시합니다.\u003c/p>\n  \u003cdiv class=\"tscroll\">\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>수치\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>코스피 (9/22 마감)\u003c/td>\u003ctd class=\"num up\">7,017.91 (+0.15%)\u003c/td>\u003ctd>10.19포인트 오름, 7,000선 이틀째 사수(머니투데이·비즈니스코리아)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>코스닥 (9/22 마감)\u003c/td>\u003ctd class=\"num down\">834.38 (-0.23%)\u003c/td>\u003ctd>1.89포인트 내림, 5거래일 연속 상승 뒤 하루 만에 조정(아시아경제)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>다우 (9/22 마감, 현지시간)\u003c/td>\u003ctd class=\"num down\">51,863.80 (-0.36%)\u003c/td>\u003ctd>185.03포인트 내림, 기술주와 혼조(파이낸셜뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>S&amp;P500 (9/22 마감)\u003c/td>\u003ctd class=\"num\">7,764.64 (-0.00%)\u003c/td>\u003ctd>0.06포인트 내림, 사실상 보합\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>나스닥 (9/22 마감)\u003c/td>\u003ctd class=\"num up\">27,244.28 (+0.45%)\u003c/td>\u003ctd>2거래일 연속 사상 최고치, 반도체 강세 견인(파이낸셜뉴스)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>원/달러 환율 (9/23, 실시간)\u003c/td>\u003ctd class=\"num\">1,355
