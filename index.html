나는 어긋났고, 예측 하나는 아직 채점을 못 했습니다.</strong> 셋 다 그대로 적습니다.</p>\n<hr>\n<h2>③ 숫자 3개</h2>\n<div class=\"tscroll\"><table><thead><tr><th>숫자</th><th>값</th><th>비교하면</th></tr></thead><tbody><tr><td>미국 기준금리</td><td><strong>3.75~4.00%</strong> (9/16, +0.25%p)</td><td>만장일치. 실효금리 3.63 → 3.88%</td></tr><tr><td>SK하이닉스</td><td><strong>1,857,000원</strong> (9/18, +6.42%)</td><td>9일 고점 1,856,000원 경신. 15일 대비 +9.9%</td></tr><tr><td>원/달러 매매기준율</td><td><strong>1,383.8원</strong> (9/21)</td><td>10일 1,337.9원에서 7거래일 <strong>+45.9원</strong></td></tr></tbody></table></div>\n<blockquote><p><strong>용어 정리</strong> — *매매기준율*은 한국은행이 매일 아침 고시하는 기준 환율입니다. *10년물*은 미국 정부가 10년 빌릴 때 내는 이자율입니다. *순매도*는 판 게 많다는 뜻, *수급*은 누가 사고 누가 팔았는지입니다.</p></blockquote>\n<hr>\n<h2>④ 채점표</h2>\n<h3>예측 1 — 9월 FOMC 인상 · <strong>적중</strong></h3>\n<div class=\"tscroll\"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td><strong>명제</strong></td><td>9월 15~16일 FOMC(연방공개시장위원회)에서 기준금리를 인상한다</td></tr><tr><td><strong>결과</strong></td><td>16일 0.25%포인트 인상, 3.75~4.00%. 만장일치 (연준 보도자료)</td></tr><tr><td><strong>우리 확률</strong></td><td>시장 확률 채택 — 8/28 57% → 9/15 91~92%대</td></tr><tr><td><strong>채점일</strong></td><td>2026-09-17 (실제 채점 9/21, 4일 지연)</td></tr><tr><td><strong>채점 메모</strong></td><td>명제는 적중했습니다. 다만 저희가 확률을 만든 게 아니라 <strong>시장 확률을 채택</strong>했습니다. 한 번의 결과로 그 규칙 자체를 채점하지는 않습니다. 8/31 시나리오표 \"고용 호조+물가 상승 → 70%대\"는 방향은 맞았지만 시장은 92%까지 갔습니다. 저희 눈금이 보수적이었습니다</td></tr></tbody></table></div>\n<h3>예측 2 — 9/15까지 외국인 순매도 누적 유지 · <strong>채점 지연</strong></h3>\n<div class=\"tscroll\"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td><strong>명제</strong></td><td>9월 15일까지 외국인이 코스피에서 순매도 누적을 유지한다</td></tr><tr><td><strong>채점 기준</strong></td><td>9/1~15 정규장·코스피, 한국거래소 공식 누적 순매매액 <strong>0원 미만이면 적중</strong></td></tr><tr><td><strong>반증 조건</strong></td><td>한국거래소 공식 누적 순매매액 0원 이상 (채점 기준과 동일)</td></tr><tr><td><strong>우리 확률</strong></td><td>산정 보류 유지</td></tr><tr><td><strong>채점일</strong></td><td>2026-09-16 — <strong>지연.</strong> 거래소 투자자별 통계는 로그인이 필요하고, 저희는 아직 그 경로가 없습니다</td></tr><tr><td><strong>상태</strong></td><td><strong>HUMAN_REVIEW_REQUIRED — 한국거래소 공식 누적 미확보.</strong> 다음 확인 예정 <strong>9월 23일(수)</strong></td></tr><tr><td><strong>약속</strong></td><td>23일에 결과 또는 못 한 사유를 적습니다. 그전에 추정치로 채우지 않습니다</td></tr></tbody></table></div>\n<hr>\n<h2>⑤ 어긋난 해석 — 무엇이 달랐나</h2>\n<p>8월 31일과 9월 15일 글에 이렇게 썼습니다. \"금리가 오르면 비싸게 값이 매겨진 자산부터 맞고, 코스피에선 반도체다.\"</p>\n<p>15일 글에서는 11~14일 낙폭의 원인으로 <strong>A 금리 재평가</strong>가 <strong>B 급등 되돌림</strong>보다 우세하다고 봤습니다.</p>\n<p>실제는 이랬습니다. 10년물은 15일 <strong>5.00%</strong>, 인상 당일 5.01%였습니다. 17일 4.94%로 내렸다가 18일 5.01%로 복귀했습니다. 금리는 5% 언저리에 머물렀습니다.</p>\n<p>그런데 15일에서 18일 사이 삼성전자 <strong>+5.0%</strong>, SK하이닉스 <strong>+9.9%</strong>.</p>\n<p><strong>금리가 5% 언저리인 채로 반도체가 올랐으니, A만으로는 설명력이 약해졌습니다.</strong> 다만 3거래일 반등으로 11~14일 낙폭의 원인을 확정하지는 않습니다. B(급등 되돌림)가 맞았다고 단정하지도 않습니다.</p>\n<p>여기부터는 해석입니다. 사실이 아닙니다.</p>\n<p><strong>왜 어긋났나 — 해석 1.</strong> 인상은 시장 확률 91~92%대로 이미 가격에 들어 있었습니다. 인상 자체의 새 정보가 적어, 매도 재료로는 약했을 수 있습니다.</p>\n<p><strong>해석 2.</strong> 원화가 7거래일에 46원 약해졌습니다. 달러 투자자에겐 같은 주식이 싸집니다 — 9/7 글에서 정정한 그 방향입니다. 다만 외국인이 실제로 샀는지는 공식 수급이 없어 모릅니다.</p>\n<p>저희는 1이 우세하다고 봅니다. 2는 수급을 읽을 수 있을 때 다시 봅니다.</p>\n<hr>\n<h2>⑥ 이번 주에 볼 것</h2>\n<p>이 채널이 추적해 온 미국 일정은 <strong>전부 이번 주 밖</strong>입니다. 8월 개인소비지출 물가와 2분기 GDP(국내총생산) 확정치는 9/30 밤 9시 30분입니다. 고용은 10/2, 다음 FOMC는 10/27~28입니다.</p>\n<p>그래서 이번 주 볼 것은 하나입니다. <strong>원/달러가 1,380원 위에 머무는지.</strong> 8월 말(1,380.3원) 수준을 넘었고, 위에 머물면 해석 2의 무게가 커집니다.</p>\n<p><strong>채점 대기</strong> — 예측 2는 일정이 아니라 접근의 문제라 따로 둡니다. 다음 확인 9월 23일.</p>\n<hr>\n<h2>⑦ 그래서 이 감정은</h2>\n<p><strong>금리 인상 뉴스에 파셨다면 — 교과서대로 읽으신 겁니다.</strong> 저희도 그렇게 썼습니다. 다만 시장은 그 교과서를 발표 전에 이미 읽고 가격에 넣어뒀습니다.</p>\n<p><strong>\"팔았는데 오른다\"는 기분</strong> — 정보가 늦어서가 아닙니다. 다 아는 정보가 이미 값에 들어 있어서 생깁니다. 다음에 \"뉴스가 나왔다\"와 \"시장이 몰랐다\"를 한 번만 구분해 보시면 좋겠습니다.</p>\n<p>저희는 맞은 것 하나, 어긋난 것 하나, 못 한 것 하나를 적었습니다. 이 기록은 지우지 않습니다.</p>\n<p><strong>인상 발표 전후, 사셨어요 파셨어요 그냥 두셨어요?</strong> 어느 쪽이었는지, 그 이유가 궁금합니다.</p>\n<hr>\n<p><sub>이 글은 정보 제공을 목적으로 하며, 특정 종목의 매수·매도를 권유하지 않습니다. 투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다. 초안은 AI가 쓰고 발행 전 사람이 검수합니다.</sub></p>\n<p><strong>출처</strong></p>\n<ul><li>FOMC 결정: <a href=\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260916a.htm\" target=\"_blank\" rel=\"noopener\">연준 보도자료</a> (2026-09-16)</li><li>연방기금 실효금리: <a href=\"https://fred.stlouisfed.org/series/DFF\" target=\"_blank\" rel=\"noopener\">FRED DFF</a> (2026-09-16~17)</li><li>미 국채 10년물: <a href=\"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve\" target=\"_blank\" rel=\"noopener\">미 재무부 일별 수익률</a> (2026-09-04~18)</li><li>원/달러 매매기준율: <a href=\"https://ecos.bok.or.kr/\" target=\"_blank\" rel=\"noopener\">한국은행 ECOS</a> 731Y001 (2026-08-28~09-21)</li><li>삼성전자·SK하이닉스 종가: <a href=\"https://www.data.go.kr/\" target=\"_blank\" rel=\"noopener\">공공데이터포털 금융위 주식시세</a> (2026-09-09~18)</li><li>미국 발표 일정: <a href=\"https://www.bea.gov/news/schedule\" target=\"_blank\" rel=\"noopener\">미 경제분석국</a> (9/30 Personal Income and Outlays · GDP Third Estimate) · <a href=\"https://www.bls.gov/schedule/news_release/empsit.htm\" target=\"_blank\" rel=\"noopener\">미 노동통계국</a> (10/2) · <a href=\"https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm\" target=\"_blank\" rel=\"noopener\">연준 FOMC 캘린더</a> (10/27~28)</li><li>9월 인상 시장 확률: 이 채널 2026-09-15 글의 출처 (centralbank.watch 자체 계산 91.4% · CBC뉴스가 전한 CME 페드워치 92.4%) — 2차 출처 2곳의 범위값이며 CME 원본은 직접 확인하지 못했습니다</li><li>지난 예측·해석 원문: 이 채널 2026-08-31 「코스피 반등, 산 건 개인이 아니었습니다」 · 2026-09-07 「외국인이 하루 2조 5천억을 샀습니다」 · 2026-09-15 「미국 근원 물가 +0.3%, 저희 기준선에 닿았습니다」</li></ul>", "added_at": "2026-09-21T15:22:14"}, {"id": "post-2026-09-15-오늘의-질문-물가-기준선", "date": "2026-09-15", "dow": "화", "corner": "오늘의 질문", "title": "[시황] 미국 근원 물가 +0.3%, 저희 기준선에 닿았습니다 — 17일 새벽 미국 금리 결정, 삼성전자는 이틀에 7.4% 빠졌습니다", "status": "발행 준비", "critic": "PASS 4차", "chars": 2211, "file": "파일럿/2026-09-15 오늘의 질문 — 물가 기준선.md", "html": "<p><sub>2026.09.15 화 · 9월 14일 국내장 마감 기준 · 오늘의 질문 · 전체 공개 · 4분</sub></p>\n<blockquote><p>15일 종가는 내일 공식 반영되어, 이 글의 국내 <strong>주가</strong> 숫자는 <strong>14일 마감까지</strong>입니다.</p></blockquote>\n<hr>\n<h2>① 오늘 이 기분은</h2>\n<p>금요일과 어제, 삼성전자를 보고 <strong>\"급등 다 토해냈네\" 싶으셨다면</strong> — 맞습니다. 7일 270,000원이 14일 249,000원이 됐습니다. <strong>급등 전(4일 255,500원)보다 낮습니다.</strong></p>\n<p>이유로 두 해석이 있고, 하나는 미국 물가 숫자에서 시작합니다. 답의 일부는 <strong>17일 새벽 3시</strong>에 나옵니다.</p>\n<hr>\n<h2>② 한 줄</h2>\n<p><strong>미국 8월 근원 물가 +0.3% — 9월 7일 적어둔 기준선 \"+0.3% 이상\"에 발표치로 닿았습니다.</strong> 지수로 계산하면 +0.29%라, 반올림 경계에 있습니다. 17일 새벽 FOMC(연방공개시장위원회, 미국 기준금리를 정하는 회의)가 답을 냅니다.</p>\n<hr>\n<h2>③ 숫자 3개</h2>\n<div class=\"tscroll\"><table><thead><tr><th>숫자</th><th>값</th><th>비교하면</th></tr></thead><tbody><tr><td>미국 8월 근원 물가</td><td><strong>+0.3%</strong> (전월 대비, 발표치)</td><td>7월 +0.2%. 기준선 \"+0.3% 이상\"에 <strong>도달</strong> (지수 계산 +0.29%)</td></tr><tr><td>미 국채 10년물</td><td><strong>4.97%</strong> (9/14, 미 재무부)</td><td>9월 4일 4.78%에서 <strong>+0.19%포인트</strong></td></tr><tr><td>삼성전자</td><td><strong>249,000원</strong> (9/14, −4.05%)</td><td>9월 7일 270,000원 대비 <strong>−7.8%</strong></td></tr></tbody></table></div>\n<blockquote><p><strong>용어 정리</strong> — *근원 물가*는 등락이 심한 식품과 에너지를 뺀 물가입니다. *10년물*은 미국 정부가 10년 빌릴 때 내는 이자율입니다. *수급*은 누가 사고 누가 팔았는지이고, *순매도*는 판 게 많다는 뜻입니다.</p></blockquote>\n<hr>\n<h2>④ 무슨 일이 있었나</h2>\n<p>여기까지는 확인된 사실입니다.</p>\n<p><strong>9월 11일 밤 미국.</strong> 노동통계국 8월 물가: 전체 <strong>+0.4%</strong>, 근원 <strong>+0.3%</strong>. 1년 전 대비 근원은 2.4%(7월 2.5%)지만, <strong>한 달 속도는 빨라졌습니다.</strong></p>\n<p><strong>미국 금리.</strong> 10년물은 9일 4.83% → 10일 4.95% → 14일 <strong>4.97%</strong>. 2년물은 4.43%에서 4.65%로 더 크게 올랐습니다.</p>\n<p><strong>환율.</strong> 한국은행 매매기준율은 10일 <strong>1,337.9원</strong>까지 내린 뒤 15일 <strong>1,345.3원</strong>으로 돌아섰습니다. 9거래일 이어진 원화 강세가 끝났습니다.</p>\n<p><strong>국내 반도체.</strong> 삼성전자 11일 −3.53%, 14일 −4.05%. SK하이닉스는 9일 1,856,000원에서 14일 <strong>1,697,000원</strong>(−8.6%)입니다.</p>\n<p><strong>FOMC는 미국 시간 15~16일.</strong> 관례대로면 결과는 한국 시간 <strong>17일 새벽 3시</strong>입니다.</p>\n<hr>\n<h2>⑤ 왜 빠졌나 — 해석 두 개</h2>\n<p>여기부터는 해석입니다. 사실이 아닙니다.</p>\n<p><strong>A — 금리 재평가.</strong> 물가가 발표치 기준으로 기준선에 닿아 인상 쪽으로 기울었고, 10년물이 열흘 사이 0.19%포인트 올랐습니다. 8월 31일 글대로 <strong>금리가 오르면 비싸게 값이 매겨진 자산부터 맞고</strong>, 코스피에선 반도체입니다.</p>\n<p><strong>B — 급등의 되돌림.</strong> 9월 7일 급등 때 파이낸셜뉴스가 지목한 재료는 GPT-6 Astra 기대였습니다. SK하이닉스는 9일 고점 뒤 되돌아왔습니다. 환율은 11일부터 원화 약세로 돌아 유입 요인이 약해졌습니다.</p>\n<p>저희는 <strong>A가 우세하다</strong>고 봅니다. 10년물이 0.12%포인트 뛴 10일 다음 날부터 낙폭이 났습니다. 다만 B가 맞으면 <strong>FOMC 결과와 무관하게 더 밀릴 수 있습니다.</strong></p>\n<p>수급은 두 해석을 가르는 보조 단서인데, 저희는 아직 공식 수급을 읽지 못합니다(아래 한계).</p>\n<hr>\n<h2>⑥ 저희 예측 두 개 — 채점 전야</h2>\n<p><strong>예측 1 — 9월 FOMC 인상.</strong> 8월 31일에 \"고용 호조 + 물가 상승이면 인상 확률 70%대\" 시나리오를 냈습니다. 물가 기준선 \"근원 +0.3% 이상\"은 9월 7일에 적었습니다.</p>\n<p>고용은 +16만 2천명, 물가는 발표치 +0.3%. <strong>두 조건이 발표치 기준으로 채워졌습니다.</strong> 저희 시나리오표는 70%대였는데 시장 집계는 <strong>91~92%대</strong>, 시장이 더 확신합니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td><strong>명제</strong></td><td>9월 15~16일 FOMC에서 기준금리를 인상한다</td></tr><tr><td><strong>시장 확률</strong></td><td>57%(8/28) → <strong>91~92%대</strong>: centralbank.watch 계산 91.4%(9/14) · CBC뉴스 전언 CME 92.4%(9/15 09:12, 원본 미확인)</td></tr><tr><td><strong>우리 입장</strong></td><td>시장 확률 채택 — 시장이 모르는 정보가 없습니다</td></tr><tr><td><strong>반증 조건</strong></td><td>FOMC 결과 자체 — <strong>동결 또는 인하</strong>면 틀림</td></tr><tr><td><strong>채점일</strong></td><td>2026-09-17 (결과 발표 직후)</td></tr></tbody></table></div>\n<p><strong>예측 2 — 9월 15일까지 외국인 순매도 누적 유지.</strong> 오늘이 마감입니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td><strong>명제</strong></td><td>9월 15일까지 외국인이 코스피에서 순매도 누적을 유지한다</td></tr><tr><td><strong>채점 기준</strong></td><td>9/1~15 정규장·코스피, 한국거래소 공식 확정치. 마감 시 누적 순매매액 <strong>0원 미만이면 적중</strong></td></tr><tr><td><strong>반증 조건</strong></td><td>누적 순매매액 0원 이상 (채점 기준과 동일)</td></tr><tr><td><strong>재검토 트리거</strong></td><td>② 매매기준율 1,340원 하회 — <strong>10일 1,337.9원으로 발동.</strong> ① 누적 0원 이상 여부는 미확인</td></tr><tr><td><strong>우리 확률</strong></td><td><strong>산정 보류</strong> 유지 (이력은 9월 7일 글에)</td></tr><tr><td><strong>채점일</strong></td><td>2026-09-16 — 한국거래소 공식 누적을 확인한 뒤</td></tr></tbody></table></div>\n<blockquote><p><strong>저희 한계</strong> — 한국거래소 투자자별 통계는 로그인이 필요해 아직 읽지 못합니다. 채점이 늦어지면 그대로 적습니다.</p></blockquote>\n<hr>\n<h2>⑦ 그래서 이 감정은</h2>\n<p><strong>\"급등 다 토해냈네\" — 정확한 관찰입니다.</strong> 다만 이유가 A라면 17일 새벽 결과가 답의 일부입니다. B라면 FOMC와 무관하게 이어질 수 있습니다.</p>\n<p>시장이 91~92%대로 보는 일이라 <strong>인상 자체는 놀랄 일이 아닙니다. 놀랄 일은 동결입니다.</strong> 어느 쪽이든 그대로 적고, 지우지 않습니다.</p>\n<p>오늘 무언가를 사고 파실 필요는 없습니다. 다만 17일 아침 기사가 쏟아질 때 <strong>\"인상이냐 동결이냐\"</strong> 하나만 먼저 보시면 좋겠습니다.</p>\n<p><strong>지난주 급등 때 사셨어요?</strong> 그 뒤 이틀은 어떠셨는지, 그 이유가 궁금합니다.</p>\n<hr>\n<p><sub>이 글은 정보 제공을 목적으로 하며, 특정 종목의 매수·매도를 권유하지 않습니다. 투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다. 초안은 AI가 쓰고 발행 전 사람이 검수합니다.</sub></p>\n<p><strong>출처</strong></p>\n<ul><li>미국 8월 소비자물가: <a href=\"https://www.bls.gov/news.release/cpi.nr0.htm\" target=\"_blank\" rel=\"noopener\">미 노동통계국 CPI 발표문</a> (2026-09-11)</li><li>미 국채 2년물·10년물: <a href=\"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve\" target=\"_blank\" rel=\"noopener\">미 재무부 일별 수익률</a> (2026-09-04~14)</li><li>원/달러 매매기준율: <a href=\"https://ecos.bok.or.kr/\" target=\"_blank\" rel=\"noopener\">한국은행 ECOS</a> 731Y001 (2026-08-28~09-15)</li><li>삼성전자·SK하이닉스 종가: <a href=\"https://www.data.go.kr/\" target=\"_blank\" rel=\"noopener\">공공데이터포털 금융위 주식시세</a> (2026-09-04~14)</li><li>8월 고용: <a href=\"https://fred.stlouisfed.org/series/PAYEMS\" target=\"_blank\" rel=\"noopener\">FRED PAYEMS</a> · <a href=\"https://www.bls.gov/schedule/news_release/empsit.htm\" target=\"_blank\" rel=\"noopener\">미 노동통계국 발표 일정</a> (2026-09-04)</li><li>FOMC 일정: <a href=\"https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm\" target=\"_blank\" rel=\"noopener\">Federal Reserve</a> (2026-09-15~16, 경제전망 포함)</li><li>9월 인상 시장 확률: <a href=\"https://centralbank.watch/federal-reserve/\" target=\"_blank\" rel=\"noopener\">centralbank.watch</a> 자체 계산 (2026-09-14, 91.4%) · <a href=\"https://www.cbci.co.kr/news/articleView.html?idxno=606812\" target=\"_blank\" rel=\"noopener\">CBC뉴스</a>가 전한 CME 페드워치 (2026-09-15 09:12, 92.4%) — CME 원본 화면은 직접 확인하지 못해 본문은 범위(91~92%대)로 적었습니다</li><li>9/7 급등 재료 해석: <a href=\"https://www.fnnews.com/news/202609071510533992\" target=\"_blank\" rel=\"noopener\">파이낸셜뉴스</a> (2026-09-07, GPT-6 Astra 명시) · <a href=\"https://www.fnnews.com/news/202609071602103407\" target=\"_blank\" rel=\"noopener\">파이낸셜뉴스 마감시황</a></li><li>지난 예측 원문: 이 채널 2026-08-31 「코스피 반등, 산 건 개인이 아니었습니다」(시나리오표) · 2026-09-07 「이번 주 볼 건 9월 11일 하나입니다」(기준선 +0.3%) · 2026-09-07 「외국인이 하루 2조 5천억을 샀습니다」(채점 기준)</li></ul>", "added_at": "2026-09-21T15:20:52"}, {"id": "post-2026-09-07-이번-주에-볼-것", "date": "2026-09-07", "dow": "월", "corner": "이번 주에 볼 것", "title": "이번 주 볼 건 9월 11일 하나입니다 — 환율은 내리는데 미국 금리는 오르는 중", "status": "검수 대기", "critic": "PASS 2차", "chars": 2475, "file": "파일럿/2026-09-07 이번 주에 볼 것.md", "html": "<p><sub>2026.09.07 월 · 이번 주에 볼 것 · 🔓 전체 공개 · 4분</sub></p>\n<hr>\n<h2>① 오늘 이 기분은</h2>\n<p>지난주 계좌를 보고 <strong>어리둥절하셨다면, 그럴 만합니다.</strong></p>\n<p>환율은 내리고(원화 강세), 미국 금리는 오르고, 삼성전자는 하루 −4%였다가 다음 날 +2.2%였습니다. <strong>방향이 서로 안 맞습니다.</strong></p>\n<p>오늘은 이번 주에 <strong>가장 먼저 보실 것 하나</strong>와, 지난주에 건 저희 예측의 현재 상태를 그대로 공개합니다.</p>\n<hr>\n<h2>② 한 줄</h2>\n<p><strong>이번 주 금요일 밤 9시 30분</strong>, 미국 8월 물가가 나옵니다.</p>\n<hr>\n<h2>오늘 마감 — 이 글을 쓴 뒤 장이 4.6% 올랐습니다</h2>\n<blockquote class=\"banner\"><p><strong>HUMAN_REVIEW_REQUIRED: 아래 외국인·기관·개인 숫자는 두 매체가 일치한 보도값입니다.</strong> 한국거래소 공식 확정치와 대조한 뒤 이 줄을 지우고 발행합니다.</p></blockquote>\n<div class=\"tscroll\"><table><thead><tr><th>항목</th><th>값</th></tr></thead><tbody><tr><td>코스피</td><td><strong>6,995.39 (+4.61%)</strong> — 7,000선까지 4.6포인트</td></tr><tr><td>외국인 / 기관 / 개인</td><td><strong>+2조 5,533억 / +2조 6,327억 / −6조 8,212억</strong> (보도값 — 파이낸셜뉴스·EBN, 공식 확정치는 익일)</td></tr><tr><td>삼성전자 / SK하이닉스</td><td><strong>+5.68% / +8.26%</strong></td></tr><tr><td>파이낸셜뉴스가 제시한 해석</td><td>OpenAI GPT-6 Astra(9/3 공개) → AI·메모리 수요 기대</td></tr></tbody></table></div>\n<p>오늘 급등과 저희 예측의 관계는 <strong>오늘 밤 글</strong>에서 다룹니다.</p>\n<h2>③ 지난주에 실제로 벌어진 일</h2>\n<p>전부 1차 출처에서 직접 받은 숫자입니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>지난주 시장 요약</th><th>8월 31일</th><th>최근</th><th>한 주</th></tr></thead><tbody><tr><td>삼성전자</td><td>260,000원</td><td><strong>255,500원</strong> (9/4)</td><td><strong>−1.73%</strong></td></tr><tr><td>SK하이닉스</td><td>1,674,000원</td><td><strong>1,647,000원</strong> (9/4)</td><td><strong>−1.61%</strong></td></tr><tr><td>원/달러 (한국은행 매매기준율)</td><td>1,376.5원</td><td><strong>1,355.2원</strong> (9/7)</td><td>원화 <strong>강세</strong></td></tr><tr><td>미 국채 10년물 (재무부)</td><td>4.73%</td><td><strong>4.78%</strong> (9/4)</td><td>금리 <strong>상승</strong></td></tr></tbody></table></div>\n<p><strong>9월 2일 하루에만 삼성전자 −4.02%, SK하이닉스 −4.73%</strong>였습니다.</p>\n<p><strong>환율과 미국 금리는 통상적 방향과 엇갈렸습니다.</strong> 미국 금리가 오르면 원화가 약해지는 게 보통인데, <strong>6거래일 연속 반대로 갔습니다.</strong></p>\n<blockquote><p><strong>왜 중요한가</strong> — 원화 강세는 달러 투자자의 보유분 환산수익률을 높여 유입 요인이 될 수 있습니다. 다만 같은 원화 가격의 주식은 달러 기준으로 더 비싸집니다. (9/7 저녁 정정 — 처음엔 \"싸진다\"고 썼는데 방향이 틀렸습니다.)</p></blockquote>\n<hr>\n<h2>④ 이번 주에 볼 것</h2>\n<div class=\"tscroll\"><table><thead><tr><th>날짜</th><th>무슨 일</th><th>왜 보나</th></tr></thead><tbody><tr><td><strong>9월 11일 (금) 밤 9:30</strong></td><td><strong>미국 8월 소비자물가</strong></td><td><strong>이번 주 최우선 지표</strong></td></tr><tr><td>9월 15~16일 (다음 주)</td><td>미국 FOMC</td><td>금리 결정. 결과는 17일 새벽</td></tr></tbody></table></div>\n<blockquote><p><strong>FOMC란</strong> — 연방공개시장위원회의 줄임말로, 미국의 기준금리를 정하는 회의입니다.</p><p><strong>소비자물가(CPI)란</strong> — 물건값이 얼마나 올랐는지 재는 지표입니다. <em>근원</em> 물가는 등락이 심한 식품·에너지를 뺀 것입니다.</p></blockquote>\n<p>FOMC 전에 남은 큰 지표가 이것 하나입니다. <strong>고용은 지난 금요일 이미 나왔고, 강했습니다.</strong> 미국 비농업 고용은 7월 +2만 1천명에서 <strong>8월 +16만 2천명</strong>으로 늘었습니다. 실업률은 4.1%로 유지됐습니다.</p>\n<p>지난번에 저희가 적어둔 인상 확률 눈금은 이랬습니다. <strong>고용·물가 둘 다 호조면 70%대, 하나만 호조면 55~60%, 둘 다 부진이면 40%대.</strong> 고용이 호조로 채워졌으니 <strong>지금은 55~60% 칸</strong>입니다.</p>\n<p>9월 11일 밤 <strong>근원 물가가 전월 대비 +0.3% 이상</strong>이면 70%대 칸, 그 아래면 지금 칸입니다. 7월은 <strong>+0.22%</strong>, 기준선 바로 아래였습니다.</p>\n<hr>\n<h2>⑤ 저희가 건 예측은 이렇게 되고 있습니다</h2>\n<h3>예측 1 — 9월 FOMC</h3>\n<p><strong>명제</strong>는 \"9월 15~16일 FOMC에서 기준금리를 인상한다\"입니다. <strong>시장 확률 57%</strong>(8월 28일 미국 장마감, 금리선물 기준), 저희 입장은 시장과 동일입니다. <strong>반증 조건</strong>은 FOMC 결과 자체 — 동결이나 인하면 틀린 것입니다. <strong>채점일 2026-09-17.</strong></p>\n<p><strong>아직 유효합니다.</strong> 고용이 호조로 나왔으니 금리를 내릴 이유는 오히려 줄었습니다.</p>\n<blockquote><p><strong>순매도란</strong> — 산 것보다 판 게 많다는 뜻입니다. *순매수*는 산 게 많다는 뜻이고, *수급*은 누가 사고 누가 팔았는지를 말합니다.</p></blockquote>\n<h3>예측 2 — 외국인 순매도 유지 · 채점일 9월 16일</h3>\n<p><strong>이건 불리하게 움직이는 중입니다.</strong> 판정은 9월 15일 마감 뒤에 합니다.</p>\n<p>저희 근거였던 \"원화 약세\"가 반대로 갔습니다. 한국은행 매매기준율은 8월 31일 1,376.5원에서 <strong>9월 7일 1,355.2원</strong>이 됐습니다. 재검토선 1,340원까지 여유는 36.5원에서 <strong>15.2원</strong>으로 좁혀졌습니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td><strong>명제</strong> (8/31 글 원문)</td><td>\"9월 15일까지 외국인이 코스피에서 순매도 누적을 유지한다\"</td></tr><tr><td><strong>채점 기준</strong></td><td>9월 1일~15일 <strong>정규장·코스피</strong>, 한국거래소 <strong>공식 확정</strong> 투자자별 매매동향 기준. <strong>9월 15일 마감 시점</strong> 외국인 누적 순매매액 <strong>0원 미만이면 적중, 0원 이상이면 틀림</strong> — 판정은 이 하나로만</td></tr><tr><td><strong>반증 조건</strong></td><td><del>환율 1,340원 하회 시 폐기</del> → 9월 15일 마감 시 한국거래소 공식 누적 순매매액 <strong>0원 이상</strong> (채점 기준과 동일, 9/7 저녁 정정)</td></tr><tr><td><strong>재검토 트리거</strong></td><td>① 기간 중 어느 날이든 누적 순매매액 0원 이상 ② 한국은행 매매기준율 원/달러 <strong>1,340원 하회</strong> — 둘 중 하나면 확률만 다시 봅니다</td></tr><tr><td><strong>우리 확률</strong></td><td><del>65%</del> → <del>55%</del> → <del>45%</del> → <strong>산정 보류</strong> — 공식 누적 확인 뒤 다시 씁니다</td></tr><tr><td><strong>채점일</strong></td><td>2026-09-16</td></tr></tbody></table></div>\n<blockquote><p><strong>9/7 저녁 갱신</strong> — 오늘 외국인이 2조 5천억을 순매수했습니다(보도값). 지난주에 환율을 반증 조건으로 쓴 건 잘못이었고, 위 표대로 고쳤습니다.</p></blockquote>\n<blockquote><p>⚠️ <strong>저희 한계</strong> — 외국인 수급을 매일 직접 확인할 경로가 아직 없어(데이터 이용 승인 대기) 환율을 대리 지표로만 씁니다.</p></blockquote>\n<h3>지난번 해석은 어느 쪽이 맞았나</h3>\n<p>8월 31일 글: <strong>\"A가 맞으면 자사주 물량이 끝나는 날 멈추고, B가 맞으면 반등이 이어집니다.\"</strong></p>\n<p><strong>반등은 이어지지 않았습니다.</strong> 두 종목 다 한 주 마이너스, 9월 2일엔 −4%대였습니다. <strong>A쪽이 우세했던 것으로 보입니다.</strong></p>\n<hr>\n<h2>⑥ 그래서 이 감정은</h2>\n<p><strong>지난주 어리둥절하셨다면 — 정상입니다.</strong></p>\n<p><strong>뭘 봐야 할지 모르겠다는 답답함 — 이번 주는 덜어드릴 수 있습니다.</strong> 금요일 밤 9시 30분, 그 숫자 하나가 FOMC 기대를 크게 바꿀 수 있습니다.</p>\n<p>오늘 무언가를 사고 파실 필요는 없습니다. 다만 금요일 밤 <strong>근원 물가 +0.3%</strong>, 이 숫자 하나만 기억해두시면 주말 기사를 빠르게 거를 수 있습니다.</p>\n<p><strong>지난주 계좌, 어느 쪽이 더 크셨어요?</strong> 빠진 게 아팠는지, 금요일 반등이 더 기억에 남는지 궁금합니다.</p>\n<hr>\n<p><sub>이 글은 정보 제공을 목적으로 하며, 특정 종목의 매수·매도를 권유하지 않습니다. 투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다. 초안은 AI가 쓰고 발행 전 사람이 검수합니다.</sub></p>\n<p><sub><strong>출처</strong> — 종목 시세: <a href=\"https://www.data.go.kr/\" target=\"_blank\" rel=\"noopener\">공공데이터포털 금융위 주식시세정보</a> (2026-08-31~09-04) | 환율: <a href=\"https://ecos.bok.or.kr/\" target=\"_blank\" rel=\"noopener\">한국은행 ECOS</a> 원/미국달러 매매기준율 | 미 국채 금리: <a href=\"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve\" target=\"_blank\" rel=\"noopener\">미 재무부 일별 수익률</a> | 고용·물가: <a href=\"https://fred.stlouisfed.org/\" target=\"_blank\" rel=\"noopener\">FRED</a> PAYEMS·UNRATE·CPILFESL | 발표 일정: <a href=\"https://www.bls.gov/schedule/news_release/cpi.htm\" target=\"_blank\" rel=\"noopener\">미 노동통계국 공식 일정</a> — 8월 CPI 2026-09-11, 8월 고용 2026-09-04 | FOMC 일정: <a href=\"https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm\" target=\"_blank\" rel=\"noopener\">Federal Reserve</a> | 9/7 마감 수급 (보도값, 추적용): <a href=\"https://www.fnnews.com/news/202609071602103407\" target=\"_blank\" rel=\"noopener\">파이낸셜뉴스</a> · <a href=\"https://v.daum.net/v/20260907155216138\" target=\"_blank\" rel=\"noopener\">EBN</a> — 한국거래소 공식 확정치로 대조 예정</sub></p>", "added_at": "2026-09-21T15:22:25"}, {"id": "post-2026-09-07-오늘의-질문-외국인-2-5조", "date": "2026-09-07", "dow": "월", "corner": "오늘의 질문", "title": "[시황] 외국인이 하루 2조 5천억을 샀습니다 — 저희 예측의 채점 기준을 고칩니다", "status": "검수 대기", "critic": "PASS 4차", "chars": 2178, "file": "파일럿/2026-09-07 오늘의 질문 — 외국인 2.5조.md", "html": "<p><sub>2026.09.07 월 · 국내장 마감 기준 · 오늘의 질문 · 전체 공개 · 4분</sub></p>\n<blockquote class=\"banner\"><p><strong>HUMAN_REVIEW_REQUIRED: 투자자별 수급 공식 확정치 대기.</strong> 지수·종가는 9/8 공식 확정. 수급은 보도값이며 매체 간 차이가 있습니다(외국인 2조 5,533억 vs 2조 5,869억). 한국거래소 공식 확정치와 대조한 뒤 이 줄을 지우고 발행합니다.</p></blockquote>\n<hr>\n<h2>① 오늘 이 기분은</h2>\n<p>오늘 코스피 +4.6%를 보고 <strong>\"나만 못 탔다\" 싶으셨다면</strong> — 숫자 하나를 먼저 보시죠. 오늘 개인 투자자는 합계 <strong>6조 8,212억원을 순매도</strong>했습니다. 이 합계만으로 각자의 이유나 성과는 알 수 없습니다.</p>\n<blockquote><p><strong>용어 정리</strong> — *수급*은 누가 사고 누가 팔았는지, *순매수*는 산 게 많다는 뜻, *순매도*는 판 게 많다는 뜻입니다.</p></blockquote>\n<p>그리고 지난주에 걸어둔 저희 예측 하나에 대해 <strong>오늘 하루 수급이 불리하게 움직였습니다.</strong> 최종 판정은 9월 15일 마감 뒤에 합니다. 그것부터 보여드리겠습니다.</p>\n<hr>\n<h2>② 저희 예측 — 지금 상태</h2>\n<p>지난 8월 31일 글에서 예측 두 개를 걸었습니다. 그중 두 번째, 외국인 수급 예측입니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td><strong>명제</strong> (8/31 글 원문)</td><td>\"9월 15일까지 외국인이 코스피에서 순매도 누적을 유지한다\"</td></tr><tr><td><strong>채점 기준</strong> (오늘 명확히 적습니다)</td><td>2026년 9월 1일~9월 15일 <strong>정규장·코스피</strong>, 한국거래소 <strong>공식 확정</strong> 투자자별 매매동향 기준. <strong>9월 15일 마감 시점</strong> 외국인 누적 순매매액이 <strong>0원 미만이면 적중, 0원 이상이면 틀림</strong> — 판정은 이 하나로만 합니다</td></tr><tr><td><strong>반증 조건</strong></td><td>위 채점 기준의 뒷부분과 같습니다 — 9월 15일 마감 시 누적 순매매액 <strong>0원 이상</strong></td></tr><tr><td><strong>재검토 트리거</strong></td><td>① 기간 중 어느 날이든 누적 순매매액이 0원 이상으로 올라옴 ② 한국은행 매매기준율 원/달러 <strong>1,340원 하회</strong> — 둘 중 하나면 확률을 다시 봅니다</td></tr><tr><td><strong>우리 확률</strong></td><td>65% → 55% → 45% → <strong>산정 보류.</strong> 공식 누적 수급을 확인한 뒤 숫자를 다시 씁니다</td></tr><tr><td><strong>채점일</strong></td><td>2026-09-16</td></tr></tbody></table></div>\n<p><strong>오늘 고친 것이 두 가지입니다.</strong> 오늘 하루 수급이 예측에 불리하게 움직인 것만이 아니라, 채점 방식이 틀려 있었습니다.</p>\n<p>첫째, 지난주에는 환율 1,340원을 반증 조건이라고 썼습니다. <strong>잘못이었습니다.</strong> 명제는 외국인 누적 수급인데 환율은 대리 지표일 뿐입니다. 환율이 1,340원 위에 있어도 누적이 순매수로 바뀌면 명제는 틀립니다.</p>\n<p>그래서 판정을 <strong>9월 15일 마감 시점의 누적 순매매액 하나</strong>로 묶었습니다. 기간 중에 누적이 뒤집히거나 환율이 1,340원을 밑돌면 확률을 다시 볼 뿐, 판정은 마지막 날에만 합니다.</p>\n<p>둘째, 확률 산정을 보류합니다. 하루치 수급 하나를 보고 숫자를 내리는 건 규칙이 아니라 감입니다. <strong>근거 없는 정밀 확률을 만들지 않는다</strong>는 저희 원칙에 어긋납니다. 공식 누적치를 손에 쥔 뒤 숫자를 다시 부르겠습니다.</p>\n<blockquote><p><strong>저희 한계</strong> — 공식 투자자별 매매동향을 매일 자동으로 받는 경로가 아직 없습니다(데이터 이용 승인 대기). 확정치는 사람이 확인해 적고, 그전까지는 보도값으로 표시합니다.</p></blockquote>\n<hr>\n<h2>③ 숫자 3개 — 지수는 공식 확정, 수급은 보도값</h2>\n<div class=\"tscroll\"><table><thead><tr><th>숫자</th><th>값</th><th>비교하면</th></tr></thead><tbody><tr><td>코스피 종가</td><td><strong>6,995.39</strong> (+4.61%)</td><td>7,000선까지 <strong>4.6포인트</strong></td></tr><tr><td>외국인 순매수</td><td><strong>+2조 5,533억</strong> (보도값)</td><td>8월 31일엔 −4,435억(보도 잠정치)이었습니다</td></tr><tr><td>개인 순매도</td><td><strong>−6조 8,212억</strong> (보도값)</td><td>외국인+기관 순매수 5조 1,860억보다 큽니다</td></tr></tbody></table></div>\n<hr>\n<h2>④ 무슨 일이 있었나</h2>\n<p>여기까지는 확인된 사실입니다.</p>\n<p><strong>9월 3일 미국.</strong> OpenAI가 새 모델 <strong>GPT-6 Astra</strong>를 공개했습니다. 목표를 주면 컴퓨터를 직접 조작해 일을 끝까지 마치는 <strong>에이전트형</strong> 모델입니다. 제한된 조직부터 시작해 유료 플랜에 순차 배포되고 있습니다.</p>\n<p><strong>9월 7일 한국.</strong> 삼성전자 <strong>270,000원 (+5.68%)</strong>, SK하이닉스 <strong>1,783,000원 (+8.26%)</strong>. 코스닥은 822.19 (+1.07%)로 코스피보다 훨씬 덜 올랐습니다.</p>\n<p><strong>미국 금리는 내려가지 않았습니다.</strong> 미 재무부 기준 10년물은 4일 4.78%로, 전날보다 0.01%포인트 올랐습니다.</p>\n<hr>\n<h2>⑤ 왜 그랬나 — 출처가 있는 해석만</h2>\n<p>여기부터는 해석입니다. 사실이 아닙니다.</p>\n<p><strong>실적 기대.</strong> 파이낸셜뉴스는 오늘 상승 원인으로 \"AI 연산·메모리 수요 확대 기대\"를 짚었습니다. OpenAI 새 모델 공개가 계기라는 설명입니다. 장기금리는 오히려 올랐으니 <strong>금리 하락으로는 설명하기 어렵고</strong>, 보도가 지목한 건 실적 쪽입니다.</p>\n<p><strong>환율.</strong> 원화는 6거래일 연속 강세였습니다(한국은행 매매기준율 1,380.3 → 1,355.2원). 원화 강세는 달러 투자자의 기존 보유분 환산수익률을 높여 <strong>유입 요인이 될 수 있습니다.</strong> 다만 같은 원화 가격의 주식은 달러 기준으로는 <strong>더 비싸집니다.</strong></p>\n<p>지난주 글에서 \"원화가 강해지면 외국인에게 한국 주식이 싸진다\"고 쓴 건 <strong>틀린 설명</strong>이었고, 정정합니다.</p>\n<hr>\n<h2>⑥ 다음 확인</h2>\n<p>내일 한국거래소 공식 확정치로 ③의 숫자를 대조하고, 9월 1일부터의 누적을 계산해 적습니다. 채점은 <strong>9월 16일</strong>, ②의 기준 하나로 합니다.</p>\n<hr>\n<h2>⑦ 그래서 이 감정은</h2>\n<p><strong>\"나만 못 탔다\" — 하루로 결론이 나지 않습니다.</strong> 오늘 산 외국인이 이번 주에도 사는지, 누적이 어느 쪽으로 가는지가 답이고 그건 며칠 뒤에 보입니다.</p>\n<p><strong>파신 분</strong> — 합계 6조 8천억 안에는 수만 가지 사정이 있습니다. 오늘 숫자 하나로 옳고 그름을 가를 수 없습니다.</p>\n<p><strong>저희</strong> — 오늘 하루 수급은 예측에 불리했고, 채점 방식은 고쳤습니다. 판정은 9월 15일에 합니다. 이 기록은 지우지 않습니다.</p>\n<p><strong>오늘 사셨어요, 파셨어요, 보기만 하셨어요?</strong> 어느 쪽이든 그 이유가 궁금합니다.</p>\n<hr>\n<p><sub>이 글은 정보 제공을 목적으로 하며, 특정 종목의 매수·매도를 권유하지 않습니다. 투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다. 초안은 AI가 쓰고 발행 전 사람이 검수합니다.</sub></p>\n<p><strong>출처</strong></p>\n<ul><li>코스피 6,995.39 · 코스닥 822.19 · 삼성전자·SK하이닉스 종가: <a href=\"https://kind.krx.co.kr/\" target=\"_blank\" rel=\"noopener\">한국거래소 KIND</a> · <a href=\"https://www.data.go.kr/\" target=\"_blank\" rel=\"noopener\">공공데이터포털 금융위 주식시세</a> basDt 20260907 — 9/8 공식 확정</li><li>투자자별 수급 (보도값): <a href=\"https://www.fnnews.com/news/202609071602103407\" target=\"_blank\" rel=\"noopener\">파이낸셜뉴스 마감시황</a> · <a href=\"https://v.daum.net/v/20260907155216138\" target=\"_blank\" rel=\"noopener\">EBN</a> 일치. <a href=\"https://www.kdfnews.com/news/articleView.html?idxno=187647\" target=\"_blank\" rel=\"noopener\">한국면세뉴스</a>는 외국인 +2조 5,869억으로 보도 — 집계 기준 차이로 보이며, 한국거래소 공식 확정치로 대조 예정</li><li>8월 31일 외국인 순매도 −4,435억: <a href=\"https://www.hankyung.com/article/202608314360i\" target=\"_blank\" rel=\"noopener\">한국경제</a> · <a href=\"https://www.edaily.co.kr/News/Read?newsId=03893366645552896\" target=\"_blank\" rel=\"noopener\">이데일리</a></li><li>원/달러 매매기준율: <a href=\"https://ecos.bok.or.kr/\" target=\"_blank\" rel=\"noopener\">한국은행 ECOS</a> 731Y001 (2026-08-28~09-07)</li><li>미 국채 10년물: <a href=\"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve\" target=\"_blank\" rel=\"noopener\">미 재무부 일별 수익률</a> (2026-09-03·09-04)</li><li>GPT-6 Astra 공개·배포: <a href=\"https://www.axios.com/2026/09/03/openai-astra-gpt-6-agi-brockman\" target=\"_blank\" rel=\"noopener\">Axios</a> · <a href=\"https://fortune.com/2026/09/03/openai-debuts-gpt-6-astra-computer-use-greg-brockman-says-start-of-agi/\" target=\"_blank\" rel=\"noopener\">Fortune</a> · <a href=\"https://9to5mac.com/2026/09/04/openai-releasing-major-upgrade-to-chatgpt-and-codex-with-gpt-6-astra-details-here/\" target=\"_blank\" rel=\"noopener\">9to5Mac</a></li><li>지난 예측 원문: 이 채널 2026-08-31 「코스피 반등, 산 건 개인이 아니었습니다」</li></ul>", "added_at": "2026-09-21T15:22:14"}, {"id": "post-2026-08-31-오늘의-질문-v3", "date": "2026-08-31", "dow": "월", "corner": "오늘의 질문", "title": "코스피 반등, 산 건 개인이 아니었습니다 — 삼성전자·SK하이닉스 자사주 1조 5천억", "status": "파일럿", "critic": "사람 검수", "chars": 3485, "file": "파일럿/2026-08-31 오늘의 질문 v3.md", "html": "<p><sub>2026.08.31 월 · 국내장 마감 기준 · 오늘의 질문 · 4분</sub></p>\n<hr>\n<h2>① 오늘 이 기분은</h2>\n<p>어제 아침에 <strong>겁이 나셨다면, 그 감각은 정확했습니다.</strong> 다만 이유는 아마 생각하신 것과 다를 겁니다.</p>\n<p>저녁에 +0.46%로 끝난 걸 보고 <strong>안심하셨다면, 그 안심은 조금 이릅니다.</strong></p>\n<p>왜 그런지 4분 안에 정리해드리겠습니다.</p>\n<hr>\n<h2>② 한 줄</h2>\n<p>어제 코스피를 떠받친 건 투자자가 아니라 <strong>회사 자신</strong>이었습니다.</p>\n<hr>\n<h2>③ 숫자 3개</h2>\n<div class=\"tscroll\"><table><thead><tr><th>숫자</th><th>값</th><th>비교하면</th></tr></thead><tbody><tr><td>코스피 종가</td><td><strong>6,820.02</strong> (+0.46%)</td><td>아침엔 −2.58%였습니다. 하루 안에 <strong>4.2% 뒤집힘</strong></td></tr><tr><td>회사가 산 금액</td><td><strong>+1조 5,433억</strong></td><td>개인·기관·외국인이 판 합계 −1조 5,448억과 <strong>15억 차이</strong></td></tr><tr><td>9월 미국 금리 <strong>인상</strong> 확률</td><td><strong>35% → 57%</strong></td><td>잭슨홀 연설 하루 만에 (8/28 미국 장마감 기준)</td></tr></tbody></table></div>\n<hr>\n<h2>④ 아침에 겁이 났던 이유는 미국이 아니라 한국에 있었습니다</h2>\n<p><strong>8월 28일 미국.</strong> 케빈 워시 연준 의장이 첫 잭슨홀 연설에서 \"물가가 잡혔다는 확신이 아직 없다\"고 했습니다. 시장은 금리를 <strong>올릴 수도 있다</strong>는 뜻으로 읽었습니다.</p>\n<p>그런데 <strong>미국 주가는 거의 안 빠졌습니다.</strong> 나스닥 −0.52%, S&amp;P500 −0.25%, 다우 −0.02%입니다.</p>\n<p><strong>대신 금리가 뛰었습니다.</strong> 미 재무부 공식 수치로 하루 만에 이렇게 움직였습니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>미 국채</th><th>8/27</th><th>8/28</th></tr></thead><tbody><tr><td>2년물</td><td>4.20%</td><td><strong>4.34%</strong> (+0.14%포인트)</td></tr><tr><td>10년물</td><td>4.67%</td><td><strong>4.73%</strong> (+0.06%포인트)</td></tr></tbody></table></div>\n<p><strong>8월 31일 한국.</strong> 코스피는 −2.58%로 출발했습니다.</p>\n<blockquote><p><strong>미국이 0.5% 빠진 다음 날, 한국은 2.6%로 시작했습니다. 다섯 배입니다.</strong></p></blockquote>\n<p>그러니 겁이 나셨다면 그건 당연한 반응이었습니다. 실제로 다섯 배 세게 맞았으니까요.</p>\n<h3>왜 우리만 다섯 배였나</h3>\n<p>금리가 오르면 <strong>비싸게 값이 매겨진 자산</strong>부터 맞습니다. 지금 그 자리에 있는 게 반도체입니다.</p>\n<p>미국 지수는 업종이 흩어져 있어서 반도체가 빠져도 다른 데가 받칩니다. <strong>코스피는 그렇지 않습니다.</strong> 같은 뉴스가 한 곳으로 몰려 들어옵니다.</p>\n<p><strong>즉 어제 일은 미국의 문제가 아니라 한국 지수의 체질 문제입니다.</strong></p>\n<hr>\n<h2>⑤ 그런데 오후에 뒤집혔습니다. 누가 샀을까요</h2>\n<p>여기서 좀처럼 보기 어려운 일이 벌어집니다. 표부터 보시겠습니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>누가</th><th>얼마</th></tr></thead><tbody><tr><td>개인</td><td>−1,917억</td></tr><tr><td>기관</td><td>−9,096억</td></tr><tr><td>외국인</td><td>−4,435억</td></tr><tr><td><strong>기타법인</strong></td><td><strong>+1조 5,433억</strong></td></tr></tbody></table></div>\n<blockquote><p><strong>용어 정리</strong> — *수급*은 누가 사고 누가 팔았는지, *순매도*는 판 게 많다는 뜻, *순매수*는 산 게 많다는 뜻입니다. *기타법인*은 개인·기관·외국인 어디에도 안 들어가는 나머지인데, <strong>회사가 자기 주식을 살 때 여기에 잡힙니다.</strong></p></blockquote>\n<p><strong>개인도 팔고, 기관도 팔고, 외국인도 팔았습니다.</strong> 셋이 판 합계가 −1조 5,448억인데, 기타법인이 +1조 5,433억을 샀습니다. 15억 차이로 맞아떨어집니다.</p>\n<p>정체는 공시에 있습니다. 공시는 회사가 의무적으로 밝힌 공식 발표를 말합니다.</p>\n<p>두 회사는 이미 8월에 <strong>자사주를 사겠다고 금융감독원에 신고해뒀습니다.</strong> 저희가 그 원문을 직접 확인했습니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>회사</th><th>신고일</th><th>총 계획</th><th>금액</th><th><strong>목적</strong></th></tr></thead><tbody><tr><td>삼성전자</td><td>8/21</td><td>5,328만 주</td><td>약 15조원</td><td><strong>임직원 주식보상</strong></td></tr><tr><td>SK하이닉스</td><td>8/19</td><td>2,407만 주</td><td>약 40조원</td><td><strong>자기주식 소각</strong></td></tr></tbody></table></div>\n<p>어제 산 건 이 계획의 일부입니다. 언론은 삼성전자 200만 주, SK하이닉스 65만 주로 전했습니다.</p>\n<p>공식 종가로 환산해봤습니다. 삼성전자 26만원 × 200만 주 = 5,200억, SK하이닉스 167만 4천원 × 65만 주 = 1조 881억. <strong>합계 1조 6,081억</strong>이고, 기타법인 순매수 1조 5,433억과 <strong>4% 차이</strong>입니다. 대체로 맞습니다.</p>\n<p>두 종목은 그날 올랐습니다. 공공데이터포털 공식 종가 기준으로 <strong>삼성전자 +1.17%, SK하이닉스 +1.27%</strong>입니다.</p>\n<blockquote><p>⚠️ 여러 매체가 이 수치를 <strong>+0.78%, +0.48%</strong>로 전했습니다. 장중 시점의 값입니다. 저희는 <strong>최종 종가</strong>를 씁니다.</p></blockquote>\n<h3>그런데 두 회사의 목적이 다릅니다</h3>\n<p>이 차이가 뉴스에서는 잘 안 보입니다. 대부분 \"주주환원\"으로 묶어서 씁니다.</p>\n<p><strong>SK하이닉스는 소각합니다.</strong> 산 주식을 없애버리는 겁니다. 주식 수가 영구히 줄어드니 남은 주주의 몫이 그만큼 커집니다.</p>\n<p><strong>삼성전자는 임직원 주식보상용입니다.</strong> 사둔 주식이 나중에 직원에게 갑니다. 지금은 시장에서 빠지지만 <strong>언젠가 다시 나옵니다.</strong></p>\n<p>회사가 사들이는 동안에는 둘 다 똑같이 주가를 받칩니다. 다만 <strong>그 뒤가 다릅니다.</strong> 소각한 쪽은 영구히 줄고, 보상용은 잠시 맡아둔 것에 가깝습니다.</p>\n<h3>잠깐, 뉴스에서 \"개인이 저가매수했다\"고 보지 않으셨나요</h3>\n<p>보셨을 겁니다. 어제 여러 곳에 돌았습니다. <strong>그런데 최종 집계에서 개인은 1,917억을 팔았습니다.</strong></p>\n<p>이유는 단순합니다. <strong>기사는 장중에 쓰는데, 수급은 장이 끝나야 확정됩니다.</strong> 오후 한때 개인이 순매수였던 건 맞습니다.</p>\n<h3>여기부터는 저희 해석입니다. 사실이 아닙니다</h3>\n<p><strong>A — 자사주가 물량을 받아냈다.</strong> 파는 쪽 물량을 회사가 그대로 받았고, 숫자가 15억 차이로 맞습니다.</p>\n<p><strong>B — 저가매수 심리와 HBM 기대가 살아났다.</strong> 자사주는 두 종목만 사는데 어제는 지수 전반이 올랐다는 점이 근거입니다.</p>\n<blockquote><p><strong>HBM이란</strong> — 인공지능 반도체에 들어가는 비싼 메모리입니다. 고대역폭 메모리의 줄임말입니다.</p></blockquote>\n<p>저희는 <strong>A가 우세하다</strong>고 봅니다. 다만 B도 지우지 않습니다.</p>\n<p><strong>B가 맞으면 반등이 이어지고, A가 맞으면 자사주 물량이 끝나는 날 멈춥니다.</strong> 이게 두 해석을 가르는 지점입니다.</p>\n<hr>\n<h2>⑥ 앞으로 — 9월 15일까지 볼 건 두 개뿐입니다</h2>\n<p>먼저 밝힙니다. <strong>시장이 이미 값을 매긴 일에 대해 저희는 시장보다 정확한 확률을 부르지 않습니다.</strong> 인상 확률 57%는 돈을 건 사람들이 만든 숫자이고, 저희가 아는 건 전부 거기 들어가 있습니다.</p>\n<blockquote><p>이 확률은 <strong>CME 페드워치</strong>에서 나옵니다. 30일짜리 금리 선물 가격으로 계산되며 <strong>장중 계속 움직입니다.</strong> 그래서 저희는 항상 <strong>기준 시각</strong>을 함께 적겠습니다. 위 수치는 <strong>8월 28일 미국 장마감 기준</strong>입니다.</p></blockquote>\n<p>대신 <strong>무엇이 나오면 이 숫자가 어디로 가는지</strong>를 드리겠습니다.</p>\n<div class=\"tscroll\"><table><thead><tr><th>무엇이 나오면</th><th>인상 확률</th><th>여러분 계좌에 뜻하는 것</th></tr></thead><tbody><tr><td>미국 8월 고용 <strong>호조</strong> + 물가 <strong>상승</strong></td><td><strong>70%대</strong></td><td>외국인 매도 계속. 반도체 더 눌림</td></tr><tr><td>둘 중 하나만</td><td>55~60%</td><td>지금 상태 유지</td></tr><tr><td>둘 다 <strong>부진</strong></td><td><strong>40%대</strong></td><td>자사주 없이도 반등 여력</td></tr></tbody></table></div>\n<p><strong>9월 초 고용지표와 9월 중순 물가지표, 이 두 개만 보시면 됩니다.</strong></p>\n<blockquote><p><strong>FOMC란</strong> — 연방공개시장위원회의 줄임말로, 미국의 기준금리를 정하는 회의입니다.</p></blockquote>\n<div class=\"tscroll\"><table><thead><tr><th></th><th><strong>명제</strong></th><th><strong>확률</strong></th><th><strong>채점일</strong></th></tr></thead><tbody><tr><td>1</td><td>9월 FOMC에서 금리 인상</td><td><strong>시장 확률</strong> 57% · 우리도 동일</td><td>9월 17일</td></tr><tr><td>2</td><td>9월 15일까지 외국인 순매도 유지</td><td><strong>우리 확률</strong> <del>65%</del> → <strong>55%</strong></td><td>9월 16일</td></tr></tbody></table></div>\n<p><strong>두 번째 예측의 확률을 낮춥니다. 근거 하나가 무너졌기 때문입니다.</strong></p>\n<p>처음에는 \"원화가 약해지고 있으니 외국인이 계속 팔 것\"이라고 봤습니다. 근거로 삼은 건 <strong>1,368.6원, 전일 대비 +3.9원</strong>이라는 보도였습니다.</p>\n<p>그런데 한국은행 공식 통계를 직접 확인하니 <strong>방향이 반대였습니다.</strong></p>\n<div class=\"tscroll\"><table><thead><tr><th>원/달러 (한국은행 매매기준율)</th><th>값</th></tr></thead><tbody><tr><td>8월 28일</td><td>1,380.3원</td></tr><tr><td>8월 31일</td><td><strong>1,376.5원</strong></td></tr><tr><td>9월 1일</td><td><strong>1,373.6원</strong></td></tr></tbody></table></div>\n<p><strong>원화는 약해진 게 아니라 사흘째 강해지고 있습니다.</strong> 저희 전제가 틀렸습니다.</p>\n<blockquote><p><strong>왜 숫자가 다른가</strong> — 언론이 쓰는 건 오후 3시 30분 <strong>종가</strong>이고, 한국은행이 내는 건 <strong>매매기준율</strong>입니다. 서로 다른 것을 재기 때문에 값도, 하루 변화의 부호도 달라질 수 있습니다. 저희는 <strong>한국은행 매매기준율</strong>을 쓰겠습니다. 나중에 채점할 수 있는 쪽이기 때문입니다.</p></blockquote>\n<p><strong>반증 조건</strong> — <strong>한국은행 매매기준율 기준</strong> 원/달러가 <strong>1,340원 아래</strong>로 내려가면 이 전망을 폐기합니다. 9월 1일 기준 1,373.6원이니 <strong>33.6원 남았습니다.</strong></p>\n<blockquote><p><strong>정정 (9월 7일)</strong> — 위 반증 조건은 잘못 세운 것입니다. 명제는 외국인 누적 수급인데 환율은 대리 지표라 명제를 반증하지 못합니다. 반증 조건을 <strong>9월 15일 마감 시 한국거래소 공식 누적 순매매액 0원 이상</strong>으로 고쳤고, 환율 1,340원은 재검토 트리거로 낮췄습니다. 원문은 지우지 않습니다. 자세한 내용은 9월 7일 글 「외국인이 하루 2조 5천억을 샀습니다」.</p></blockquote>\n<blockquote><p>⚠️ 위 표의 \"호조·부진\" 기준선은 시장 예상치가 나와야 확정됩니다. 발표 2~3일 전에 숫자를 채워 다시 알려드리겠습니다.</p></blockquote>\n<hr>\n<h2>⑦ 그래서 이 감정은</h2>\n<p><strong>아침의 공포 — 맞았습니다.</strong> 다섯 배 세게 맞은 게 사실이고, 그건 우리 지수 구조 때문입니다. 기분 탓이 아니었습니다.</p>\n<p><strong>저녁의 안도 — 이릅니다.</strong> 받쳐준 게 시장이 아니라 회사였고, 자사주에는 정해진 수량이 있기 때문입니다. 그리고 자사주는 미국 금리를 0.01%포인트도 낮추지 못합니다.</p>\n<p><strong>원인은 아직 미국에 그대로 있습니다.</strong> 열만 내렸을 뿐입니다.</p>\n<p>오늘 무언가를 사고 파실 필요는 없습니다. 다만 다음에 비슷한 아침이 왔을 때 이것만 구분하실 수 있으면 좋겠습니다.</p>\n<p><strong>뉴스 때문에 빠진 것인가, 우리 지수의 체질 때문에 더 빠진 것인가.</strong> 이 구분이 되면 그날 판단이 훨씬 편해집니다.</p>\n<blockquote><p>어제 산 자사주는 <strong>해열제</strong>입니다. 열은 내렸고, 체질은 그대로입니다.</p></blockquote>\n<p><strong>어제 장, 어느 쪽으로 느끼셨어요?</strong> 겁이 더 크셨는지, 아니면 그냥 또 하루였는지 궁금합니다.</p>\n<hr>\n<p><sub>이 글은 정보 제공을 목적으로 하며, 특정 종목의 매수·매도를 권유하지 않습니다. 투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다. 초안은 AI가 쓰고 발행 전 사람이 검수합니다.</sub></p>\n<p><sub><strong>출처</strong> — 코스피 종가·환율: <a href=\"https://view.asiae.co.kr/article/2026083115333132539\" target=\"_blank\" rel=\"noopener\">아시아경제</a> · <a href=\"https://www.businesskorea.co.kr/news/articleView.html?idxno=275876\" target=\"_blank\" rel=\"noopener\">Businesskorea</a> | <strong>자사주 공시(1차 출처): <a href=\"https://opendart.fss.or.kr/\" target=\"_blank\" rel=\"noopener\">DART 전자공시 주요사항보고서</a></strong> — 삼성전자 2026-08-21, SK하이닉스 2026-08-19 | <strong>환율(1차 출처): <a href=\"https://ecos.bok.or.kr/\" target=\"_blank\" rel=\"noopener\">한국은행 ECOS</a></strong> | <strong>시세(1차 출처): <a href=\"https://www.data.go.kr/\" target=\"_blank\" rel=\"noopener\">공공데이터포털 금융위 주식시세정보</a></strong> | 수급: <a href=\"https://www.hankyung.com/article/202608314360i\" target=\"_blank\" rel=\"noopener\">한국경제</a> · <a href=\"https://www.edaily.co.kr/News/Read?newsId=03893366645552896\" target=\"_blank\" rel=\"noopener\">이데일리</a> | <strong>미 국채 금리(1차 출처): <a href=\"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve\" target=\"_blank\" rel=\"noopener\">미 재무부 일별 수익률</a></strong> | 미국 지수·인상확률: <a href=\"https://finance.yahoo.com/markets/live/stock-market-today-friday-august-28-dow-sp-500-nasdaq-dip-fed-warsh-jackson-hole-speech-081514091.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance</a> | 잭슨홀: <a href=\"https://www.mt.co.kr/world/2026/08/28/2026082823312599082\" target=\"_blank\" rel=\"noopener\">머니투데이</a> | FOMC 일정: <a href=\"https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm\" target=\"_blank\" rel=\"noopener\">Federal Reserve</a></sub></p>", "added_at": "2026-09-21T15:20:52"}]}</script>

<script>
(function () {
  var DB = {};
  try { DB = JSON.parse(document.getElementById('REPORT_DATA').textContent); } catch (e) { DB = {}; }
  var DATA = DB.reports || [];

  var dl = document.getElementById('dl');
  var rep = document.getElementById('rep');
  document.getElementById('repCount').textContent = DATA.length;
  document.getElementById('bkNote').textContent =
    DATA.length ? DATA.length + '개 · ' + DATA[DATA.length - 1].date + ' ~ ' + DATA[0].date : '없음';

  function fmt(d) { return d.replace(/-/g, '.'); }

  function tallyHtml(t) {
    if (!t) return '';
    var out = '';
    if (t.ok)   out += '<i class="t-ok">사실 ' + t.ok + '</i>';
    if (t.warn) out += '<i class="t-wa">주의 ' + t.warn + '</i>';
    if (t.bad)  out += '<i class="t-ba">오류 ' + t.bad + '</i>';
    return out ? '<span class="tally">' + out + '</span>' : '';
  }

  DATA.forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'dbtn'; b.setAttribute('data-d', r.date);
    b.innerHTML = '<span class="d1">' + fmt(r.date) + ' <span class="dow">' + (r.dow || '') + '</span></span>' +
      '<span class="d2">' + (r.summary || '') + '</span>' + tallyHtml(r.tally);
    b.addEventListener('click', function () { show(r.date, true); });
    dl.appendChild(b);
  });

  function show(date, push) {
    var r = null;
    for (var i = 0; i < DATA.length; i++) if (DATA[i].date === date) { r = DATA[i]; break; }
    if (!r) return false;
    var kick = ['<span>' + fmt(r.date) + ' ' + (r.dow || '') + '</span>'];
    (r.kicker || []).forEach(function (k) { kick.push('<span class="dot"></span><span>' + k + '</span>'); });
    rep.innerHTML =
      '<header class="mast"><div class="kicker">' + kick.join('') + '</div><h2>' + r.title + '</h2>' +
      '<p class="standfirst">' + r.standfirst + '</p></header>' + r.body +
      '<footer class="rfoot"><p><strong>출처</strong> — ' + (r.sources || '') + '</p>' +
      '<p class="disc">이 보고서는 정보 제공 목적입니다. 특정 종목의 매수·매도를 권유하지 않습니다.</p></footer>';
    Array.prototype.forEach.call(dl.querySelectorAll('.dbtn'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-d') === date);
    });
    if (push && location.hash !== '#' + date) history.replaceState(null, '', '#' + date);
    window.scrollTo({ top: 0, behavior: 'auto' });
    return true;
  }

  document.getElementById('tabReports').addEventListener('click', function () {
    if (DATA.length) show(DATA[0].date, true);
  });

  /* ── 채널 글 ─────────────────────────── */
  var POSTS = DB.channel_posts || [];
  var pl = document.getElementById('pl');
  document.getElementById('postCount').textContent = POSTS.length;
  function pstat(s) {
    var cls = s === '발행 준비' || s === '발행됨' ? 'ready' : (s === '검수 대기' ? 'hold' : '');
    return '<span class="pstat ' + cls + '">' + (s || '') + '</span>';
  }
  POSTS.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'dbtn'; b.setAttribute('data-p', p.id);
    b.innerHTML = '<span class="d1">' + fmt(p.date) + ' <span class="dow">' + (p.dow || '') + '</span></span>' +
      '<span class="d2">' + (p.corner || '') + ' · ' + (p.title || '') + '</span>' + pstat(p.status);
    b.addEventListener('click', function () { showPost(p.id, true); });
    pl.appendChild(b);
  });
  function showPost(id, push) {
    var p = null;
    for (var i = 0; i < POSTS.length; i++) if (POSTS[i].id === id) { p = POSTS[i]; break; }
    if (!p) return false;
    var kick = ['<span>' + fmt(p.date) + ' ' + (p.dow || '') + '</span>', '<span class="dot"></span><span>' + (p.corner || '') + '</span>',
      '<span class="dot"></span>' + pstat(p.status), '<span class="dot"></span><span>' + (p.chars || '') + '자</span>'];
    if (p.critic) kick.push('<span class="dot"></span><span>크리틱 ' + p.critic + '</span>');
    rep.innerHTML =
      '<header class="mast"><div class="kicker">' + kick.join('') + '</div><h2>' + p.title + '</h2></header>' +
      '<div class="post">' + p.html + '</div>' +
      '<footer class="rfoot"><p class="disc">네이버 프리미엄콘텐츠 채널 원고입니다. 정보 제공 목적이며 특정 종목의 매수·매도를 권유하지 않습니다. 초안은 AI가 쓰고 발행 전 사람이 검수합니다.</p></footer>';
    Array.prototype.forEach.call(dl.querySelectorAll('.dbtn'), function (b) { b.classList.remove('on'); });
    Array.prototype.forEach.call(pl.querySelectorAll('.dbtn'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-p') === id);
    });
    if (push && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    window.scrollTo({ top: 0, behavior: 'auto' });
    return true;
  }
  document.getElementById('tabPosts').addEventListener('click', function () {
    if (POSTS.length) showPost(POSTS[0].id, true);
  });

  function hashId() { try { return decodeURIComponent(location.hash.replace('#', '')); } catch (e) { return location.hash.replace('#', ''); } }
  var initial = hashId();
  if (!initial || !(show(initial, false) || showPost(initial, false))) { if (DATA.length) show(DATA[0].date, false); }
  window.addEventListener('hashchange', function () {
    var d = hashId(); if (d) { if (!show(d, false)) showPost(d, false); }
  });
})();
</script>

</body>
</html>
